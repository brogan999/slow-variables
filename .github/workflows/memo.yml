name: memo
on:
  schedule: [{ cron: "17 9 * * 1" }]
  workflow_dispatch:
permissions: { contents: write, pull-requests: write }
jobs:
  memo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ai-tracker evaluate && uv run ai-tracker export && uv run ai-tracker memo && uv run ai-tracker export
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_TRACKER_USER_AGENT: ${{ secrets.AI_TRACKER_USER_AGENT }}
      - id: today
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      # the maintainer's one weekly touchpoint: every part falls back to a line so the PR always opens
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          {
            echo "Weekly memo draft from the memo job. Merging publishes it under /memos. Edit docs/memos/*.md on this branch to change the prose; the front matter is generated. Merge or close it within the week: next Monday's run resets this branch and drops edits made on it."
            echo
            uv run ai-tracker ops-notes 2>/dev/null || echo "(operator notes failed; see the run log)"
            echo
            echo "**Nightly**"
            echo
            last=$(gh pr list --head nightly --state merged -L 1 --json number,mergedAt --jq '.[] | "- Last self-merged nightly: #\(.number) at \(.mergedAt)"') || last="- Last self-merged nightly: unavailable"
            echo "${last:-- Last self-merged nightly: none}"
            held=$(gh pr list --head nightly --state open --json number,title --jq '.[] | "- Held: #\(.number) \(.title)"') || held="- Held nightly PR: unavailable"
            echo "${held:-- No nightly PR held}"
          } > "$RUNNER_TEMP/body.md"
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: memo
          title: "memo: week to ${{ steps.today.outputs.date }}"
          body-path: ${{ runner.temp }}/body.md
          reviewers: brogan999
          commit-message: "memo: weekly draft"
          add-paths: |
            docs/memos/**
            web/data/memos/**
