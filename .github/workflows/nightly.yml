name: nightly
on:
  schedule: [{ cron: "17 6 * * *" }]
  workflow_dispatch:
permissions: { contents: write, pull-requests: write }
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - uses: actions/cache@v4
        with:
          path: ingest/cache
          key: raw-cache-${{ github.run_started_at }}
          restore-keys: raw-cache-
      - id: ingest
        run: uv run ai-tracker ingest --all || echo "failed=true" >> "$GITHUB_OUTPUT"
        env:
          AI_TRACKER_USER_AGENT: "${{ secrets.AI_TRACKER_USER_AGENT }}"
          ARTIFICIAL_ANALYSIS_API_KEY: "${{ secrets.ARTIFICIAL_ANALYSIS_API_KEY }}"
      # approve inside the run so the PR shows exactly what merge will commit; merge is still the gate
      - run: uv run ai-tracker approve && uv run ai-tracker build && uv run ai-tracker evaluate && uv run ai-tracker export
      - id: check
        run: uv run ai-tracker check || echo "failed=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: raw-cache, path: ingest/cache, retention-days: 90, if-no-files-found: ignore }
      - id: today
        if: always()
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: peter-evans/create-pull-request@v7
        if: always()
        with:
          branch: nightly
          title: "nightly: ${{ steps.check.outputs.failed == 'true' && 'CHECK FAILED ' || '' }}${{ steps.ingest.outputs.failed == 'true' && 'PARTIAL ' || '' }}observations ${{ steps.today.outputs.date }}"
          body-path: data/summary.md
          commit-message: "nightly ingest\n\nCo-Authored-By: ai-tracker nightly <noreply@github.com>"
          add-paths: |
            data/**
            web/data/**
            web/public/data/**
            docs/thesis.md
      - if: steps.ingest.outputs.failed == 'true' || steps.check.outputs.failed == 'true'
        run: exit 1
