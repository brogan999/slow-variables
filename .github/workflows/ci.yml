name: ci
on:
  push:
  pull_request:  # bot PRs (nightly, memo) only touch these paths; their gate runs inside the job that opens them
    paths-ignore: ["data/**", "web/data/**", "web/public/data/**", "docs/**"]
permissions: { contents: read }
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check src tests
      - run: uv run pytest -q
      - run: uv run ai-tracker evaluate && uv run ai-tracker check
      - run: uv run mypy src || true  # advisory for month 1
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit -p .
      - run: pnpm build
