# Every derived metric: inputs are observation series_key globs; sql runs over the `observations` view
# (approved, non-superseded rows + `subject` = second dotted segment + `q` = calendar quarter) and must
# return as_of_date, value, obs_ids (+ any dims columns). Change only via reviewed PR, with a rationale.
version: 1
metrics:
  horizon_ratio_80_50:
    description: METR 50% horizon divided by 80% horizon, per model (~7-10x today; a fall toward 2x would be pro-fast).
    rationale: N&K reliability argument; the gap between "works half the time" and "works reliably" is the productisation valve.
    grain: [as_of_date, model]
    unit: ratio
    lead_lag: leading
    formula_version: 1
    inputs: ["metr.*.horizon_50.pt", "metr.*.horizon_80.pt"]
    caveats: Rows METR marks beyond the 16h suite ceiling are excluded.
    sql: |
      SELECT a.as_of_date, a.subject AS model, a.value_numeric / b.value_numeric AS value, [a.id, b.id] AS obs_ids
      FROM observations a JOIN observations b ON a.subject = b.subject AND a.as_of_date = b.as_of_date
      WHERE a.series_key LIKE 'metr.%.horizon_50.pt' AND b.series_key LIKE 'metr.%.horizon_80.pt'
        AND NOT a.disputed AND NOT b.disputed AND b.value_numeric > 0
  gross_margin:
    description: Gross profit divided by revenue per filer per fiscal quarter, from XBRL company facts; a fiscal Q4 filed only inside the 10-K is the full year minus the three quarters inside it.
    rationale: The margin is the rent; its direction at each layer is the capture question in one number.
    grain: [as_of_date, entity]
    unit: share
    lead_lag: lagging
    formula_version: 2
    inputs: ["sec.*.gross_profit.q", "sec.*.revenue.q", "sec.*.gross_profit.fy", "sec.*.revenue.fy"]
    caveats: Fiscal quarters differ by filer (NVDA ends late Jan/Apr/Jul/Oct). Whole-company, not segment, margin. A filled Q4 cites the 10-K and the three 10-Qs it subtracts.
    sql: |
      WITH p AS (  -- gross profit and revenue for the same filer, grain and period end
        SELECT g.subject, right(g.series_key, 3) = '.fy' AS is_fy, g.as_of_date, g.period_start,
               g.value_numeric AS gp, r.value_numeric AS rev, [g.id, r.id] AS ids
        FROM observations g JOIN observations r
          ON r.subject = g.subject AND r.as_of_date = g.as_of_date AND r.series_key = replace(g.series_key, '.gross_profit.', '.revenue.')
        WHERE (g.series_key LIKE 'sec.%.gross_profit.q' OR g.series_key LIKE 'sec.%.gross_profit.fy') AND r.value_numeric > 0),
      q AS (SELECT * FROM p WHERE NOT is_fy),
      fill AS (  -- a fiscal Q4 filed only inside the 10-K: full year minus the three quarters inside it
        SELECT f.subject, f.as_of_date, f.gp - sum(q.gp) AS gp, f.rev - sum(q.rev) AS rev, flatten(list_prepend(f.ids, list(q.ids))) AS ids
        FROM p f JOIN q ON q.subject = f.subject AND q.as_of_date > f.period_start AND q.as_of_date < f.as_of_date
        WHERE f.is_fy
        GROUP BY f.subject, f.as_of_date, f.gp, f.rev, f.ids
        HAVING count(*) = 3 AND NOT EXISTS (SELECT 1 FROM q q2 WHERE q2.subject = f.subject AND q2.as_of_date = f.as_of_date))
      SELECT as_of_date, subject AS entity, gp / rev AS value, ids AS obs_ids FROM q
      UNION ALL SELECT as_of_date, subject, gp / rev, ids FROM fill WHERE rev > 0

  gross_margin_fy:
    description: Gross profit divided by revenue per filer per fiscal year, from the 10-K's XBRL company facts.
    rationale: The annual margin smooths fiscal-calendar noise and is the figure filers headline.
    grain: [as_of_date, entity]
    unit: share
    lead_lag: lagging
    formula_version: 1
    inputs: ["sec.*.gross_profit.fy", "sec.*.revenue.fy"]
    caveats: Whole-company margin; fiscal years end on different dates by filer.
    sql: |
      SELECT g.as_of_date, g.subject AS entity, g.value_numeric / r.value_numeric AS value, [g.id, r.id] AS obs_ids
      FROM observations g JOIN observations r
        ON r.subject = g.subject AND r.as_of_date = g.as_of_date AND r.series_key = 'sec.' || g.subject || '.revenue.fy'
      WHERE g.series_key LIKE 'sec.%.gross_profit.fy' AND r.value_numeric > 0

  lab_gross_margin_estimate:
    description: A lab's full-year revenue minus its inference compute spend, over revenue, from Epoch's estimates (grade C). Not a filed gross margin.
    rationale: The only public view of lab unit economics; it feeds the lab layer of the gross-profit stack.
    grain: [as_of_date, entity]
    unit: share
    lead_lag: lagging
    formula_version: 1
    inputs: ["epoch.*.revenue_usd.fy", "epoch.*.inference_compute_usd.fy"]
    caveats: Estimated (tier 5). Revenue minus inference compute overstates a true gross margin, which would also subtract serving staff, data and hosting costs.
    sql: |
      SELECT r.as_of_date, r.subject AS entity, 1 - i.value_numeric / r.value_numeric AS value, [r.id, i.id] AS obs_ids
      FROM observations r JOIN observations i
        ON i.subject = r.subject AND i.as_of_date = r.as_of_date AND i.series_key = 'epoch.' || r.subject || '.inference_compute_usd.fy'
      WHERE r.series_key LIKE 'epoch.%.revenue_usd.fy' AND r.value_numeric > 0

  gross_profit_share_by_layer:
    description: Each layer's share of the stack's gross profit per calendar quarter. Chips = NVIDIA and AMD whole-company gross profit (filed); cloud = Microsoft Intelligent Cloud revenue minus its cost of revenue (filed, the one cloud segment that files cost); labs = OpenAI and Anthropic, estimated as the run-rate at the quarter's end over four times Epoch's revenue-minus-inference margin for that year (grade C). Apps are unmeasured.
    rationale: The headline capture chart on the brief's own basis (gross profit), with the lab layer drawn as an estimate rather than left out.
    grain: [as_of_date, layer_id, basis]
    unit: share
    lead_lag: lagging
    formula_version: 1
    inputs: ["sec.nvda.gross_profit.*", "sec.amd.gross_profit.*", "sec_seg.msft.intelligent_cloud.revenue.*", "sec_seg.msft.intelligent_cloud.cost_of_revenue.*", "epoch.*.revenue_run_rate_usd.pt", "epoch.*.revenue_usd.fy", "epoch.*.inference_compute_usd.fy"]
    caveats: Fiscal quarters mapped to the calendar quarter of their period end; a fiscal Q4 is the full year minus three quarters. Chips are whole-company, so they include gaming and client chips. Only quarters with all five inputs are kept. The lab estimate uses the run-rate as of the quarter's end (never a later one), and the margin of the year containing the quarter, else the latest earlier year; revenue minus inference compute overstates true gross margin.
    sql: |
      WITH gq AS (
        SELECT subject, as_of_date, period_start, value_numeric AS v, [id] AS ids FROM observations
        WHERE series_key IN ('sec.nvda.gross_profit.q', 'sec.amd.gross_profit.q')
        UNION ALL
        SELECT 'msft_ic', r.as_of_date, r.period_start, r.value_numeric - c.value_numeric, [r.id, c.id]
        FROM observations r JOIN observations c ON c.series_key = 'sec_seg.msft.intelligent_cloud.cost_of_revenue.q'
             AND c.as_of_date = r.as_of_date AND c.period_start = r.period_start
        WHERE r.series_key = 'sec_seg.msft.intelligent_cloud.revenue.q'),
      gfy AS (
        SELECT subject, as_of_date, period_start, value_numeric AS v, [id] AS ids FROM observations
        WHERE series_key IN ('sec.nvda.gross_profit.fy', 'sec.amd.gross_profit.fy')
        UNION ALL
        SELECT 'msft_ic', r.as_of_date, r.period_start, r.value_numeric - c.value_numeric, [r.id, c.id]
        FROM observations r JOIN observations c ON c.series_key = 'sec_seg.msft.intelligent_cloud.cost_of_revenue.fy'
             AND c.as_of_date = r.as_of_date AND c.period_start = r.period_start
        WHERE r.series_key = 'sec_seg.msft.intelligent_cloud.revenue.fy'),
      fill AS (  -- a fiscal Q4 filed only inside the 10-K: full year minus the three quarters inside it
        SELECT f.subject, f.as_of_date, f.v - sum(q.v) AS v, flatten(list_prepend(f.ids, list(q.ids))) AS ids
        FROM gfy f JOIN gq q ON q.subject = f.subject AND q.as_of_date > f.period_start AND q.as_of_date < f.as_of_date
        GROUP BY f.subject, f.as_of_date, f.v, f.ids
        HAVING count(*) = 3 AND NOT EXISTS (SELECT 1 FROM gq q2 WHERE q2.subject = f.subject AND q2.as_of_date = f.as_of_date)),
      filed AS (
        SELECT date_trunc('quarter', as_of_date) AS cq, subject, v, ids,
               CASE WHEN subject = 'msft_ic' THEN 'compute_cloud' ELSE 'compute_semis' END AS layer_id
        FROM (SELECT subject, as_of_date, v, ids FROM gq UNION ALL SELECT subject, as_of_date, v, ids FROM fill)),
      qs AS (SELECT cq FROM filed GROUP BY cq HAVING count(DISTINCT subject) = 3),
      margin AS (  -- Epoch's full-year revenue minus inference compute, over revenue
        SELECT r.subject, year(r.as_of_date) AS fy, 1 - i.value_numeric / r.value_numeric AS m, [r.id, i.id] AS ids
        FROM observations r JOIN observations i ON i.subject = r.subject AND i.as_of_date = r.as_of_date
             AND i.series_key = 'epoch.' || r.subject || '.inference_compute_usd.fy'
        WHERE r.series_key IN ('epoch.openai.revenue_usd.fy', 'epoch.anthropic.revenue_usd.fy') AND r.value_numeric > 0),
      rr AS (SELECT subject, as_of_date, value_numeric AS v, id FROM observations
             WHERE series_key IN ('epoch.openai.revenue_run_rate_usd.pt', 'epoch.anthropic.revenue_run_rate_usd.pt')),
      lab AS (  -- the run-rate as of the quarter's end (never a later one) over four, times the year's margin
        SELECT cq, subject, v, ids FROM (
          SELECT qs.cq, rr.subject, rr.v / 4 * margin.m AS v, list_prepend(rr.id, margin.ids) AS ids,
                 row_number() OVER (PARTITION BY qs.cq, rr.subject ORDER BY rr.as_of_date DESC, margin.fy DESC) AS rn
          FROM qs JOIN rr ON rr.as_of_date < qs.cq + INTERVAL 3 MONTH AND rr.as_of_date >= qs.cq + INTERVAL 3 MONTH - INTERVAL 183 DAY
                  JOIN margin ON margin.subject = rr.subject AND margin.fy <= year(qs.cq))
        WHERE rn = 1),
      complete AS (SELECT cq FROM lab GROUP BY cq HAVING count(DISTINCT subject) = 2),
      by_layer AS (
        SELECT f.cq, f.layer_id, 'filed' AS basis, sum(f.v) AS gp, flatten(list(f.ids)) AS ids FROM filed f JOIN complete USING (cq) GROUP BY 1, 2
        UNION ALL
        SELECT l.cq, 'model', 'estimated', sum(l.v), flatten(list(l.ids)) FROM lab l JOIN complete USING (cq) GROUP BY 1)
      SELECT (cq + INTERVAL 3 MONTH - INTERVAL 1 DAY)::DATE AS as_of_date, layer_id, basis, gp / sum(gp) OVER (PARTITION BY cq) AS value,
             list_distinct(flatten(list(ids) OVER (PARTITION BY cq))) AS obs_ids
      FROM by_layer

  bls_tfp_yoy:
    description: Year-on-year change in the BLS private nonfarm business total factor productivity index.
    rationale: TFP is the residual where an AI productivity effect would have to show up; the brief's normal band is Acemoglu's estimate, the fast band Goldman-scale.
    grain: [as_of_date]
    unit: share
    lead_lag: lagging
    formula_version: 1
    inputs: ["bls.mpu4910012.a"]
    caveats: Annual, published with a lag, revised.
    sql: |
      SELECT as_of_date, value_numeric / lag(value_numeric) OVER (ORDER BY as_of_date) - 1 AS value,
             [id, lag(id) OVER (ORDER BY as_of_date)] AS obs_ids
      FROM observations WHERE series_key = 'bls.mpu4910012.a'
      QUALIFY lag(id) OVER (ORDER BY as_of_date) IS NOT NULL
  lab_recoupment_ratio:
    description: A lab's latest revenue run-rate divided by the equity it had raised by that date (Epoch data). Above 1 means a year of run-rate exceeds all capital raised.
    rationale: The financial view of the return arrow - whether deployment revenue is recouping the capital that funded invention. Large caveat - run-rate is not booked revenue and equity is not total capital.
    grain: [as_of_date, entity]
    unit: ratio
    lead_lag: lagging
    formula_version: 1
    inputs: ["epoch.*.revenue_run_rate_usd.pt", "epoch.*.round_equity_usd.pt"]
    caveats: Tier-5 inputs; excludes debt, compute credits and cloud commitments; run-rates are press-reported annualised months.
    sql: |
      WITH rr AS (SELECT subject, as_of_date, value_numeric AS rev, id FROM observations WHERE series_key LIKE 'epoch.%.revenue_run_rate_usd.pt'),
           eq AS (SELECT subject, as_of_date, value_numeric AS eq, id FROM observations WHERE series_key LIKE 'epoch.%.round_equity_usd.pt')
      SELECT rr.as_of_date, rr.subject AS entity, rr.rev / sum(eq.eq) AS value,
             list_concat([rr.id], list(eq.id ORDER BY eq.id)) AS obs_ids
      FROM rr JOIN eq ON eq.subject = rr.subject AND eq.as_of_date <= rr.as_of_date
      GROUP BY rr.as_of_date, rr.subject, rr.rev, rr.id
  horizon_doubling_days_50_since_2024:
    description: Log-linear fit of the 50% horizon against release date, 2024 onward; doubling time in days with a 95% CI. The most recent window, matching METR's own "since 2024" figure.
    rationale: The normal/fast bands are about the current pace, so the band input is the most recent window METR itself reports (TH1.1 post, 29 Jan 2026 - 89 days since 2024), recomputed here from the corrected data file.
    grain: [as_of_date]
    unit: days
    lead_lag: leading
    formula_version: 2
    inputs: ["metr.*.horizon_50.pt"]
    args: {since: "2024-01-01"}
    caveats: OLS on ln(horizon); rows beyond the 16h suite ceiling excluded; CI from the slope standard error.
    python: fits.loglinear
  horizon_doubling_days_80_since_2024:
    description: Log-linear fit of the 80% horizon against release date, 2024 onward; doubling time in days with a 95% CI.
    rationale: Same window as the 50% fit so the two horizons are judged on the same period.
    grain: [as_of_date]
    unit: days
    lead_lag: leading
    formula_version: 2
    inputs: ["metr.*.horizon_80.pt"]
    args: {since: "2024-01-01"}
    caveats: OLS on ln(horizon); disputed rows excluded.
    python: fits.loglinear
  horizon_doubling_days_50_since_2023:
    description: Our own log-linear fit of the 50% horizon, 2023 onward, to compare against METR's published from_2023_on figure.
    rationale: A reproducibility check on METR's published number from the same data file.
    grain: [as_of_date]
    unit: days
    lead_lag: leading
    formula_version: 2
    inputs: ["metr.*.horizon_50.pt"]
    args: {since: "2023-01-01"}
    caveats: Point estimate with CI; METR's own fit uses a different estimator.
    python: fits.loglinear
  horizon_doubling_days_80_since_2023:
    description: Log-linear fit of the 80% horizon, 2023 onward.
    rationale: The wider window for the 80% series, for comparison with the 2024-onward fit.
    grain: [as_of_date]
    unit: days
    lead_lag: leading
    formula_version: 2
    inputs: ["metr.*.horizon_80.pt"]
    args: {since: "2023-01-01"}
    caveats: Point estimate with CI.
    python: fits.loglinear
  horizon_blowup_year_50_since_2024:
    description: Hyperbolic fit of the 50% horizon (horizon = 1/(a - b t)), 2024 onward; the year at which the fitted horizon diverges, with a 95% CI. Compare its AIC with the log-linear fit's.
    rationale: The AI 2027 story is superexponential; a hyperbolic form with a lower AIC than the log-linear form would be evidence for it.
    grain: [as_of_date]
    unit: year
    lead_lag: leading
    formula_version: 1
    inputs: ["metr.*.horizon_50.pt"]
    args: {since: "2024-01-01"}
    caveats: Three parameters worth of freedom on ~20 points; AIC computed on ln(horizon) residuals for both forms.
    python: fits.hyperbolic
  cait_high_exposure_claims_3mma_mom:
    description: Month-on-month change in the three-month moving average of California initial UI claims from occupations in the top quartile of potential AI exposure (Eloundou et al.), from the tracker's monthly claims workbook - the tracker's own headline figure.
    rationale: The fast-band test for claims needs the tracker's headline computed from its published counts rather than retyped from its page each month.
    grain: [as_of_date]
    unit: share
    lead_lag: coincident
    formula_version: 1
    inputs: ["cait.ca_top_quartile_potential.claims.m"]
    caveats: California only; claims dated to the month of their week-ending date; the observed-exposure measure (Claude usage) is stored beside it but not used here.
    sql: |
      WITH m AS (SELECT as_of_date, value_numeric AS v, id FROM observations WHERE series_key = 'cait.ca_top_quartile_potential.claims.m'),
      a AS (SELECT as_of_date, avg(v) OVER w AS ma, count(*) OVER w AS n, list(id) OVER w AS ids
            FROM m WINDOW w AS (ORDER BY as_of_date ROWS BETWEEN 2 PRECEDING AND CURRENT ROW)),
      b AS (SELECT *, lag(ma) OVER (ORDER BY as_of_date) AS ma0, lag(n) OVER (ORDER BY as_of_date) AS n0,
                   lag(ids) OVER (ORDER BY as_of_date) AS ids0 FROM a)
      SELECT as_of_date, ma / ma0 - 1 AS value, list_distinct(list_concat(ids, ids0)) AS obs_ids FROM b WHERE n = 3 AND n0 = 3
  cl_refresh_cadence_hours:
    description: The shortest production interval, in hours, between a model update learned from live use and that update serving traffic, among vendors that describe one (their latest description each).
    rationale: The return arrow's speed as a vendor states it; the minimum is the frontier of what ships.
    grain: [as_of_date]
    unit: hours
    lead_lag: leading
    formula_version: 1
    inputs: ["cl_refresh.*.cadence_hours.pt"]
    caveats: Vendors' own descriptions (tier 7); a stated interval, not a measured one.
    sql: |
      WITH l AS (SELECT series_key, value_numeric AS v, as_of_date, id,
                        row_number() OVER (PARTITION BY series_key ORDER BY as_of_date DESC) AS rn
                 FROM observations WHERE series_key LIKE 'cl_refresh.%.cadence_hours.pt')
      SELECT max(as_of_date) AS as_of_date, min(v) AS value, [arg_min(id, v)] AS obs_ids FROM l WHERE rn = 1 HAVING count(*) > 0
  cross_tracker_concordance:
    description: Number of the four monthly labour trackers whose latest reading is past its own AI-attributable-break threshold (0-4), counting each tracker once and none of the entry-level cuts (Appendix B asks for a break beyond entry level). Thresholds - most-exposed quintile employment y/y <= -3% (Canaries, all ages); exposed-vs-unexposed gap <= -10% (Revelio); high-exposure claims 3-month average +5% or more m/m (CAIT, potential exposure, computed from its counts); occupational-mix dissimilarity >= 10 pp (Yale).
    rationale: The falsification rule wants three trackers breaking at once, not one; this is the count. Thresholds are the fast-band edges of the four indicators, documented there.
    grain: [as_of_date]
    unit: count
    lead_lag: coincident
    formula_version: 2
    inputs: ['canaries.us_exposure_q5.employment_yoy.m', 'revelio.us_exposed.growth_gap.m', 'cait.ca_top_quartile_potential.claims.m', 'yale_budget_lab_data.us_workers.occupation_dissimilarity_pp.m']
    caveats: Different geographies (CA claims vs US employment) and different exposure measures; a count, not a test. Each tracker's latest reading counts, whatever its month.
    sql: |
      WITH obs AS (
        SELECT series_key, value_numeric AS v, as_of_date, [id] AS ids FROM observations
        WHERE series_key IN ('canaries.us_exposure_q5.employment_yoy.m', 'revelio.us_exposed.growth_gap.m',
                             'yale_budget_lab_data.us_workers.occupation_dissimilarity_pp.m')),
      cait AS (SELECT as_of_date, value_numeric AS v, id FROM observations WHERE series_key = 'cait.ca_top_quartile_potential.claims.m'),
      cma AS (SELECT as_of_date, avg(v) OVER w AS ma, count(*) OVER w AS n, list(id) OVER w AS ids
              FROM cait WINDOW w AS (ORDER BY as_of_date ROWS BETWEEN 2 PRECEDING AND CURRENT ROW)),
      cchg AS (SELECT 'cait_3mma_mom' AS series_key, ma / lag(ma) OVER o - 1 AS v, as_of_date,
                      list_distinct(list_concat(ids, lag(ids) OVER o)) AS ids, n, lag(n) OVER o AS n0
               FROM cma WINDOW o AS (ORDER BY as_of_date)),
      allx AS (SELECT series_key, v, as_of_date, ids FROM obs UNION ALL SELECT series_key, v, as_of_date, ids FROM cchg WHERE n = 3 AND n0 = 3),
      latest AS (SELECT *, row_number() OVER (PARTITION BY series_key ORDER BY as_of_date DESC) AS rn FROM allx)
      SELECT max(as_of_date) AS as_of_date,
             sum(CASE WHEN series_key = 'canaries.us_exposure_q5.employment_yoy.m' AND v <= -0.03 THEN 1
                      WHEN series_key = 'revelio.us_exposed.growth_gap.m' AND v <= -0.10 THEN 1
                      WHEN series_key = 'cait_3mma_mom' AND v >= 0.05 THEN 1
                      WHEN series_key = 'yale_budget_lab_data.us_workers.occupation_dissimilarity_pp.m' AND v >= 10 THEN 1
                      ELSE 0 END)::DOUBLE AS value,
             list_distinct(flatten(list(ids))) AS obs_ids
      FROM latest WHERE rn = 1
  surprise_index:
    description: The mean of the two graders' latest readings of AI 2027's quantitative predictions against what happened (AI Futures Project's own grading and the independent ai2027-tracker), as a share of the predicted pace.
    rationale: One number for whether the fast scenario is running ahead of or behind its own schedule, from the people grading it rather than from the tracker.
    grain: [as_of_date]
    unit: share
    lead_lag: coincident
    formula_version: 1
    inputs: ['aifutures_blog.ai_2027_quantitative.pace_vs_predicted.pt', 'ai2027_tracker.ai_2027_quantitative.pace_vs_predicted.pt']
    caveats: Two graders with different item lists; each counts once, at its latest reading.
    sql: |
      WITH l AS (SELECT series_key, value_numeric AS v, as_of_date, id,
                        row_number() OVER (PARTITION BY series_key ORDER BY as_of_date DESC) AS rn
                 FROM observations WHERE series_key IN ('aifutures_blog.ai_2027_quantitative.pace_vs_predicted.pt',
                                                        'ai2027_tracker.ai_2027_quantitative.pace_vs_predicted.pt'))
      SELECT max(as_of_date) AS as_of_date, avg(v) AS value, list(id ORDER BY id) AS obs_ids FROM l WHERE rn = 1 HAVING count(*) > 0
  bls_labor_share_yoy:
    description: Year-on-year change in the BLS nonfarm business labor share index (PRS85006173).
    rationale: The Anthropic Institute scenarios (Korinek, Jones et al., Sept 2026) make the labor share the cleanest macro discriminator - extreme change takes it from 60% to 45% by 2030 - and it is where "surplus shifts to capital" would first show in official data.
    grain: [as_of_date]
    unit: share
    lead_lag: lagging
    formula_version: 1
    inputs: ["bls.prs85006173.q"]
    caveats: Index, not the published percent level; quarterly, revised; cyclical swings of a point or two are normal.
    sql: |
      SELECT as_of_date, value_numeric / lag(value_numeric, 4) OVER (ORDER BY as_of_date) - 1 AS value,
             [id, lag(id, 4) OVER (ORDER BY as_of_date)] AS obs_ids
      FROM observations WHERE series_key = 'bls.prs85006173.q'
      QUALIFY lag(id, 4) OVER (ORDER BY as_of_date) IS NOT NULL
  segment_operating_margin:
    description: Segment operating income divided by segment revenue, per filer segment, per fiscal quarter (AWS, Google Cloud, Microsoft Intelligent Cloud, AMD Data Center, NVIDIA Compute & Networking).
    rationale: The closest filed proxy for the margin each layer keeps; gross profit is not disclosed by segment.
    grain: [as_of_date, segment]
    unit: share
    lead_lag: lagging
    formula_version: 1
    inputs: ["sec_seg.*.operating_income.q", "sec_seg.*.revenue.q"]
    caveats: Operating, not gross, margin; segment definitions differ (Intelligent Cloud includes server products and Windows Server).
    sql: |
      SELECT oi.as_of_date, oi.subject || '.' || split_part(oi.series_key, '.', 3) AS segment,
             oi.value_numeric / r.value_numeric AS value, [oi.id, r.id] AS obs_ids
      FROM observations oi JOIN observations r
        ON r.series_key = replace(oi.series_key, '.operating_income.q', '.revenue.q') AND r.as_of_date = oi.as_of_date
      WHERE oi.series_key LIKE 'sec_seg.%.operating_income.q' AND r.value_numeric > 0
  margin_stack_share_by_layer:
    description: Each layer's share of the AI stack's filed segment operating income per calendar quarter. Semis = NVIDIA Compute & Networking + AMD Data Center; cloud = AWS + Google Cloud + Microsoft Intelligent Cloud. Labs and apps join when a filed or estimated series exists.
    rationale: The headline capture chart (P1 gap #1). Where operating income bulges is where the surplus sits; the thesis "rents migrate up the stack" needs the semis share to fall while labs and apps rise.
    grain: [as_of_date, layer_id]
    unit: share
    lead_lag: lagging
    formula_version: 2
    inputs: ["sec_seg.*.operating_income.q", "sec_seg.*.operating_income.fy"]
    caveats: Fiscal quarters mapped to the calendar quarter of their period end (NVIDIA's late-July quarter counts as Q3); a filer's unreported fiscal Q4 is filled as fiscal year minus its three reported quarters and cites all four filings; quarters where any of the five segments is still missing are dropped; segment operating income, not gross profit; only two layers so far.
    sql: |
      WITH q AS (
        SELECT subject, series_key, as_of_date, period_start, value_numeric AS v, id
        FROM observations WHERE series_key LIKE 'sec_seg.%.operating_income.q'),
      fy AS (
        SELECT subject, replace(series_key, '.fy', '.q') AS series_key, as_of_date, period_start, value_numeric AS v, id
        FROM observations WHERE series_key LIKE 'sec_seg.%.operating_income.fy'),
      fill AS (  -- FY minus the three quarters inside it, when exactly three are reported
        SELECT fy.subject, fy.series_key, fy.as_of_date, fy.v - sum(q.v) AS v, list_prepend(fy.id, list(q.id ORDER BY q.id)) AS ids
        FROM fy JOIN q ON q.subject = fy.subject AND q.series_key = fy.series_key
                       AND q.as_of_date > fy.period_start AND q.as_of_date < fy.as_of_date
        GROUP BY fy.subject, fy.series_key, fy.as_of_date, fy.v, fy.id
        HAVING count(*) = 3 AND NOT EXISTS (SELECT 1 FROM q q2 WHERE q2.series_key = fy.series_key AND q2.as_of_date = fy.as_of_date)),
      allq AS (
        SELECT subject, as_of_date, v, [id] AS ids FROM q
        UNION ALL SELECT subject, as_of_date, v, ids FROM fill),
      seg AS (
        SELECT date_trunc('quarter', as_of_date) AS cq, subject, v, ids,
               CASE WHEN subject IN ('nvda', 'amd') THEN 'compute_semis' ELSE 'compute_cloud' END AS layer_id
        FROM allq),
      complete AS (SELECT cq FROM seg GROUP BY cq HAVING count(DISTINCT subject) = 5),
      by_layer AS (SELECT s.cq, s.layer_id, sum(v) AS oi, flatten(list(ids)) AS ids FROM seg s JOIN complete c USING (cq) GROUP BY 1, 2)
      SELECT (cq + INTERVAL 3 MONTH - INTERVAL 1 DAY)::DATE AS as_of_date, layer_id, oi / sum(oi) OVER (PARTITION BY cq) AS value,
             list_distinct(flatten(list(ids) OVER (PARTITION BY cq))) AS obs_ids
      FROM by_layer
  circular_commitments_total:
    description: Cumulative signed circular / vendor-financing commitments in USD by quarter - equity stakes, guarantees, take-or-pay contracts and backstops between suppliers and their AI-lab customers - excluding letters of intent, talks and self-reported aggregates.
    rationale: The scale of money that flows round the stack rather than out of it; the leading indicator of over- or under-build (P1 §6.4).
    grain: [as_of_date]
    unit: USD
    lead_lag: leading
    formula_version: 2
    inputs: ["circular.*_usd.pt"]
    caveats: Mixes instruments (equity, guarantees, commitments) with different risk; "up to" and floor values taken at face; cumulative, so it only rises until a row is superseded.
    sql: |
      WITH deals AS (
        SELECT as_of_date, value_numeric AS v, id FROM observations
        WHERE series_key LIKE 'circular.%_usd.pt'
          AND series_key NOT LIKE '%loi_usd%' AND series_key NOT LIKE '%talks_usd%' AND series_key NOT LIKE '%total_commitments%'
          AND series_key NOT LIKE '%commercial_rpo%')
      SELECT last_deal AS as_of_date, sum(v) OVER (ORDER BY q_end) AS value,
             flatten(list(ids) OVER (ORDER BY q_end)) AS obs_ids
      FROM (SELECT date_trunc('quarter', as_of_date)::DATE AS q_end, max(as_of_date) AS last_deal, sum(v) AS v, list(id ORDER BY id) AS ids
            FROM deals GROUP BY 1)
  enterprise_app_spend_share:
    description: Application layer's share of US enterprise generative-AI spend, per Menlo Ventures wave (applications ÷ total).
    rationale: The only published layer split of enterprise dollars; a rising application share means buyers' money is landing above the model layer.
    grain: [as_of_date]
    unit: share
    lead_lag: coincident
    formula_version: 1
    inputs: ["menlo.us_enterprise.genai_app_spend_usd.fy", "menlo.us_enterprise.genai_spend_usd.fy"]
    caveats: Survey-based; scope excludes chips, standalone inference and embedded features; two waves so far.
    sql: |
      SELECT a.as_of_date, a.value_numeric / t.value_numeric AS value, [a.id, t.id] AS obs_ids
      FROM observations a JOIN observations t ON a.as_of_date = t.as_of_date
      WHERE a.series_key = 'menlo.us_enterprise.genai_app_spend_usd.fy' AND t.series_key = 'menlo.us_enterprise.genai_spend_usd.fy'
  hhi_by_layer:
    description: Herfindahl index (sum of squared revenue shares, 0-1) among the filers the tracker covers in a layer, per calendar quarter. Semis = NVIDIA Data Center vs AMD Data Center; cloud = AWS vs Google Cloud vs Microsoft Intelligent Cloud; model = Ramp's share of businesses paying each lab, normalised.
    rationale: Capture flows toward the layer that stays concentrated while its neighbours fragment (P1 cross-layer indicator). Coverage is partial, so read the trend, not the level.
    grain: [as_of_date, layer_id]
    unit: index
    lead_lag: leading
    formula_version: 1
    inputs: ["sec_seg.*.revenue.q", "ramp.*.business_paid_share.m"]
    caveats: Only covered filers; Broadcom, TSMC, Oracle and the neoclouds are absent, so levels overstate concentration. Fiscal quarters mapped to the calendar quarter of their period end. Ramp lab shares allow multi-homing and are normalised to sum to one.
    sql: |
      WITH rev AS (
        SELECT date_trunc('quarter', as_of_date) AS cq, subject, value_numeric AS v, id,
               CASE WHEN subject IN ('nvda', 'amd') THEN 'compute_semis' ELSE 'compute_cloud' END AS layer_id,
               CASE WHEN subject IN ('nvda', 'amd') THEN 2 ELSE 3 END AS need
        FROM observations
        WHERE series_key IN ('sec_seg.nvda.data_center.revenue.q', 'sec_seg.amd.data_center.revenue.q',
                             'sec_seg.amzn.aws.revenue.q', 'sec_seg.googl.cloud.revenue.q', 'sec_seg.msft.intelligent_cloud.revenue.q')),
      complete AS (SELECT cq, layer_id FROM rev GROUP BY cq, layer_id, need HAVING count(DISTINCT subject) = need),
      sh AS (SELECT (r.cq + INTERVAL 3 MONTH - INTERVAL 1 DAY)::DATE AS as_of_date, r.layer_id,
                    r.v / sum(r.v) OVER (PARTITION BY r.cq, r.layer_id) AS s, r.id
             FROM rev r JOIN complete c USING (cq, layer_id)),
      lab AS (SELECT as_of_date, 'model' AS layer_id, value_numeric / sum(value_numeric) OVER (PARTITION BY as_of_date) AS s, id
              FROM observations WHERE series_key LIKE 'ramp.%.business_paid_share.m')
      SELECT as_of_date, layer_id, sum(s * s) AS value, list(id ORDER BY id) AS obs_ids
      FROM (SELECT * FROM sh UNION ALL SELECT * FROM lab) GROUP BY 1, 2
  frontier_price_per_horizon_hour:
    description: Cheapest available capability-hour - on each price change date, the minimum over METR-measured models of OpenRouter prompt price (USD per million tokens, each model's latest price carried forward) divided by the model's latest 50% time horizon in hours.
    rationale: Price per unit of capability is the lab layer's capture proxy. Falling means surplus is passed to the application layer and users; flat or rising means labs keep it.
    grain: [as_of_date]
    unit: USD
    lead_lag: coincident
    formula_version: 3
    inputs: ["openrouter.*.price_prompt_usd_per_mtok.pt", "metr.*.horizon_50.pt"]
    caveats: List prices on one router, prompt tokens only; the horizon is METR's suite, not general capability; only models present in both datasets count; a price series starts on 10 Sep 2026 and records change points, so the trend needs months; a delisted model's last price carries forward.
    sql: |
      WITH h AS (
        SELECT subject, arg_max(value_numeric, as_of_date) AS minutes, arg_max(id, as_of_date) AS hid
        FROM observations WHERE series_key LIKE 'metr.%.horizon_50.pt' AND NOT coalesce(disputed, false) GROUP BY subject),
      p AS (SELECT subject, as_of_date, value_numeric AS usd, id FROM observations WHERE series_key LIKE 'openrouter.%.price_prompt_usd_per_mtok.pt' AND value_numeric > 0),
      d AS (SELECT DISTINCT as_of_date FROM p),
      cp AS (SELECT d.as_of_date, p.subject, arg_max(p.usd, p.as_of_date) AS usd, arg_max(p.id, p.as_of_date) AS pid
             FROM d JOIN p ON p.as_of_date <= d.as_of_date GROUP BY 1, 2)
      , r AS (SELECT cp.as_of_date, min(cp.usd / (h.minutes / 60)) AS value, arg_min([cp.pid, h.hid], cp.usd / (h.minutes / 60)) AS obs_ids
      FROM cp JOIN h USING (subject) GROUP BY cp.as_of_date)
      SELECT * FROM r QUALIFY value IS DISTINCT FROM lag(value) OVER (ORDER BY as_of_date)  -- change points only
  venture_dollars:
    description: Primary-round dollars per calendar quarter and sub-layer. Form D amount sold (tier 4) where an entity files; Epoch's press-compiled equity rounds (tier 5) only for entity-quarters with no Form D row. Sub-layer from the entity's primary membership.
    rationale: The venture-flow strip and the concentration metrics start here (P1 §7 #8-#13). Filed amounts first; press only where filings are absent (most frontier labs raise via SPVs and offshore vehicles that never file).
    grain: [as_of_date, sublayer_id]
    unit: USD
    lead_lag: leading
    formula_version: 1
    inputs: ["formd.*.amount_sold_usd.pt", "epoch.*.round_equity_usd.pt"]
    caveats: Only entities on the seed list with a verified CIK or an Epoch row; Form D amendments supersede their originals (cumulative amount sold); Epoch rounds are reported, not filed; secondary sales and debt are excluded.
    sql: |
      WITH rounds AS (SELECT entity_id, as_of_date, v, id FROM venture_rounds WHERE kind = 'equity'),
      m AS (SELECT entity_id, sublayer_id FROM entity_membership WHERE is_primary AND sublayer_id IS NOT NULL)
      SELECT (date_trunc('quarter', r.as_of_date) + INTERVAL 3 MONTH - INTERVAL 1 DAY)::DATE AS as_of_date, m.sublayer_id, sum(r.v) AS value, list(r.id ORDER BY r.id) AS obs_ids
      FROM rounds r JOIN m USING (entity_id) WHERE r.as_of_date >= DATE '2023-01-01' GROUP BY 1, 2
  venture_dollars_by_source:
    description: Venture dollars per sub-layer per calendar quarter, split by source (Form D, tier 4; Epoch, tier 5) and kind (equity; Form D debt), for the stacked flow strip.
    rationale: The strip shows how much of each quarter rests on a filing and how much on reporting, and what debt adds.
    grain: [as_of_date, sublayer_id, source, kind]
    unit: USD
    lead_lag: leading
    formula_version: 1
    inputs: ["formd.*.amount_sold_usd.pt", "formd.*.debt_sold_usd.pt", "epoch.*.round_equity_usd.pt"]
    caveats: Epoch rows count only for an entity-quarter with no Form D filing, so the two sources never double-count a round.
    sql: |
      SELECT (date_trunc('quarter', r.as_of_date) + INTERVAL 3 MONTH - INTERVAL 1 DAY)::DATE AS as_of_date, m.sublayer_id, r.source, r.kind,
             sum(r.v) AS value, list(r.id ORDER BY r.id) AS obs_ids
      FROM venture_rounds r JOIN (SELECT entity_id, sublayer_id FROM entity_membership WHERE is_primary AND sublayer_id IS NOT NULL) m USING (entity_id)
      WHERE r.as_of_date >= DATE '2023-01-01' GROUP BY 1, 2, 3, 4
  venture_dollars_4q:
    description: Equity venture dollars over the trailing four calendar quarters at each quarter end, per layer (sublayer_id "all") and per sub-layer.
    rationale: The capture lens's capital-flow arrow and sub-layer ticks (v2 §4.2); four quarters smooth a single mega-round.
    grain: [as_of_date, layer_id, sublayer_id]
    unit: USD
    lead_lag: leading
    formula_version: 1
    inputs: ["formd.*.amount_sold_usd.pt", "epoch.*.round_equity_usd.pt"]
    caveats: Seed-list entities only, attributed by primary membership; debt excluded.
    sql: |
      WITH m AS (SELECT entity_id, layer_id, sublayer_id FROM entity_membership WHERE is_primary AND sublayer_id IS NOT NULL),
      r AS (SELECT date_trunc('quarter', v.as_of_date) AS cq, m.layer_id, m.sublayer_id, v.v, v.id
            FROM venture_rounds v JOIN m USING (entity_id) WHERE v.kind = 'equity' AND v.as_of_date >= DATE '2022-04-01'),
      qs AS (SELECT DISTINCT cq FROM r WHERE cq >= DATE '2023-01-01'),
      w AS (SELECT qs.cq, r.layer_id, r.sublayer_id, r.v, r.id FROM qs JOIN r ON r.cq > qs.cq - INTERVAL 12 MONTH AND r.cq <= qs.cq)
      SELECT (cq + INTERVAL 3 MONTH - INTERVAL 1 DAY)::DATE AS as_of_date, layer_id, coalesce(sublayer_id, 'all') AS sublayer_id,
             sum(v) AS value, list(id ORDER BY id) AS obs_ids
      FROM w GROUP BY GROUPING SETS ((cq, layer_id), (cq, layer_id, sublayer_id))
  venture_dollars_incl_debt:
    description: venture_dollars plus Form D offerings filed as debt alone, per calendar quarter and sub-layer (P1 §9's equity-only versus including-debt view).
    rationale: Debt-financed compute (neoclouds, data centres) is a growing share of AI capital; the equity-only strip hides it.
    grain: [as_of_date, sublayer_id]
    unit: USD
    lead_lag: leading
    formula_version: 1
    inputs: ["formd.*.amount_sold_usd.pt", "formd.*.debt_sold_usd.pt", "epoch.*.round_equity_usd.pt"]
    caveats: Only Form D debt, so bank facilities and bonds are missing; Epoch's press rows stay equity-only and are suppressed only by a Form D equity row in the same entity-quarter.
    sql: |
      WITH rounds AS (SELECT entity_id, as_of_date, v, id FROM venture_rounds),
      m AS (SELECT entity_id, sublayer_id FROM entity_membership WHERE is_primary AND sublayer_id IS NOT NULL)
      SELECT (date_trunc('quarter', r.as_of_date) + INTERVAL 3 MONTH - INTERVAL 1 DAY)::DATE AS as_of_date, m.sublayer_id, sum(r.v) AS value, list(r.id ORDER BY r.id) AS obs_ids
      FROM rounds r JOIN m USING (entity_id) WHERE r.as_of_date >= DATE '2023-01-01' GROUP BY 1, 2
  round_count:
    description: Number of primary rounds per calendar quarter and sub-layer, same sources as venture_dollars.
    rationale: Round counts separate one mega-round from broad activity.
    grain: [as_of_date, sublayer_id]
    unit: count
    lead_lag: leading
    formula_version: 1
    inputs: ["formd.*.amount_sold_usd.pt", "epoch.*.round_equity_usd.pt"]
    caveats: As venture_dollars.
    sql: |
      WITH rounds AS (SELECT entity_id, as_of_date, v, id FROM venture_rounds WHERE kind = 'equity'),
      m AS (SELECT entity_id, sublayer_id FROM entity_membership WHERE is_primary AND sublayer_id IS NOT NULL)
      SELECT (date_trunc('quarter', r.as_of_date) + INTERVAL 3 MONTH - INTERVAL 1 DAY)::DATE AS as_of_date, m.sublayer_id, count(*)::DOUBLE AS value, list(r.id ORDER BY r.id) AS obs_ids
      FROM rounds r JOIN m USING (entity_id) WHERE r.as_of_date >= DATE '2023-01-01' GROUP BY 1, 2
  venture_capital_intensity:
    description: Frontier labs' primary-round dollars over the trailing four calendar quarters divided by their summed latest revenue run-rates at quarter end (v2 §9 venture capital intensity, frontier-lab sub-layer). Only labs with a run-rate on record in the twelve months to quarter end count, on both sides.
    rationale: A leading overfunding signal - how many dollars of new capital each dollar of revenue attracts. Rising means capital is running ahead of revenue.
    grain: [as_of_date]
    unit: ratio
    lead_lag: leading
    formula_version: 1
    inputs: ["formd.*.amount_sold_usd.pt", "epoch.*.round_equity_usd.pt", "epoch.*.revenue_run_rate_usd.pt"]
    caveats: Run-rates are press-reported annualised months (tier 5); rounds are mostly Epoch (tier 5). Other sub-layers have no revenue series outside the labs, so this is measured for frontier labs only.
    sql: |
      WITH rounds AS (SELECT entity_id, as_of_date, v, id FROM venture_rounds WHERE kind = 'equity'),
      labs AS (SELECT entity_id FROM entity_membership WHERE is_primary AND sublayer_id = 'frontier_labs'),
      rr AS (SELECT entity_id, as_of_date, value_numeric AS rev, id FROM observations WHERE series_key LIKE 'epoch.%.revenue_run_rate_usd.pt' AND entity_id IN (SELECT entity_id FROM labs)),
      qs AS (SELECT DISTINCT date_trunc('quarter', as_of_date) AS cq FROM rounds WHERE as_of_date >= DATE '2023-01-01'),
      rev AS (SELECT cq, entity_id, rev, id FROM (
                SELECT qs.cq, rr.*, row_number() OVER (PARTITION BY qs.cq, rr.entity_id ORDER BY rr.as_of_date DESC) AS rn
                FROM qs JOIN rr ON rr.as_of_date < qs.cq + INTERVAL 3 MONTH AND rr.as_of_date >= qs.cq + INTERVAL 3 MONTH - INTERVAL 12 MONTH)
              WHERE rn = 1),
      raised AS (SELECT qs.cq, r.entity_id, r.v, r.id FROM qs JOIN rounds r ON date_trunc('quarter', r.as_of_date) > qs.cq - INTERVAL 12 MONTH AND date_trunc('quarter', r.as_of_date) <= qs.cq
                 WHERE r.entity_id IN (SELECT entity_id FROM rev WHERE rev.cq = qs.cq))
      SELECT (rv.cq + INTERVAL 3 MONTH - INTERVAL 1 DAY)::DATE AS as_of_date,
             (SELECT sum(v) FROM raised WHERE raised.cq = rv.cq) / sum(rv.rev) AS value,
             list_concat((SELECT list(id ORDER BY id) FROM raised WHERE raised.cq = rv.cq), list(rv.id ORDER BY rv.id)) AS obs_ids
      FROM rev rv GROUP BY rv.cq HAVING sum(rv.rev) > 0 AND (SELECT sum(v) FROM raised WHERE raised.cq = rv.cq) > 0
  frontier_share_of_venture_dollars:
    description: Frontier labs' share of all tracked primary-round dollars over the trailing four calendar quarters (P1 §7 #8, capital concentration in frontier labs).
    rationale: Whether capital keeps piling into the model layer's incumbents or spreads down and up the stack.
    grain: [as_of_date]
    unit: share
    lead_lag: leading
    formula_version: 1
    inputs: ["formd.*.amount_sold_usd.pt", "epoch.*.round_equity_usd.pt"]
    caveats: Denominator is the seed list, not the market; frontier rounds are mostly Epoch (tier 5) because the labs raise through vehicles that do not file Form D.
    sql: |
      WITH rounds AS (SELECT entity_id, as_of_date, v, id FROM venture_rounds WHERE kind = 'equity'),
      m AS (SELECT entity_id, sublayer_id FROM entity_membership WHERE is_primary AND sublayer_id IS NOT NULL),
      q AS (SELECT date_trunc('quarter', r.as_of_date) AS cq, m.sublayer_id, r.v, r.id FROM rounds r JOIN m USING (entity_id) WHERE r.as_of_date >= DATE '2023-01-01'),
      qs AS (SELECT DISTINCT cq FROM q)
      SELECT (qs.cq + INTERVAL 3 MONTH - INTERVAL 1 DAY)::DATE AS as_of_date,
             sum(CASE WHEN q.sublayer_id = 'frontier_labs' THEN q.v ELSE 0 END) / sum(q.v) AS value,
             list(q.id ORDER BY q.id) AS obs_ids
      FROM qs JOIN q ON q.cq > qs.cq - INTERVAL 12 MONTH AND q.cq <= qs.cq GROUP BY 1 HAVING sum(q.v) > 0
  vertical_vs_horizontal_apps:
    description: Vertical AI primary-round dollars divided by coding-agent plus consumer-AI dollars, trailing four quarters (P1 §7 #11).
    rationale: Whether investors are backing domain-specific applications over horizontal ones.
    grain: [as_of_date]
    unit: ratio
    lead_lag: leading
    formula_version: 1
    inputs: ["formd.*.amount_sold_usd.pt", "epoch.*.round_equity_usd.pt"]
    caveats: Seed-list coverage; large horizontal raises by entities without a CIK (Anysphere, Cognition) are missing until their filings are matched, which biases the ratio upward.
    sql: |
      WITH rounds AS (SELECT entity_id, as_of_date, v, id FROM venture_rounds WHERE kind = 'equity'),
      m AS (SELECT entity_id, sublayer_id FROM entity_membership WHERE is_primary AND sublayer_id IN ('vertical_ai', 'coding_agents', 'consumer_ai')),
      q AS (SELECT date_trunc('quarter', r.as_of_date) AS cq, m.sublayer_id, r.v, r.id FROM rounds r JOIN m USING (entity_id) WHERE r.as_of_date >= DATE '2023-01-01'),
      qs AS (SELECT DISTINCT cq FROM q)
      SELECT (qs.cq + INTERVAL 3 MONTH - INTERVAL 1 DAY)::DATE AS as_of_date,
             sum(CASE WHEN q.sublayer_id = 'vertical_ai' THEN q.v ELSE 0 END) / sum(CASE WHEN q.sublayer_id <> 'vertical_ai' THEN q.v ELSE 0 END) AS value,
             list(q.id ORDER BY q.id) AS obs_ids
      FROM qs JOIN q ON q.cq > qs.cq - INTERVAL 12 MONTH AND q.cq <= qs.cq GROUP BY 1 HAVING sum(CASE WHEN q.sublayer_id <> 'vertical_ai' THEN q.v ELSE 0 END) > 0
  post_money_to_arr_multiple:
    description: Frontier labs' latest post-money valuations divided by their latest annualised run-rates, summed across labs with both, at each valuation date (the market's expected-rent multiple for the model layer).
    rationale: A multiple of 30-40x says the market prices durable rents; compression toward software multiples says commoditisation is being priced in.
    grain: [as_of_date]
    unit: ratio
    lead_lag: leading
    formula_version: 1
    inputs: ["epoch.*.post_money_usd.pt", "epoch.*.revenue_run_rate_usd.pt"]
    caveats: Run-rates are press-reported and annualised; the nearest run-rate on or before the valuation date is used, so the multiple lags when revenue is growing fast.
    sql: |
      WITH pm AS (SELECT entity_id, as_of_date, value_numeric AS v, id FROM observations WHERE series_key LIKE 'epoch.%.post_money_usd.pt' AND entity_id IS NOT NULL),
      rr AS (SELECT entity_id, as_of_date, value_numeric AS v, id FROM observations WHERE series_key LIKE 'epoch.%.revenue_run_rate_usd.pt' AND entity_id IS NOT NULL),
      dates AS (SELECT DISTINCT as_of_date FROM pm),
      latest_pm AS (SELECT d.as_of_date, p.entity_id, arg_max(p.v, p.as_of_date) AS v, arg_max(p.id, p.as_of_date) AS id FROM dates d JOIN pm p ON p.as_of_date <= d.as_of_date AND p.as_of_date > d.as_of_date - INTERVAL 18 MONTH GROUP BY 1, 2),
      latest_rr AS (SELECT d.as_of_date, r.entity_id, arg_max(r.v, r.as_of_date) AS v, arg_max(r.id, r.as_of_date) AS id FROM dates d JOIN rr r ON r.as_of_date <= d.as_of_date AND r.as_of_date > d.as_of_date - INTERVAL 12 MONTH GROUP BY 1, 2)
      SELECT p.as_of_date, sum(p.v) / sum(r.v) AS value, list_distinct(flatten(list([p.id, r.id]))) AS obs_ids
      FROM latest_pm p JOIN latest_rr r USING (as_of_date, entity_id) GROUP BY 1 HAVING sum(r.v) > 0
  safety_brake_events_12m:
    description: Number of deliberate safety brakes (paused training, gated releases, confinement under a preparedness framework) recorded as evidence rows in the trailing twelve months, at each event date.
    rationale: Narayanan and Kapoor's safety speed limits are usually read off regulators; the September 2026 events show them binding inside a lab first, which the tracker records as dated evidence rather than prose.
    grain: [as_of_date]
    unit: count
    lead_lag: coincident
    formula_version: 3
    inputs: ["evidence.safety_brake_events.for.pt"]
    caveats: Only events with a fetched, verbatim announcement count; labs announce brakes selectively, so the count is a floor; statements of intent are recorded as context and excluded.
    sql: |
      WITH ev AS (SELECT as_of_date, id FROM observations WHERE series_key = 'evidence.safety_brake_events.for.pt'),
      d AS (SELECT DISTINCT as_of_date FROM ev UNION SELECT current_date)  -- today's row lets an old event age out
      SELECT d.as_of_date, count(*)::DOUBLE AS value, list(ev.id ORDER BY ev.id) AS obs_ids
      FROM d JOIN ev ON ev.as_of_date <= d.as_of_date AND ev.as_of_date > d.as_of_date - INTERVAL 12 MONTH GROUP BY 1
  training_compute_doubling_days:
    description: Log-linear fit of frontier models' training compute against publication date, 2020 onward; doubling time in days with a 95% CI (Epoch's frontier table).
    rationale: The invention-stage speed limit the brief tracks as epoch_training_compute_growth (4-5x a year in Epoch's own reading).
    grain: [as_of_date]
    unit: days
    lead_lag: leading
    formula_version: 1
    inputs: ["epoch_models.*.training_compute_flop.pt"]
    args: {since: "2020-01-01"}
    caveats: Frontier set only; compute is estimated for most closed models; the newest models are censored until Epoch estimates them.
    python: fits.loglinear
  training_power_doubling_days:
    description: Log-linear fit of notable models' training power draw against publication date, 2020 onward; doubling time in days.
    rationale: "Power is the physical constraint on the invention stage (brief: 2.2x a year)."
    grain: [as_of_date]
    unit: days
    lead_lag: leading
    formula_version: 1
    inputs: ["epoch_models.*.training_power_w.pt"]
    args: {since: "2020-01-01"}
    caveats: Power draw is estimated from hardware counts and TDP for most models.
    python: fits.loglinear
  perf_per_dollar_doubling_days:
    description: Log-linear fit of FP16 tensor FLOP/s per release-price dollar across accelerators, by release date; doubling time in days.
    rationale: "Hardware price-performance is the floor under inference-price declines (brief: +49% a year). FP16 at a fixed precision, not Epoch's best-precision column, so a chip adding FP8 or INT8 does not read as a price-performance jump."
    grain: [as_of_date]
    unit: days
    lead_lag: leading
    formula_version: 2
    inputs: ["epoch_hw.*.fp16_flops.pt", "epoch_hw.*.release_price_usd.pt"]
    args: {since: "2012-01-01"}
    caveats: Only accelerators with a public release price; recent data-centre GPUs have no list price, so the series may end years before today.
    python: fits.loglinear
    sql: |
      SELECT f.as_of_date, f.value_numeric / p.value_numeric AS value, [f.id, p.id] AS obs_ids
      FROM observations f JOIN observations p ON p.subject = f.subject AND p.as_of_date = f.as_of_date
      WHERE f.series_key LIKE 'epoch_hw.%.fp16_flops.pt' AND p.series_key LIKE 'epoch_hw.%.release_price_usd.pt'
        AND NOT f.disputed AND NOT p.disputed AND p.value_numeric > 0
  routed_tokens_top_models:
    description: Tokens routed through OpenRouter to the models on its public rankings, summed across the list, at each snapshot date.
    rationale: The tracker measures who has an account and how models score, but not how much AI work is being done. One router's routed volume is the only free, non-self-reported measure of that.
    grain: [as_of_date]
    unit: tokens
    lead_lag: coincident
    formula_version: 1
    inputs: ["openrouter_rankings.*.tokens.d"]
    caveats: One router, and only the models on its public list, over the router's own trailing window. A model entering or leaving the list moves the sum, so the level is a sample and the growth rate is the reading.
    sql: |
      SELECT as_of_date, sum(value_numeric) AS value, list(id ORDER BY id) AS obs_ids
      FROM observations WHERE series_key LIKE 'openrouter_rankings.%.tokens.d' GROUP BY as_of_date
  routed_tokens_doubling_days:
    description: Log-linear fit of routed token volume across OpenRouter's listed models; doubling time in days.
    rationale: Growth in work actually routed, rather than in accounts opened. The level is a sample of one router; its doubling time is comparable across snapshots.
    grain: [as_of_date]
    unit: days
    lead_lag: coincident
    formula_version: 1
    inputs: ["openrouter_rankings.*.tokens.d"]
    caveats: Needs months of snapshots before the fit means anything, and the list's composition changes under it.
    python: fits.loglinear
    sql: |
      SELECT as_of_date, sum(value_numeric) AS value, list(id ORDER BY id) AS obs_ids
      FROM observations WHERE series_key LIKE 'openrouter_rankings.%.tokens.d' GROUP BY as_of_date
  inference_price_halving_days:
    description: Halving time, in days, of the lowest price per million tokens among models clearing GPT-4-0314's GPQA Diamond score, from Epoch's price-trend series (fit on the inverse price).
    rationale: Price per unit of capability on a fixed benchmark axis; the brief cites ~40x a year at this threshold.
    grain: [as_of_date]
    unit: days
    lead_lag: coincident
    formula_version: 1
    inputs: ["epoch_price.gpqa_diamond_gpt_4_0314.lowest_usd_per_mtok.pt"]
    args: {since: "2023-01-01", invert: true}
    caveats: Six-ish points; list prices; the cheapest model at a fixed threshold is not the frontier.
    python: fits.loglinear
  open_weights_lag_months:
    description: How far the open-weights frontier trails the closed one in time, on Epoch's Capabilities Index - at each new open-weights record, the months since a closed model first scored as high.
    rationale: v2 Appendix A's open-weights lag; the time version of the open-vs-closed gap, so it reads in months rather than index points.
    grain: [as_of_date]
    unit: months
    lead_lag: leading
    formula_version: 1
    inputs: ["epoch_bench.*.eci_open.pt", "epoch_bench.*.eci_closed.pt"]
    caveats: Measured only when the open frontier sets a record; between records the true lag grows with the calendar. A 30.44-day month. ECI carries its own confidence intervals.
    sql: |
      WITH o AS (SELECT as_of_date, value_numeric AS v, id FROM observations WHERE series_key LIKE 'epoch_bench.%.eci_open.pt'),
      c AS (SELECT as_of_date, value_numeric AS v, id FROM observations WHERE series_key LIKE 'epoch_bench.%.eci_closed.pt'),
      daily AS (SELECT as_of_date, max(v) AS v, arg_max(id, v) AS id FROM o GROUP BY as_of_date),
      rec AS (SELECT d.* FROM daily d WHERE d.v > coalesce((SELECT max(v) FROM daily d2 WHERE d2.as_of_date < d.as_of_date), -1e9)),
      m AS (SELECT r.as_of_date, r.id, (SELECT arg_min(c.id, c.as_of_date) FROM c WHERE c.v >= r.v) AS cid,
                   (SELECT min(c.as_of_date) FROM c WHERE c.v >= r.v) AS cdate FROM rec r)
      SELECT as_of_date, date_diff('day', cdate, as_of_date) / 30.44 AS value, [id, cid] AS obs_ids
      FROM m WHERE cdate IS NOT NULL AND cdate <= as_of_date
  customer_concentration:
    description: The largest direct customer's share of a filer's total revenue per fiscal quarter, from the customer-concentration facts in its 10-Q and 10-K (P1 §6, semis).
    rationale: A chokepoint's rent is only as durable as its buyers are many; a few buyers' capex plans can move it.
    grain: [as_of_date, entity]
    unit: share
    lead_lag: coincident
    formula_version: 1
    inputs: ["sec_seg.*.customer_revenue_share.*.q"]
    caveats: Filers name customers only by letter or number and rename them each filing, so this is the top share, not one customer tracked over time; indirect sales through distributors and cloud providers are not attributed.
    sql: |
      SELECT as_of_date, subject AS entity, max(value_numeric) AS value, [arg_max(id, value_numeric)] AS obs_ids
      FROM observations WHERE series_key LIKE 'sec_seg.%.customer_revenue_share.%.q' GROUP BY as_of_date, subject
  incremental_capex_to_revenue:
    description: The change in a cloud filer's capital expenditure over the change in its revenue, fiscal year on fiscal year (P1 §6, cloud).
    rationale: How many new dollars of capex each new dollar of revenue is costing; a ratio climbing above one says capacity is being built ahead of the revenue it is for.
    grain: [as_of_date, entity]
    unit: ratio
    lead_lag: leading
    formula_version: 1
    inputs: ["sec.*.capex.fy", "sec.*.revenue.fy"]
    caveats: Fiscal years only (quarters are too noisy); whole-company revenue, not AI revenue; skipped when revenue fell. Hyperscalers and CoreWeave.
    sql: |
      WITH j AS (
        SELECT c.subject, c.as_of_date, c.value_numeric AS capex, r.value_numeric AS rev, [c.id, r.id] AS ids
        FROM observations c JOIN observations r ON r.subject = c.subject AND r.as_of_date = c.as_of_date AND r.series_key = 'sec.' || c.subject || '.revenue.fy'
        WHERE c.series_key LIKE 'sec.%.capex.fy' AND c.subject IN ('msft', 'googl', 'amzn', 'meta', 'orcl', 'crwv')),
      p AS (SELECT *, lag(capex) OVER w AS capex0, lag(rev) OVER w AS rev0, lag(ids) OVER w AS ids0, lag(as_of_date) OVER w AS d0
            FROM j WINDOW w AS (PARTITION BY subject ORDER BY as_of_date))
      SELECT as_of_date, subject AS entity, (capex - capex0) / (rev - rev0) AS value, list_concat(ids, ids0) AS obs_ids
      FROM p WHERE capex0 IS NOT NULL AND rev > rev0 AND date_diff('day', d0, as_of_date) BETWEEN 350 AND 380
  open_vs_closed_gap:
    description: Gap in Epoch Capabilities Index points between the best closed-weights and the best open-weights model, at each open-weights release date.
    rationale: Open-weight quality converging on the frontier is the leading indicator of model-layer commoditisation.
    grain: [as_of_date]
    unit: index
    lead_lag: leading
    formula_version: 2
    inputs: ["epoch_bench.*.eci_open.pt", "epoch_bench.*.eci_closed.pt"]
    caveats: ECI is a composite with its own CIs; 'other' accessibility rows are excluded; the gap is measured only on open-release dates.
    sql: |
      WITH o AS (SELECT as_of_date, value_numeric AS v, id FROM observations WHERE series_key LIKE 'epoch_bench.%.eci_open.pt'),
      c AS (SELECT as_of_date, value_numeric AS v, id FROM observations WHERE series_key LIKE 'epoch_bench.%.eci_closed.pt'),
      d AS (SELECT as_of_date, list(id ORDER BY id) AS ids FROM o GROUP BY as_of_date)
      SELECT d.as_of_date,
             (SELECT max(v) FROM c WHERE c.as_of_date <= d.as_of_date) - (SELECT max(v) FROM o WHERE o.as_of_date <= d.as_of_date) AS value,
             list_distinct(list_concat(d.ids, [(SELECT arg_max(id, v) FROM c WHERE c.as_of_date <= d.as_of_date),
                                               (SELECT arg_max(id, v) FROM o WHERE o.as_of_date <= d.as_of_date)])) AS obs_ids
      FROM d WHERE EXISTS (SELECT 1 FROM c WHERE c.as_of_date <= d.as_of_date)
  arc_agi_frontier:
    description: Running best ARC-AGI-2 score by release date, from Epoch's compilation of external results.
    rationale: The brief's one serious proxy for out-of-distribution generalisation.
    grain: [as_of_date]
    unit: share
    lead_lag: leading
    formula_version: 1
    inputs: ["epoch_bench.*.arc_agi_2.pt"]
    caveats: External, compute-unconstrained results; cost per task is not in the score.
    sql: |
      SELECT as_of_date, max(value_numeric) OVER (ORDER BY as_of_date) AS value, list(id) OVER (ORDER BY as_of_date) AS obs_ids
      FROM observations WHERE series_key LIKE 'epoch_bench.%.arc_agi_2.pt' QUALIFY value_numeric = value
  custom_silicon_share:
    description: Non-Nvidia designers' share of cumulative AI compute shipped, in H100-equivalents, at each complete quarter end (Epoch chip sales).
    rationale: Custom silicon share is the leading indicator of Nvidia rent decay.
    grain: [as_of_date]
    unit: share
    lead_lag: leading
    formula_version: 1
    inputs: ["epoch_chips.*.h100e_cumulative.pt"]
    caveats: Epoch estimates with wide ranges; incomplete quarters skipped; Google TPUs are internal, not sold, so the share overstates merchant competition.
    sql: |
      SELECT as_of_date, sum(CASE WHEN subject <> 'nvidia' THEN value_numeric ELSE 0 END) / sum(value_numeric) AS value, list(id ORDER BY id) AS obs_ids
      FROM observations WHERE series_key LIKE 'epoch_chips.%.h100e_cumulative.pt' GROUP BY 1 HAVING count(*) >= 3
  continual_learning_level:
    description: The highest ladder rung (Appendix E, L0-L6) with a shipped, production system on record, at each date a new production row lands.
    rationale: The return arrow made mechanical - if deployment data feeds weights automatically, the fourth-to-first-stage loop stops depending on human data vendors. The thesis rule 'strengthened' needs this at or below L4.
    grain: [as_of_date]
    unit: rung
    lead_lag: leading
    formula_version: 1
    inputs: ["cl_ladder.*.rung.pt"]
    caveats: Production rows only; research results sit in cl_ladder.*.rung_research.pt and never move the level; each row is a lab or vendor describing its own system (tier 7) unless independently evaluated.
    sql: |
      SELECT as_of_date, max(value_numeric) OVER (ORDER BY as_of_date) AS value, list(id) OVER (ORDER BY as_of_date) AS obs_ids
      FROM observations WHERE series_key LIKE 'cl_ladder.%.rung.pt' QUALIFY value_numeric = value
  fda_ai_devices_yoy:
    description: Year-on-year growth in the cumulative count of FDA-authorised AI-enabled devices, at each month end.
    rationale: The regulated-domain speed limit as a rate; the paper predicts slow diffusion in high-consequence tasks.
    grain: [as_of_date]
    unit: pct_change_yoy
    lead_lag: coincident
    formula_version: 1
    inputs: ["fda.us.ai_devices_cumulative.m"]
    caveats: Authorisations, not deployments; mostly radiology CAD; the list is updated in batches.
    sql: |
      SELECT a.as_of_date, (a.value_numeric / b.value_numeric - 1) * 100 AS value, [a.id, b.id] AS obs_ids
      FROM observations a JOIN observations b ON b.series_key = a.series_key AND b.as_of_date = a.as_of_date - INTERVAL 12 MONTH
      WHERE a.series_key = 'fda.us.ai_devices_cumulative.m'
  capex_to_revenue_stack:
    description: "Trailing four quarters of hyperscaler capex (Microsoft, Alphabet, Amazon, Meta, Oracle; filed) divided by AI revenue (frontier-lab run-rates from Epoch plus Menlo's enterprise generative-AI spend), at each quarter end."
    rationale: "The Sequoia '$600B question' framed as a ratio: capex ahead of the revenue that must repay it (P1 seed indicator 2; brief Appendix C)."
    grain: [as_of_date]
    unit: ratio
    lead_lag: leading
    formula_version: 1
    inputs: ["sec.*.capex.q", "epoch.*.revenue_run_rate_usd.pt", "menlo.us_enterprise.genai_spend_usd.fy"]
    caveats: "Hyperscaler capex is not all AI; the revenue side is run-rates (annualised, press-reported) plus one annual survey and double-counts where enterprises buy from labs; grade C by construction."
    sql: |
      WITH capex AS (
        SELECT date_trunc('quarter', as_of_date) AS cq, subject, value_numeric AS v, id FROM observations
        WHERE series_key LIKE 'sec.%.capex.q' AND subject IN ('msft', 'googl', 'amzn', 'meta', 'orcl')),
      qs AS (SELECT DISTINCT cq FROM capex WHERE cq >= DATE '2024-01-01'),
      capex4 AS (
        SELECT q.cq, sum(c.v) AS v, list(c.id ORDER BY c.id) AS ids FROM qs q JOIN capex c ON c.cq > q.cq - INTERVAL 12 MONTH AND c.cq <= q.cq
        GROUP BY q.cq HAVING count(DISTINCT c.subject) >= 4),
      rr AS (SELECT entity_id, as_of_date, value_numeric AS v, id FROM observations WHERE series_key LIKE 'epoch.%.revenue_run_rate_usd.pt' AND entity_id IS NOT NULL),
      rr_latest AS (
        SELECT q.cq, r.entity_id, arg_max(r.v, r.as_of_date) AS v, arg_max(r.id, r.as_of_date) AS id FROM qs q JOIN rr r ON r.as_of_date <= q.cq + INTERVAL 3 MONTH AND r.as_of_date > q.cq - INTERVAL 9 MONTH GROUP BY 1, 2),
      ent AS (SELECT as_of_date, value_numeric AS v, id FROM observations WHERE series_key = 'menlo.us_enterprise.genai_spend_usd.fy'),
      ent_latest AS (SELECT q.cq, arg_max(e.v, e.as_of_date) AS v, arg_max(e.id, e.as_of_date) AS id FROM qs q JOIN ent e ON e.as_of_date <= q.cq + INTERVAL 3 MONTH GROUP BY 1)
      SELECT (c.cq + INTERVAL 3 MONTH - INTERVAL 1 DAY)::DATE AS as_of_date,
             c.v / ((SELECT sum(v) FROM rr_latest r WHERE r.cq = c.cq) + e.v) AS value,
             list_distinct(flatten([c.ids, (SELECT list(id) FROM rr_latest r WHERE r.cq = c.cq), [e.id]])) AS obs_ids
      FROM capex4 c JOIN ent_latest e USING (cq)
  ord_half_life_misfit:
    description: "How far the observed 50%/80% horizon ratio departs from the constant-hazard (Ord half-life) prediction of ln(0.5)/ln(0.8) = 3.11: the ratio divided by 3.11, per model."
    rationale: "Ord's reframing says every model has a task-length half-life; if success decays at a constant hazard the 50% and 80% horizons sit a fixed 3.1x apart. A misfit above 1 says reliability degrades faster than a constant hazard at long horizons."
    grain: [as_of_date, model]
    unit: ratio
    lead_lag: leading
    formula_version: 2
    inputs: ["metr.*.horizon_50.pt", "metr.*.horizon_80.pt"]
    caveats: "Two points per model on METR's suite; the constant-hazard model is a null, not a claim."
    sql: |
      SELECT a.as_of_date, a.subject AS model, (a.value_numeric / b.value_numeric) / 3.1063 AS value, [a.id, b.id] AS obs_ids
      FROM observations a JOIN observations b ON a.subject = b.subject AND a.as_of_date = b.as_of_date
      WHERE a.series_key LIKE 'metr.%.horizon_50.pt' AND b.series_key LIKE 'metr.%.horizon_80.pt' AND NOT coalesce(a.disputed, false)
  exposure_vs_usage_gap:
    description: Weekly work use of generative AI (Bick-Blandin-Deming, via FRED) divided by the share of the US workforce with at least a tenth of tasks exposed to LLMs (Eloundou et al. 2023).
    rationale: Exposure is a ceiling on diffusion; the ratio is how much of the ceiling has been reached.
    grain: [as_of_date]
    unit: ratio
    lead_lag: coincident
    formula_version: 1
    inputs: ["fred.us_workers.work_use_weekly_share.q", "arxiv.us_workforce.llm_exposed_10pct_tasks_share.pt"]
    caveats: The denominator is a fixed 2023 estimate; the numerator counts any weekly use.
    sql: |
      SELECT u.as_of_date, u.value_numeric / e.value_numeric AS value, [u.id, e.id] AS obs_ids
      FROM observations u, observations e
      WHERE u.series_key = 'fred.us_workers.work_use_weekly_share.q'
        AND e.series_key = 'arxiv.us_workforce.llm_exposed_10pct_tasks_share.pt' AND e.value_numeric > 0
  fda_llm_devices_count:
    description: Number of distinct FDA-cleared devices whose core function is a large language model, counted from clearance records.
    rationale: A count of authorisations is the throughput of the regulated-domain speed limit.
    grain: [as_of_date]
    unit: count
    lead_lag: leading
    formula_version: 1
    inputs: ["*.first_llm_device_clearance.pt"]
    caveats: One record per device from any source counts once; the FDA record itself does not say LLM.
    sql: |
      SELECT max(as_of_date) AS as_of_date, count(DISTINCT subject) AS value, list(id) AS obs_ids
      FROM observations WHERE series_key LIKE '%.first_llm_device_clearance.pt'
  model_token_hhi_top10:
    description: Herfindahl index of prompt-plus-completion tokens across the models in OpenRouter's daily top table (sum of squared shares within the listed slice), the last reading in each week.
    rationale: Router traffic is the only public, daily, cross-vendor usage signal; concentration in it is the model layer's HHI from the demand side.
    grain: [as_of_date]
    unit: index
    lead_lag: coincident
    formula_version: 2
    inputs: ["openrouter_rankings.*.tokens.d"]
    caveats: Only the models OpenRouter lists that day (its top table) are in the denominator, so the index is an upper bound on market concentration and shifts when the table's length changes; one router, not the market; weekly so the direction rule's four periods are four weeks.
    sql: |
      WITH t AS (SELECT as_of_date, id, value_numeric AS v, sum(value_numeric) OVER (PARTITION BY as_of_date) AS tot
                 FROM observations WHERE series_key LIKE 'openrouter_rankings.%.tokens.d' AND value_numeric > 0),
      d AS (SELECT as_of_date, sum((v / tot) * (v / tot)) AS value, list(id) AS obs_ids FROM t GROUP BY as_of_date HAVING count(*) >= 5)
      SELECT * FROM d QUALIFY as_of_date = max(as_of_date) OVER (PARTITION BY date_trunc('week', as_of_date))
  lab_token_hhi:
    description: Herfindahl index of routed tokens by lab - models in OpenRouter's daily top table grouped by the author prefix of their OpenRouter id (meta-llama counted as meta, qwen as alibaba), sum of squared lab shares, the last reading in each week.
    rationale: Concentration by lab rather than by model is the bargaining question - a lab with three popular models holds one position, not three.
    grain: [as_of_date]
    unit: index
    lead_lag: coincident
    formula_version: 1
    inputs: ["openrouter_rankings.*.tokens.d"]
    caveats: One router with a developer-heavy mix; only the day's listed models; an open-weight model served by many providers counts toward its author; enterprise traffic that goes direct to the labs never appears.
    sql: |
      WITH t AS (SELECT as_of_date, id, value_numeric AS v,
                        CASE split_part(raw_snippet, '/', 1) WHEN 'meta-llama' THEN 'meta' WHEN 'qwen' THEN 'alibaba'
                             ELSE split_part(raw_snippet, '/', 1) END AS lab
                 FROM observations WHERE series_key LIKE 'openrouter_rankings.%.tokens.d' AND value_numeric > 0),
      l AS (SELECT as_of_date, lab, sum(v) AS v, count(*) AS n, list(id) AS ids FROM t GROUP BY 1, 2),
      sh AS (SELECT *, v / sum(v) OVER (PARTITION BY as_of_date) AS s FROM l),
      d AS (SELECT as_of_date, sum(s * s) AS value, flatten(list(ids)) AS obs_ids FROM sh GROUP BY 1 HAVING sum(n) >= 5)
      SELECT * FROM d QUALIFY as_of_date = max(as_of_date) OVER (PARTITION BY date_trunc('week', as_of_date))
  aa_frontier_intelligence_index:
    description: Highest Artificial Analysis Intelligence Index among models released on or before each date on which a new record was set (index rows are dated by model release).
    rationale: An independent, frequently refreshed capability axis to set beside METR's horizon.
    grain: [as_of_date]
    unit: index
    lead_lag: leading
    formula_version: 2
    inputs: ["aa.*.intelligence_index.pt"]
    caveats: The index composition changes between Artificial Analysis versions and every model is re-scored on the current version, so the history is today's scores placed at release dates, not what was measured then.
    sql: |
      WITH x AS (SELECT as_of_date, max(value_numeric) AS v, arg_max(id, value_numeric) AS id
                 FROM observations WHERE series_key LIKE 'aa.%.intelligence_index.pt' GROUP BY 1)
      SELECT as_of_date, v AS value, [id] AS obs_ids FROM x QUALIFY v >= max(v) OVER (ORDER BY as_of_date)
  aa_frontier_price_per_point:
    description: Cheapest near-frontier capability - on each price change date, the lowest Artificial Analysis blended price (USD per million tokens, 3:1 input to output, each model's latest price carried forward) divided by the model's Intelligence Index, among models in the top decile of the index.
    rationale: Price per unit of capability at the frontier is the lab layer's capture proxy on an independent capability axis; falling means the surplus from better models passes to applications and users, flat or rising means labs keep it.
    grain: [as_of_date]
    unit: USD
    lead_lag: coincident
    formula_version: 2
    inputs: ["aa.*.price_blended_usd_per_mtok.pt", "aa.*.intelligence_index.pt"]
    caveats: List prices, not what large buyers pay; the top decile moves as Artificial Analysis adds and drops models; unpriced models are excluded; a delisted model's last price carries forward; the series starts on 10 Sep 2026 and records change points.
    sql: |
      WITH i AS (SELECT subject, arg_max(value_numeric, as_of_date) AS idx, arg_max(id, as_of_date) AS iid
                 FROM observations WHERE series_key LIKE 'aa.%.intelligence_index.pt' AND value_numeric > 0 GROUP BY 1),
      p AS (SELECT subject, as_of_date, value_numeric AS usd, id FROM observations
            WHERE series_key LIKE 'aa.%.price_blended_usd_per_mtok.pt' AND value_numeric > 0),
      d AS (SELECT DISTINCT as_of_date FROM p),
      cp AS (SELECT d.as_of_date, p.subject, arg_max(p.usd, p.as_of_date) AS usd, arg_max(p.id, p.as_of_date) AS pid
             FROM d JOIN p ON p.as_of_date <= d.as_of_date GROUP BY 1, 2),
      j AS (SELECT cp.as_of_date, cp.usd / i.idx AS v, [cp.pid, i.iid] AS ids,
                   percent_rank() OVER (PARTITION BY cp.as_of_date ORDER BY i.idx) AS pr FROM cp JOIN i USING (subject))
      , r AS (SELECT as_of_date, min(v) AS value, arg_min(ids, v) AS obs_ids FROM j WHERE pr >= 0.9 GROUP BY 1)
      SELECT * FROM r QUALIFY value IS DISTINCT FROM lag(value) OVER (ORDER BY as_of_date)  -- change points only
  aa_price_per_horizon_hour:
    description: Cheapest capability-hour on Artificial Analysis prices - on each price change date, the lowest blended price (USD per million tokens, latest price carried forward) divided by the model's latest METR 50% time horizon in hours, across models in both datasets.
    rationale: The same capture proxy as frontier_price_per_horizon_hour on a second price source with blended rather than prompt-only prices, so a move in one can be checked against the other.
    grain: [as_of_date]
    unit: USD
    lead_lag: coincident
    formula_version: 2
    inputs: ["aa.*.price_blended_usd_per_mtok.pt", "metr.*.horizon_50.pt"]
    caveats: Models are matched on METR's id with its "_inspect" suffix dropped, so only models named alike in both datasets count; list prices; METR's horizon is software tasks under its suite.
    sql: |
      WITH h AS (SELECT regexp_replace(subject, '_inspect$', '') AS subject, arg_max(value_numeric, as_of_date) AS minutes,
                        arg_max(id, as_of_date) AS hid FROM observations
                 WHERE series_key LIKE 'metr.%.horizon_50.pt' AND NOT coalesce(disputed, false) GROUP BY 1),
      p AS (SELECT subject, as_of_date, value_numeric AS usd, id FROM observations
            WHERE series_key LIKE 'aa.%.price_blended_usd_per_mtok.pt' AND value_numeric > 0),
      d AS (SELECT DISTINCT as_of_date FROM p),
      cp AS (SELECT d.as_of_date, p.subject, arg_max(p.usd, p.as_of_date) AS usd, arg_max(p.id, p.as_of_date) AS pid
             FROM d JOIN p ON p.as_of_date <= d.as_of_date GROUP BY 1, 2)
      , r AS (SELECT cp.as_of_date, min(cp.usd / (h.minutes / 60)) AS value, arg_min([cp.pid, h.hid], cp.usd / (h.minutes / 60)) AS obs_ids
      FROM cp JOIN h USING (subject) GROUP BY 1)
      SELECT * FROM r QUALIFY value IS DISTINCT FROM lag(value) OVER (ORDER BY as_of_date)  -- change points only
  lab_vertical_integration_events_4q:
    description: Distinct acquisitions or acquihires by AI labs and hyperscalers of application, tooling or data companies announced in the trailing four quarters, counted from the acquisition ledger (one per acquirer-target pair) at each quarter end. Only acquirers whose primary membership is in the model or compute layer count; the ledger keeps every deal.
    rationale: The exit bell for the application layer rings when labs buy the layer above them; a rising count is vertical integration, the capture thesis's clearest signal.
    grain: [as_of_date]
    unit: count
    lead_lag: leading
    formula_version: 2
    inputs: ["acq.*.*.pt"]
    caveats: Only deals with a fetched announcement are counted; undisclosed prices still count as events; Stripe (a payments company) is in the ledger for the OpenRouter deal but, with no model or compute membership, is not counted.
    sql: |
      WITH buyers AS (SELECT DISTINCT entity_id FROM entity_membership WHERE is_primary AND layer_id IN ('model', 'compute_physical')),
      deals AS (
        SELECT split_part(series_key, '.', 2) || '/' || split_part(series_key, '.', 3) AS deal, min(as_of_date) AS announced, list(id) AS ids
        FROM observations WHERE series_key LIKE 'acq.%.pt' AND split_part(series_key, '.', 2) IN (SELECT entity_id FROM buyers) GROUP BY 1
      ), qends AS (
        SELECT DISTINCT (date_trunc('quarter', announced) + INTERVAL 3 MONTH - INTERVAL 1 DAY)::DATE AS q FROM deals
      )
      SELECT q AS as_of_date, count(*) AS value, flatten(list(ids)) AS obs_ids
      FROM qends JOIN deals ON deals.announced <= qends.q AND deals.announced > qends.q - INTERVAL 12 MONTH
      GROUP BY q ORDER BY q
  neocloud_weighted_facility_rate:
    description: Simple average of the effective interest rates CoreWeave reports on its delayed-draw term-loan facilities at each quarter end.
    rationale: What the neocloud layer pays for capital; rising rates say the compute build is being financed at the margin by lenders who price it as risk.
    grain: [as_of_date, entity]
    unit: share
    lead_lag: coincident
    formula_version: 1
    inputs: ["sec_filing.*.debt_facility_rate_*.pt"]
    caveats: Unweighted by facility size; only facilities with a stated effective rate; one filer.
    sql: |
      SELECT as_of_date, subject AS entity, avg(value_numeric) AS value, list(id) AS obs_ids
      FROM observations WHERE series_key LIKE 'sec_filing.%.debt_facility_rate_%.pt' AND value_numeric IS NOT NULL
      GROUP BY 1, 2
  cl_lab_release_claims_12m:
    description: Distinct vendors or labs with a dated production claim on the continual-learning ladder (a `cl_ladder.*.rung.pt` row citing their own description) in the trailing twelve months, at each claim date.
    rationale: Appendix E's release-claims sub-metric; the count of builders shipping systems they call continual learning is the breadth behind the ladder's top rung.
    grain: [as_of_date]
    unit: count
    lead_lag: leading
    formula_version: 2
    inputs: ["cl_ladder.*.rung.pt"]
    caveats: Every row is self-described (tier 7); research results are kept off; a vendor counts once however many posts it publishes.
    sql: |
      WITH ev AS (SELECT as_of_date, coalesce(entity_id, subject) AS who, id FROM observations WHERE series_key LIKE 'cl_ladder.%.rung.pt'),
      d AS (SELECT DISTINCT as_of_date FROM ev UNION SELECT current_date)  -- today's row lets an old claim age out
      SELECT d.as_of_date, count(DISTINCT ev.who)::DOUBLE AS value, list(ev.id ORDER BY ev.id) AS obs_ids
      FROM d JOIN ev ON ev.as_of_date <= d.as_of_date AND ev.as_of_date > d.as_of_date - INTERVAL 12 MONTH GROUP BY 1
  top3_concentration:
    description: Share of tracked primary-round dollars raised by the three largest raisers over the trailing four calendar quarters, across the whole seed list.
    rationale: P1's venture concentration measure; read beside frontier_share_of_venture_dollars, which it equals while the top three are the frontier labs.
    grain: [as_of_date]
    unit: share
    lead_lag: leading
    formula_version: 1
    inputs: ["formd.*.amount_sold_usd.pt", "epoch.*.round_equity_usd.pt"]
    caveats: Denominator is the seed list, not the market; per sub-layer it is meaningless on current coverage (one to four rounds per cell), so it is computed stack-wide only.
    sql: |
      -- ponytail: the f/e/rounds/m CTEs are copied from frontier_share_of_venture_dollars; a shared view when a third venture metric needs them
      WITH rounds AS (SELECT entity_id, as_of_date, v, id FROM venture_rounds WHERE kind = 'equity'),
      m AS (SELECT entity_id FROM entity_membership WHERE is_primary AND sublayer_id IS NOT NULL),
      q AS (SELECT date_trunc('quarter', r.as_of_date) AS cq, r.entity_id, r.v, r.id FROM rounds r JOIN m USING (entity_id) WHERE r.as_of_date >= DATE '2023-01-01'),
      qs AS (SELECT DISTINCT cq FROM q),
      win AS (SELECT qs.cq, q.entity_id, sum(q.v) AS v, list(q.id) AS ids FROM qs JOIN q ON q.cq > qs.cq - INTERVAL 12 MONTH AND q.cq <= qs.cq GROUP BY 1, 2),
      rk AS (SELECT *, row_number() OVER (PARTITION BY cq ORDER BY v DESC, entity_id) AS r, sum(v) OVER (PARTITION BY cq) AS tot FROM win)
      SELECT (cq + INTERVAL 3 MONTH - INTERVAL 1 DAY)::DATE AS as_of_date, sum(v) FILTER (WHERE r <= 3) / max(tot) AS value,
             flatten(list(ids)) AS obs_ids
      FROM rk GROUP BY cq HAVING max(tot) > 0
  lab_procurement_signal_4q:
    description: "The labs' enter bell (P1 §6.3): the sum over training-input vendors of each vendor's best procurement score in the trailing four quarters, at quarter ends. Rubric per vendor: 0 no public evidence; 1 a lab named as customer; 2 revenue or growth attributed to lab demand; 3 a disclosed lab contract or commitment of at least $100M, in a filing or confirmed by both parties."
    rationale: Labs buying from the layer below them is the entry signal for that layer's economics; read with lab_vertical_integration_events_4q, the exit bell when they buy the vendors outright.
    grain: [as_of_date]
    unit: score
    lead_lag: leading
    formula_version: 2
    inputs: ["procurement.*.signal.pt"]
    caveats: Scores are hand-coded from quoted text against the rubric (each row's coding note says how); only vendors with a fetched, verbatim source count, so the sum is a floor; lab compute commitments are on the circular ledger and excluded here.
    sql: |
      WITH s AS (SELECT entity_id, as_of_date, value_numeric AS v, id FROM observations WHERE series_key LIKE 'procurement.%.signal.pt' AND entity_id IS NOT NULL),
      qe AS (SELECT (unnest(generate_series(date_trunc('quarter', min(as_of_date)), date_trunc('quarter', current_date) - INTERVAL 3 MONTH, INTERVAL 3 MONTH)) + INTERVAL 3 MONTH - INTERVAL 1 DAY)::DATE AS q FROM s),  -- every complete quarter, so the window decays
      best AS (SELECT qe.q, s.entity_id, max(s.v) AS v, list(s.id) AS ids FROM qe JOIN s ON s.as_of_date <= qe.q AND s.as_of_date > qe.q - INTERVAL 12 MONTH GROUP BY 1, 2)
      SELECT q AS as_of_date, sum(v) AS value, flatten(list(ids)) AS obs_ids FROM best GROUP BY q
  genai_revenue_upper_bound:
    description: An approximate ceiling on generative-AI revenue - the frontier labs' latest annualised run-rates (within twelve months) plus Menlo's latest US enterprise generative-AI spend, at each run-rate date.
    rationale: The capture thesis compares consumer surplus with what consumers and firms pay; lab run-rates include consumer subscriptions and are global, so adding enterprise spend over-counts US revenue and makes a ceiling the surplus must clear.
    grain: [as_of_date]
    unit: USD
    lead_lag: coincident
    formula_version: 1
    inputs: ["epoch.*.revenue_run_rate_usd.pt", "menlo.us_enterprise.genai_spend_usd.fy"]
    caveats: An over-count on the labs' side (lab API revenue is inside enterprise spend, and run-rates are global) but it omits consumer spend on big-tech and app subscriptions, so it is an approximate ceiling, not a bound.
    sql: |
      WITH rr AS (SELECT entity_id, as_of_date, value_numeric AS v, id FROM observations WHERE series_key LIKE 'epoch.%.revenue_run_rate_usd.pt' AND entity_id IS NOT NULL),
      d AS (SELECT DISTINCT as_of_date FROM rr),
      lr AS (SELECT d.as_of_date, r.entity_id, arg_max(r.v, r.as_of_date) AS v, arg_max(r.id, r.as_of_date) AS id FROM d JOIN rr r ON r.as_of_date <= d.as_of_date AND r.as_of_date > d.as_of_date - INTERVAL 12 MONTH GROUP BY 1, 2),
      m AS (SELECT as_of_date, value_numeric AS v, id FROM observations WHERE series_key = 'menlo.us_enterprise.genai_spend_usd.fy'),
      lm AS (SELECT d.as_of_date, arg_max(m.v, m.as_of_date) AS v, arg_max(m.id, m.as_of_date) AS id FROM d JOIN m ON m.as_of_date <= d.as_of_date AND m.as_of_date > d.as_of_date - INTERVAL 18 MONTH GROUP BY 1)
      SELECT lr.as_of_date, sum(lr.v) + max(lm.v) AS value, list_append(list(lr.id ORDER BY lr.id), max(lm.id)) AS obs_ids
      FROM lr JOIN lm USING (as_of_date) GROUP BY 1
