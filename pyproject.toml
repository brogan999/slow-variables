[project]
name = "ai-tracker"
version = "0.1.0"
description = "AI diffusion + value-capture tracker: every number traces to a dated, graded observation"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "pydantic>=2.7", "duckdb>=1.1", "pyyaml>=6"]

[project.scripts]
ai-tracker = "ai_tracker.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_tracker"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
ignore_missing_imports = true
