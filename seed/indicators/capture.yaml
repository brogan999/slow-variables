    sublayer_id: hyperscalers_neoclouds
    direction_rule: {periods: 4, dead_band: 0.02, higher_is: concentrating, rationale: "Four fiscal quarters; two points of margin is noise. Rising cloud margin under rising capex means the layer is keeping surplus."}
    leading_lagging: lagging
    tracker_interpretation: Cloud margins have held through the capex wave so far; depreciation schedules do a lot of the holding.
    counterevidence: Segment margins blend AI and non-AI workloads; useful-life extensions flatter them; Google Cloud's margin is on a much smaller base.
