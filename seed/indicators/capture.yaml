  - id: lab_hhi
    name: Lab concentration of routed tokens (OpenRouter, HHI)
    definition: Herfindahl index of prompt-plus-completion tokens by lab across the models in OpenRouter's daily top table, each model counted toward the lab in its OpenRouter id, last reading each week. Derived metric lab_token_hhi. One router's traffic and the listed slice only.
    why_it_matters: Multi-homing shrinks lock-in, which shrinks the labs' bargaining share; a falling index is the leading sign of model commoditisation in buyer behaviour.
    proxy_types: [market_structure]
    unit: index
    cadence_expected: weekly
    metric: lab_token_hhi
    band_input: "metric:lab_token_hhi"
    layer_id: model
    direction_rule: {periods: 4, dead_band: 0.02, higher_is: concentrating, rationale: "Four weekly readings; under 0.02 in the index is table churn. Rising = routed tokens concentrating on fewer labs."}
    leading_lagging: leading
    tracker_interpretation: The series starts in the week of 7 September 2026; a direction needs five weekly readings. On 9 September the top table spread across twelve labs, led by Chinese open-weight authors.
    counterevidence: OpenRouter is one router with a developer-heavy mix and only its top table is counted; enterprise buyers mostly go direct to the labs and never appear here. Ramp's letters measure a different thing (the share of US businesses paying each lab) and are not counted as a second source for this index.
    confidence: 40
    proposed_status: not_yet_measurable
    related_indicators: [model_token_concentration, ramp_paid_ai_adoption]
    published: true
    updated_at: 2026-09-11
  - id: saas_multiples
    name: Public cloud software valuation multiples (Clouded Judgement)
    definition: Median enterprise value to next-twelve-months revenue across public cloud software companies, weekly, as computed by Jamin Ball's Clouded Judgement; the top-five median is tracked alongside.
    why_it_matters: The valuation multiple is the market's expectation of durable rent at the application layer. Compression toward low single digits prices in commoditisation by AI; recovery prices in apps keeping their surplus.
    proxy_types: [market_structure, price]
    unit: ratio
    cadence_expected: weekly
    series_keys: ["clouded_judgment.saas_public.ev_ntm_revenue_median.w", "clouded_judgment.saas_public_top5.ev_ntm_revenue_median.w"]
    band_input: clouded_judgment.saas_public.ev_ntm_revenue_median.w
    layer_id: deployment_application
    direction_rule: {periods: 8, dead_band: 0.3, higher_is: concentrating, rationale: "Eight weekly prints (two months); a move under 0.3x of NTM revenue is market noise. Rising multiples = the market pricing more durable rents into the application layer."}
    leading_lagging: leading
    tracker_interpretation: The median multiple fell to about 3x in spring 2026 on the 'AI eats software' trade and has recovered to the mid-4s; the top five trade above 30x.
    counterevidence: One analyst's basket and methodology; multiples move with rates as much as with AI; the basket is incumbents, not AI-native apps.
    confidence: 50
    proposed_status: emerging
    related_indicators: [enterprise_spend_by_layer]
    unpublished_reason: "Cannot refresh unattended: Clouded Judgement's Substack feed refuses the nightly's cloud fetches (HTTP 403 on every run since 10 Sep 2026), so the weekly series would sit stale; the history stays on /series, and the indicator publishes again if a fetchable copy of the weekly table appears."
    published: false
    updated_at: 2026-09-11
