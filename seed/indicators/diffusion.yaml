  - id: cross_tracker_concordance
    name: Cross-tracker concordance (labour)
    definition: How many of the four labour trackers (Canaries payroll, Canaries entry-level, Revelio, CAIT) currently read past their own AI-attributable-break threshold. Derived metric cross_tracker_concordance, 0 to 4.
    why_it_matters: The thesis's falsification rule requires three trackers breaking concurrently, not one. This is that count, made explicit.
    proxy_types: [deployment, welfare]
    unit: count
    cadence_expected: monthly
    metric: cross_tracker_concordance
    band_input: "metric:cross_tracker_concordance"
    bucket_id: adaptation
    valve_measured: adoption_to_adaptation
    normal_band: {hi: 1}
    fast_band: {lo: 2}
    falsifying_band: {lo: 3}
    band_rationale: "Normal = at most one tracker past its threshold; fast = two; falsifying = three or more concurrently, per the thesis rules in the brief."
    tracker_interpretation: Zero of four. The entry-level signal is real but below its threshold; nothing else is close.
    counterevidence: Thresholds are ours; the four trackers measure different populations and geographies, so concurrence is a loose test.
    layer_id: labour_consumers
    leading_lagging: coincident
    confidence: 70
    proposed_status: consistent_with_normal
    related_indicators: [canaries_exposed_employment_yoy, revelio_exposed_vs_unexposed_growth, cait_high_exposure_claims, canaries_entry_level_gap]
