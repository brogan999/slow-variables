  - id: rsi_agent_workdays_per_human
    name: Agent-workdays per human workday in frontier research (self-reported)
    definition: Agent effort used by a frontier lab's research organisation, in standard eight-hour workdays, per workday of human labour. Today only OpenAI reports it, about itself.
    why_it_matters: The return arrow made numeric. If deployment inside the lab is feeding invention at more than one agent-day per human-day, the loop Narayanan and Kapoor draw but do not instrument is running; whether it substitutes for external bottlenecks is the thesis question.
    proxy_types: [deployment, behaviour]
    unit: ratio
    cadence_expected: quarterly
    series_keys: ["openai_blog.openai.rsi_agent_workdays_per_human.pt"]
    band_input: openai_blog.openai.rsi_agent_workdays_per_human.pt
    bucket_id: return_arrow
    valve_measured: return_arrow
    normal_band: {hi: 1.0}
    fast_band: {lo: 3.0}
    band_rationale: "Below one agent-day per human-day, agents are tools inside a human-run process (normal); at three or more, most research effort is agent effort, the regime the AI 2027 'R&D multiplier' assumes (fast). Between is emerging. Tier 7 evidence caps the status at emerging whatever the number says."
    tracker_interpretation: OpenAI says 3.1 as of mid-August 2026, having crossed 1.0 in June; Anthropic says its overall progress multiplier is below 2x. Lab statements about themselves, not outcome measures; the number to watch is an independent replication, which METR is funded to build.
    counterevidence: Self-measured and self-published by the lab whose timeline it supports; 'effort' counts agent time, not delivered research; the same post says over half of successful four-to-eight-hour tasks still needed human intervention. Anthropic's September 2026 system card reports staff self-estimating about 4x productivity uplift while the company puts its overall progress multiplier below 2x and observes no sustained AI-attributable 2x acceleration. METR's technical-worker survey finds a self-reported 1.4–2x value uplift, and METR's own RCT measured developers slower with AI.
    layer_id: model
    leading_lagging: leading
    timing_rationale: "Leading: agent effort inside research labs runs ahead of the capability it produces by a model generation or more."
    confidence: 30
    proposed_status: emerging
    related_indicators: [rsi_intervention_rate_4_8h, metr_horizon_80, dev_rct_uplift]
    published: true
    updated_at: 2026-09-10
  - id: rsi_intervention_rate_4_8h
    name: Human interventions on 4–8 hour agent tasks (self-reported)
    definition: Share of successful four-to-eight-hour agent tasks inside a frontier lab's research organisation that needed at least one human intervention. Today only OpenAI reports it, about itself, and only as 'over half'.
    why_it_matters: The reliability side of the return arrow. Agent-workdays can rise while humans still steer every long task; the loop only substitutes for people when this rate falls.
    proxy_types: [deployment, behaviour]
    unit: share
    cadence_expected: quarterly
    series_keys: ["openai_blog.openai.rsi_intervention_rate_4_8h.pt"]
    band_input: openai_blog.openai.rsi_intervention_rate_4_8h.pt
    bucket_id: return_arrow
    valve_measured: return_arrow
    normal_band: {lo: 0.5}
    fast_band: {hi: 0.25}
    band_rationale: "Humans steering most long tasks (half or more need intervention) is the normal-technology picture; a quarter or fewer is the regime where long agent runs are autonomous. Between is emerging. The reported value is a floor ('over half'), stored as 0.5."
    tracker_interpretation: Over half of successful long tasks still needed a person in the loop in the first half of 2026; agent effort is up, autonomy on long tasks is not yet.
    counterevidence: Self-reported and rounded; counts successful tasks only, so failed runs that needed no intervention are excluded; 'intervention' is defined by the lab.
    layer_id: model
    leading_lagging: leading
    timing_rationale: "Leading: fewer interventions on long internal tasks come before agents are trusted with the same work outside the lab."
    confidence: 30
    proposed_status: emerging
    related_indicators: [rsi_agent_workdays_per_human, horizon_ratio_80_50]
    published: true
    updated_at: 2026-09-10
  - id: safety_brake_events
    name: Safety brakes inside the labs (events, trailing year)
    definition: "Deliberate slowdowns announced by a frontier lab and recorded as dated evidence rows with a verbatim announcement: paused training runs, gated releases, confinement of a model under a preparedness framework. Derived metric safety_brake_events_12m counts them over the trailing twelve months."
    why_it_matters: The paper's safety speed limits are argued from regulated domains; the tracker also watches for them on the invention stage, where a brake inside a lab slows the whole chain before any regulator acts.
    proxy_types: [policy, model_release]
    unit: count
    cadence_expected: quarterly
    metric: safety_brake_events_12m
    band_input: "metric:safety_brake_events_12m"
    bucket_id: adaptation
    valve_measured: adoption_to_adaptation
    normal_band: {lo: 1}
    fast_band: {hi: 0}
    band_rationale: "Normal = at least one announced brake a year (the limits bind); fast = none, the pace the AI 2027 scenario assumes on the invention stage. Lab self-reports are tier 7, so the status is capped at emerging until an independent record exists."
    tracker_interpretation: Three brakes in five weeks of 2026, all inside OpenAI and all self-announced; the count is a floor, since labs announce selectively.
    counterevidence: Every row is the lab describing itself; a brake announced is not a brake measured, and the same lab restarted the paused run within a month; other labs' brakes are not yet recorded.
    layer_id: model
    leading_lagging: leading
    timing_rationale: "Leading: a lab pauses or gates before a release reaches users, so brakes show before any deployment slows."
    confidence: 40
    proposed_status: emerging
    related_indicators: [rsi_intervention_rate_4_8h, rsi_agent_workdays_per_human]
    published: true
    updated_at: 2026-09-11
  - id: epoch_training_compute_growth
    name: Frontier training compute growth (doubling time)
    definition: Doubling time of frontier models' training compute, fitted log-linearly against publication date from 2020 on Epoch's frontier-model table. Derived metric training_compute_doubling_days.
    why_it_matters: The invention stage's own speed limit. The brief's reading is 4-5x a year; a slowdown here is the first thing the data-and-compute constraint would show.
    proxy_types: [benchmark, model_release]
    unit: days
    cadence_expected: annual
    metric: training_compute_doubling_days
    band_input: "metric:training_compute_doubling_days"
    bucket_id: methods
    valve_measured: invention_to_product
    normal_band: {lo: 300}
    fast_band: {hi: 182}
    band_rationale: "Normal = doubling no faster than every 300 days (about 2.3x a year, the pre-2010 pace of compute growth); fast = every 182 days or less (4x a year or more, Epoch's 2010-2025 trend). Between is emerging."
    tracker_interpretation: Fitted on Epoch's estimates, most of which are inferred for closed models; the newest models are missing until Epoch estimates them.
    counterevidence: Compute estimates for closed models carry wide uncertainty; the frontier set is Epoch's selection; training compute is an input, not a capability.
    layer_id: model
    leading_lagging: leading
    timing_rationale: "Leading: training compute sets the capability of models released months later and deployed years later."
    confidence: 60
    related_indicators: [epoch_training_power_growth, metr_horizon_50]
    published: true
    updated_at: 2026-09-11
