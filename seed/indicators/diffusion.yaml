  - id: aei_augmentation_share
    name: Augmentation vs automation share (Anthropic Economic Index)
    definition: Share of classified Claude.ai conversations in the augmentation bucket (learning, task iteration, validation) versus automation (directive, feedback loop), computed from Anthropic's Economic Index open dataset for each 2026 release; the blog-reported shares and the share of occupations with at least a quarter of their tasks used are shown alongside.
    why_it_matters: The paper's bet is that AI diffuses as a tool people use, not a replacement; this is the only large-scale usage classification that speaks to it directly.
    proxy_types: [behaviour, product]
    unit: share
    cadence_expected: quarterly
    series_keys: ["anthropic_ei.global.augmentation_share.pt", "anthropic_ei.global.automation_share.pt", "anthropic_ei.global.augmentation_share_reported.pt", "anthropic_ei.global.automation_share_reported.pt", "anthropic_ei.global.occupations_25pct_tasks_share.pt"]
    band_input: anthropic_ei.global.augmentation_share.pt
    bucket_id: early_adoption
    valve_measured: product_to_adoption
    normal_band: {lo: 0.5}
    fast_band: {hi: 0.4}
    band_rationale: "Normal = augmentation at least half of classified use; fast = automation clearly dominant (augmentation under 40%). Between is `emerging`."
    tracker_interpretation: Augmentation has held just above half of classified use through the 2026 releases (53% in Nov 2025, 54% in Feb 2026, 51% in Apr-May 2026); automation is gaining slowly on the monthly data.
    counterevidence: One provider's consumer product; classification is model-based; API usage (where automation concentrates) is reported separately and skews the other way.
    layer_id: adopters
    leading_lagging: coincident
    confidence: 60
    proposed_status: consistent_with_normal
    related_indicators: [bbd_work_hours_assisted]
    published: true
    updated_at: 2026-09-10
  - id: labor_share_nonfarm
    name: US labour share of income, year on year
    definition: Year-on-year change in the BLS nonfarm business labor share index (PRS85006173), derived metric bls_labor_share_yoy. The share of output paid to labour rather than capital.
    why_it_matters: If AI shifts surplus from wages to capital, this is where it shows in official data. The Anthropic Institute's September 2026 scenarios put the labour share at 60% today and 45% by 2030 under extreme change, and unchanged under modest change.
    proxy_types: [welfare]
    unit: share
    cadence_expected: quarterly
    series_keys: ["bls.prs85006173.q"]
    metric: bls_labor_share_yoy
    band_input: "metric:bls_labor_share_yoy"
    bucket_id: adaptation
    valve_measured: leak
    normal_band: {lo: -0.02}
    fast_band: {hi: -0.05}
    band_rationale: "Normal = year-on-year moves of at most 2%, the size of ordinary cyclical swings in the index; fast = 5% or worse a year, roughly the pace that takes the share from 60% to 45% by 2030 (the extreme scenario). Between is `emerging`."
    tracker_interpretation: The share is falling faster than a cycle alone explains, though from a post-pandemic high; it is the one adaptation series that is not at trend.
    counterevidence: The index has fallen before without AI (2000s); wage lags after an inflation shock push it down mechanically; quarterly readings are revised and the 2025 peak was unusual.
