# Diffusion-lens indicators. No status here: status lives in data/status_events.jsonl only.
# `proposed_status` is what the brief expected on 9 Sep 2026; `check` reports disagreement with the evaluator.
indicators:
  - id: metr_horizon_50
    name: METR 50% time horizon
    definition: Length (in human-expert minutes) of software tasks a frontier model completes with 50% success, per METR's Horizon v1.1 suite, plotted by model release date. The band applies to the doubling time of that series over the most recent window METR itself reports (2024 onward), recomputed here from METR's corrected data file; METR's published 2023-onward figure is shown alongside.
    why_it_matters: The cleanest single series for the methods stock. If capability doubles every few months the invention valve is wide open; the paper's claim is that this alone does not move the later stocks.
    proxy_types: [benchmark]
    unit: minutes
    cadence_expected: per_release
    series_keys: ["metr.*.horizon_50.pt", "metr.suite.doubling_time_days.pt", "metr_blog.suite.doubling_time_days_since_2024.pt", "metr_blog.suite.doubling_time_days_since_2023.pt", "metr_blog.suite.doubling_time_days_2019_2025.pt"]
    band_input: "metric:horizon_doubling_days_50_since_2024"
    related_metrics: [horizon_doubling_days_50_since_2024, horizon_doubling_days_50_since_2023, horizon_blowup_year_50_since_2024]
    bucket_id: methods
    normal_band: {lo: 213}
    fast_band: {hi: 122}
    band_rationale: "Normal = doubling time ≥ 7 months (≈213 days, METR's 2019–2025 trend); fast = ≤ 4 months (≈122 days), the AI 2027 assumption. Between the two is `emerging`. The bands are about the current pace, so the input is a log-linear fit over the 2024-onward window, the most recent window METR reports (89 days in the TH1.1 post of 29 Jan 2026), recomputed from METR's corrected data. On the 2023-onward window METR's published figure is 128.7 days, in the gap between the bands: the reading is window-sensitive and both numbers are shown."
    tracker_interpretation: Capability is moving fast by any historical standard. Whether it is faster than the AI-2027 doubling assumption is the live question the band answers.
    counterevidence: On the 2023-onward window (METR's published 128.7 days, our fit 125) the status would be `emerging`, not `faster_than_normal`; the status depends on the window. METR notes measurements above 16 hours are unreliable with the current task suite, so the newest points carry wide intervals and are flagged disputed, and human baselines exist for only 5 of the 31 tasks over 8 hours. Horizon is a software-task construct and may not transfer to other work.
    layer_id: model
    leading_lagging: leading
    confidence: 80
    proposed_status: faster_than_normal
    related_bottlenecks: [1, 2, 3]
    related_indicators: [metr_horizon_80, horizon_ratio_80_50]
    published: true
    updated_at: 2026-09-10
  - id: metr_horizon_80
    name: METR 80% time horizon
    definition: Task length a model completes with 80% success on the same suite. The band applies to a log-linear doubling-time fit over the 80% series from 2024 onward (derived metric horizon_doubling_days_80_since_2024), the same window as the 50% horizon.
    why_it_matters: 80% is closer to what a product needs than 50%. If the reliable horizon lags badly, benchmarks flatter products.
    proxy_types: [benchmark]
    unit: minutes
    cadence_expected: per_release
    series_keys: ["metr.*.horizon_80.pt"]
    band_input: "metric:horizon_doubling_days_80_since_2024"
    related_metrics: [horizon_doubling_days_80_since_2024, horizon_doubling_days_80_since_2023]
    bucket_id: methods
    normal_band: {lo: 213}
    fast_band: {hi: 122}
    band_rationale: "Same bands and same 2024-onward window as the 50% horizon, applied to our own fit because METR publishes doubling times for the 50% series only. The 2023-onward fit (horizon_doubling_days_80) sits in the gap between the bands."
    tracker_interpretation: Fast, but lagging the 50% horizon; the lag is the reliability gap the products bucket has to close.
    counterevidence: Our fit has no confidence interval and excludes points METR marks unreliable; the 2023-onward window gives ~125 days, which would read `emerging`. The 80% horizon is still an order of magnitude below the 50% horizon, which is the reliability gap the products bucket has to close.
    layer_id: model
    leading_lagging: leading
    confidence: 70
    proposed_status: faster_than_normal
    related_indicators: [metr_horizon_50, horizon_ratio_80_50]
    published: true
    updated_at: 2026-09-10
  - id: horizon_ratio_80_50
    name: 50%/80% horizon ratio
    definition: METR 50% horizon divided by 80% horizon for the same model (derived metric horizon_ratio_80_50). ~7-10x recently, up from ~5x.
    why_it_matters: The ratio is the reliability gap in one number. If it collapses toward 2x while the 80% horizon exceeds eight hours, the normal-technology thesis loses its productisation argument.
    proxy_types: [benchmark]
    unit: ratio
    cadence_expected: per_release
    metric: horizon_ratio_80_50
    band_input: "metric:horizon_ratio_80_50"
    bucket_id: methods
    valve_measured: invention_to_product
    normal_band: {lo: 5}
    fast_band: {hi: 2}
    band_rationale: "Normal = ratio ≥ 5 (gap holding or widening); fast = ratio ≤ 2. The falsifying condition (≤ 2 AND 80% horizon > 8 h) is compound and lives in the thesis monitor, not the band."
    tracker_interpretation: The gap is widening, which is pro-normal. It is the paper's reliability argument made measurable.
    counterevidence: Ratio is sensitive to the task mix and to the exclusion of models beyond the suite ceiling; a single new model can move it.
    layer_id: model
    leading_lagging: leading
    confidence: 70
    proposed_status: consistent_with_normal
    related_indicators: [metr_horizon_50, metr_horizon_80]
    published: true
    updated_at: 2026-09-10
  - id: bls_labor_productivity_yoy
    name: US labour productivity, year on year
    definition: Nonfarm business sector output per hour, percent change from the same quarter a year earlier (BLS PRS85006091).
    why_it_matters: The adaptation stock only counts when it shows up in aggregate productivity. The paper predicts diffusion at human speed, so productivity stays near trend for years even while capability races.
    proxy_types: [deployment, welfare]
    unit: pct
    cadence_expected: quarterly
    series_keys: ["bls.prs85006091.q", "bls.prs85006092.q"]
    band_input: bls.prs85006091.q
    bucket_id: adaptation
    valve_measured: adoption_to_adaptation
    normal_band: {hi: 2.5}
    fast_band: {lo: 3.5}
    band_rationale: "Post-war nonfarm productivity growth averages about 2.1% a year, so anything up to 2.5% is trend. Goldman's AI scenario adds about 1.5 points a year; sustained prints of 3.5% or more would be that. Between is `emerging`."
    tracker_interpretation: Productivity is at or slightly above trend, which is exactly what a normal-technology diffusion path looks like in year three of deployment.
    counterevidence: Quarterly productivity is noisy and cyclical; 2025–26 prints reflect a softening labour market and hours cuts as much as technology. Aggregate data cannot attribute anything to AI.
    layer_id: labour_consumers
    leading_lagging: lagging
    confidence: 80
    proposed_status: consistent_with_normal
    related_indicators: [bls_tfp_private_nonfarm]
    published: true
    updated_at: 2026-09-10
  - id: bls_tfp_private_nonfarm
    name: US total factor productivity, private nonfarm business
    definition: Year-on-year change in the BLS total factor productivity index for private nonfarm business (MPU4910012), derived from the annual index.
    why_it_matters: TFP is the residual where a general-purpose-technology effect must eventually appear; it strips out capital deepening, so it is the cleanest macro test of adaptation.
    proxy_types: [welfare]
    unit: share
    cadence_expected: annual
    series_keys: ["bls.mpu4910012.a"]
    metric: bls_tfp_yoy
    band_input: "metric:bls_tfp_yoy"
    bucket_id: adaptation
    valve_measured: adoption_to_adaptation
    normal_band: {hi: 0.012}
    fast_band: {lo: 0.02}
    band_rationale: "Long-run private nonfarm TFP growth is about 1% a year; Acemoglu's AI estimate is at most 0.66% over a decade, invisible at annual resolution. Goldman-scale is roughly a point a year on top of trend. Normal = at most 1.2%; fast = 2% or more."
    tracker_interpretation: TFP growth is inside its long-run range. A sustained break above 2% for several years is what the fast band requires, and nothing yet suggests it.
    counterevidence: Annual, published with a lag, and revised; the latest year predates most enterprise deployment. TFP can be flattered by measurement of software investment.
    layer_id: labour_consumers
    leading_lagging: lagging
    confidence: 75
    proposed_status: consistent_with_normal
    related_indicators: [bls_labor_productivity_yoy]
    published: true
    updated_at: 2026-09-10
  - id: dev_rct_uplift
    name: Developer productivity uplift (METR RCTs)
    definition: Measured speed change for experienced developers using AI tools versus not, from METR's randomised trials. Negative means slower. The band applies to the newest estimate (Feb 2026, newly recruited developers).
    why_it_matters: The single best-controlled test of whether frontier capability turns into product-level uplift. The paper's claim is that benchmark gains do not translate quickly; this is where that shows.
    proxy_types: [product, deployment]
    unit: share
    cadence_expected: annual
    series_keys: ["metr_blog.rct_*.dev_speed_change.pt"]
    band_input: metr_blog.rct_2026.dev_speed_change.pt
    bucket_id: products
    valve_measured: invention_to_product
    normal_band: {hi: 0.2}
    fast_band: {lo: 0.4}
    band_rationale: "Normal = uplift of at most about 20%, setting-dependent (the range of controlled studies to date); fast = broad uplift above 40%, the scale the productivity-boom claims need."
    tracker_interpretation: Two trials, two years, and the best estimate is still near zero. Capability is not the constraint; integration and verification are.
    counterevidence: Small samples; the 2026 redesign has selection effects METR itself calls 'very weak evidence'; experienced open-source maintainers on their own repos are the hardest case for uplift.
    layer_id: deployment_application
    leading_lagging: leading
    confidence: 70
    proposed_status: consistent_with_normal
    related_bottlenecks: [4, 5, 6]
    related_indicators: [enterprise_pilot_to_production]
    published: true
    updated_at: 2026-09-10
  - id: enterprise_pilot_to_production
    name: Enterprise pilots with measurable P&L impact
    definition: Share of enterprise generative-AI pilots that reach measurable P&L impact, from MIT NANDA's 2025 survey (5%). Disputed; Menlo's ~47% reaching production uses a different denominator.
    why_it_matters: The product-to-adoption valve in one number. If most pilots never pay off, adoption stays broad but shallow.
    proxy_types: [deployment, behaviour]
    unit: share
    cadence_expected: annual
    series_keys: ["nanda.us_enterprise.pilots_with_pnl_impact_share.pt", "fortune.us_enterprise.pilots_with_pnl_impact_share.pt"]
    band_input: nanda.us_enterprise.pilots_with_pnl_impact_share.pt
    bucket_id: products
    valve_measured: product_to_adoption
    normal_band: {hi: 0.1}
    fast_band: {lo: 0.3}
    band_rationale: "Normal = at most 10% of pilots with measurable P&L impact, the typical enterprise-IT hit rate; fast = more than 30%."
    tracker_interpretation: Consistent with the paper, and with every previous general-purpose technology; the number to watch is whether it moves at all in the 2026 wave.
    counterevidence: One survey, disputed sample and denominator; Menlo's 47% reach-production figure on a different definition; the report is hosted only on a mirror.
    layer_id: deployment_application
    leading_lagging: coincident
    confidence: 55
    proposed_status: consistent_with_normal
    related_bottlenecks: [20, 21, 22]
    related_indicators: [dev_rct_uplift]
    published: true
    updated_at: 2026-09-10
  - id: bbd_work_hours_assisted
    name: Share of work hours assisted by generative AI
    definition: Share of all US work hours in which employed adults used generative AI, from the Bick–Blandin–Deming Real-Time Population Survey (quarterly series via FRED), with weekly work use and any-use shares shown alongside.
    why_it_matters: The intensive margin. Headline adoption is broad, but hours actually assisted is what productivity arithmetic runs on.
    proxy_types: [behaviour, deployment]
    unit: share
    cadence_expected: quarterly
    series_keys: ["fred.us_workers.hours_assisted_share.q", "fred.us_workers.work_use_weekly_share.q", "fred.us_adults.any_use_share.q", "bbd.us_workers.hours_assisted_share.pt", "bbd.us_workers.work_use_weekly_share.pt", "bbd.us_adults.any_use_share.pt", "stlouisfed_blog.us_workers.hours_assisted_share.pt"]
    band_input: fred.us_workers.hours_assisted_share.q
    bucket_id: early_adoption
    valve_measured: product_to_adoption
    normal_band: {hi: 0.09}
    fast_band: {lo: 0.2}
    band_rationale: "Normal = single-digit share of hours in year three (PCs and the internet were here at the same age); fast = more than 20% of hours assisted."
    tracker_interpretation: Broad but shallow, exactly as the paper predicts - most workers touch it, few hours run on it. The weekly-use share moved far faster than the brief expected.
    counterevidence: Self-reported survey; the instrument changed between waves; hours assisted is not hours saved.
    layer_id: adopters
    leading_lagging: coincident
    confidence: 80
    proposed_status: consistent_with_normal
    related_indicators: [btos_firm_use]
    published: true
    updated_at: 2026-09-10
  - id: btos_firm_use
    name: US firms using AI (Census BTOS)
    definition: Share of US businesses reporting AI use in any business function in the last two weeks, Census Business Trends and Outlook Survey. The question changed in November 2025, so this is the post-break series.
    why_it_matters: The firm-level extensive margin from an official biweekly survey of 1.2 million businesses. Employment-weighted use is higher; small firms dominate the count.
    proxy_types: [behaviour, deployment]
    unit: share
    cadence_expected: biweekly
    series_keys: ["census_btos.us.ai_use_share_v2.2w", "census_btos.us.ai_use_share_v1.2w"]
    band_input: census_btos.us.ai_use_share_v2.2w
    bucket_id: early_adoption
    valve_measured: product_to_adoption
    normal_band: {hi: 0.35}
    fast_band: {lo: 0.5}
    band_rationale: "Normal = under about a third of firms in year three, the pace at which PCs and e-commerce reached half of firms over a decade or more; fast = more than half. Ramp's card-spend index (>50%) is a different instrument and not comparable."
    tracker_interpretation: One firm in five, rising a point or two per quarter - organisational speed, not capability speed.
    counterevidence: Series break in November 2025 (the pre-break series is shown as v1); 'AI use' is self-defined by respondents; the count is dominated by very small firms.
    layer_id: adopters
    leading_lagging: coincident
    confidence: 70
    proposed_status: consistent_with_normal
    related_indicators: [bbd_work_hours_assisted]
    published: true
    updated_at: 2026-09-10
  - id: canaries_exposed_employment_yoy
    name: Employment in AI-exposed occupations, year on year
    definition: Year-on-year employment change in the most AI-exposed occupation quintile versus the least exposed, from the Stanford DEL and ADP Research Canaries Dashboard (payroll data). The band applies to the most-exposed series.
    why_it_matters: The paper predicts no broad AI-attributable employment decline for years; this is the highest-frequency payroll test of that claim.
    proxy_types: [deployment, welfare]
    unit: share
    cadence_expected: monthly
    series_keys: ["adp_research.us_high_exposure.employment_yoy.m", "adp_research.us_low_exposure.employment_yoy.m"]
    band_input: adp_research.us_high_exposure.employment_yoy.m
    bucket_id: adaptation
    valve_measured: adoption_to_adaptation
    normal_band: {lo: -0.01, hi: 0.01}
    fast_band: {hi: -0.03}
    band_rationale: "Normal = within one percent of flat, ordinary occupational churn; fast = a 3% or worse decline in exposed occupations, which is what a broad AI-attributable displacement looks like in payroll data. Between is `emerging`."
    tracker_interpretation: Exposed occupations are flat while unexposed grow slowly; the signal is in the young, not the aggregate.
    counterevidence: Unpublished until a second source states the all-ages figure (the Stanford note shows it only in a figure). Exposure is a model-derived measure; ADP payroll coverage skews to larger firms; the divergence began before ChatGPT on some cuts (NY Fed; Iscenko and Millet).
    layer_id: labour_consumers
    leading_lagging: coincident
    confidence: 80
    proposed_status: consistent_with_normal
    related_indicators: [canaries_entry_level_gap, cross_tracker_concordance]
    published: false
    updated_at: 2026-09-10
  - id: canaries_entry_level_gap
    name: Entry-level employment shortfall in AI-exposed occupations
    definition: How far employment of 22–25-year-olds in the two most AI-exposed quintiles has fallen short of keeping pace with the three least exposed, per the Canaries paper (Aug 2026 revision).
    why_it_matters: If AI substitutes for the codified knowledge new graduates bring, the first sign is hiring, not separations. This is that sign.
    proxy_types: [deployment, welfare]
    unit: share
    cadence_expected: quarterly
    series_keys: ["stanford_del.us_entry_level_exposed.employment_gap.pt", "stanford_del.us_entry_level_exposed.employment_change_since_nov2022.pt", "stanford_del.us_entry_level_unexposed.employment_change_since_nov2022.pt"]
    band_input: stanford_del.us_entry_level_exposed.employment_gap.pt
    bucket_id: adaptation
    valve_measured: adoption_to_adaptation
    normal_band: {hi: 0.1}
    fast_band: {lo: 0.25}
    band_rationale: "Normal = a shortfall under 10 points, inside the range youth employment swings over a cycle; fast = 25 points or more. The current reading sits between, so it is `emerging`."
    tracker_interpretation: Widening (15% to 19% in a year) and concentrated exactly where the paper says AI bites first. Real, but not yet the broad decline the falsification rule needs.
    counterevidence: Timing partly predates ChatGPT; hiring freezes in tech and finance explain part of it; the measure is relative, so exposed-occupation youth could be flat while others boom.
    layer_id: labour_consumers
    leading_lagging: leading
    confidence: 70
    proposed_status: emerging
    related_indicators: [canaries_exposed_employment_yoy, new_grad_unemployment]
    published: true
    updated_at: 2026-09-10
