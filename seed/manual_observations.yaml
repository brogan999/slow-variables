  # ---------- 4. lab_vertical_integration_exit_bell ----------
  # The ledger's written rule (swept 23 Sep 2026 for the 120 buyers pinned in tests/test_manual.py). A deal counts when:
  # R1 its acquirer is a buyer (primary membership in the model or compute layer), keyed as the subject; Alphabet units
  #    are googl, Microsoft units msft, Amazon units amzn; a lab's parent never stands in for the lab, nor a lab for its parent.
  # R2 it was first confirmed on the record by a party or a filing on or after 1 Jan 2025, and is dated then, never at a
  #    report of talks.
  # R3 it is a purchase (whole or controlling); an acquihire, where a party confirms that the company's founders or its
  #    team are joining the buyer and the company's own product ends or passes to the buyer (people leaving a company
  #    that carries on, or is sold to someone else, do not count); or a licence or stake with money paid, the founder,
  #    chief executive or most of the team joining, and a party or filing confirming it. A confirmed deal later
  #    terminated counts at its confirmation; a deal only reported never counts; a joint purchase counts only if one
  #    buyer controls it. A deal notified to the European Commission under the Digital Markets Act is dated no later
  #    than its notification (a filing), in Brussels time.
  # R4 its target is in one of the fourteen sublayers above the model layer (training input, serving and orchestration,
  #    deployment and application), named in the row's note; a target that is an entity is classed by its primary
  #    membership (so robot makers, filed as labs, are out). Software built for AI workloads counts; general cluster and
  #    HPC schedulers count as compute. Chips, clouds, data centres, power, other labs, databases and data tools, and
  #    non-AI or non-technology businesses are listed below as considered, not counted.
  # R5 one row per deal, from the acquirer's or target's announcement, else CNBC or Fortune, else TechCrunch; a page that
  #    refuses scripted requests or no longer exists is cited from a raw archive capture.
  # R6 searched: newsrooms and blogs, Wikipedia's M&A lists and the EU's DMA notices (discovery only), 8-K Items
  #    1.01/2.01 and 10-K/10-Q acquisition notes, and searches for "acquires", "acquisition", "acquihire", "buys",
  #    "joins" and "acquired by" in 2025 and 2026; the metric reads only quarters a sweep has covered.
