  - metr_horizon_80
  domain: general
  domain_basis: 'matched extraction row: Capability-reliability gap'
- id: 4
  title: Compounding unreliability in agents
  text: An agent making dozens of LLM calls with even a 2% error rate per step becomes useless end to end.
  section: 'Stage 1: Methods → products (the model-to-product gap)'
  bucket_id: products
  source_codes:
  - AgentsMatter
  related_indicators:
