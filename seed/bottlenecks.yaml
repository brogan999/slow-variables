  - dev_rct_uplift
  domain: general
  domain_basis: 'matched extraction row: Proof-of-concept to product gap'
- id: 3
  title: Capability-reliability gap
  text: Accuracy has risen sharply while reliability has moved only a few points. A model that is right 70% of the time but fails unpredictably cannot remove the human from the loop, and reliability fixes are application-specific.
  section: 'Stage 1: Methods → products (the model-to-product gap)'
  bucket_id: products
  source_codes:
  - ANT
  - Slowing
  - Left
  - OWE
  related_indicators:
