  domain: general
  domain_basis: 'matched extraction row: Application development effort does not vanish'
- id: 2
  title: Proof-of-concept to product gap
  text: A demo that works 90% of the time is a capability, not a product. Executives see quick prototypes and miss the 90% of work needed to finish them.
  section: 'Stage 1: Methods → products (the model-to-product gap)'
  bucket_id: products
  source_codes:
