- id: 1
  title: Application development effort does not vanish
  text: The "bitter lesson" applies to methods, not products. Real applications still need hand-built business logic, frontends, integrations, and evaluation.
  section: 'Stage 1: Methods → products (the model-to-product gap)'
  bucket_id: products
  source_codes:
