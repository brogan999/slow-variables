  - horizon_ratio_80_50
  domain: agents
  domain_basis: 'matched extraction row: Compounding unreliability in agents'
- id: 5
  title: Users expect software-like determinism
  text: People expect AI products to behave like software. Stochastic outputs violate that expectation, and it is unclear whether determinism can be engineered in.
