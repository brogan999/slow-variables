- id: firm_own_record
  name: The firm's own record of itself, kept on its own servers for every agent to read
  published: true
  primary: context_and_memory
  adjacent:
  - context_engineering
  - technical_implementation
  - tools_and_actuation
  customer: Large firms in regulated fields whose data may not leave their own systems
  bottleneck: What a firm knows is scattered across systems whose tables no document explains, so every agent has to be taught the firm again
  wedge: Answer hard questions over the firm's data where it already sits, writing down what each table and term means along the way
  unit_sold: A platform licence, then each agent and application that runs on the record
  why_not_bundled: A lab or a cloud would hold the record on its own systems; the buyer wants it on its own, and usable with any model
  durable_asset: The written-down map of what the firm's data means and how its work is done, which every agent and application comes to depend on
  powers:
  - switching_costs
  builds_on:
  - pos:vc_deployment_services
  - pos:vc_agent_infra
  rent:
    rent_kind: switching_cost
    appropriability: weak
    complementary_assets: specialised
    asset_owner: innovator
    durability: medium
  rent_reason: Everything a firm builds comes to read the record, which is costly to replace; but the record is the customer's own and kept as files it can move, so leaving the seller is easier than leaving the record
  falsifier: The labs and clouds ship a model of the firm as a built-in feature that buyers accept, or customers move the record to another seller at little cost
  prerequisites: 'A customer with data it may not move and questions it cannot answer today, and engineers who can work inside its systems'
  acquirers: 'The firms that sell data warehouses and business software, and the consultancies and labs moving into deployment'
  next_action: 'Take one hard reporting question in one regulated firm, answer it where the data sits, and keep what was learned as the first pages of the record'

