- id: energy_aware_compute
  name: Moving computing to where power is available
  published: true
  primary: compute_utilization_and_control
  adjacent:
  - power_and_sites
  - compute_providers
  - inference_optimization
  customer: Data-centre operators, utilities and large compute buyers
  bottleneck: A site already wired to the grid is scarcer than the building or the money
  wedge: Shift flexible workloads to hours and places where power is spare, and sell that flexibility to the grid
  unit_sold: A share of the power saved or the capacity freed
  why_not_bundled: It needs both the grid's and the operator's data, which neither side holds alone
  durable_asset: Agreements with utilities that let a site connect sooner
  powers:
  - cornered_resource
  builds_on:
  - pos:vc_dc_power
  rent:
    rent_kind: scarcity
    appropriability: weak
    complementary_assets: specialised
    asset_owner: incumbents
    durability: medium
  rent_reason: The scarcity is real while grid hookups lag; the rent goes to whoever holds the grid position
  falsifier: Interconnection queues shorten sharply
  prerequisites: 'Workloads that can wait or move, and a utility or grid operator that will pay for flexibility or connect a flexible site sooner'
  acquirers: 'Data-centre operators, the newer compute clouds and utilities. Chip and cloud firms have been buying software that gets more from the same hardware (AMD bought Brium, and Crusoe bought Atero), though neither deal was for moving work to follow power'
  next_action: 'Run one site''s flexible workloads against its grid''s spare hours and agree with the utility what the freed capacity is worth'
