  - inference_supply
  - evals_and_assurance
  customer: Firms that want frontier quality without depending on a closed lab
  bottleneck: Open weights are free but turning them into a reliable product takes scarce skill
  wedge: Tune an open model for one industry's hardest tasks and prove it on that industry's tests
  unit_sold: A tuned model per industry, with upkeep
  why_not_bundled: Closed labs gain nothing from making open models better
  durable_asset: The skill of tuning a model without breaking what it already knew
