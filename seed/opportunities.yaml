  - outcome_verification
  customer: Small and mid-sized firms that want the work done, not another tool
  bottleneck: Buyers want one accountable party when consequential work goes wrong
  wedge: One narrow service in one licensed trade, priced per outcome
  unit_sold: A completed job
  why_not_bundled: A lab would have to hold the licence and carry the liability
  durable_asset: The customer relationship and the licence to do the work, which software firms cannot buy
  powers:
  - cornered_resource
  builds_on:
  - pos:vc_vertical_ai
  - pos:vc_ai_rollups
  rent:
    rent_kind: regulatory
