made_by:
  model: claude-opus-5-5
  date: '2026-10-11'
  method: Research runs of one model read each vendor's own public pages (job listings, research posts, product pages and
    terms) and noted what each page shows the vendor being asked for or paid to do. A further run grouped the notes into signals
    and wrote each headline. Nothing was read from social media.
  reviewed_by: separate reviewing runs of the same model checked every pairing of a vendor with a signal against that vendor's
    own note, withdrew the pairings no note supported and reworded headlines that claimed more than the notes show; no person
    reviewed each one
disclosure: This section was drafted by Claude, a model made by Anthropic. Anthropic buys from, sells to or competes with
  companies named here, so read what it says about them with that in mind.
