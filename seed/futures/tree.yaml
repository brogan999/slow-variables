      - {decade: 2050s, name: Moving asteroids and sealed ships, built: idea, after: [energy-2040s]}
      - {decade: 2060s, name: Spinning habitats, built: idea}
      - {decade: 2070s, name: Cities in orbit, built: idea, after: [robotics_automation-2050s]}
      - {decade: 2080s, name: A lift to orbit, built: idea, after: [materials_manufacturing-2060s]}
