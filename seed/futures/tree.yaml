      - {decade: 2040s, name: Fusion power, built: lab, after: [computing_ai-2030s]}
      - {decade: 2060s, name: Batteries that hold a vast store, built: idea}
      - {decade: 2070s, name: Reactors that fit in a pocket, built: idea}
      - {decade: 2100-or-later, name: Collectors around a star, built: idea, after: [space-2070s]}
  - id: space
