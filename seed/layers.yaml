# Capture lens: the stack, top-down. Seven layers (v2 Appendix D); bucket→layer is many-to-many via crosswalk.yaml.
layers:
  - {id: compute_physical, name: Compute & physical, order: 1, description: "The chip makers, the big cloud companies and the newer rented-computing firms, data centres and the power they draw, memory and networking.", dependency_tier: 1}
  - {id: model, name: Model, order: 2, description: "The labs that build AI models: the leaders such as OpenAI and Anthropic, newer labs founded since 2023, and labs that publish their models openly, many of them Chinese.", dependency_tier: 2}
  - {id: training_input, name: Training input, order: 3, description: "What models are trained and tested on: work by paid human experts, practice tasks for training by trial and error, generated data, licensed content, and tests.", dependency_tier: 2}
  - {id: serving_orchestration, name: Serving & orchestration, order: 4, description: "The businesses that run models for others, route requests between them, and supply the plumbing for AI agents.", dependency_tier: 3}
  - {id: deployment_application, name: Deployment & application, order: 5, description: "The products people use: coding assistants, apps built for one industry, consumer apps, and firms that buy up service businesses to run them with AI.", dependency_tier: 4}
  - {id: adopters, name: Adopters, order: 6, description: "The companies and people using the products. Tracked through its readings; no company list.", dependency_tier: 5}
  - {id: labour_consumers, name: Labour & consumers, order: 7, description: "Workers and consumers: wages, jobs, and the value users get without paying for it. Tracked through its readings; no company list.", dependency_tier: 5}
