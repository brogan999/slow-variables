# Who owns what (/firm, docs/argument/firm.md). The page's claims, facts and sources are outlook records
# (seed/outlook.yaml), tested nightly by the outlook's own code. This file only seats positions under the essay's
# folios (by each folio's anchor word), holds the rent-or-own table, and names the claims on which the essay says the
# forecasts board's leans disagree with it. Text types no digit.

folios:
  boundary: [boundary_holds, firms_dissolve]
  leak: [context_costly, simple_first]
  liability: [liability_owns, liability_contracted, liable_wrappers]
  edge: [centralises, barbell, local_knowledge, edge]
  rent: [rent_by_default, own_your_intelligence]
  residue: [checking_order]
  shape: [junior_first, pyramid_bottom_up, middle_thins, accountable_top, no_one_inside]
  limit: [conglomerate_returns]
  record: [up_the_stack]

# The essay's last folio says the board leans against these claims. `check` fails if a lean here is re-made the other
# way, so the sentence is rewritten with it.
leans_against: [through_incumbents, conglomerate_premium]

# The plate in the folio on renting. A judgement: this site's reading of the writers that folio cites, with no test of
# its own. Rows are [what is scarce, an example, rent or own, who wins].
regimes:
  title: When to rent intelligence, and when to own it
  note: This site's reading of the writers cited on this page. It is a judgement, and no row has a test of its own; the last row rests on no source and is the weakest.
  columns: ["What is scarce in the firm's work", An example, Rent or own, Who wins]
  rows:
    - ["Nothing the firm alone can see, and a cheap check exists", "Answering routine customer queries; keeping the books", "Rent by the token, from more than one seller", "The firm's customers, once rivals rent the same; and whoever pools many firms' results"]
    - ["A signal only this firm senses", "A fleet of driverless cars; a ring that reads its wearer's body (both among Soren Larson's examples)", "Own the sensors and the model trained on what they read", "The owner-operator, for as long as the signal stays its own"]
    - ["Time or power at the point of work", "A vehicle at speed; a camera running on a battery", "Own small models and run them on the spot", "Whoever owns the device or the site"]
    - ["The right to sign, and the loss when the work is wrong", "An audit opinion; a prescription; an insurance policy", "Rent the model, own the licensed operation", "The licensed firm, and whoever insures it"]
    - ["Secrecy, where being seen is the loss", "A trading strategy; a product not yet announced", "Keep the model inside, on machines the firm controls", "The firm, and sellers of private installations"]
    - ["The frontier itself", "Training the most capable model", "Own", "The labs, for as long as their lead lasts"]
    - ["Use so heavy and steady that paying by the token costs more than running machines", "A service that calls a model at every step for every user", "Run an open model on owned or leased chips", "The firm, and the owners of chips and power"]

# The plate in the folio on the firm's shape: the shapes writers have argued for. Each row names its sources, which the
# page prints by number. A row is someone else's hypothesis in this site's words, not a reading.
shapes:
  title: Shapes the firm might take, and who argues each
  note: Each row is its authors' hypothesis in this site's words. None is tested here, and several come from people who sell AI or advise on it; the sources say who.
  rows:
    - shape: A pyramid emptied from the bottom
      who: Luke Drago and Rudolf Laine; Dario Amodei warns of its first step
      goes_first: Entry-level hiring, then junior roles
      stays: The executives longest; at a few firms nobody
      would_show: Young workers' hiring falling in the jobs most exposed to AI while managers' numbers hold
      sources: [drago_laine_pyramid, amodei_adolescence, canaries]
    - shape: A flatter firm, with the middle taken out
      who: Jack Dorsey and Roelof Botha argue it; Michael Ewens and Xavier Giroud measure flatter firms and do not say which layer goes
      goes_first: Managers whose work is passing information along
      stays: People who do the work, and people answerable for a result
      would_show: Fewer layers at firms that adopt AI than at similar firms that do not
      sources: [dorsey_botha, ewens_giroud]
    - shape: A pyramid that stops training
      who: Luis Garicano
      goes_first: The routine work by which juniors paid for their training
      stays: Seniors, each overseeing more; later, too few of them
      would_show: Firms hiring fewer trainees and paying more for experienced staff
      sources: [garicano_becker]
    - shape: More managers, not fewer
      who: Luis Garicano; Julia Shin and Sandra Sucher report the middle loaded with checking, not enlarged
      goes_first: Jobs made of a single task
      stays: Whoever holds the right to decide, and whoever checks the machine's work
      would_show: The share of managers and reviewers rising at firms that adopt AI
      sources: [garicano_task, shin_sucher_middle]
    - shape: A very small firm directing many agents
      who: Sam Altman, in a remark Fortune reported; Ethan Mollick reports agents organising themselves and says it could mean more work for people
      goes_first: On Altman's remark, most hired staff
      stays: A founder or a few people who set the task and judge the result
      would_show: Large companies with a handful of employees becoming common
      sources: [altman_one_person, mollick_swarm]
    - shape: A firm of copies of its best worker
      who: Dwarkesh Patel and his co-authors, who put their own confidence low
      goes_first: By assumption every human worker; what they add is that copies need no hand-offs
      stays: Many copies of a few models, and the market as the test of their work
      would_show: Firms growing very large without adding layers
      sources: [patel]
    - shape: A firm that no person owns or controls
      who: Shawn Bayern; Lynn LoPucki, who accepts it can be done and warns against it
      goes_first: The human owners and whoever controlled the firm; it may still hire people
      stays: A legal entity that follows a program
      would_show: Such entities trading lawfully at scale
      sources: [bayern_entities, lopucki_entities]

# What novelists pictured, below the plate. Fiction is listed, never cited: no claim, position or test rests on it.
# Each picture is this site's own words, and only works checked against a text are listed.
fiction:
  label: "What fiction pictured: imagined, not evidence"
  note: A few of the pictures fiction has drawn. The list is not a survey.
  works:
    - {author: Karel Čapek, title: R.U.R., year: 1920, shape: a few people over a made workforce, picture: "A general manager and a few department heads run an island factory that manufactures the workers it sells."}
    - {author: Marshall Brain, title: Manna, year: 2003, shape: the machine as middle manager, picture: "Software gives each worker instructions through a headset, and the layer of human managers above them goes."}
    - {author: Charles Stross, title: Accelerando, year: 2005, shape: a firm that owns itself, picture: "Companies run by programs sit on one another's boards, and in time own themselves."}
    - {author: Daniel Suarez, title: Daemon, year: 2006, shape: a firm run by a program, picture: "A dead founder's software recruits people and takes control of companies."}
    - {author: Ted Chiang, title: The Lifecycle of Software Objects, year: 2010, shape: a firm that owns itself, picture: "A digital being is made a company so that it can own property and sign contracts."}
    - {author: qntm, title: Lena, year: 2021, shape: copies of one mind, picture: "A single scanned mind is run as a great many copies, each put to work."}
