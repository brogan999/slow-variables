# The Singularity Atlas (plan Part 18): what named writers expect to change in each part of life as AI becomes
# transformative, by era and by which of the site's four worlds (seed/singularity.yaml `worlds`) they assume.
# Every expectation is a writer's view in the site's words, credited to a source the site has fetched (in this file,
# seed/singularity.yaml or seed/outlook.yaml); none is quoted, none is scored, and none sits on the predictions
# board. The map counts sourced works per domain and era: a count of who wrote about it, not a probability.
# The site's own sentences type no number; a writer's line may state that writer's figure in words.
intro: >-
  Most forecasts about AI ask when. This atlas asks what changes: in money, work, meaning, power, war, science,
  health and an ordinary day. For each part of life it gathers what named writers expect, from the first essays on
  thinking machines to this year's scenarios, sorted by era and by which of the site's worlds each assumes.
  The map counts works, not odds: a darker cell means more writers expect change there, not that change is more
  likely. Beside each part of life sit the public series this site reads for it.
provenance: >-
  The plates are illustrations in the manner of old master paintings, made with an image model for the site's
  owner in September of 2026. They illustrate the domains; they are not evidence of anything.
eras:
  - id: now
    label: Now and on the way
    definition: The years we are living through, before machines can do most of what people do.
  - id: first_decade
    label: The first decade after
    definition: The years just after AI can do most of what people do, when most writers expect the largest shocks.
  - id: long_run
    label: The long run
    definition: Decades to centuries on, once whatever happens has settled into a new normal.
facts:  # readings that are not already outlook facts or published indicators
  labour_share_world: {series: owid_context.world.labour_share_of_gdp.a}
  democracy_world: {series: owid_context.world.liberal_democracy_index.a}
  life_exp_65: {series: owid_context.world.life_expectancy_at_65.a}
  ai_incidents: {series: ai_index.world.ai_incidents_reported.a}
