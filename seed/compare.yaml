# /compare: the same evidence read against both worldviews. `leans` is never written here; export derives it from the
# indicator's current status (faster_than_normal -> AI 2027, consistent/slower -> Normal Technology, else open).
# Expectation text paraphrases sourced claims in seed/predictions.yaml (ids listed) or the briefs' band rationale.
rows:
  - indicator: metr_horizon_50
    nk: "Capability can move fast; the paper's speed limits sit downstream of methods. A short doubling time does not contradict Normal Technology on its own."
    ai2027: "Doubling every four months or faster from 2024, continuing to shorten, is the premise of the superhuman-coder timeline."
    nk_predictions: [nk_benchmarks_false_summits]
    ai2027_predictions: [ai2027_horizon_doubling_4mo]
  - indicator: metr_horizon_80
    nk: "The 80% horizon is the number that matters for products; it should lag the 50% horizon by years because reliability fixes are application-specific."
    ai2027: "80% reliability on tasks taking humans years by March 2027 if the trend keeps accelerating."
    nk_predictions: [nk_benchmarks_false_summits]
    ai2027_predictions: [ai2027_80pct_years_by_mar_2027]
  - indicator: horizon_ratio_80_50
    nk: "The capability-reliability gap stays wide (ratio of five or more); benchmarks are false summits."
    ai2027: "The gap collapses toward two as agents become reliable enough to run unattended."
    nk_predictions: [nk_benchmarks_false_summits]
    ai2027_predictions: [ai2027_superhuman_coder_2027]
  - indicator: dev_rct_uplift
    nk: "Modest, setting-dependent developer uplift; AI has not replaced software engineers and will not."
    ai2027: "Broad, large uplift as coding agents take over the work."
    nk_predictions: [nk_benchmarks_false_summits]
    ai2027_predictions: [amodei_swe_end_to_end_6_12mo]
    lab: "Most of what software engineers do, end to end, within six to twelve months of January 2026 (Amodei)."
  - indicator: enterprise_pilot_to_production
    nk: "The proof-of-concept-to-product gap keeps most pilots from measurable P&L impact for years."
    ai2027: "Agents that work reset the pilot economics; production share rises quickly."
    nk_predictions: [nk_adoption_decades]
    ai2027_predictions: [ai2027_superhuman_coder_2027]
  - indicator: bbd_work_hours_assisted
    nk: "Single-digit share of work hours in year three, like PCs and the web at the same age."
    ai2027: "A fifth or more of work hours assisted as agents diffuse through white-collar work."
    nk_predictions: [nk_adoption_decades]
    ai2027_predictions: [ai2027_superhuman_coder_2027]
  - indicator: btos_firm_use
    nk: "Under a third of firms in year three; organisational speed, not capability speed."
    ai2027: "More than half of firms as agents remove the integration cost."
    nk_predictions: [nk_adoption_decades]
    ai2027_predictions: [ai2027_superhuman_coder_2027]
  - indicator: ramp_paid_ai_adoption
    nk: "Paid adoption saturates early among tech-forward firms and flattens as the hard integration work begins."
    ai2027: "Paid adoption keeps rising toward universality as agents pay for themselves."
    nk_predictions: [nk_adoption_decades]
    ai2027_predictions: [amodei_trillions_before_2030]
    capture: "Trillions of dollars of AI revenue before 2030 (Amodei) would need paid adoption close to universal."
  - indicator: bls_labor_productivity_yoy
    nk: "Productivity at trend for years; the Solow paradox repeats (paper's entries 28, 29, 61)."
    nk_predictions: [nk_adoption_decades]
    ai2027_predictions: [korinek_extreme_scenario]
    capture: "Productivity growth well above trend by 2030 on the extreme path; under half a point of GDP growth on the modest one (Korinek et al.)."
  - indicator: bls_tfp_private_nonfarm
    nk: "TFP invisible at annual resolution; Acemoglu's 0.66% over a decade is the normal reading."
    nk_predictions: [nk_adoption_decades]
    ai2027_predictions: [korinek_extreme_scenario]
    capture: "TFP separates from trend only after 2027, and only on the substantial and extreme paths (Korinek et al.)."
  - indicator: labor_share_nonfarm
    nk: "Labour share moves within its cyclical range; no AI-attributable break before 2028."
    nk_predictions: [nk_adoption_decades]
    ai2027_predictions: [korinek_extreme_scenario]
    capture: "Labour share falls from about 60% toward 45% by 2030 on the extreme path (Korinek et al.)."
  - indicator: canaries_entry_level_gap
    nk: "No broad AI-attributable employment decline for years; canaries stay within youth-employment swings."
    nk_predictions: [nk_adoption_decades]
    ai2027_predictions: [korinek_substantial_scenario]
    capture: "Cognitive employment down about 4% by 2030 on the substantial path; entry-level exposed work breaks first (Korinek et al.)."
  - indicator: cross_tracker_concordance
    nk: "The four monthly labour trackers agree on a null."
    nk_predictions: [nk_agi_not_milestone]
    ai2027_predictions: [korinek_substantial_scenario]
    capture: "On the substantial path the trackers converge on a decline in exposed occupations by 2030 (Korinek et al.)."
  - indicator: rsi_agent_workdays_per_human
    nk: "Agent effort inside labs can rise without escaping external bottlenecks; self-reports do not resolve the question."
    ai2027: "Agent effort passes human effort inside labs by 2026 and the R&D multiplier compounds from there."
    nk_predictions: [nk_rsi_external_limits]
    ai2027_predictions: [openai_research_intern_sep_2026, openai_automated_researcher_mar_2028]
    lab: "An automated research intern by September 2026 and an automated AI researcher by March 2028 (OpenAI)."
  - indicator: rsi_intervention_rate_4_8h
    nk: "Humans keep steering most long agent runs; unreliability compounds over steps (entry 4)."
    ai2027: "Long runs go unattended as reliability catches up; intervention rates fall below a quarter."
    nk_predictions: [nk_rsi_external_limits, nk_benchmarks_false_summits]
    ai2027_predictions: [openai_automated_researcher_mar_2028]
    lab: "An automated AI researcher by March 2028 implies long runs without intervention (OpenAI)."
  - indicator: margin_stack_semis_share
    nk: "Rents at a chokepoint erode as users capture most of the surplus, the usual course for a general-purpose technology."
    ai2027: "Whoever controls the frontier labs and their compute captures a rising share as capability compounds."
    capture: "The chip layer's share of stack profit is the question the gap analyses turn on: spend far ahead of revenue (Cahn, Covello)."
    predictions: [cahn_600b_question, covello_too_much_spend]
  - indicator: capex_to_revenue_stack
    nk: "Capex runs ahead of revenue for years, as in earlier infrastructure build-outs."
    ai2027: "Capex is repaid quickly because capability growth turns into revenue fast."
    capture: "Infrastructure spend many times AI revenue, needing revenue in the trillions to justify it (Cahn, Bain, Tunguz)."
    predictions: [cahn_1_5t_question, bain_2t_revenue_2030, tunguz_12x_infra_per_revenue]
  - indicator: lab_recoupment_ratio
    ai2027: "Lab revenue compounds fast enough to fund the next training runs from operations."
    lab: "Revenue growing about tenfold a year (Amodei)."
    capture: "Trillions of dollars of revenue before 2030 (Amodei) against the capital already raised."
    predictions: [anthropic_10x_per_year, amodei_trillions_before_2030]
  - indicator: circular_financing_scale
    nk: "Vendor financing is a normal feature of a build-out and unwinds as end demand is proven."
    capture: "Circular deals inflate reported demand and widen the gap between spend and end revenue (Cahn)."
    predictions: [cahn_1_5t_question]
