# Saved analyses (v2 §6.1): named questions answered nightly from the semantic layer. `metric` (+ optional dims) is
# what /query renders; `shape` is what `check` enforces on the export.
analyses:
  - {id: horizon_fits, name: "METR horizon doubling times, both windows and both reliability levels", question: "How fast is the time horizon doubling, and does the answer depend on the window?", metric: horizon_doubling_days_50_since_2024, related: [horizon_doubling_days_80_since_2024, horizon_doubling_days_50_since_2023, horizon_doubling_days_80_since_2023, horizon_blowup_year_50_since_2024], shape: {unit: days}}
  - {id: ord_misfit, name: "Constant-hazard misfit", question: "Do the 50% and 80% horizons sit where a constant task-length hazard predicts?", metric: ord_half_life_misfit, shape: {unit: ratio}}
  - {id: gross_profit_stack, name: "Gross profit by layer", question: "What share of the stack's gross profit do the labs take, counting them as an estimate?", metric: gross_profit_share_by_layer, dims: {layer_id: model}, related: [lab_gross_margin_estimate, gross_margin_fy], shape: {unit: share}}
  - {id: margin_stack, name: "Filed operating income, five segments", question: "Where in the stack does filed operating income bulge?", metric: margin_stack_share_by_layer, dims: {layer_id: compute_semis}, shape: {unit: share}}
  - {id: hhi_layers, name: "Concentration by layer", question: "Is any layer fragmenting while its neighbours stay concentrated?", metric: hhi_by_layer, dims: {layer_id: compute_cloud}, related: [], shape: {unit: index}}
  - {id: recoupment, name: "Lab recoupment ratios", question: "How much run-rate has each lab earned per dollar of capital raised?", metric: lab_recoupment_ratio, shape: {unit: ratio}}
  - {id: concordance, name: "Labour-tracker concordance", question: "Do the four monthly labour trackers agree?", metric: cross_tracker_concordance, shape: {unit: count}}
  - {id: capex_ratio, name: "Capex to AI revenue", question: "How far ahead of AI revenue is hyperscaler capex running?", metric: capex_to_revenue_stack, shape: {unit: ratio}}
  - {id: circular, name: "Circular financing total", question: "How much circular financing has been signed?", metric: circular_commitments_total, shape: {unit: USD}}
  - {id: price_capability, name: "Price per capability", question: "What does a METR-hour of capability cost on OpenRouter?", metric: frontier_price_per_horizon_hour, shape: {unit: USD}}
  - {id: customer_concentration, name: "Top direct customer's share of NVIDIA revenue", question: "How dependent is the chip layer's rent on a handful of buyers?", metric: customer_concentration, dims: {entity: nvda}, shape: {unit: share}}
  - {id: incremental_capex, name: "Incremental capex to incremental revenue", question: "How many new dollars of capex does each new dollar of cloud revenue cost?", metric: incremental_capex_to_revenue, dims: {entity: msft}, related: [capex_to_revenue_stack], shape: {unit: ratio}}
  - {id: surprise, name: "Surprise index", question: "Is AI 2027 running ahead of or behind its own quantitative predictions, by its graders' reckoning?", metric: surprise_index, shape: {unit: share}}
  - {id: venture_4q, name: "Venture dollars, trailing four quarters", question: "How much equity has each layer raised over the past year?", metric: venture_dollars_4q, dims: {layer_id: model, sublayer_id: all}, shape: {unit: USD}}
  - {id: venture_intensity, name: "Venture capital intensity, frontier labs", question: "How many dollars of new capital do the frontier labs raise per dollar of run-rate?", metric: venture_capital_intensity, shape: {unit: ratio}}
  - {id: venture_frontier, name: "Frontier share of venture dollars", question: "What share of tracked venture dollars goes to the frontier labs?", metric: frontier_share_of_venture_dollars, shape: {unit: share}}
  - {id: aa_frontier, name: "Frontier Intelligence Index", question: "What is the best Artificial Analysis Intelligence Index, and when was each record set?", metric: aa_frontier_intelligence_index, shape: {unit: index}}
  - {id: price_capability_aa, name: "Price per capability, Artificial Analysis", question: "What does a METR-hour cost at Artificial Analysis blended prices, and what does a near-frontier index point cost?", metric: aa_price_per_horizon_hour, related: [aa_frontier_price_per_point], shape: {unit: USD}}
  - {id: venture_top3, name: "Top-three share of venture dollars", question: "What share of tracked venture dollars do the three largest raisers take?", metric: top3_concentration, shape: {unit: share}}
  - {id: routed_tokens, name: "Tokens routed through a public router", question: "How much AI work is actually being run, and how fast is that growing?", metric: routed_tokens_top_models, related: [routed_tokens_doubling_days], shape: {unit: tokens}}
  - {id: rli_frontier, name: "Best score on real freelance projects", question: "What share of real paid freelance projects can the best model complete end to end, and when was that record set?", metric: benchmark_frontier, dims: {test: epoch_bench.rli}, shape: {unit: share}}
  - {id: open_share, name: "Open models' share of routed tokens", question: "Of the tokens routed through OpenRouter's most used models, what share goes to models whose weights are published?", metric: open_share_of_routed_tokens, shape: {unit: share}}
  - {id: open_premium, name: "What closed capability costs over open", question: "At the same capability, how does the cheapest closed model's price compare with an open model's, typically?", metric: closed_over_open_price_premium, shape: {unit: ratio}}
  - {id: oracle_backlog, name: "Oracle's contracted backlog", question: "How many years of its current revenue has Oracle already contracted but not yet delivered?", metric: rpo_to_trailing_revenue, dims: {entity: orcl}, shape: {unit: ratio}}
  - {id: chatgpt_paid, name: "Paying subscribers against weekly users of ChatGPT", question: "What are ChatGPT's paying consumer subscribers as a share of its weekly users?", metric: chatgpt_paid_share, shape: {unit: share}}
  - {id: agent_fences, name: "Platforms fencing out outside agents", question: "In the year to the date shown, how many times did a large platform move to keep outside AI agents off it?", metric: ledger_events_12m, dims: {target: agent_access_fences, stance: for}, shape: {unit: count}}
  - {id: canaries_spread, name: "Young against old workers in the most exposed jobs", question: "In the jobs most exposed to AI, how far has employment of workers aged 22 to 25 fallen behind that of workers aged 50 and over since November 2022?", metric: canaries_junior_senior_gap, dims: {quintile: most_exposed}, shape: {unit: index_points}}
  - {id: hal_trend, name: "How fast agents are getting more accurate", question: "Across the agents HAL evaluates, how many points a year has accuracy risen across model releases?", metric: hal_trend_per_year, dims: {measure: accuracy}, shape: {unit: pts_a_year}}
  - {id: gdp_pc_over_peak, name: "Output per person over its previous peak", question: "How far does American real output per person stand above the highest level it reached a year or more before, the reading the growth bet settles on?", metric: real_gdp_per_capita_over_peak, shape: {unit: share}}
  - {id: gdp_pc_yoy, name: "Output per person, year on year", question: "How fast is American real output per person growing on a year before?", metric: real_gdp_per_capita_yoy, shape: {unit: share}}
  # The migrating bottleneck (/argument/migration): every figure in that essay and every gauge on its scorecard lands here
  - {id: dc_gap, name: "Planned against built data-centre power", question: "How far does the power Epoch expects at the sites it tracks run ahead of what is built there?", metric: dc_projected_to_observed_power, dims: {sites: all}, related: [dc_sites_compared], shape: {unit: ratio}}
  - {id: dc_sites, name: "Sites behind the data-centre gap", question: "How many sites carry both a built and a planned figure, and how many of them are still bare?", metric: dc_sites_compared, dims: {sites: all}, shape: {unit: count}}
  - {id: chip_input_supply, name: "Supply of what AI chips consume", question: "How fast is the supply of packaging, leading-edge logic and high-bandwidth memory growing?", metric: chip_input_supply_yoy, dims: {input: cowos_supply_wafers}, shape: {unit: share}}
  - {id: cowos_buyers, name: "Who buys advanced packaging", question: "How concentrated are the buyers of advanced chip packaging?", metric: cowos_buyer_hhi, shape: {unit: index}}
  - {id: chip_designers, name: "Concentration of AI chip supply", question: "How concentrated is the supply of AI chips by designer?", metric: chip_designer_hhi, shape: {unit: index}}
  - {id: chip_fleet_power, name: "Power drawn by the chip fleet", question: "How fast is the electricity the installed AI chips would draw growing?", metric: chip_fleet_power_yoy, shape: {unit: share}}
  - {id: accelerator_cost, name: "Cost of a unit of accelerator compute", question: "Is the price of compute still falling at its usual pace?", metric: accelerator_cost_per_flop_annual_change, shape: {unit: share}}
  - {id: basket_price, name: "Cheapest model in the flagship basket", question: "What does the cheapest capable model cost to run?", metric: basket_min_output_price_per_mtok, shape: {unit: USD}}
  - {id: capex_growth, name: "Growth in hyperscaler capital spending", question: "Are the five largest builders still raising their spending?", metric: hyperscaler_capex_ttm_yoy, shape: {unit: share}}
