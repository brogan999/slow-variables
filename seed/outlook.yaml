  capex_to_revenue: {metric: capex_to_revenue_stack, max_age_days: 200, expect: {gt: 1}}

  lab_deals_now: {metric: lab_vertical_integration_events_4q, max_age_days: 200}
  lab_deals_year_ago: {metric: lab_vertical_integration_events_4q, pick: year_ago}
  msft_backlog: {metric: rpo_to_trailing_revenue, dims: {entity: msft}, max_age_days: 200}
  msft_backlog_year_ago: {metric: rpo_to_trailing_revenue, dims: {entity: msft}, pick: year_ago}
  ai_app_margin: {series: iconiq.ai_products.gross_margin.fy, max_age_days: 500}
  # Part 16: readings for the claims taken from Sean Cai and The Diff
  startup_app_share: {series: menlo.us_enterprise.startup_app_revenue_share.fy, max_age_days: 500}
  ramp_spend: {series: ramp.us_businesses.ai_spend_per_employee_median_usd.m, max_age_days: 90}
