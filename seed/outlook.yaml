    field: the writer of The Diff, a newsletter on finance and technology, after work in digital advertising and investment research; he discloses that he holds shares in Alphabet
    finding: Models have more pricing power where they are the best tool for a particular job; labs that agree to slow their best releases are also agreeing not to widen their lead over open models.
