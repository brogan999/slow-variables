  - id: thompson
    who: "Ben Thompson"
    field: "a writer on technology strategy at Stratechery"
    finding: "A firm that owns the relationship with users at scale makes its suppliers interchangeable: they join on its terms. Such a firm serves each new user at no extra cost and does not operate the supply it gathers."
