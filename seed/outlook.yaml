  - id: arrow
    who: "Kenneth Arrow"
    field: "an economist who studied how markets handle knowledge and risk"
    finding: "Information is a good that markets handle badly: a buyer cannot tell what it is worth until he has it, and once he has it he need not pay; and using it tends to reveal it. One private remedy is a large company that runs many projects and insures itself."
    work: "Economic Welfare and the Allocation of Resources for Invention"
    venue: "The Rate and Direction of Inventive Activity (National Bureau of Economic Research and Princeton University Press), 1962. The link opens the chapter's record; it was read in the Bureau's own copy"
