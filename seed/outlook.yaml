    short: "Garicano and Saa-Requejo"
    field: "Garicano is an economist who studies how firms organise what they know; Saa-Requejo is his co-author at the Silicon Continent newsletter"
    finding: "The sellers of models are squeezed between customers who can switch with a change of setting and suppliers above them who cannot be replaced. The surplus goes to hardware and to whoever does the work of fitting AI into an organisation, where the limits are workflow, authority and data."
