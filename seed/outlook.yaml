positions:
  # I · capability
  - id: compounding
    folio: capability
    title: AI speeds up its own research, and the gains compound
    holders: [ai_2027]
    attribution: author
    mechanism: Each model helps write the code and run the experiments that build the next one, so progress feeds on itself.
    case: AI coding agents improved faster in late 2025 and early 2026 than even these forecasters expected, and they brought their dates forward again [cite:ai_futures_update], though their own check finds events running a little slower than the story [cite:ai_futures_q25].
    kill_shot: Whole jobs staying far out of reach while single skills race ahead, which is the pattern a pace set by the slowest step predicts.
    rival: slowest_task
    visible: true
  - id: slowest_task
    folio: capability
    title: Research moves at the pace of its slowest step
    holders: [jones_b]
    attribution: author
    mechanism: Superhuman speed on some steps leaves the others, still slow, setting the pace of the whole.
    case: The best models finish ever longer software tasks, yet only a small part of the whole paid projects they are set.
    kill_shot: A huge speed-up on a single step making overall progress explode, the test Jones himself proposes, since that would show the bottlenecks to be weak.
    rival: compounding
    visible: true
  - id: not_reliability
    folio: capability
    title: Getting a task right is not getting it right every time
    holders: [agent_reliability]
    attribution: author
    mechanism: Agents must be dependable, not just accurate, before they are given work that matters, and dependability has improved far more slowly than accuracy.
    case: The same agents that solve more tasks each year still give different answers when the same task is run again.
    kill_shot: Reliability rising as fast as accuracy.
    rival: compounding
    visible: true
  - id: coverage_bought
    folio: capability
    title: The missing steps can be bought
    holders: [jones_b]
    attribution: extension
    mechanism: If progress moves at the pace of the steps AI cannot take [cite:jones_b], the scarce thing is the next step a model can be taught, and that can be paid for, with practice tasks (exercises a model is scored on while it trains) and graders (programs that do the scoring) sold to the labs, and with the work of fitting a model to the steps a firm's own jobs need.
    case: One firm that sells the labs expert-written practice work, Surge AI, was reported in 2025 to have passed [fact:surge_revenue] in yearly revenue.
    kill_shot: The next model taking the missing steps by itself, so that paying to teach them buys nothing a lab would not soon have anyway.
    rival: compounding
    visible: false
  - id: lossy
    folio: capability
    title: Self-improvement leaks
    holders: [lambert]
    attribution: author
    mechanism: The research AI can automate is narrow, and the judgement of a few top researchers, not more agents, still sets the pace.
    case: AI already helps build AI, yet Lambert sees no fast take-off coming and expects the trend, looked back on, to seem closer to a steady line.
    kill_shot: Each new model's gains on AI research arriving faster than the last's, with nothing lost along the way.
    rival: compounding
    visible: false
  - id: scaling_limits
    folio: capability
    title: Bigger models alone will not get there
    holders: [scaling_myths]
    attribution: author
    mechanism: Scaling laws promise better guessing of the next word, not any particular new ability, and good data is getting ever costlier.
    case: What scaling laws measure is how well a model guesses the next word, not whether it can do a job.
    kill_shot: Size alone producing abilities that no change in method explains.
    rival: compounding
    visible: false

  # II · products
  - id: assurance_layer
    folio: products
    title: Checking AI's work becomes a business of its own
    holders: [hadfield_koh]
    attribution: extension
    mechanism: Someone has to verify what an agent did and answer when it is wrong, and buyers will pay for that. Hadfield and Koh argue for the registration and the accountability; this site carries it to a market.
    case: Gartner, which advises companies on what to buy, has published a guide to the platforms that sell such checking, and since January 2026 insurers have been able to attach optional standard wording that excludes harm from generative AI.
    kill_shot: Checking staying a free feature of the labs' and cloud companies' own platforms.
    rival: bundled
    visible: true
  - id: bundled
    folio: products
    title: Checking stays a free feature of the big platforms
    holders: []
    attribution: site
    mechanism: The labs and cloud companies already test and watch their own models, and can give that away to keep their customers.
    case: A lab that wants firms to trust its agents has every reason to supply the checks itself.
    kill_shot: Independent checkers winning large contracts that the platforms' free tools could have filled.
    rival: assurance_layer
    visible: false
  - id: smart_squeeze
    folio: products
    title: Apps that resell the labs' models get squeezed
    holders: [larson_squeeze]
    attribution: author
    mechanism: An app cannot pay less than the lab charges for its model, nor charge much more than going to the lab directly would cost its customers.
    case: As far as Larson knows, labs sell to apps at the prices they list for everyone, so an app's margin is only what its own additions are worth.
    kill_shot: Labs selling to apps below their public prices.
    rival: apps_keep
    visible: true
  - id: apps_keep
    folio: products
    title: Apps keep their margin through what they build around the model
    holders: []
    attribution: site
    mechanism: Data, workflow and the customer relationship are hard to copy, even when the model underneath is not.
    case: Firms pay for tools that fit their work, not for raw access to a model.
    kill_shot: Apps' margins falling as their customers' use rises.
    rival: smart_squeeze
    visible: false
  - id: fences
    folio: products
    title: Big platforms fence out agents that are not their own
    holders: [hobart_inference, larson_coasean]
    attribution: author
    mechanism: A platform that owns the customer loses that tie if someone else's agent does the shopping, so it pays to keep outside agents out and run its own.
    case: Amazon went to court to keep an AI browser's shopping agent off its site, and later blocked Meta's shopping assistant.
    kill_shot: Platforms opening to outside agents through shared rules and protocols.
    rival: opens
    visible: true
  - id: opens
    folio: products
    title: Platforms let outside agents in, on terms they set
    holders: [shahidi_etal]
    attribution: author
    mechanism: Platforms will set rules for how outside agents may use them, much as websites tell search engines' crawlers what they may read.
    case: Etsy and Walmart have agreed to let shoppers buy through OpenAI's chatbot, Etsy on an open standard for agents to pay.
    kill_shot: Platforms blocking or suing outside agents more often than they sign them up.
    rival: fences
    visible: false
  - id: verified_data
    folio: products
    title: Checked practice work is the next shortage
    holders: [cai_data]
    attribution: author
    mechanism: Teaching models long work whose results are hard to check needs practice tasks and graders that people must build.
    case: Buyers pay for tasks a model can be trained to improve on, and those are scarce.
    kill_shot: Models learning such work from practice they set and grade themselves.
    rival: self_made
    visible: false
  - id: self_made
    folio: products
    title: Models make their own practice
    holders: []
    attribution: site
    mechanism: Where a computer can check the answer, as in mathematics and code, a model can practise without people writing the answers, and the checking can spread from there.
    case: A task whose answer a machine can check can be practised endlessly, at the cost of the computing alone.
    kill_shot: Progress stalling in work a machine cannot grade until people build the graders.
    rival: verified_data
    visible: false

  # III · adoption
  - id: frictions
    folio: adoption
    title: Adoption is slow because the frictions are real
    holders: [normal_tech]
    attribution: author
    mechanism: Firms have to rebuild processes, train people and learn where liability falls before a tool pays, and that takes decades, not years.
    case: The share of American firms using AI has risen at the pace of past technologies, not faster, and OpenAI's chief executive has said the whole industry was too ambitious about timelines [cite:altman_inertia].
    kill_shot: Measured adoption jumping to the pace this site calls fast.
    rival: invisible
    visible: true
  - id: invisible
    folio: adoption
    title: Adoption is not slow; it is hard to see
    holders: [coyle_poquiz]
    attribution: author
    mechanism: Most use of AI is free and its gains come as quality and saved time, which the official statistics do not price.
    case: The biggest AI assistant counts far more weekly users than paying subscribers, so most of its weekly users pay nothing.
    kill_shot: Official statistics capturing AI's gains in quality and saved time as use spreads.
    rival: frictions
    visible: true
  - id: junior_first
    folio: adoption
    title: Junior hiring shows it first
    holders: [canaries]
    attribution: author
    mechanism: A firm that can do a junior's work with AI hires fewer juniors before it lets anyone go.
    case: In the jobs most exposed to AI, young workers have fallen behind older ones; in the least exposed jobs they have not.
    kill_shot: Young workers falling behind in the least exposed jobs as well, which would point to a cause other than AI.
    rival: other_causes
    visible: true
  - id: other_causes
    folio: adoption
    title: Young workers' troubles have causes other than AI
    holders: []
    attribution: site
    mechanism: Interest rates, the hiring boom after the pandemic and its unwinding hit young workers first, whatever AI does.
    case: The study itself describes a pattern rather than proving its cause; the gap survives controls for occupations' exposure to interest-rate increases but narrows once workers' education is taken into account.
    kill_shot: The gap staying confined to the most exposed jobs as those other causes fade.
    rival: junior_first
    visible: false
  - id: simple_first
    folio: adoption
    title: Agents arrive first where wants are simple and agents already work
    holders: [shahidi_etal]
    attribution: author
    mechanism: Handing a task to an agent is easiest where people already hire agents and can say simply what they want.
    case: Selling a house is easier to delegate than buying one, and the first traction is in job search, property and matching.
    kill_shot: Agents spreading first in markets where people rarely hire human agents.
    rival: context_costly
    visible: false
  - id: context_costly
    folio: adoption
    title: Asking reveals what you want, so firms keep work inside
    holders: [larson_coasean]
    attribution: author
    mechanism: When everyone has the same models, what a firm knows about its own needs is its edge, and asking the market for help gives it away.
    case: Larson points to the largest retail platforms shutting out independent shopping agents in favour of their own.
    kill_shot: Independent agents dealing on firms' behalf at scale in open markets.
    rival: simple_first
    visible: false
  - id: checking_order
    folio: adoption
    title: What goes first is set by the cost of checking, not the cost of doing
    holders: [hadfield_koh]
    attribution: extension
    mechanism: A task is handed over when checking the result costs less than doing it. Hadfield and Koh argue about accountability; this site carries the argument to the order of adoption.
    case: Code that comes with tests is handed to AI before contracts that come with none.
    kill_shot: Work that is hard to check being handed over as fast as work that is easy to check.
    rival: frictions
    visible: false

  # IV · reorganisation
  - id: modest_growth
    folio: reorganisation
    title: Growth rises, but does not explode
    holders: [moll_imas, jones_tonetti]
    attribution: author
    mechanism: An explosion would need fast automation across the economy, spending that follows it, demand that absorbs the output, no cyberattacks by or with AI destroying value, and AI that automates research, all at once; and work is a chain of tasks that substitute poorly for one another, so AI that follows the pattern of past automation raises growth only slowly [cite:jones_tonetti].
    case: Moll and Imas expect AI's abilities to keep leaping and still think growth of four to five percent a year, which would itself be historic, is the more reasonable baseline [cite:moll_imas].
    kill_shot: A quarter before 2034 in which output per person clears the bet's line above the highest level it had reached a year or more before.
    rival: fast_growth
    visible: true
  - id: fast_growth
    folio: reorganisation
    title: AI compresses a century of progress into a decade
    holders: [macaskill_moorhouse]
    attribution: author
    mechanism: Once AI's thinking rivals the whole of humanity's, it keeps growing far faster than the number of people, research speeds up enormously and industry follows, so output can break away within a decade of AI matching human researchers.
    case: MacAskill and three others have bet, at odds of four to one against them, on growth exploding before 2034 [cite:bet_fast_side], and in Korinek and colleagues' model a fast path looks like the others until about 2027 [cite:korinek_etal], so slow readings now do not count against it.
    kill_shot: AI's research effort rivalling humanity's without technological progress speeding up.
    rival: modest_growth
    visible: true
  - id: intensity_first
    folio: reorganisation
    title: Work gets more intense before it frees time
    holders: [stevenson]
    attribution: author
    mechanism: A tool that makes work easier first raises what people are expected to produce, as washing machines raised the standard of a clean house.
    case: Appliances in the middle of the twentieth century raised standards of cleanliness long before they shortened the hours spent on housework.
    kill_shot: Paid hours in the most exposed work falling before output rises.
    rival: time_first
    visible: true
  - id: time_first
    folio: reorganisation
    title: Machines buy people time
    holders: [keynes]
    attribution: extension
    mechanism: As output per hour rises, people take part of the gain as leisure and share out the work that remains. Keynes argued it of machines in general in 1930; this site carries it to AI.
    case: If AI multiplies what an hour of work produces, the same needs can be met with fewer hours.
    kill_shot: Hours in the most exposed work rising as AI spreads.
    rival: intensity_first
    visible: false
  - id: relational
    folio: reorganisation
    title: Work built on people dealing with people gains
    holders: [imas_scarce]
    attribution: author
    mechanism: As machines make other things cheap, spending moves to work where the person is part of what is bought.
    case: Richer households spend much more on care, teaching and hospitality.
    kill_shot: That work's share of spending and jobs falling as AI spreads.
    rival: jagged_wages
    visible: false
  - id: jagged_wages
    folio: reorganisation
    title: Wages follow a jagged path, and the displaced can lose again
    holders: [restrepo, athey_scott_morton]
    attribution: extension
    mechanism: Where better algorithms set the pace, wages jump and fall as tasks are automated [cite:restrepo]; where AI is sold with market power, Athey and Scott Morton add, workers can pay again when its price rises [cite:athey_scott_morton].
    case: In Restrepo's model labour's share of income heads towards nothing once computing can do any work, even as total wages rise.
    kill_shot: Wages keeping pace with output as AI takes on more tasks.
    rival: relational
    visible: false
  - id: centralises
    folio: reorganisation
    title: Decisions move to the centre
    holders: [brynjolfsson_hitzig]
    attribution: author
    mechanism: AI captures the local knowledge that used to justify leaving decisions to people on the spot.
    case: Early evidence, by the authors' account, fits bigger firms and less local autonomy.
    kill_shot: Firms getting smaller and more decentralised as they adopt AI.
    rival: local_knowledge
    visible: false
  - id: local_knowledge
    folio: reorganisation
    title: Knowledge on the spot keeps decisions there
    holders: [hayek]
    attribution: extension
    mechanism: What matters for most decisions is knowledge of particular times and places, which changes constantly and by its nature cannot reach the centre as statistics. Hayek argued it about central planning; this site carries it to AI.
    case: The knowledge Hayek meant is local and fleeting and cannot be gathered into statistics; this site adds that a model trained on what is written may lack it.
    kill_shot: Firms that move decisions to the centre with AI outperforming those that leave them local.
    rival: centralises
    visible: false
  - id: referrals_fall
    folio: reorganisation
    title: Answers replace visits, and the web that trained AI loses its income
    holders: [stiglitz_ventura_bolet]
    attribution: author
    mechanism: Sites that produce information are paid by visits, and AI that answers directly sends fewer of them.
    case: Cloudflare counts AI companies' crawlers, the programs that read websites for them, taking far more pages than they send visitors back, on news sites as elsewhere [cite:cloudflare_crawl], though it warns the count may be overstated where an app does not say where its visitors came from [cite:cloudflare_ratio].
    kill_shot: Visits to publishers from search and AI answers rising.
    rival: paid_access
    visible: false
  - id: paid_access
    folio: reorganisation
    title: AI companies pay for what they read
    holders: []
    attribution: site
    mechanism: As answers replace visits, publishers charge the AI companies directly, by licence or by the page.
    case: Cloudflare, which stands between many websites and their visitors, bought an AI data marketplace to build a system in which AI developers pay for the content they train on [cite:cloudflare_human_native].
    kill_shot: Publishers' income falling even where they charge AI companies.
    rival: referrals_fall
    visible: false

  # V · value
  - id: commodity
    folio: value
    title: Tokens become a commodity where a model is not the best tool
    holders: [hobart_round_trip, hobart_pacing]
    attribution: author
    mechanism: Where some labs give their models away, the marginal cost of serving the cheapest models comes down to the chips and power that run them, and a lab has more pricing power where its model is the best tool for the job.
    case: Open models trail the best closed ones by [fact:open_lag], months rather than years.
    kill_shot: Labs keeping a premium on models that open ones already match.
    rival: price_holds
    visible: true
  - id: price_holds
    folio: value
    title: Labs charge for their lead and let buyers go
    holders: [larson_durability]
    attribution: author
    mechanism: Buyers who will not pay a lab's price leave for an open model rather than wait for a discount, so the lab is not bid down to cost; it charges what its lead over the open alternative is worth and serves fewer buyers, and as open models close the gap its price and its market both shrink. Simon Board and Marek Pycia proved the first step for a monopolist selling a durable good whose buyers all have another option [cite:board_pycia].
    case: Near-frontier open models sell for a small fraction of the best model's price without, as Larson reads it, forcing the best model's price down.
    kill_shot: Labs cutting the best model's price to keep its sales while open models still improve too slowly for buyers to wait for them.
    rival: commodity
    visible: true
  - id: up_the_stack
    folio: value
    title: Labs escape by moving up the stack, and lock their customers in
    holders: [nk_up_the_stack]
    attribution: author
    mechanism: Selling access to a model tends towards a commodity business, so labs move into products and into deployments built into their customers' work, where switching is costly.
    case: Cloud computing escaped the same trap by becoming software, and the leading chip foundry by being almost alone.
    kill_shot: The labs' revenue staying mostly in selling access to their models by the token.
    rival: commodity
    visible: true
  - id: distribution_wins
    folio: value
    title: The biggest platforms win with models that are good enough
    holders: [hobart_complements]
    attribution: author
    mechanism: A platform with the most users gains most by serving good-enough models to all of them and selling better ones on top, whoever built them.
    case: Hobart reads the reports that Meta may use other firms' models for some of its answers this way.
    kill_shot: The owners of the best models taking users from the biggest platforms.
    rival: up_the_stack
    visible: false
  - id: router_power
    folio: value
    title: Routers gain power
    holders: [larson_router]
    attribution: author
    mechanism: A neutral router that pools many firms' checked outcomes learns to solve their problems, new kinds above all, faster than any one firm alone, and pricing by outcome belongs with it.
    case: In Larson's own simulation, with the model held fixed, a harness trained on many firms' outcomes beat what each firm learned from its own, most of all on new kinds of problems.
    kill_shot: Firms learning as well from their own outcomes as a router does from everyone's.
    rival: router_fades
    visible: false
  - id: router_fades
    folio: value
    title: A router works itself out of a job
    holders: []
    attribution: site
    mechanism: The better a router works, the more easily buyers move to the cheapest model that is good enough, the harder sellers compete on price, and the less anyone needs a router.
    case: This is the line in this site's essay on the migrating bottleneck, and Larson's argument contradicts it.
    kill_shot: Routers' share of traffic and their margins rising as models converge.
    rival: router_power
    visible: false
  - id: scarce_input_collects
    folio: value
    title: Whoever holds the scarcest input collects
    holders: []
    attribution: site
    mechanism: When every input is needed at once, the one hardest to get sets the pace and its owner takes the profit, until the industry builds its way out.
    case: NVIDIA and AMD take [fact:chips_gp_share] of the gross profit they share with Microsoft's cloud arm and the estimates for OpenAI and Anthropic, the only cloud and lab figures this site can measure.
    kill_shot: The chip makers' share falling while chips stay scarce.
    rival: up_the_stack
    visible: false

  - id: money_runs_out
    folio: value
    title: The spending runs ahead of the revenue, and investors take the loss
    holders: [cahn_2024]
    attribution: author
    mechanism: The spending on data centres has to be paid back by revenue that has not arrived yet, and the chips it buys lose value fast, so if the revenue comes late the investors take the loss.
    case: The biggest cloud and platform companies spend [fact:capex_to_revenue] as much a year on buildings and equipment as AI earns in revenue.
    kill_shot: AI's revenue growing into the spending before the chips it bought are out of date.
    rival: durable_labs
    visible: false
  - id: build_runs_late
    folio: value
    title: The build-out runs late while use keeps rising
    holders: [cahn_2025]
    attribution: author
    mechanism: Demand for computing runs into a supply chain that has not grown as fast, from the few firms that make the most advanced chips and the machines that make them to generators, cooling and skilled builders, so data centres are finished late while use keeps rising.
    case: Cahn wrote in December 2025 that a few such delays had already been reported publicly.
    kill_shot: The new capacity coming online on schedule, with the price of computing falling as it arrives, the other outcome Cahn names.
    rival: money_runs_out
    visible: false
  - id: durable_labs
    folio: value
    title: The labs are durable businesses with high margins
    holders: [sundheim]
    attribution: author
    mechanism: Customers could switch between models as easily as between clouds but mostly do not, and staying at the frontier costs too much capital for more than a handful of labs.
    case: Sundheim, whose firm holds stakes in OpenAI and Anthropic, points to the labs' coding tools and the paid access to their models as businesses customers stick with.
    kill_shot: Customers switching between models freely on price, or more than a handful of labs staying at the frontier.
    rival: money_runs_out
    visible: false
  - id: consumers_keep
    folio: value
    title: Consumers keep most of the value
    holders: [nordhaus]
    attribution: extension
    mechanism: Competition and imitation pass most of an innovation's value to the people who use it, through lower prices; the innovators keep a sliver. Nordhaus measured it across American nonfarm business from 1948 to 2001; this site carries it to AI.
    case: Across American nonfarm business from 1948 to 2001, innovators kept, by his central estimate, about two cents of each dollar of value they created [cite:nordhaus].
    kill_shot: AI firms' profits growing as fast as the value their users get.
    rival: price_holds
    visible: false
  - id: edge
    folio: value
    title: AI's everyday work moves onto people's own devices
    holders: [paik_edge]
    attribution: author
    mechanism: Once a small model on a phone or laptop is good enough, running it there is cheaper and faster than paying a data centre for each request, and the meter stops.
    case: Open models a few steps behind the best keep getting better, and each release widens what a device can do on its own.
    kill_shot: Everyday use staying in cloud data centres even as capable open models shrink.
    rival: cloud_keeps
    visible: false
  - id: cloud_keeps
    folio: value
    title: The cloud keeps the thinking
    holders: []
    attribution: site
    mechanism: The best models stay too large for a device, and people want the best model for work that matters.
    case: Almost all paid use today runs through the labs' and clouds' own services.
    kill_shot: A large share of everyday requests answered on the device.
    rival: edge
    visible: false
  # Part 16: positions from Sean Cai's and The Diff's posts, paid ones included, in fresh wording and never quoted.
  - id: real_work
    folio: capability
    title: Training data comes from real work inside firms
    holders: [cai_mar26]
    attribution: author
    mechanism: Practice tasks written by outside contractors cannot teach a model long work whose results are hard to check, in fields such as biology and security; only records of how experts actually do that work can.
    case: The labs are turning from staged practice tasks towards records of real work, and pay for access to them.
    kill_shot: Staged practice tasks going on improving models at long, hard-to-check office work.
    rival: verified_data
    visible: false
  - id: data_moats
    folio: value
    title: Labs may pull apart by industry, on the records they buy
    holders: [hobart_scarcity]
    attribution: author
    mechanism: The labs' general skills converge, so what separates them is the specialist business records each has bought, and each grows strongest in the trades it bought most from.
    case: Labs are buying records from an airline and from start-ups that have wound down, and the gains may spill into neighbouring fields.
    kill_shot: The labs staying interchangeable in every industry, with none ahead in a trade because of the data it bought.
    rival: commodity
    visible: false
  - id: data_fragments
    folio: value
    title: The data market stays split among specialists
    holders: [cai_commodities]
    attribution: author
    mechanism: Each field and each kind of data needs its own experts and its own checks, so no one seller can be best at all of them.
    case: Sellers focused on one field keep winning lab budgets from the large all-purpose vendors.
    kill_shot: One or two sellers coming to handle most of what the frontier labs buy.
    rival: data_consolidates
    visible: false
  - id: data_consolidates
    folio: value
    title: A few large sellers take most of the data market
    holders: []
    attribution: site
    mechanism: Labs want one supplier that can recruit experts at volume, check quality and pass security reviews, and those costs favour the largest sellers.
    case: Recruiting, checking and security reviews may cost less per task the larger the seller.
    kill_shot: Specialist sellers taking a growing share of the labs' data budgets.
    rival: data_fragments
    visible: false
  - id: firms_train
    folio: products
    title: Tuning open models for firms becomes one business
    holders: [cai_jul26]
    attribution: author
    mechanism: Hosting models, selling data and custom training each lead to the same product, an open model fitted to a firm's own work and billed by use.
    case: Firms want models fitted to their own work and run where they control them, and open models are good enough to start from.
    kill_shot: These firms staying in separate businesses rather than converging on selling tuned models by use.
    rival: general_wins
    visible: false
  - id: general_wins
    folio: products
    title: General models overtake models built for one field
    holders: [cai_verifiable, cai_mar26]
    attribution: author
    mechanism: Each new general model from the labs learns many fields at once, so a model trained for one field keeps its edge only until the next release.
    case: Cai expects the gains from custom training to be nearly wiped out by each general release, outside regulated niches where data is scarce.
    kill_shot: Models built for one field keeping their lead over each new general release.
    rival: firms_train
    visible: false
  - id: cost_binds
    folio: capability
    title: Cost, not ability, becomes the limit
    holders: [cai_jun26]
    attribution: author
    mechanism: Once many agents can work on a task at once, what limits the work is the cost of the computing and the systems around it, not what a single model can do.
    case: Agents working in parallel multiply what a model can finish, at a price.
    kill_shot: Valuable office tasks staying out of AI's reach even where computing is cheap.
    rival: not_reliability
    visible: false
  - id: deployers_scarce
    folio: adoption
    title: Engineers who fit AI to each firm are the scarce ingredient
    holders: [hobart_fde, cai_preseed]
    attribution: author
    mechanism: Every firm's work is different, and fitting a model to it takes engineers who understand both the model and the firm, of whom there are few.
    case: Labs, investors and software firms all compete for these engineers, and labs buy the consultancies that employ them.
    kill_shot: These roles becoming easy to fill, and their pay premium fading.
    rival: frictions
    visible: false
  - id: us_lead
    folio: capability
    title: Chinese labs do not take the lead
    holders: [cai_jul26, hobart_nomentum]
    attribution: author
    mechanism: The tests that define the frontier, the work it is judged on and the customers who pay are mostly American, and the most advanced chips stay hard for Chinese labs to get.
    case: Chinese labs release strong open models, yet the best closed models from American labs have stayed ahead of them.
    kill_shot: A Chinese lab's model becoming the best at the frontier.
    rival: commodity
    visible: false
  - id: lock_fails
    folio: value
    title: Labs cannot lock their customers in
    holders: [cai_jun26, cai_may26]
    attribution: author
    mechanism: Competition among the frontier labs keeps switching cheap, and bans on copying models and exclusive deals leak.
    case: Rival labs are close enough that a customer's cost of switching between them stays small.
    kill_shot: Customers becoming bound to one lab by exclusive deals and bans on copying.
    rival: up_the_stack
    visible: false
  - id: models_differ
    folio: value
    title: Models stay different, not interchangeable
    holders: [cai_apr26, cai_mythos]
    attribution: author
    mechanism: Models differ in efficiency and in the kinds of input they handle, and a system built from several models needs each one to fit its part.
    case: A system built from several models needs each to fit its part.
    kill_shot: Buyers treating models as interchangeable and choosing on the price of a token alone.
    rival: commodity
    visible: false
  - id: no_glut
    folio: value
    title: Computing cannot flood the market overnight
    holders: [cai_commodities]
    attribution: author
    mechanism: New capacity takes years to plan, power and build, so it cannot be multiplied overnight the way new fibre equipment multiplied internet bandwidth.
    case: Adding capacity means new buildings, power and chips, none of which can be added at once.
    kill_shot: A sudden glut sending the rent for AI chips down by most of its value within a year.
    rival: glut_somewhere
    visible: false
  - id: glut_somewhere
    folio: value
    title: Some link in the chip chain proves easier to expand
    holders: [hobart_technoking]
    attribution: author
    mechanism: AI's demand strains every link from memory to power at once; somewhere supply will prove easier to expand than expected, and prices there will turn.
    case: Each shortage draws investment, and some suppliers respond faster than expected.
    kill_shot: Every part squeezed by AI's demand staying scarce and rising in price.
    rival: no_glut
    visible: false
  - id: builders_bind
    folio: capability
    title: The grid and tradespeople set the pace of building
    holders: [hobart_lr188, hobart_skilled]
    attribution: author
    mechanism: A data centre can be financed and designed quickly, but the grid is planned for slow change with warning, and electricians and welders are few; neither can be hurried.
    case: The largest technology firms already pay to train electricians and other tradespeople.
    kill_shot: Data centres being finished on time once the money is committed.
    rival: build_runs_late
    visible: false
  - id: lead_rotates
    folio: value
    title: The lead among labs keeps changing hands
    holders: [hobart_court]
    attribution: author
    mechanism: The lab with the most popular model spends its chips serving it, leaving less to train the next, while rivals with spare chips train theirs.
    case: The title of best model has already passed between labs several times.
    kill_shot: One lab keeping the best model for several years running.
    rival: durable_labs
    visible: false
  - id: held_back
    folio: products
    title: Labs hold back their strongest models
    holders: [hobart_fpa]
    attribution: author
    mechanism: No government agrees a pause, but the largest labs, loosely in step, slow the public release of their most powerful models.
    case: Labs have already gated models they judged too capable to publish at once.
    kill_shot: Labs releasing their best models to the public as soon as they are trained.
    rival: released_fast
    visible: false
  - id: released_fast
    folio: products
    title: The best models go to everyone at once
    holders: []
    attribution: site
    mechanism: Labs compete for users and revenue, so a model kept back is revenue handed to a rival.
    case: Every lab that waits hands its customers to a rival that does not.
    kill_shot: Labs keeping their best models back from the public.
    rival: held_back
    visible: false
  - id: liable_wrappers
    folio: adoption
    title: AI's work is bought through firms that can be sued
    holders: [hobart_sued, hobart_peanut]
    attribution: author
    mechanism: When an agent does long, unpredictable work, the buyer wants someone with assets and a licence who answers for its mistakes, so AI reaches customers through such parties.
    case: Hobart expects labs to buy operating firms in the trades they serve, gaining customers and assets that can answer for mistakes.
    kill_shot: Buyers taking AI's work on long, unpredictable tasks from parties that cannot answer for its mistakes.
    rival: startups_sell
    visible: false
  - id: startups_sell
    folio: adoption
    title: Firms buy AI straight from the start-ups that build it
    holders: []
    attribution: site
    mechanism: Start-ups built around AI are cheaper and faster, and contracts and insurance can carry the liability.
    case: Start-ups take [fact:startup_app_share] of what American firms spend on AI apps, by Menlo Ventures' survey, though the survey leaves out AI built into incumbents' existing software.
    kill_shot: Established firms taking most of what firms spend on AI apps.
    rival: liable_wrappers
    visible: false
  - id: tokens_climb
    folio: value
    title: Firms' AI bills keep rising as prices fall
    holders: [hobart_convergent, hobart_fde, cai_victoria]
    attribution: author
    mechanism: Each fall in price makes AI worth using for more work, and use grows faster than the price falls.
    case: Ramp, which handles firms' card spending, counts their median AI spending per employee at [fact:ramp_spend], up on a year before.
    kill_shot: Firms' AI spending levelling off or falling while prices keep dropping.
    rival: spend_plateaus
    visible: false
  - id: spend_plateaus
    folio: value
    title: Firms' AI spending levels off as prices fall
    holders: []
    attribution: site
    mechanism: Work gets moved to cheaper models and fixed routines, so falling prices cut the bill faster than new uses add to it.
    case: Each generation of models does last year's work for a fraction of the price.
    kill_shot: Firms' spending on AI per employee rising year after year.
    rival: tokens_climb
    visible: false
  - id: backlash
    folio: reorganisation
    title: AI grows unpopular, and its rules come late
    holders: [hobart_backlash, hobart_visible, hobart_lr188]
    attribution: author
    mechanism: Most of AI's benefits are hard to see, while those facing automation outnumber those doing it, so politicians gain by opposing it.
    case: AI's use keeps growing while the public grows warier of it.
    kill_shot: Public approval of AI rising clearly and politicians campaigning in its favour.
    rival: quiet_rules
    visible: false
  - id: quiet_rules
    folio: reorganisation
    title: AI's rules are settled quietly
    holders: []
    attribution: site
    mechanism: Agencies, courts and industry standards set AI's rules before it becomes a voting issue.
    case: Rules for a technology often come from agencies, courts and standards bodies long before voters take it up.
    kill_shot: AI becoming a central issue in national elections.
    rival: backlash
    visible: false
  - id: train_replacements
    folio: reorganisation
    title: Some workers turn into trainers of their replacements
    holders: [hobart_contrarian]
    attribution: author
    mechanism: The fastest way to teach a model a job is to record people doing it, so in some jobs the work becomes producing that record.
    case: Labs and data sellers already pay experts to set down how they do their work.
    kill_shot: Few occupations showing workers shifting to producing training data.
    rival: relational
    visible: false
  - id: vendor_finance
    folio: value
    title: NVIDIA finances its customers
    holders: [hobart_toll, hobart_neocloud]
    attribution: author
    mechanism: NVIDIA lends to and invests in the data centres that buy its chips in return for a share of their income, turning one-off sales into a stream and gaining a say over who gets capacity.
    case: NVIDIA has invested in cloud companies that rent out its chips and in labs that buy them.
    kill_shot: NVIDIA's revenue staying almost wholly one-off sales of hardware.
    rival: scarce_input_collects
    visible: false
  - id: shared_bet
    folio: value
    title: The builders overbuild and rent out the rest
    holders: [hobart_neocloud]
    attribution: author
    mechanism: The largest technology firms build more computing than they need and rent the spare to rivals, turning each firm's bet into one bet, shared across the industry, that demand for AI keeps growing.
    case: Labs and clouds already buy capacity from one another in every direction.
    kill_shot: The largest firms keeping their computing for their own use and renting none of it out.
    rival: money_runs_out
    visible: false
  - id: ads_fund
    folio: value
    title: Advertising pays for free AI
    holders: [hobart_rocketship, hobart_peanut]
    attribution: author
    mechanism: Assistants can see what people want to buy earlier than search does, so advertisers will pay to reach them, and ads fund the free versions.
    case: Search shows how much advertisers pay for a clear sign of what someone wants; assistants can see that want earlier.
    kill_shot: Ads in assistants driving users away or earning far less per user than ads in search.
    rival: consumers_keep
    visible: false
  - id: records_hold
    folio: value
    title: The software that keeps the records gains
    holders: [hobart_rnd]
    attribution: author
    mechanism: Coding agents let firms build their own tools instead of buying them, but the programs that hold a business's core records are hard to replace and every new tool needs them.
    case: Firms build more of their own software with coding agents while still running on the same systems of record.
    kill_shot: Software that holds a business's records losing customers as fast as other software.
    rival: up_the_stack
    visible: false
  - id: labs_below_software
    folio: value
    title: Deployment staff pull the labs' margins down
    holders: [hobart_coasian]
    attribution: author
    mechanism: Labs need staff inside their customers to deploy their models, and that staff grows with the customers.
    case: The labs keep adding engineers who work inside customers' firms.
    kill_shot: Labs reporting gross margins as high as software firms' while running large teams inside their customers.
    rival: durable_labs
    visible: false
  - id: niches_open
    folio: reorganisation
    title: Cheap AI fills niches no one served
    holders: [hobart_pundit, hobart_coasian, cai_victoria]
    attribution: author
    mechanism: Once a task costs less by machine than any worker would, services appear that were never worth paying a person for, and growth comes from filling them.
    case: Firms buy AI for any task where it returns more than it costs, however small.
    kill_shot: New businesses in small information niches not rising as AI's costs fall.
    rival: fast_growth
    visible: false
  - id: generalists
    folio: reorganisation
    title: Versatile workers pull ahead of specialists
    holders: [cai_serviceable]
    attribution: author
    mechanism: When AI does the specialised steps, the valuable worker is the one who can direct it across many of them.
    case: Firms building around AI hire for range more than for depth.
    kill_shot: Specialists keeping their value over versatile workers.
    rival: jagged_wages
    visible: false
claims:
  # A claim with a `stage` says its map row binds there; a claim about what happens on a row, such as who gains or
  # loses, names the row without a stage, so the map lists it under the row and marks no cell.
  # I · capability
  - id: rli_reached
    position: compounding
    text: As the scenario is written, AI completes most real, paid freelance projects end to end by the end of 2027.
    test: {fact: rli_record, gt: 0.5}
    due: 2027-12-31
    grace_days: 90
    falsifier: No model completing most of the Remote Labor Index's projects by the end of 2027.
    expect_state: untestable
  - id: horizon_fast
    position: compounding
    text: The length of the software tasks AI can finish keeps doubling at least as fast as the scenario assumes, every [test:horizon_fast] or less.
    test: {fact: horizon_doubling, lte: 122}
    rival_test: {fact: horizon_doubling, lte: 122}
    falsifier: The doubling time lengthening beyond what the scenario assumes.
    expect_state: both
  - id: frontier_uneven
    position: slowest_task
    text: Whole projects stay far behind single skills, with the best score on real freelance projects below [test:frontier_uneven].
    test: {fact: rli_record, lt: 0.5}
    rival_test: {fact: rli_record, lt: 0.5}
    rival_until: 2027-12-31
    grace_days: 90
    row: family_8
    stage: methods
    falsifier: The best model completing most of the Remote Labor Index's projects.
    expect_state: both
  - id: reliability_lags
    position: not_reliability
    text: The agents Princeton's tracker tests grow more dependable far more slowly than they grow more accurate.
    test: {fact: hal_reliability_trend, lt: hal_accuracy_trend}
    rival_test: {fact: hal_reliability_trend, lt: hal_accuracy_trend}
    row: family_0
    stage: products
    falsifier: Reliability rising as fast as accuracy across the next models the tracker tests.
    expect_state: both
  - id: coverage_sold
    position: coverage_bought
    text: Labs and companies keep paying more for the steps models cannot yet take, even as each new model takes more of them on its own.
    falsifier: What labs and companies pay for practice work and for fitting models falling as the models improve.
  - id: lossy_loop
    position: lossy
    text: AI's help with AI research brings steady gains, not accelerating ones.
    falsifier: Each new model's gains on AI research tasks coming faster than the last's, with nothing lost along the way.

  # II · products
  - id: checking_sold
    position: assurance_layer
    text: Checking AI's work is sold as a category of its own.
    test: {fact: evals_ledger, gte: 1}
    rival_test: {fact: evals_ledger, gte: 1}
    row: verification
    stage: products
    falsifier: No independent category forming, the checks staying inside the labs' and clouds' own platforms.
    expect_state: both
  - id: insurers_exclude
    position: assurance_layer
    text: Insurers write AI's mistakes out of their standard policies, so the cover has to be bought and priced on its own.
    test: {fact: insurer_ledger, gte: 1}
    rival_test: {fact: insurer_ledger, gte: 1}
    row: verification
    stage: early_adoption
    falsifier: Standard policies going on covering AI's mistakes at no extra price.
    expect_state: both
  - id: apps_squeezed
    position: smart_squeeze
    text: Apps that resell the labs' models see their margins shrink as their use grows.
    row: applications
    falsifier: A lab selling to apps below its public prices, or apps' margins holding as their use grows.
  - id: agents_fenced
    position: fences
    text: Large platforms move to keep outside agents off them more often than they let them in.
    row: agents
    stage: early_adoption
    falsifier: Platforms opening to outside agents more often than they block them, counted under one rule for both; this site's hand-kept ledger does not yet sweep both sides that way, so it tests nothing yet.
  - id: data_next
    position: verified_data
    text: Labs spend more each year with the firms that sell practice tasks, graders and expert data.
    row: post_training
    stage: methods
    falsifier: That spending falling once each firm counted a year ago has reported again; the hand-kept tally of disclosed deals is too thin to test it yet.

  # III · adoption
  - id: firms_normal
    position: frictions
    text: The share of American firms using AI stays within the pace this site calls normal, below [test:firms_normal].
    test: {fact: firms_using_ai, lt: 0.35}
    rival_test: {fact: firms_using_ai, lt: 0.35}
    row: family_1
    stage: early_adoption
    falsifier: The share of firms using AI climbing past that pace.
    expect_state: both
  - id: use_unpriced
    position: invisible
    text: Official output statistics miss most of AI's gains, which come as better quality and saved time that no price records.
    row: measuring_returns
    falsifier: Official statistics capturing AI's gains in quality and saved time as use spreads.
  - id: juniors_behind
    position: junior_first
    text: In the jobs most exposed to AI, workers in their early twenties fall behind workers over fifty [cite:canaries], while in the least exposed jobs they do not.
    test: {fact: junior_gap, lt: junior_gap_control}
    rival_test: {fact: junior_gap_control, lt: 0}
    row: work_and_pay
    falsifier: The same gap opening in the least exposed jobs.
    expect_state: holding
  - id: simple_markets_first
    position: simple_first
    text: Agents take hold first in job search, property and other matching markets.
    falsifier: Agents spreading first in markets where people rarely hire human agents.

  # IV · reorganisation
  - id: no_growth_jump
    position: modest_growth
    text: In no quarter before 2034 does American real output per person stand [test:no_growth_jump] or more above the highest level it had reached a year or more before.
    holders: [moll_imas_bet]
    test: {fact: gdp_pc_over_peak_best, lt: 0.15}
    rival_test: {fact: gdp_pc_over_peak_best, lt: 0.15}
    rival_until: 2033-12-31
    falsifier: A quarter before 2034 that clears the bet's line.
    expect_state: both
  - id: bet_fast_side
    position: fast_growth
    holders: [bet_fast_side]
    text: In some quarter before 2034, output per person stands [test:bet_fast_side] or more above the highest level it had reached a year or more before, which wins the bet's fast side.
    test: {fact: gdp_pc_over_peak_best, gte: 0.15}
    due: 2033-12-31
    falsifier: No qualifying quarter by the time the last one the bet counts is published.
    expect_state: untestable
  - id: hours_rise_first
    position: intensity_first
    text: Work in the jobs most exposed to AI grows more intense before it grows shorter.
    row: work_and_pay
    falsifier: Paid hours in the most exposed work falling before output per worker rises.
  - id: relational_share
    position: relational
    text: Care, teaching, hospitality and other work where the person is part of what is bought take a rising share of spending and jobs as AI spreads.
    row: work_and_pay
    falsifier: That work's share of spending and jobs falling as AI spreads.
  - id: labour_share_falls
    position: jagged_wages
    holders: [restrepo]
    text: Labour's share of income falls as AI takes on more tasks, even as wages rise.
    row: work_and_pay
    falsifier: Labour's share holding while AI does a growing share of tasks.
  - id: firms_centralise
    position: centralises
    text: Firms using AI grow larger and take decisions further from the people on the spot.
    falsifier: Firms getting smaller and more decentralised as they adopt AI.
  - id: visits_fall
    position: referrals_fall
    text: Publishers lose the visits that pay for what they produce.
    row: information
    falsifier: Visits to publishers from search and AI answers rising.

  # V · value
  - id: open_takes_volume
    position: price_holds
    attribution: site
    text: Open models carry most of the tokens routed to OpenRouter's busiest models.
    test: {fact: open_share, gt: 0.5}
    rival_test: {fact: open_share, gt: 0.5}
    falsifier: The closed models' share of those tokens climbing back as the gap to open models closes.
    expect_state: both
  - id: gap_stays_short
    position: commodity
    attribution: site
    text: Open models trail the best closed ones by less than [test:gap_stays_short], a shorter gap than this site calls normal.
    test: {fact: open_lag, lt: 9}
    rival_test: {fact: open_lag, lt: 9}
    falsifier: The best closed models pulling away from open ones by that gap or more.
    expect_state: both
  - id: lock_in
    position: up_the_stack
    text: The labs earn a growing share of their revenue from products and deployments inside their customers' firms rather than from selling access to their models by the token.
    falsifier: The labs' revenue staying mostly in selling access to their models by the token.
  - id: chips_collect
    position: scarce_input_collects
    text: NVIDIA and AMD take more than [test:chips_collect] of the gross profit they share with Microsoft's cloud arm and the estimates for OpenAI and Anthropic.
    test: {fact: chips_gp_share, gt: 0.5}
    rival_test: {fact: chips_gp_share, gt: 0.5}
    row: accelerators
    stage: methods
    falsifier: Their share falling below that line while chips stay short.
    expect_state: both
  - id: capex_ahead
    position: money_runs_out
    text: The biggest cloud and platform companies spend more each year on buildings and equipment than AI earns in revenue.
    test: {fact: capex_to_revenue, gt: 1}
    rival_test: {fact: capex_to_revenue, gt: 1}
    row: capital
    falsifier: AI's revenue overtaking that spending.
    expect_state: both
  - id: chips_stored
    position: build_runs_late
    text: The cloud companies start storing new chips instead of installing them, the sign Cahn watches for that data centres are running late [cite:cahn_2025].
    row: data_centres
    stage: methods
    falsifier: New chips going into service as fast as they arrive.
  - id: few_labs
    position: durable_labs
    text: Only a handful of labs stay at the frontier, because it costs too much capital for more.
    row: pretraining
    falsifier: More than a handful of labs keeping pace with the best models.
  - id: surplus_to_users
    position: consumers_keep
    text: The people who use AI keep far more of its value than the firms that make it.
    falsifier: AI firms' profits growing as fast as the value their users get.

  - id: field_divergence
    position: slowest_task
    text: Research speeds up far more in software and mathematics than in drug development, materials or physics, where the slowest steps are experiments.
    falsifier: A broad speed-up in the experiment-heavy sciences at the same time as in software.
  - id: data_drives_pretraining
    position: scaling_limits
    holders: [dwarkesh_data]
    text: Better data, more than better model designs, drives how much a model learns from its training, so progress comes to rest on finding new data.
    row: training_data
    stage: methods
    falsifier: Design changes, not data, turning out to carry the gains at the largest scale.
  - id: labs_buy_exits
    position: up_the_stack
    attribution: site
    text: Being bought by a lab or a compute company becomes the usual way out for the start-ups that sell them data and tools.
    test: {fact: lab_deals_now, gt: lab_deals_year_ago}
    falsifier: The yearly count flattening, read only over quarters searched the same way. A later search that turns up deals missed earlier also raises the count, so it is not by itself a sign of more buying.
    expect_state: untestable
  - id: contracts_shift
    position: up_the_stack
    attribution: site
    text: Buyers sign up for AI capacity well ahead of using it, so Microsoft's contracted but undelivered business keeps growing faster than its revenue.
    test: {fact: msft_backlog, gt: msft_backlog_year_ago}
    falsifier: The backlog shrinking against revenue; it is one company's figure and counts contracts of every kind, much of it OpenAI's commitment to Microsoft's cloud.
    expect_state: holding
  - id: own_models
    position: commodity
    holders: [nadella_models]
    text: Every firm ends up with a model of its own, trained on its own work.
    falsifier: Businesses' use of open models, the easiest kind to make one's own, falling further.
  - id: self_hosting
    position: commodity
    attribution: site
    text: Most businesses end up running models on machines they control rather than renting a lab's.
    falsifier: Businesses sticking with rented frontier models even as open models improve.
  - id: training_cheapens
    position: apps_keep
    attribution: extension
    holders: [cai_mythos]
    text: If training a model further on a firm's own work keeps getting cheaper, apps train their own instead of renting the best.
    falsifier: Apps built on open models still paying labs' prices because training their own stays too costly.
  - id: edge_inference
    position: edge
    text: Much of AI's everyday work moves out of distant data centres onto people's own phones and laptops.
    falsifier: Everyday use staying in cloud data centres as capable open models get smaller.
  - id: margins_below_software
    position: smart_squeeze
    attribution: site
    text: Companies selling AI products keep lower gross margins than classic software, because every use costs them the model's price.
    test: {fact: ai_app_margin, lt: 0.7}
    rival_test: {fact: ai_app_margin, gte: 0.7}
    row: applications
    falsifier: AI product margins reaching those of classic software.
    expect_state: holding
  - id: verification_first
    position: assurance_layer
    holders: [hadfield_koh]
    text: The first large failure of a market run by AI agents comes from no one being able to check what an agent did, not from agents lacking skill.
    falsifier: The first large agent failure traced to agents that could not do the work.
  - id: insurers_cover
    position: assurance_layer
    attribution: site
    text: Insurers sell cover written for AI's mistakes, not only exclusions from standard policies.
    falsifier: AI cover staying a niche product that large buyers do not purchase.
  - id: software_jobs_hold
    position: frictions
    holders: [nk_swe]
    text: AI does not wipe out software engineering jobs, and demand for engineers may rise as software gets cheaper to make.
    row: work_and_pay
    falsifier: Software engineering employment falling as AI coding tools spread.
  - id: chips_concentrate
    position: scarce_input_collects
    attribution: site
    text: NVIDIA's lead over other chip makers in sales for data centres keeps widening as AI spending grows.
    falsifier: Rival chip makers taking a growing share of data-centre chip sales while spending rises.
  - id: states_buy_in
    position: scarce_input_collects
    attribution: site
    text: Governments take direct stakes in the companies that make chips, power and models.
    falsifier: States staying lenders and buyers rather than owners.
  - id: ai_taxed
    position: jagged_wages
    attribution: extension
    holders: [korinek_lockwood]
    text: As AI takes over paid work, governments move tax from wages towards spending, and later towards AI itself.
    falsifier: Tax systems unchanged as AI does a growing share of the work.
  # Part 16: claims from Sean Cai and The Diff, reworded, credited and linked to the post each came from
  - id: real_work_data
    position: real_work
    text: Training for long work whose results are hard to check, in fields such as biology, security and matters of taste, comes to rest on records of real work inside firms, because tasks staged by contractors stop teaching models.
    row: training_data
    stage: methods
    falsifier: Staged practice tasks going on improving models at long office work.
  - id: labs_by_industry
    position: data_moats
    text: The leading labs may pull apart by industry, each strongest where it has bought the most specialist business records.
    falsifier: The labs staying interchangeable in every industry, with none ahead in a trade because of the data it bought.
  - id: labs_buy_records
    position: data_moats
    attribution: author
    holders: [cai_may26]
    text: Labs buy more of their training data straight from leading app companies and specialists, squeezing the firms that sell general practice environments.
    row: training_data
    falsifier: General environment sellers keeping their share of the labs' data budgets.
  - id: data_split
    position: data_fragments
    text: The market for training data stays split among many specialist sellers rather than gathering around one or two.
    row: training_data
    falsifier: One or two sellers coming to handle most of what the frontier labs buy.
  - id: tuning_converges
    position: firms_train
    text: Leading firms that host models, sell training data or do custom training, such as Baseten, Mercor and Applied Compute, converge on one business, tuning open models for firms and selling them the use.
    falsifier: These firms staying in separate businesses.
  - id: firms_buy_data
    position: firms_train
    attribution: author
    holders: [cai_verifiable]
    text: Firms outside the labs become large buyers of training data and practice tasks, so the labs stop being almost the only customers.
    row: training_data
    falsifier: The labs remaining almost all of the spending on training data and practice tasks.
  - id: field_models_fade
    position: general_wins
    text: Start-ups that build a model for one field fall behind as the labs' general models improve, outside a few regulated niches where data is scarce.
    falsifier: Models built for one field keeping their lead over each new general release.
  - id: compute_cost_binds
    position: cost_binds
    text: With many agents working on a task at once, most valuable office work comes to turn on the cost of computing and the systems around it, not on whether models are good enough.
    row: inference
    falsifier: Valuable office tasks staying out of AI's reach even where computing is cheap.
  - id: deployers_paid
    position: deployers_scarce
    text: Engineers who fit AI into each customer's own work stay scarce, so their pay rises or employers settle for weaker hires.
    row: applications
    stage: early_adoption
    falsifier: These roles becoming easy to fill, and their pay premium fading.
  - id: labs_buy_deployers
    position: deployers_scarce
    attribution: author
    holders: [hobart_nomentum]
    text: Labs keep buying the consultancies that put AI to work inside companies, to get their staff faster than hiring allows.
    falsifier: Labs building these teams by hiring and buying no such firms.
  - id: no_chinese_lead
    position: us_lead
    text: Chinese labs do not take the lead at the frontier while the best chips, the tests that matter and the paying customers stay American.
    falsifier: A Chinese lab's model becoming the best at the frontier.
  - id: lock_in_fails
    position: lock_fails
    text: Labs' efforts to tie customers down, through exclusive deals and bans on copying their models, eventually fail, and moving between labs stays cheap.
    falsifier: Customers becoming bound to one lab by exclusive deals and bans on copying.
  - id: models_not_utility
    position: models_differ
    text: Models keep differing in efficiency and in the kinds of input they handle, so they do not become an interchangeable utility like electricity.
    falsifier: Buyers treating models as interchangeable and choosing on the price of a token alone.
  - id: compute_no_crash
    position: no_glut
    text: The price of rented computing does not crash the way internet bandwidth did, because physical capacity cannot be multiplied overnight.
    falsifier: A sudden glut sending the rent for AI chips down by most of its value within a year.
  - id: link_overshoots
    position: glut_somewhere
    text: Somewhere along the chip supply chain, a part AI has made scarce proves easier to expand than expected, and its price turns.
    falsifier: Every part squeezed by AI's demand staying scarce and rising in price.
  - id: grid_hookups
    position: builders_bind
    attribution: author
    holders: [hobart_lr188]
    text: Data centres arrive faster and with less warning than the grid's planners assume, so getting connected holds back new American sites.
    row: grid
    stage: methods
    falsifier: New sites being connected to the grid as fast as they are built.
  - id: trades_short
    position: builders_bind
    attribution: author
    holders: [hobart_skilled]
    text: Too few electricians, welders and other tradespeople hold back the building of data centres, so the largest technology firms keep paying to train them.
    row: data_centres
    stage: methods
    falsifier: Data-centre projects facing no delays tied to shortages of skilled trades.
  - id: lead_changes
    position: lead_rotates
    text: The lab with the best model keeps changing, because the leader uses its chips to serve its popular model while rivals train the next one.
    falsifier: One lab keeping the best model for several years running.
  - id: models_held_back
    position: held_back
    text: A formal pause looks unlikely; instead the biggest labs, loosely in step, slow the public release of their most powerful models.
    row: family_5
    stage: products
    falsifier: Labs releasing their best models to the public as soon as they are trained.
  - id: through_incumbents
    position: liable_wrappers
    text: Firms increasingly buy AI's work through a party with assets and a licence that can be held liable, such as an established service firm.
    row: verification
    stage: early_adoption
    falsifier: Buyers taking AI's work on long, unpredictable tasks from parties that cannot answer for its mistakes.
  - id: ai_bills_rise
    position: tokens_climb
    text: Firms' spending on AI per employee keeps rising, because what they use grows faster than the price of each unit falls.
    test: {fact: ramp_spend, gt: ramp_spend_year_ago}
    expect_state: holding
    falsifier: Spending on AI per employee levelling off or falling while prices keep dropping.
  - id: tasks_distilled
    position: tokens_climb
    text: Much narrow work AI does is turned into cheap fixed routines, so spending on each such task rises for a while and then stops.
    falsifier: Spending on well-defined tasks staying high after they are solved.
    attribution: author
    holders: [hobart_ghost]
  - id: ai_unpopular
    position: backlash
    text: AI grows more unpopular even as more people use it, giving politicians on both the left and the right reason to campaign against it.
    row: family_3
    stage: adaptation
    falsifier: Public approval of AI rising clearly and politicians campaigning in its favour.
  - id: jobs_become_data
    position: train_replacements
    text: Some jobs move from doing the work to supplying the data that trains AI to do it.
    falsifier: Few occupations showing workers shifting to producing training data.
  - id: chips_finance_buyers
    position: vendor_finance
    text: NVIDIA keeps financing its own customers in return for a share of their income, and uses such deals to gain a say over who gets computing capacity.
    falsifier: NVIDIA's revenue staying almost wholly one-off sales of hardware.
  - id: rent_surplus
    position: shared_bet
    text: The largest technology firms build more computing than they need and rent the spare to rivals, so the industry becomes one shared bet on demand for AI.
    falsifier: The largest firms keeping their computing for their own use and renting none of it out.
  - id: ads_pay
    position: ads_fund
    text: Advertising comes to pay for free AI assistants, because they can spot what people want to buy before search does, though keeping users' trust will be hard.
    falsifier: Ads in assistants driving users away or earning far less per user than ads in search.
  - id: trades_scattered
    position: local_knowledge
    attribution: author
    holders: [hobart_n1]
    text: Law, contracting and other trades scattered by place stay split among many small firms, while the AI tools each trade uses gather around a few vendors.
    falsifier: A handful of labs ending up running, and profiting from, most professional work directly.
  - id: records_gain
    position: records_hold
    text: Coding agents slow new firms' purchases of ready-made software but make the programs that hold a business's core records worth more.
    falsifier: Software that holds a business's records losing customers as fast as other software.
  - id: lab_margins_below
    position: labs_below_software
    text: The labs' margins are pulled down because the staff who deploy their models grow with their customers, which a pure software business avoids.
    falsifier: Labs reporting gross margins at or above classic software's while running large teams inside their customers.
  - id: niches_filled
    position: niches_open
    text: Cheap AI makes many small services worth selling that were never worth paying a person for, and filling these niches is how AI lifts growth.
    falsifier: New businesses in small information niches not rising as AI's costs fall.
  - id: generalists_gain
    position: generalists
    text: The gap in value between versatile workers who manage AI and narrow specialists keeps widening.
    falsifier: Specialists keeping their value over versatile workers.
scenarios:
  progress:
    - {id: stall_capability, label: Capability stalls}
    - {id: stall_money, label: The money stalls}
    - {id: steady, label: Steady progress}
    - {id: automated_research, label: AI automates research}
  rules:
    - {id: unclear, label: The rules stay unsettled}
    - {id: priced, label: Courts and insurers price the risk}
    - {id: licensed, label: Oversight comes first}
  cells:
    - progress: stall_capability
      rules: unclear
      argued_by: [scaling_myths]
      says: Scaling runs out before whole jobs are in reach, and the gains come from spreading what already works.
      signposts: [frontier_uneven, reliability_lags]
      binds_next: [family_2]
    - progress: stall_money
      rules: unclear
      argued_by: [cahn_2024, covello]
      says: The spending outruns the revenue it needs, and the losses fall on the investors who paid for it.
      signposts: [capex_ahead]
      binds_next: [capital]
    - progress: steady
      rules: unclear
      argued_by: [moll_imas, normal_tech, jones_tonetti]
      says: Capability keeps improving, firms adopt it at the pace of past technologies, and growth rises without exploding.
      signposts: [no_growth_jump, firms_normal]
      binds_next: [family_2, family_3]
    - progress: steady
      rules: priced
      argued_by: [hadfield_koh, normal_tech]
      says: Clear rules settle who pays for AI's mistakes, and adoption speeds up where they do.
      signposts: [insurers_exclude, checking_sold]
      binds_next: [verification]
    - progress: steady
      rules: licensed
      argued_by: [hadfield_koh]
      says: Agents and the firms behind them must register before they deal; licensing who may build the models, Kapoor and Narayanan argue, would not work.
      signposts: []
      binds_next: [family_3]
    - progress: automated_research
      rules: unclear
      argued_by: [ai_2027, restrepo, macaskill_moorhouse]
      says: Each model speeds up the research behind the next and output breaks away; in Restrepo's model, wages then settle at the cost of the computing that could replace a person.
      signposts: [rli_reached, horizon_fast, bet_fast_side]
      binds_next: [energy, data_centres, accelerators]
    - progress: automated_research
      rules: licensed
      argued_by: [ai_2027]
      says: In the story's slower ending, a committee of the leading lab and the government slows the race until the systems can be checked.
      signposts: [rli_reached]
      binds_next: [family_5]
  anchors:
    - {source: eo_14365, date: 2025-12-11, text: The American president ordered moves against state AI laws and called for a light national standard.}
    - {source: iso_exclusions, date: 2026-01, text: Standard exclusions for harm caused by generative AI became available for insurers to attach to general liability policies.}
    - {source: colorado_sb26_189, date: 2026-05-14, text: "Colorado replaced its AI Act with a narrower law on automated decisions, which applies from January 2027."}
    - {source: eu_2026_1744, date: 2026-07-27, text: "The European Union's changes to its AI Act came into force, putting off its rules for high-risk AI until December 2027 and August 2028."}

agree:
  - id: tokens_thin
    text: Selling access to a model that others can match, token by token, is a thin business.
    holders: [hobart_pacing, nk_up_the_stack]
    dissent: [sundheim]
    dissent_text: Sundheim, whose firm holds stakes in two of the labs, says customers mostly stay with a lab even when they could switch, and margins are high.
  - id: someone_answers
    text: Someone has to answer for what an AI agent does before it can be trusted with work that matters.
    holders: [hadfield_koh, normal_tech]
    dissent: []
  - id: checking_costs
    text: Checking AI's work becomes a costly task of its own.
    holders: [jones_b, cai_data]
    dissent: []
  - id: use_first
    text: People use AI well before firms reorganise around it.
    holders: [normal_tech, brs_jcurve]
    dissent: [ai_2027]
    dissent_text: In AI 2027's story the economy is remade within a few years once AI can do the work of the best researchers.
