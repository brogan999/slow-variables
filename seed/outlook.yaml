  - id: aghion_jones_jones
    who: "Philippe Aghion, Benjamin Jones and Charles Jones"
    short: "Aghion, Jones and Jones"
    field: "economists who study where growth comes from"
    finding: "Tasks depend on one another, so output is limited by the tasks that are hardest to improve. As automated tasks get cheap their share of spending falls, and the slow, essential tasks that are left take a rising share."
