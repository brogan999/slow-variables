    layer: deployment_application
    sublayer: coding_agents
    title: "Coding agents are among the fastest-growing AI apps, but the labs sell their own and a lab's owner now holds Cursor; an independent agent's margin is a lease on the labs' models"
    holders: []
    attribution: site
    mechanism: "A coding agent is an AI tool that writes, edits and tests software, from suggesting the next line to carrying out a whole task on its own. The independent sellers include Cognition, Replit, Lovable, Factory and Augment. The labs and their owners sell their own: Anthropic's Claude Code, OpenAI's Codex, and Cursor, made by Anysphere, which SpaceX, the owner of the lab xAI, bought in 2026 and which now works with xAI on its Grok models; and Microsoft sells coding tools through GitHub, a site where developers keep and share code. This site judges that the independent agents mostly run on models bought from the labs, paying by the token (a fragment of a word), though some train models of their own. David Ricardo, an English economist who asked in 1817 why landlords grew rich when bread grew dear, found that the owner of the scarcest input collects a rent: profit above what it takes to keep a business going, earned because something holds rivals off. This site judges that the scarce input in a coding agent is the model underneath, which the labs own, so an independent agent keeps a rent only for what it adds: its editor (the program in which developers write and read code), its grip on a firm's code and habits, and its own models where it trains them."
    case: "Coding agents hold large and fast-rising run-rates (a recent month's revenue scaled up to a year) in this site's records. Cursor's grew sharply between February and June 2026 on press reports citing people close to it; Cognition says its own grew sharply between May and September 2026; and Anthropic said, in announcing a funding round early in 2026, that Claude Code's had grown sharply since the year began. The last two are company figures, not audited ones. This site holds no comparable readings for OpenAI's Codex or for GitHub's tools, though its record of acquisitions shows the teams of small coding-tool firms joining OpenAI's Codex division in 2025 and 2026. The labs and their owners are buying in. SpaceX took an option in April 2026 to buy Cursor for its own shares, and Cursor says the purchase was completed in August. SpaceX's quarterly filing says that alongside the option it agreed to give Cursor computing capacity and to work with it on improving xAI's Grok models and developing new ones jointly; that August Cursor released a Grok model it says the two built together. Cursor says the deal gives it SpaceX's fleet of GPUs (the chips AI runs on) to train stronger models that cost less to run; it had said in late 2025 that its in-house models already wrote a great deal of code. Lovable says it draws on several models, matching each part of a job to the one best suited to it, and tunes open-source models (free code anyone may use and change) of its own. Cognition names large firms, NVIDIA and Citi among them, whose engineering teams use its agent. Google hired away Windsurf's leaders in July 2025 and Cognition agreed to buy the rest of the firm; this site's record of acquisitions also shows OpenAI and Anthropic hiring the teams of smaller coding-tool firms. Microsoft's filing describes GitHub as a platform where developers add AI and agent tools across the whole of building software. Each use costs an app the model's price, which a classic software firm does not pay: ICONIQ, an investment firm, puts the gross margin (sales minus the direct cost of making them, as a share of sales) of the AI products in its survey at [fact:ai_app_margin]. Whether the agents make developers faster is less clear than their revenue suggests: randomised trials (tests that compare groups assigned by chance) by METR, a research group, have not found developers working faster with AI tools, and METR calls the evidence from its newer trial weak."
    kill_shot: "An independent coding agent keeping its customers and its margin through a year in which the labs cut their own agents' prices and ship better models to everyone at once, with customers not moving to the labs' tools."
    rival: apps_keep
    direction: commoditising
    commoditising: "This site judges that the agent's wrapper, the editor, the chat window and the loop that lets a model run and test code, is becoming a commodity: several sellers offer much the same, open-source versions exist, and the labs bundle their own with their models. William Nordhaus, an economist who measured how much of the value of new inventions their makers keep as profit, found that it is a small part; most goes to buyers as lower prices and better products. David Teece, an economist who studied why the firm that invents something often fails to keep the returns, found that the firm holding the scarce inputs a product needs usually keeps the profit; here the lab holds the model, the scarcest input."
    stays_scarce: "This site judges that what stays scarce is the best coding model at any moment, and, for an agent maker, the record of how developers accept, reject and correct its work, which could train its own models. Andrei Hagiu and Julian Wright, economists who asked when learning from customers' data keeps rivals out, found it does so only when the data is proprietary, keeps its value and improves the product for every customer; a record of accepted code may pass the first and last tests, but goes stale as models improve. Hamilton Helmer, a strategy consultant who studied why some firms keep earning more than their investors could expect elsewhere, found that a lasting advantage is a benefit behind a barrier. Switching costs (what a customer would lose by moving to a rival) are the candidate, but this site judges that a firm can try a rival agent alongside the one it has, and no seller publishes figures on customers leaving, so this site does not count them proven."
    powers: []
    converts_if: "An agent becomes the place a firm's software is planned, reviewed and run, holding its rules, permissions and history, so leaving means rebuilding how its engineers work: switching costs in Helmer's sense. Or its record of developers' corrections trains models of its own good enough to cut what it pays the labs. Ronald Coase, an economist who studied why some work is done inside firms rather than bought, would otherwise expect the owners of models to bring the agents inside, as SpaceX did with Cursor."
    bottlenecks:
    - agents
    - applications
    - inference
    visible: false
