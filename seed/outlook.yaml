sources:
  # I · capability
  - id: ai_2027
    who: Daniel Kokotajlo, Eli Lifland, Thomas Larsen and Romeo Dean, with Scott Alexander
    short: the authors of AI 2027
    field: forecasters of AI progress at the AI Futures Project; Kokotajlo worked on governance at OpenAI
    finding: A dated story in which AI labs use each model to speed up the research that builds the next, ending with AI that outdoes people at almost everything by the end of 2027. The authors say 2027 was their single most likely year, and their middle estimates were later.
    work: AI 2027
    venue: AI Futures Project
    year: 2025
    url: https://ai-2027.com/
    retrieved_at: 2026-09-22
    http_status: 200
    content_hash: d12c71f77cff8065569fe35a71dbb8b59da149b0ce2bb747523ae49663262994
  - id: ai_futures_update
    who: Daniel Kokotajlo, Eli Lifland and Brendan Halstead
    short: the AI Futures Project's forecasters
    field: forecasters at the AI Futures Project, revising their own dates
    finding: After pushing their dates for fully automated coding later at the end of 2025, the forecasters brought them forward again, because AI coding agents improved faster than they expected in late 2025 and early 2026.
    work: Q1 2026 Timelines Update
    venue: AI Futures Project blog
    year: 2026
    url: https://blog.aifutures.org/p/q1-2026-timelines-update
    retrieved_at: 2026-09-22
    http_status: 200
    content_hash: 429bf581aaa39092c81f698810ff0cfbc2035159f8abf50feda1d10c8d2cadf2
  - id: ai_futures_q25
    who: Eli Lifland, Daniel Kokotajlo and Brendan Halstead
    short: the AI Futures Project's forecasters
    field: forecasters at the AI Futures Project, checking their story against events
    finding: Checked against what has happened, the story is roughly on track but running a little slower, at roughly seventy to ninety percent of its pace.
    work: "Q2.5 2026 Timelines Update: Uplift and Revenue"
    venue: AI Futures Project blog
    year: 2026
    url: https://blog.aifutures.org/p/q25-2026-timelines-update-uplift
    retrieved_at: 2026-09-22
    http_status: 200
    content_hash: 15e21f1f6694abaae76322e0cb9a1b89291c50ded832b667e548b0848ac2fd2e
  - id: jones_b
    who: Benjamin Jones
    field: an economist at Northwestern who studies where growth and scientific progress come from
    finding: Research needs every step done, so an AI that is superhumanly good at some steps lifts overall progress only a little while other steps stay slow; what counts is the share of steps it can take over. He adds that checking the work becomes a task of its own, and that AI able to check its own work could reduce the need for costly human checking.
    work: Artificial Intelligence in Research and Development
    venue: The Economics of Transformative AI (National Bureau of Economic Research)
    year: 2026
    url: https://www.kellogg.northwestern.edu/faculty/jones-ben/htm/Artificial_Intelligence_in_Research_and_Development.pdf
    retrieved_at: 2026-09-22
    http_status: 200
    content_hash: 5e249e2daf50e4b847602dba19a31104428f24693a7ae07b90885d9bd1d5edb4
    quote: bottlenecks severely mute the effect of extremely productive AI
  - id: normal_tech
    who: Arvind Narayanan and Sayash Kapoor
    field: computer scientists at Princeton who study what AI can and cannot do
    finding: AI's large effects on the economy will arrive over decades, at the pace at which people and institutions adopt it, as with electricity and the internet. Unclear liability deters firms from adopting a technology, and clear rules can speed it up.
    work: AI as Normal Technology
    venue: Knight First Amendment Institute
    year: 2025
    url: https://knightcolumbia.org/content/ai-as-normal-technology
    retrieved_at: 2026-09-22
    http_status: 200
    content_hash: 0e97b621be9c4ea29687ade9a4dba7eb920b135448b216935639486a61186a62
  - id: agent_reliability
    who: Stephan Rabanser, Sayash Kapoor and colleagues, including Arvind Narayanan
    short: Rabanser, Kapoor and colleagues
    field: Princeton researchers who test AI agents
    finding: Large gains in how often agents solve tasks brought only small gains in how dependably they do it; agents still answer differently on repeat runs and break when instructions are reworded, and though their stated confidence is better calibrated, they still often cannot tell when they will fail.
    work: Towards a Science of AI Agent Reliability
    venue: ICML 2026 (preprint on arXiv)
    year: 2026
    url: https://arxiv.org/abs/2602.16666
    retrieved_at: 2026-09-22
    http_status: 200
    content_hash: 95b9a26416d2300c391617dd6336e26c8760ab4efe15d9b4804a74871f0f8680
  - id: lambert
    who: Nathan Lambert
    field: a machine-learning researcher who builds and writes about open language models
    finding: AI already helps build AI, but the loop leaks, because the research it can automate is narrow, adding agents gives less and less, and the judgement of a few top researchers still sets the pace; so he expects progress, looked back on, to seem closer to a steady line than an explosion.
    work: Lossy self-improvement
    venue: Interconnects
    year: 2026
    url: https://www.interconnects.ai/p/lossy-self-improvement
    retrieved_at: 2026-09-22
    http_status: 200
    content_hash: 6ee918f0755858479879117b6d36f548d3d66a001f4dc0887b30e74ff00b3427
  - id: scaling_myths
    who: Arvind Narayanan and Sayash Kapoor
    field: computer scientists at Princeton who study what AI can and cannot do
    finding: Scale has brought new abilities before, but scaling laws predict only how well a model guesses the next word, not which abilities appear, and good data is getting ever costlier, so making models bigger is unlikely on its own to produce general intelligence.
    work: AI scaling myths
    venue: AI Snake Oil
    year: 2024
    url: https://www.normaltech.ai/p/ai-scaling-myths
    retrieved_at: 2026-09-22
    http_status: 200
    content_hash: 906b175b8d99fd510c8337beeca62695bed2d9e9488349a136ed7015544af30f
  # II · products
  - id: hadfield_koh
    who: Gillian Hadfield and Andrew Koh
    field: Hadfield designs legal and regulatory systems for AI; Koh studies how to design markets and incentives
    finding: AI agents lack the identity and registration systems markets rely on; the authors sketch two routes, each with its own problems, one tying each agent to a registered person or firm that answers for it, the other giving agents legal standing with assets a court could seize.
    work: An Economy of AI Agents
    venue: The Economics of Transformative AI (National Bureau of Economic Research)
    year: 2026
    url: https://arxiv.org/abs/2509.01063
    retrieved_at: 2026-09-22
    http_status: 200
    content_hash: f02048cd546c1c6b011de245099c4494df4e82044e5892a2988f7b2158a6c119
  - id: cai_data
    who: Sean Cai
    field: an investor and writer who works in the market for training data
    finding: The scarce input is realistic, well-checked training data, meaning practice tasks, grading rubrics and quality checks for long work whose results are hard to verify.
    work: An AI Bubble is a human data problem
    venue: his newsletter
    year: 2026
    url: https://seanzcai.substack.com/p/an-ai-bubble-is-a-human-data-problem
    retrieved_at: 2026-09-22
    http_status: 200
    content_hash: e4bbf8bd768ebc1b92a29f31e5e858a3709be0bf0b630d60bdae36a4b12d1e78
  - id: larson_squeeze
    who: Soren Larson
    field: a writer on how money moves between AI labs and the apps built on them, who co-founded Crosshatch, a personalised-AI start-up that shut down in July 2025
    finding: Apps that resell a lab's models are squeezed between the lab's price per token and what customers would pay to go to the lab directly, so as use grows their profit shrinks towards nothing unless their revenue stops tracking tokens.
    work: The Smart Squeeze
    venue: hypersoren.xyz
    year: 2025
    url: https://hypersoren.xyz/posts/smart-squeeze/
    retrieved_at: 2026-09-22
    http_status: 200
    content_hash: e11c4cd50d46273cecb17a7c051c7965bbb4da08a9e8d6e55682455d588454c0
    quote: To my knowledge labs do not offer special wholesale pricing
  - id: shahidi_etal
    who: Peyman Shahidi, Gili Rusak, Benjamin Manning, Andrey Fradkin and John Horton
    short: Shahidi, Horton and colleagues
    field: economists and a computer scientist who study online markets; Fradkin works for Amazon and Horton advises Anthropic
    finding: Agents could slash the cost of searching, bargaining and contracting; they will be taken up first where people already hire human agents and can state simply what they want, and platforms will set rules for how outside agents may use them, much as websites tell search engines' crawlers what they may read, though some already block them.
    work: "The Coasean Singularity? Demand, Supply, and Market Design with AI Agents"
    venue: The Economics of Transformative AI (National Bureau of Economic Research)
    year: 2026
    url: https://peymanshahidi.github.io/assets/pdf/NBER_TAI_Chapter_Shahidi.pdf
    retrieved_at: 2026-09-22
    http_status: 200
    content_hash: a9cba7bbfac6c3c47fd2ce0c409f9974c39437b144bd330782accb852fd04844
  - id: hobart_inference
    who: Byrne Hobart and Nikhil Davar
    field: writers of The Diff, a newsletter on finance and technology; the issue discloses a holding in Amazon
    finding: Amazon blocked Meta's shopping assistant from its site; the authors read it as a sign that companies gain enough from controlling their customers' dealings with AI to pay for the computing themselves rather than let another firm's agent in.
    work: Forward Deployed (the section Fighting for Inference)
    venue: The Diff
    year: 2026
    url: https://www.thediff.co/archive/forward-deployed/
    retrieved_at: 2026-09-22
    http_status: 200
    content_hash: 7c40df1e1ec61c5a5eceb22ce8665c9517d16c08d9cab25a10a1eec8f02c9b9e

  # III · adoption
  - id: coyle_poquiz
    who: Diane Coyle and John Lourenze Poquiz
    field: economists at Cambridge who study how the economy is measured
    finding: Official statistics will capture AI's contribution poorly and late, because most use is free and its gains in quality and saved time are not priced, so measured output can lag or even fall while people are better off.
    work: "Making AI Count: The Next Measurement Frontier"
    venue: The Economics of Transformative AI (National Bureau of Economic Research)
    year: 2026
    url: https://conference.nber.org/conf_papers/f227496.pdf
    retrieved_at: 2026-09-22
    http_status: 200
    content_hash: d28f14724c1b456353d832a6b2aea57de719822d8a31a5a3695f2da49a3ed02d
  - id: canaries
    who: Erik Brynjolfsson, Bharat Chandar and Ruyu Chen
    short: Brynjolfsson, Chandar and Chen
    field: economists at Stanford's Digital Economy Lab who study AI and work through payroll records
    finding: Employment of workers in their early twenties in the jobs most exposed to AI has fallen behind that of their less exposed peers, mostly through less hiring, while experienced workers show no such gap. The authors describe the pattern; they do not claim to have proved its cause.
    work: "Canaries in the Coal Mine? Six Facts about the Recent Employment Effects of Artificial Intelligence"
    venue: Stanford Digital Economy Lab
    year: 2026
    url: https://digitaleconomy.stanford.edu/publication/canaries-in-the-coal-mine-six-facts-about-the-recent-employment-effects-of-artificial-intelligence/
    retrieved_at: 2026-09-22
    http_status: 200
    content_hash: df71c6772283e86d5c6d28cc111638a8dcfe6b85a6e0aee88febd7c4a550b3d9
  - id: larson_coasean
    who: Soren Larson
    field: a writer on how money moves between AI labs and the apps built on them, who co-founded Crosshatch, a personalised-AI start-up that shut down in July 2025
    finding: Cheap agents make dealing with outsiders costlier, not cheaper, because asking a market for anything reveals what you want to your competitors; so firms keep work inside, platforms shut out outside agents, and firms split into the very large and the very small.
    work: Against The Coasean Singularity
    venue: hypersoren.xyz
    year: 2026
    url: https://hypersoren.xyz/posts/against-coasean-singularity/
    retrieved_at: 2026-09-22
    http_status: 200
    content_hash: 33126d46c3b2fcaffc675498c128ef047ed2dbd3e26ee2223c5250908e96f064

  # IV · reorganisation
  - id: moll_imas
    who: Benjamin Moll and Alex Imas
    field: Moll is a macroeconomist at the London School of Economics; Imas, a behavioural economist, leads the economics of advanced AI at Google DeepMind, on leave from Chicago Booth
    finding: Growth of more than ten percent a year in the next decade or so is extremely unlikely even if AI's abilities leap, because it would need several unlikely things at once, from fast automation across the economy to AI that automates research itself; four to five percent a year would already be massive. They are bullish on AI's abilities and have bet against an explosion.
    work: Will AI soon lead to double-digit growth?
    venue: Ghosts of Electricity
    year: 2026
    url: https://aleximas.substack.com/p/will-ai-soon-lead-to-double-digit
    retrieved_at: 2026-09-22
    http_status: 200
    content_hash: 26a0f53d5266db352f6c59caccd8cc0a099270569fb81b6da18d2dcbb1bf55ea
  - id: moll_imas_bet
    who: Benjamin Moll, Alex Imas and five others
    field: the terms of a public bet agreed in August 2026
    finding: Seven people, Moll and Imas among them, bet against four others that in no quarter before 2034 will American real output per person stand fifteen percent or more above the highest level it had reached a year or more before; the fast side wins as soon as one quarter does, later revisions do not reopen a settled bet, a reading close to the line waits for the government's third estimate, and disputes go to an arbiter.
    work: Bet on Explosive AI-Driven Growth
    venue: benjaminmoll.com
    year: 2026
    url: https://benjaminmoll.com/wp-content/uploads/2026/08/growth_bet.pdf
    retrieved_at: 2026-09-22
    http_status: 200
    content_hash: 2430ae73077a3a0daf36711fb6f823728588ec41dcf352717bc7c45bee3a8277
  - id: bet_fast_side
    who: William MacAskill, Samuel Albanie, Tom Cohen and Jan Kulveit
    short: the fast side of the growth bet
    field: the four who took the fast side of the growth bet; MacAskill is a moral philosopher at Forethought, a research group that studies how to prepare for advanced AI
    finding: They bet, at odds of four to one against them, that in some quarter before 2034 American real output per person will stand fifteen percent or more above the highest level it had reached a year or more before.
    work: Bet on Explosive AI-Driven Growth
    venue: benjaminmoll.com
    year: 2026
    url: https://benjaminmoll.com/wp-content/uploads/2026/08/growth_bet.pdf
    retrieved_at: 2026-09-22
    http_status: 200
    content_hash: 2430ae73077a3a0daf36711fb6f823728588ec41dcf352717bc7c45bee3a8277
  - id: macaskill_moorhouse
    who: William MacAskill and Fin Moorhouse
    field: MacAskill, a moral philosopher who taught at Oxford until 2024, is a senior research fellow at Forethought, a research group that studies how to prepare for advanced AI; Moorhouse was a researcher there until June 2026 and is now at Google DeepMind
    finding: Once AI's thinking rivals the whole of humanity's, it will keep growing far faster than the number of people, so a century of technological progress could be compressed into a decade, followed by an explosion in industry.
    work: Preparing for the Intelligence Explosion
    venue: Forethought
    year: 2025
    url: https://www.forethought.org/research/preparing-for-the-intelligence-explosion
    retrieved_at: 2026-09-22
    http_status: 200
    content_hash: ae3c4d99e534ad6766821b80268591c829437ed60e667b09faee431400d1b5db
  - id: korinek_etal
    who: Anton Korinek, Charles Jones, Szymon Sacher, Tess Cotter and Peter McCrory
    short: Korinek, Jones and colleagues
    field: economists who model growth under advanced AI; several work for or advise Anthropic
    finding: A model that turns assumptions about AI into paths for the economy to 2030, from barely changed to growing far faster than today; the authors present them as scenarios, not predictions.
    work: Economic Scenarios for Transformative AI
    venue: Anthropic Institute
    year: 2026
    url: https://www-cdn.anthropic.com/files/4zrzovbb/website/cf58f84d46a4a76bf5a5b039ac695fba6b80041c.pdf
    retrieved_at: 2026-09-22
    http_status: 200
    content_hash: 9fe6667ec24b8a1dce3cde7c8ae5d5e6631bb95f68dae82dbd827cbfa2410327
    quote: Across scenarios, almost all of the divergence comes after 2027.
  - id: stevenson
    who: Betsey Stevenson
    field: a labour economist at the University of Michigan
    finding: The danger is not too little output but gains that reach many people late and unevenly; as with household appliances, AI will first raise how hard and how well people work before it frees their time.
    work: What Is There to Fear in a Post-AGI World?
    venue: The Economics of Transformative AI (National Bureau of Economic Research)
    year: 2026
    url: https://betseystevenson.com/papers/what-is-there-to-fear-post-agi.pdf
    retrieved_at: 2026-09-22
    http_status: 200
    content_hash: 5e94aea4deb8545ef877f0e1a8f4cfa88bdee24bf7f33f12852baa0651f3a7e9
  - id: keynes
    who: John Maynard Keynes
    field: the economist whose work founded modern macroeconomics
    finding: Within a century, barring important wars and any large increase in population, technical progress might raise living standards so far that the economic problem would be solved, or at least be within sight of solution; and he suggested people might share out the little work left in three-hour shifts, a fifteen-hour week.
    work: Economic Possibilities for our Grandchildren
    venue: an essay, reprinted in his Essays in Persuasion
    year: 1930
    url: http://www.econ.yale.edu/smith/econ116a/keynes1.pdf
    retrieved_at: 2026-09-22
    http_status: 200
    content_hash: 642c276674fdfb24d025fcd3fa9cafd7892900c9a09f39b5e9a9ef5ea3b97ece
  - id: imas_scarce
    who: Alex Imas
    field: a behavioural economist who leads the economics of advanced AI at Google DeepMind, on leave from Chicago Booth
    finding: As AI makes mass-produced things cheap and people richer, spending and jobs shift towards relational work, where the person doing it is part of the value, such as care, teaching and hospitality.
    work: What will be scarce?
    venue: Ghosts of Electricity
    year: 2026
    url: https://aleximas.substack.com/p/what-will-be-scarce
    retrieved_at: 2026-09-22
    http_status: 200
    content_hash: a0337dd71dbe4881fc1b812aac5a034efd064a26f4e534325722f42cea6b9cf6
  - id: restrepo
    who: Pascual Restrepo
    field: a Yale economist who studies how technology shapes work and pay, and a member of Anthropic's economic advisory council
    finding: Once AI can turn computing power into any kind of work, wages settle at what the computing to replace a person costs and labour's share of income heads towards nothing even as total wages rise; the path is jagged when better algorithms, not more computing, set the pace.
    work: "We Won't Be Missed: Work and Growth in the AGI World"
    venue: The Economics of Transformative AI (National Bureau of Economic Research)
    year: 2026
    url: https://campuspress.yale.edu/pascualrestrepo/files/2025/10/AGI_v4.pdf
    retrieved_at: 2026-09-22
    http_status: 200
    content_hash: c66c833b1ef6a36e76dcce20a81693da0ca0eeedf5cc0f524f474090814c55c8
  - id: athey_scott_morton
    who: Susan Athey and Fiona Scott Morton
    field: economists who study competition and technology; both served as chief economist of the US antitrust division
    finding: When AI is sold by firms with market power, the workers it displaces can lose twice, once when cheap AI cuts their pay and again when its price later rises.
    work: Artificial Intelligence, Competition, and Welfare
    venue: The Economics of Transformative AI (National Bureau of Economic Research)
    year: 2026
    url: https://conference.nber.org/conf_papers/f227494.pdf
    retrieved_at: 2026-09-22
    http_status: 200
    content_hash: 54322bef1c0df886a5fcd8a6982abb8a8d9de99c760b397a7c32b109d75ee12d
  - id: brynjolfsson_hitzig
    who: Erik Brynjolfsson and Zoë Hitzig
    field: Brynjolfsson directs Stanford's Digital Economy Lab; Hitzig studies AI's effects on society, now at the Anthropic Institute and at OpenAI when the chapter was written
    finding: AI can capture the local, unwritten knowledge that once argued for leaving decisions to people on the spot, so decisions centralise, with bigger firms, more concentrated industries and less room for local managers.
    work: AI's Use of Knowledge in Society
    venue: The Economics of Transformative AI (National Bureau of Economic Research)
    year: 2026
    url: https://www.nber.org/books-and-chapters/economics-transformative-ai/ais-use-knowledge-society
    retrieved_at: 2026-09-22
    http_status: 200
    content_hash: de868e5a6179ffd52965ac16b6aa3457b8ba52775fc6322c18b9916fcc99c6de
  - id: hayek
    who: Friedrich Hayek
    field: an economist who studied how prices carry what people know
    finding: The knowledge an economy runs on is scattered among the people on the spot and never exists whole in any one place, so decisions about particular circumstances have to be left to them, with prices telling them what they need to know.
    work: The Use of Knowledge in Society
    venue: American Economic Review
    year: 1945
    url: https://web.archive.org/web/20260920204610id_/https://www.econlib.org/library/Essays/hykKnw.html
    retrieved_at: 2026-09-22
    http_status: 200
    content_hash: 3c4edd88fc40284ea123d1de1474052a41dd1d85571fd4152c701c0ce7975555
  - id: stiglitz_ventura_bolet
    who: Joseph Stiglitz and Màxim Ventura-Bolet
    field: Stiglitz won the Nobel prize for work on markets where one side knows more than the other; Ventura-Bolet is a doctoral student in economics at Columbia
