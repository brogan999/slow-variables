  - id: vc_ai_rollups
    folio: value
    layer: deployment_application
    sublayer: ai_rollups
    title: "A rollup keeps AI's saving only where the firms it buys are paid for results rather than hours; its asset is the customer, and the AI is bought in"
    holders: []
    attribution: site
    mechanism: "A rollup buys many small firms in one trade, such as accounting, property management or home services, and runs them as one. The groups this site files as AI rollups, among them Thrive Holdings, Long Lake, Crete, Dwelly and Titan, and funds such as General Catalyst that have set money aside to build them, plan to run the firms they buy with AI and keep the saving. David Ricardo, an English economist who asked in 1817 why landlords grew rich when bread grew dear, found that the owner of the scarcest input collects a rent: profit above what it takes to keep a business going, earned because something holds rivals off. Ronald Coase, an economist who studied why some work is done inside firms rather than bought, and Oliver Williamson, who studied contracts and found that whoever depends on an asset owned by someone else can be squeezed by its owner, would read a rollup as a bet that owning the customer, the licence and the trust is worth more than selling software to the firm that owns them. This site judges that the bet pays only where the firm's prices do not fall when its costs do."
    case: "This site holds no revenue or margin readings for any AI rollup; the evidence is structural. The site's automatability census, which screens tasks for whether their shape would let them be handed to software, asks of each trade whether its owner would keep the saving, and answers from how the trade sends its bills. Where the bill counts hours, as in most accounting and audit work, cutting the time cuts the bill and the client keeps the saving, which is why the census calls accounting its false positive. Where the fee is set by something other than the firm's own costs, such as a share of a placed candidate's salary, a commission on a booking or a fixed fee set by the payer, the owner can keep it until the price is next reset. The labs are reaching the same buyers another way: OpenAI has set up the OpenAI Deployment Company, which is buying consultancies that put AI to work in large firms, and Anthropic has formed a venture with Blackstone and other investors (reports in this site's records differ on who the others are) to serve companies that private-equity firms (investment firms that buy whole companies) own. This site's entry for General Catalyst's plan rests on a press report not yet confirmed by a second source."
    kill_shot: "AI rollups in trades billed by the hour keeping higher margins for years after buying, without moving clients to fixed fees; or rollups' margins falling back to their trades' ordinary level as rivals that did not merge buy the same AI tools."
    rival: conglomerate_returns
    direction: holding
    commoditising: "This site judges that the AI a rollup uses is bought from the labs and software firms like any other customer's, so it gives no lasting edge over a rival firm that buys the same tools. William Nordhaus, an economist who measured how much of the value of new inventions their makers keep as profit, found that it is a small part; most goes to buyers. In a trade where clients re-bid their contracts, a saving becomes a lower price once rivals match it. The rival view holds that AI lets one centre see and run many unrelated businesses, an edge that would outlast the tools themselves."
    stays_scarce: "This site judges that what stays scarce is the customer relationship, a licence or professional's signature where the trade needs one, and prices that are set by something other than the firm's costs. David Teece, an economist who studied why the firm that invents something often fails to keep the returns, called such inputs complementary assets and found that their owners often keep the profit; the rollup buys them rather than building them. Hamilton Helmer, a strategy consultant who studied why some firms keep earning more than their investors could expect elsewhere, found that a lasting advantage is a benefit behind a barrier; this site finds none proven for any AI rollup yet."
    powers: []
    converts_if: "A rollup turns its running of many firms into a way of working rivals take years to learn, what Helmer calls process power, or grows large enough in one trade and place that its costs per client fall below any single firm's, his scale economies. Both need the saving to outlast the next time clients re-bid, which in trades billed by the hour means moving clients to fixed fees first."
    bottlenecks:
    - applications
    - agents
    - capital
    visible: false
  - id: vc_adopters
    folio: value
    layer: adopters
    title: "Firms that adopt AI keep its saving only where competition and their pricing let them; so far use is spreading at the pace of past technologies and few report a payoff"
    holders: []
    attribution: site
    mechanism: "The adopters are the ordinary firms that buy and use AI, from banks and hospitals to shops and law practices. When AI cuts a firm's costs, the saving can go three ways: to the firm as profit, to its customers as lower prices, or to its workers as higher pay. David Ricardo, an English economist who asked in 1817 why landlords grew rich when bread grew dear, found that the owner of the scarcest input collects a rent: profit above what it takes to keep a business going, earned because something holds rivals off. William Nordhaus, an economist who measured how much of the value of new inventions their makers keep as profit, found that it is a small part and that competition passes most of it on as lower prices. This site judges that the same holds one step down: a firm that adopts AI keeps the saving only until its rivals adopt too, unless its prices are set by something other than its costs. For a layer of buyers, the direction word describes the AI they buy: commoditising means that input is getting cheaper and more alike from seller to seller, so its gains pass to the adopters, unless competition among them passes the gains on again to their own customers."
    case: "Use is spreading, but slowly and unevenly. The Census Bureau's survey of American businesses finds [fact:firms_using_ai] of firms using AI in their work. This site sets the normal range for that reading at the pace at which personal computers and online selling spread through firms, and the reading sits inside it. Ramp, a company that handles businesses' card spending and whose customers lean towards technology, puts the median (the middle firm's figure when all are ranked) AI spending per employee at [fact:ramp_spend], against [fact:ramp_spend_year_ago] a year before. Payoffs are hard to find so far: in a survey of executives published in early 2026, most said AI had made no measurable difference to their own firm, and in another survey of large firms most AI pilots (trial projects) built into their systems showed no measurable effect on profit. Studies of single jobs find real but modest gains, as in one study of customer-support staff using an AI assistant. Many workers in the jobs most exposed to AI (those whose tasks AI can most readily do, on researchers' measures) do not yet use it weekly, on the research this site follows. This site's automatability census asks, trade by trade, whether the owner would keep a saving, and finds the answer turns on how the trade sends its bills: by the hour, and the client keeps it; by a fee set elsewhere, and the firm can."
    kill_shot: "Firms that adopt AI earning higher profits than rivals that do not for years after the tools became widely available, in trades where prices are set by competition; or the share of firms reporting a measurable payoff jumping as use spreads."
    rival: invisible
    direction: commoditising
    commoditising: "This site judges that AI itself is becoming a commodity to the adopting firm: the same tools are sold to it and to its rivals, and their price keeps falling. David Teece, an economist who studied why the firm that invents something often fails to keep the returns, found that generic inputs anyone can buy earn only an ordinary return; on his account a firm's advantage from AI lasts only as long as its rivals are slower to adopt it."
    stays_scarce: "This site judges that what stays scarce, for the adopter, is the skill to rebuild its work around AI rather than add AI to old work, and its own records of how that work is done. Hamilton Helmer, a strategy consultant who studied why some firms keep earning more than their investors could expect elsewhere, found that a lasting advantage is a benefit behind a barrier; process power, a way of working that takes rivals years to learn, is the one that could fit an early adopter, but this site cannot yet see it in any reading."
    powers: []
    converts_if: "Early adopters rebuild their operations around AI in ways rivals take years to copy, process power in Helmer's sense; or they hold prices that are set by something other than their own costs, such as a share of what the client spends or a fee a regulator sets, so the saving stays with them. Ronald Coase, an economist who studied why some work is done inside firms rather than bought, would add that cheaper checking and contracting could also move work out of firms to AI-run suppliers, handing the saving to whoever runs them."
    bottlenecks:
    - applications
    - deployment_platforms
    - evaluations
    visible: false
  - id: vc_labour_consumers
    folio: value
    layer: labour_consumers
    title: "So far users keep most of AI's value; workers' pay and jobs show no broad break, except for the young in the most exposed jobs, though some labour readings are moving"
    holders: []
    attribution: site
    mechanism: "This layer is people: the workers whose tasks AI can do and the consumers who use it. Consumer surplus is the gap between what people would pay for something and what they are charged, the value they keep. Labour's share of income is the part of what businesses earn that goes to pay rather than profit. David Ricardo, an English economist who asked in 1817 why landlords grew rich when bread grew dear, found that the owner of the scarcest input collects a rent: profit above what it takes to keep a business going, earned because something holds rivals off. William Nordhaus, an economist who measured how much of the value of new inventions their makers keep as profit, found that it is a small part and that users keep most. Pascual Restrepo, an economist who models how automation changes wages, argues that once machines can do any task, labour's share of income falls towards nothing even as total wages rise. This site judges that for now consumers are Nordhaus's winners, and that workers are paid in wages only as long as their time stays a scarce input. For a layer of people, the direction word describes the split of AI's gains: holding means the split has not yet moved against them, with users keeping most of the value and workers' pay and jobs showing no broad break."
    case: "On the consumer side, Stanford's Digital Economy Lab estimated what American users would have to be paid to give up generative AI (AI that writes text or makes images on request), and its total rose sharply between the middle of 2025 and early 2026. On the labour side, the readings are mixed and early. The jobs most exposed to AI are those whose tasks AI can most readily do, on researchers' measures. In those jobs, employment of workers in their early twenties has moved [fact:junior_gap] against older workers since late 2022, against [fact:junior_gap_control] in the least exposed jobs (a minus sign marks the young falling behind), in payroll records that move with anything that treats young and old differently. Revelio Labs, a firm that tracks jobs through online career profiles, finds employment in the most exposed jobs falling behind the least exposed since before ChatGPT's launch, across all ages, with the gap widening in its latest edition; this site reads that as emerging, not a break, and notes that such profiles over-represent office workers. Labour's share of business income changed by [fact:labour_share_yoy] over the latest year (a minus sign marks a fall), which this site also reads as emerging, not a break: the share fell as fast in 2021 to 2023, after the inflation shock, and the latest fall is about as steep as those. The other labour trackers this site follows showed no break it could put down to AI as of the middle of 2026, and a Danish study found chatbots had no measurable effect on earnings or hours in exposed jobs two years in. Jobs in private education and health services and in leisure and hospitality, which stand in for work where the person is part of what is bought, make up [fact:relational_share_now] of American payroll jobs, against [fact:relational_share_year_ago] a year before."
    kill_shot: "AI firms' profits growing as fast as the value users say they get; or labour's share of income falling steeply with employment in exposed jobs, across ages, falling well behind the rest while output rises."
    rival: jagged_wages
    direction: holding
    commoditising: "This site judges that AI's answers are becoming a commodity to the people who use them, free or cheap and offered by many firms, which is why users keep most of their value. Nordhaus's finding is the account of it: competition and copying pass an invention's value to its users as lower prices and better products. For workers, the tasks AI can already do, such as drafting, summarising and routine coding, earn less as the machine's price falls."
    stays_scarce: "This site judges that what stays scarce is work where the person is part of what is bought (care, teaching, hospitality), work someone must answer for, and the skill to direct and check AI across many tasks. Hamilton Helmer, a strategy consultant who studied why some firms keep earning more than their investors could expect elsewhere, named the lasting advantages of firms, not people, so none of his powers applies here; the question is only whether workers' time stays scarce enough to be paid for."
    powers: []
    converts_if: "Consumers keep their share only while AI firms compete; a few firms coming to own the assistants people rely on could let them raise prices and take back part of the surplus. Susan Athey and Fiona Scott Morton, economists who study competition, find that when AI is sold by firms with market power, the workers it displaces can lose twice: once when cheap AI cuts their pay, and again when its price later rises. Workers gain a durable share if AI makes their time more valuable than it makes it replaceable, which is what the rise or fall of relational jobs and of pay in exposed jobs would show."
    bottlenecks:
    - applications
    - agents
    visible: false
  # The firm (/firm): positions argued on that page, seated there by seed/firm.yaml; none is shown under an outlook folio.
  - id: boundary_holds
    folio: reorganisation
    title: Cheap agents move the firm's boundary; they do not remove it
    holders: [shahidi_etal, hadfield_koh, larson_coasean]
    attribution: author
    mechanism: "Agents cut the cost of finding, bargaining and contracting, and they cut the cost of managing as well, so both sides of Coase's comparison fall [cite:coase]. The authors who named the Coasean singularity put a question mark on it themselves and list the new frictions agents bring [cite:shahidi_etal]."
    case: "None of the writers this page read argues that firms vanish, and [fact:firms_using_ai] of American firms say they use AI at all, so any change in the size of firms lies ahead of the readings."
    kill_shot: Firms in the industries most exposed to AI shrinking sharply as work moves to independent contractors and their agents.
    rival: firms_dissolve
    visible: false
  - id: firms_dissolve
    folio: reorganisation
    title: With dealing nearly free, most work is bought in and firms shrink towards nothing
    holders: []
    attribution: site
    mechanism: If a firm exists only because dealing with outsiders is costly, then agents that deal for almost nothing leave little reason to employ anyone. This is the popular reading of the Coasean singularity; no writer this page read holds it as stated.
    case: This site holds no reading that favours it.
    kill_shot: Firms in exposed industries keeping or growing their size as agents spread.
    rival: boundary_holds
    visible: false
  - id: liability_owns
    folio: adoption
    title: Whoever must answer for the work ends up owning the operation
    holders: [grossman_hart, hadfield_koh, hobart_sued, larson_do_things]
    attribution: extension
    mechanism: "An instruction to an agent cannot cover every case [cite:hadfield_koh], so someone must decide in the cases it missed and pay when the work is wrong. Where a contract cannot be completed, ownership settles who decides [cite:grossman_hart]; so the party that bears the loss wants to own the operation, and a seller with nothing to lose is a poor party to buy from [cite:hobart_sued]. None of these writers makes the whole argument; this site joins them."
    case: "Buyers built around AI bought [fact:rollup_service_deals] firms that sell services in the past year, against [fact:rollup_service_deals_year_ago] the year before, and insurers have moved [fact:insurer_ledger] times in a year to write AI's mistakes out of their standard policies. Neither reading shows that owning pays."
    kill_shot: Sellers that own no operation and hold no licence carrying the liability for consequential AI work by contract and insurance, at scale.
    rival: liability_contracted
    visible: false
  - id: liability_contracted
    folio: adoption
    title: Insurance and contract carry the liability, so nobody needs to own the operation
    holders: []
    attribution: site
    mechanism: If insurers learn to price an agent's mistakes, a software seller can buy cover and warrant its work, as contractors do, and the buyer need not care who owns what.
    case: The forecasts board on this site, a model's judgement, leans this way; it expects insurers to sell cover written for AI and doubts that AI's work will mostly be bought through firms that can be sued.
    kill_shot: Insurers going on writing AI out of standard cover while cover written for it stays small.
    rival: liability_owns
    visible: false
  - id: rent_by_default
    folio: value
    title: Most firms should rent intelligence and own something else
    holders: [larson_router, garicano_theses]
    attribution: author
    mechanism: "The best model's lead over open ones is short, so a firm that owns its intelligence owns a wasting asset; and most firms see nothing in their own work that others do not see, so a system that learns from many firms beats one that learns from one [cite:larson_router]. What holds most organisations back is workflow, authority and data, not intelligence [cite:garicano_theses]."
    case: "Open models trail the best closed ones by [fact:open_lag], and developers' routed tokens are spread across many labs."
    kill_shot: Firms that train and run their own models pulling ahead of rivals that rent, in trades where no firm senses anything the others cannot.
    rival: own_your_intelligence
    visible: false
  - id: own_your_intelligence
    folio: value
    title: A firm that rents its thinking teaches its supplier its business
    holders: [garicano_holdup]
    attribution: extension
    mechanism: "A supplier of rented intelligence sees how its customer works, can raise its price once the customer's work depends on it, and can learn enough to compete [cite:garicano_holdup]. Garicano and Saa-Requejo answer by renting the model while owning the rules and records above it and keeping a second supplier. This site carries their warning further, to the case for owning the model itself."
    case: The labs have been buying firms in the layers above them, their own customers' trades among them.
    kill_shot: Firms moving freely between suppliers of models at no loss, and no supplier entering its customers' trades.
    rival: rent_by_default
    visible: false
  # The shape of the firm (/firm, folio seven), 5 Oct 2026.
  - id: pyramid_bottom_up
    folio: reorganisation
    title: AI empties the pyramid from the bottom
    holders: [drago_laine_pyramid]
    attribution: author
    mechanism: "Entry-level work is the most routine and the cheapest to hand to a model, so a firm first stops hiring at the bottom, then loses its juniors, then its managers as there are fewer people to manage, and last its executives [cite:drago_laine_pyramid]. Its authors give no dates and call the last stage their most speculative."
    case: "Workers in their early twenties have fallen behind in the jobs most exposed to AI, through less hiring [cite:canaries]. Economists at Google reply that hiring in those jobs turned down before chatbots existed [cite:iscenko_curto_millet]."
    kill_shot: Firms that adopt AI removing layers of management while they go on hiring at entry level.
    rival: middle_thins
    visible: false
  - id: middle_thins
    folio: reorganisation
    title: The middle goes first, and the firm flattens
    holders: [ewens_giroud, dorsey_botha]
    attribution: author
    mechanism: "Much of a manager's work is passing information up and instructions down. When a model can carry both, a firm needs fewer layers between the people who do the work and the people who answer for it [cite:dorsey_botha]."
    case: "A count of layers at listed American firms finds them flattening after they adopt AI [cite:ewens_giroud]; its abstract does not say which layers go or that AI is the cause."
    kill_shot: Firms that adopt AI keeping their layers of management while their entry-level ranks shrink.
    rival: pyramid_bottom_up
    visible: false
  - id: accountable_top
    folio: reorganisation
    title: A firm keeps people where someone has to answer
    holders: [garicano_task, shin_sucher_middle]
    attribution: extension
    mechanism: "A job is a bundle of tasks, and where tasks conflict someone has to hold the right to decide and bear the result [cite:garicano_task]. Checking a model's work falls to the people in the middle [cite:shin_sucher_middle]. This site carries both further: the layers that stay are the ones that answer, sign or check, whatever their rank."
    case: "On this site's census, managers and lawyers are the kinds of job with the least payroll passing its hand-over screen. The census is a screen scored by AI models and has no field for seniority."
    kill_shot: Firms running consequential work in lawful trades with no person who decides or answers for it.
    rival: no_one_inside
    visible: false
  - id: no_one_inside
    folio: reorganisation
    title: A firm needs no people at all
    holders: [bayern_entities, altman_one_person]
    attribution: extension
    mechanism: "Company law already allows an entity that follows a program and has no human members [cite:bayern_entities], and the head of one lab expects a company of a single person to reach a very large valuation [cite:altman_one_person]. Neither says such firms will be common; this site states the strong form so it can be tested."
    case: "This site holds no count of firms without employees. A law professor who accepts that they can be formed expects them to be used first for crime [cite:lopucki_entities]."
    kill_shot: Firms with no employees staying rare and marginal while models go on improving.
    rival: accountable_top
    visible: false
claims:
  # A claim with a `stage` says its map row binds there; a claim about what happens on a row, such as who gains or
  # loses, names the row without a stage, so the map lists it under the row and marks no cell.
  # I · capability
  - id: rli_reached
    position: compounding
    text: As the scenario is written, AI completes most real, paid freelance projects end to end by the end of 2027.
    test: {fact: rli_record, gt: 0.5}
    due: 2027-12-31
    grace_days: 90
    falsifier: No model completing most of the Remote Labor Index's projects by the end of 2027.
    expect_state: untestable
  - id: horizon_fast
    position: compounding
    text: The length of the software tasks AI can finish keeps doubling at least as fast as the scenario assumes, every [test:horizon_fast] or less.
    test: {fact: horizon_doubling, lte: 122}
    rival_test: {fact: horizon_doubling, lte: 122}
    falsifier: The doubling time lengthening beyond what the scenario assumes.
    expect_state: both
  - id: frontier_uneven
    position: slowest_task
    text: Whole projects stay far behind single skills, with the best score on real freelance projects below [test:frontier_uneven].
    test: {fact: rli_record, lt: 0.5}
    rival_test: {fact: rli_record, lt: 0.5}
    rival_until: 2027-12-31
    grace_days: 90
    row: family_8
    stage: methods
    falsifier: The best model completing most of the Remote Labor Index's projects.
    expect_state: both
  - id: reliability_lags
    position: not_reliability
    text: The agents Princeton's tracker tests grow more dependable far more slowly than they grow more accurate.
    test: {fact: hal_reliability_trend, lt: hal_accuracy_trend}
    rival_test: {fact: hal_reliability_trend, lt: hal_accuracy_trend}
    row: family_0
    stage: products
    falsifier: Reliability rising as fast as accuracy across the next models the tracker tests.
    expect_state: both
  - id: coverage_sold
    position: coverage_bought
    text: Labs and companies keep paying more for the steps models cannot yet take, even as each new model takes more of them on its own.
    falsifier: What labs and companies pay for practice work and for fitting models falling as the models improve.
  - id: lossy_loop
    position: lossy
    text: AI's help with AI research brings steady gains, not accelerating ones.
    falsifier: Each new model's gains on AI research tasks coming faster than the last's, with nothing lost along the way.

  # II · products
  - id: checking_sold
    position: assurance_layer
    text: Checking AI's work is sold as a category of its own.
    test: {fact: evals_ledger, gte: 1}
    rival_test: {fact: evals_ledger, gte: 1}
    row: verification
    stage: products
    falsifier: No independent category forming, the checks staying inside the labs' and clouds' own platforms.
    expect_state: both
  - id: insurers_exclude
    position: assurance_layer
    text: Insurers write AI's mistakes out of their standard policies, so the cover has to be bought and priced on its own.
    test: {fact: insurer_ledger, gte: 1}
    rival_test: {fact: insurer_ledger, gte: 1}
    row: verification
    stage: early_adoption
    falsifier: Standard policies going on covering AI's mistakes at no extra price.
    expect_state: both
  - id: apps_squeezed
    position: smart_squeeze
    text: Apps that resell the labs' models see their margins shrink as their use grows.
    row: applications
    falsifier: A lab selling to apps below its public prices, or apps' margins holding as their use grows.
  - id: agents_fenced
    position: fences
    text: Large platforms move to keep outside agents off them more often than they let them in.
    row: agents
    stage: early_adoption
    falsifier: Platforms opening to outside agents more often than they block them, counted under one rule for both; this site's hand-kept ledger does not yet sweep both sides that way, so it tests nothing yet.
  - id: data_next
    position: verified_data
    text: Labs spend more each year with the firms that sell practice tasks, graders and expert data.
    row: post_training
    stage: methods
    falsifier: That spending falling once each firm counted a year ago has reported again.
    # Test line from Cai's own falsifier: that spending falling once each firm counted a year ago has reported again.
    test: {fact: data_seller_growth, gt: 0}
    expect_state: holding

  # III · adoption
  - id: firms_normal
    position: frictions
    text: The share of American firms using AI stays within the pace this site calls normal, below [test:firms_normal].
    test: {fact: firms_using_ai, lt: 0.35}
    rival_test: {fact: firms_using_ai, lt: 0.35}
    row: family_1
    stage: early_adoption
    falsifier: The share of firms using AI climbing past that pace.
    expect_state: both
  - id: use_unpriced
    position: invisible
    text: Official output statistics miss most of AI's gains, which come as better quality and saved time that no price records.
    row: measuring_returns
    falsifier: Official statistics capturing AI's gains in quality and saved time as use spreads.
  - id: juniors_behind
    position: junior_first
    text: In the jobs most exposed to AI, workers in their early twenties fall behind workers over fifty [cite:canaries], while in the least exposed jobs they do not.
    test: {fact: junior_gap, lt: junior_gap_control}
    rival_test: {fact: junior_gap_control, lt: 0}
    row: work_and_pay
    falsifier: The same gap opening in the least exposed jobs.
    expect_state: holding
  - id: simple_markets_first
    position: simple_first
    text: Agents take hold first in job search, property and other matching markets.
    falsifier: Agents spreading first in markets where people rarely hire human agents.

  # IV · reorganisation
  - id: no_growth_jump
    position: modest_growth
    text: In no quarter before 2034 does American real output per person stand [test:no_growth_jump] or more above the highest level it had reached a year or more before.
    holders: [moll_imas_bet]
    test: {fact: gdp_pc_over_peak_best, lt: 0.15}
    rival_test: {fact: gdp_pc_over_peak_best, lt: 0.15}
    rival_until: 2033-12-31
    falsifier: A quarter before 2034 that clears the bet's line.
    expect_state: both
  - id: bet_fast_side
    position: fast_growth
    holders: [bet_fast_side]
    text: In some quarter before 2034, output per person stands [test:bet_fast_side] or more above the highest level it had reached a year or more before, which wins the bet's fast side.
    test: {fact: gdp_pc_over_peak_best, gte: 0.15}
    due: 2033-12-31
    falsifier: No qualifying quarter by the time the last one the bet counts is published.
    expect_state: untestable
  - id: hours_rise_first
    position: intensity_first
    text: Work in the jobs most exposed to AI grows more intense before it grows shorter.
    row: work_and_pay
    falsifier: Paid hours in the most exposed work falling before output per worker rises.
  - id: relational_share
    position: relational
    text: Care, teaching, hospitality and other work where the person is part of what is bought take a rising share of spending and jobs as AI spreads.
    row: work_and_pay
    falsifier: That work's share of spending and jobs falling as AI spreads.
    # Test line from Imas's own words: jobs shift towards relational work (the jobs half; spending is not measured).
    test: {fact: relational_share_now, gt: relational_share_year_ago}
    expect_state: holding
  - id: labour_share_falls
    position: jagged_wages
    holders: [restrepo]
    text: Labour's share of income falls as AI takes on more tasks, even as wages rise.
    row: work_and_pay
    falsifier: Labour's share holding while AI does a growing share of tasks.
    # Test line from Restrepo's own words: labour's share of income heads towards nothing even as total wages rise.
    test: {fact: labour_share_yoy, lt: 0}
    expect_state: holding
  - id: firms_centralise
    position: centralises
    text: Firms using AI grow larger and take decisions further from the people on the spot.
    falsifier: Firms getting smaller and more decentralised as they adopt AI.
  - id: visits_fall
    position: referrals_fall
    text: Publishers lose the visits that pay for what they produce.
    row: information
    falsifier: Visits to publishers from search and AI answers rising.

  # V · value
  - id: open_takes_volume
    position: price_holds
    attribution: site
    text: Open models carry most of the tokens routed to OpenRouter's busiest models.
    test: {fact: open_share, gt: 0.5}
    rival_test: {fact: open_share, gt: 0.5}
    falsifier: The closed models' share of those tokens climbing back as the gap to open models closes.
    expect_state: both
  - id: gap_stays_short
    position: commodity
    attribution: site
    text: Open models trail the best closed ones by less than [test:gap_stays_short], a shorter gap than this site calls normal.
    test: {fact: open_lag, lt: 9}
    rival_test: {fact: open_lag, lt: 9}
    falsifier: The best closed models pulling away from open ones by that gap or more.
    expect_state: both
  - id: lock_in
    position: up_the_stack
    text: The labs earn a growing share of their revenue from products and deployments inside their customers' firms rather than from selling access to their models by the token.
    falsifier: The labs' revenue staying mostly in selling access to their models by the token.
  - id: chips_collect
    position: scarce_input_collects
    text: NVIDIA and AMD take more than [test:chips_collect] of the gross profit they share with Microsoft's cloud arm and the estimates for OpenAI and Anthropic.
    test: {fact: chips_gp_share, gt: 0.5}
    rival_test: {fact: chips_gp_share, gt: 0.5}
    row: accelerators
    stage: methods
    falsifier: Their share falling below that line while chips stay short.
    expect_state: both
  - id: capex_ahead
    position: money_runs_out
    text: The biggest cloud and platform companies spend more each year on buildings and equipment than AI earns in revenue.
    test: {fact: capex_to_revenue, gt: 1}
    rival_test: {fact: capex_to_revenue, gt: 1}
    row: capital
    falsifier: AI's revenue overtaking that spending.
    expect_state: both
  - id: chips_stored
    position: build_runs_late
    text: The cloud companies start storing new chips instead of installing them, the sign Cahn watches for that data centres are running late [cite:cahn_2025].
    row: data_centres
    stage: methods
    falsifier: New chips going into service as fast as they arrive.
  - id: few_labs
    position: durable_labs
    text: Only a handful of labs stay at the frontier, because it costs too much capital for more.
    row: pretraining
    falsifier: More than a handful of labs keeping pace with the best models.
    # Test line from Sundheim's own words, "only a handful of labs"; five is this site's reading of a handful.
    test: {fact: frontier_lab_count, lte: 5}
    expect_state: holding
  - id: surplus_to_users
    position: consumers_keep
    text: The people who use AI keep far more of its value than the firms that make it.
    falsifier: AI firms' profits growing as fast as the value their users get.

  - id: field_divergence
    position: slowest_task
    text: Research speeds up far more in software and mathematics than in drug development, materials or physics, where the slowest steps are experiments.
    falsifier: A broad speed-up in the experiment-heavy sciences at the same time as in software.
  - id: data_drives_pretraining
    position: scaling_limits
    holders: [dwarkesh_data]
    text: Better data, more than better model designs, drives how much a model learns from its training, so progress comes to rest on finding new data.
    row: training_data
    stage: methods
    falsifier: Design changes, not data, turning out to carry the gains at the largest scale.
  - id: labs_buy_exits
    position: up_the_stack
    attribution: site
    text: Being bought by a lab or a compute company becomes the usual way out for the start-ups that sell them data and tools.
    test: {fact: lab_deals_now, gt: lab_deals_year_ago}
    falsifier: The yearly count flattening, read only over quarters searched the same way. A later search that turns up deals missed earlier also raises the count, so it is not by itself a sign of more buying.
    expect_state: untestable
  - id: contracts_shift
    position: up_the_stack
    attribution: site
    text: Buyers sign up for AI capacity well ahead of using it, so Microsoft's contracted but undelivered business keeps growing faster than its revenue.
    test: {fact: msft_backlog, gt: msft_backlog_year_ago}
    falsifier: The backlog shrinking against revenue; it is one company's figure and counts contracts of every kind, much of it OpenAI's commitment to Microsoft's cloud.
    expect_state: holding
  - id: own_models
    position: commodity
    holders: [nadella_models]
    text: Every firm ends up with a model of its own, trained on its own work.
    falsifier: Businesses' use of open models, the easiest kind to make one's own, falling further.
  - id: self_hosting
    position: commodity
    attribution: site
    text: Most businesses end up running models on machines they control rather than renting a lab's.
    falsifier: Businesses sticking with rented frontier models even as open models improve.
  - id: training_cheapens
    position: apps_keep
    attribution: extension
    holders: [cai_mythos]
    text: If training a model further on a firm's own work keeps getting cheaper, apps train their own instead of renting the best.
    falsifier: Apps built on open models still paying labs' prices because training their own stays too costly.
  - id: edge_inference
    position: edge
    text: Much of AI's everyday work moves out of distant data centres onto people's own phones and laptops.
    falsifier: Everyday use staying in cloud data centres as capable open models get smaller.
  - id: margins_below_software
    position: smart_squeeze
    attribution: site
    text: Companies selling AI products keep lower gross margins than classic software, because every use costs them the model's price.
    test: {fact: ai_app_margin, lt: 0.7}
    rival_test: {fact: ai_app_margin, gte: 0.7}
    row: applications
    falsifier: AI product margins reaching those of classic software.
    expect_state: holding
  - id: verification_first
    position: assurance_layer
    holders: [hadfield_koh]
    text: The first large failure of a market run by AI agents comes from no one being able to check what an agent did, not from agents lacking skill.
    falsifier: The first large agent failure traced to agents that could not do the work.
  - id: insurers_cover
    position: assurance_layer
    attribution: site
    text: Insurers sell cover written for AI's mistakes, not only exclusions from standard policies.
    falsifier: AI cover staying a niche product that large buyers do not purchase.
  - id: software_jobs_hold
    position: frictions
    holders: [nk_swe]
    text: AI does not wipe out software engineering jobs, and demand for engineers may rise as software gets cheaper to make.
    row: work_and_pay
    falsifier: Software engineering employment falling as AI coding tools spread.
  - id: chips_concentrate
    position: scarce_input_collects
    attribution: site
    text: NVIDIA's lead over other chip makers in sales for data centres keeps widening as AI spending grows.
    falsifier: Rival chip makers taking a growing share of data-centre chip sales while spending rises.
    # Test line from the claim itself (this site's): rivals' share of data-centre chips falling is NVIDIA's lead widening.
    test: {fact: silicon_share_now, lt: silicon_share_year_ago}
    expect_state: failing
  - id: states_buy_in
    position: scarce_input_collects
    attribution: site
    text: Governments take direct stakes in the companies that make chips, power and models.
    falsifier: States staying lenders and buyers rather than owners.
  - id: ai_taxed
    position: jagged_wages
    attribution: extension
    holders: [korinek_lockwood]
    text: As AI takes over paid work, governments move tax from wages towards spending, and later towards AI itself.
    falsifier: Tax systems unchanged as AI does a growing share of the work.
  # Part 16: claims from Sean Cai and The Diff, reworded, credited and linked to the post each came from
  - id: real_work_data
    position: real_work
    text: Training for long work whose results are hard to check, in fields such as biology, security and matters of taste, comes to rest on records of real work inside firms, because tasks staged by contractors stop teaching models.
    row: training_data
    stage: methods
    falsifier: Staged practice tasks going on improving models at long office work.
  - id: labs_by_industry
    position: data_moats
    text: The leading labs may pull apart by industry, each strongest where it has bought the most specialist business records.
    falsifier: The labs staying interchangeable in every industry, with none ahead in a trade because of the data it bought.
  - id: labs_buy_records
    position: data_moats
    attribution: author
    holders: [cai_may26]
    text: Labs buy more of their training data straight from leading app companies and specialists, squeezing the firms that sell general practice environments.
    row: training_data
    falsifier: General environment sellers keeping their share of the labs' data budgets.
  - id: data_split
    position: data_fragments
    text: The market for training data stays split among many specialist sellers rather than gathering around one or two.
    row: training_data
    falsifier: One or two sellers coming to handle most of what the frontier labs buy.
  - id: tuning_converges
    position: firms_train
    text: Leading firms that host models, sell training data or do custom training, such as Baseten, Mercor and Applied Compute, converge on one business, tuning open models for firms and selling them the use.
    falsifier: These firms staying in separate businesses.
  - id: firms_buy_data
    position: firms_train
    attribution: author
    holders: [cai_verifiable]
    text: Firms outside the labs become large buyers of training data and practice tasks, so the labs stop being almost the only customers.
    row: training_data
    falsifier: The labs remaining almost all of the spending on training data and practice tasks.
  - id: field_models_fade
    position: general_wins
    text: Start-ups that build a model for one field fall behind as the labs' general models improve, outside a few regulated niches where data is scarce.
    falsifier: Models built for one field keeping their lead over each new general release.
  - id: compute_cost_binds
    position: cost_binds
    text: With many agents working on a task at once, most valuable office work comes to turn on the cost of computing and the systems around it, not on whether models are good enough.
    row: inference
    falsifier: Valuable office tasks staying out of AI's reach even where computing is cheap.
  - id: deployers_paid
    position: deployers_scarce
    text: Engineers who fit AI into each customer's own work stay scarce, so their pay rises or employers settle for weaker hires.
    row: applications
    stage: early_adoption
    falsifier: These roles becoming easy to fill, and their pay premium fading.
  - id: labs_buy_deployers
    position: deployers_scarce
    attribution: author
    holders: [hobart_nomentum]
    text: Labs keep buying the consultancies that put AI to work inside companies, to get their staff faster than hiring allows.
    falsifier: Labs building these teams by hiring and buying no such firms.
  - id: no_chinese_lead
    position: us_lead
    text: Chinese labs do not take the lead at the frontier while the best chips, the tests that matter and the paying customers stay American.
    falsifier: A Chinese lab's model becoming the best at the frontier.
    # Test line from Cai's own words: Chinese labs will not take the frontier lead.
    test: {fact: china_eci_gap, lt: 0}
    expect_state: holding
  - id: lock_in_fails
    position: lock_fails
    text: Labs' efforts to tie customers down, through exclusive deals and bans on copying their models, eventually fail, and moving between labs stays cheap.
    falsifier: Customers becoming bound to one lab by exclusive deals and bans on copying.
  - id: models_not_utility
    position: models_differ
    text: Models keep differing in efficiency and in the kinds of input they handle, so they do not become an interchangeable utility like electricity.
    falsifier: Buyers treating models as interchangeable and choosing on the price of a token alone.
  - id: compute_no_crash
    position: no_glut
    text: The price of rented computing does not crash the way internet bandwidth did, because physical capacity cannot be multiplied overnight.
    test: {fact: h100_rent_yoy, gt: -0.5}
    falsifier: A sudden glut sending the rent for AI chips down by most of its value within a year.
    expect_state: holding
  - id: link_overshoots
    position: glut_somewhere
    text: Somewhere along the chip supply chain, a part AI has made scarce proves easier to expand than expected, and its price turns.
    falsifier: Every part squeezed by AI's demand staying scarce and rising in price.
  - id: grid_hookups
    position: builders_bind
    attribution: author
    holders: [hobart_lr188]
    text: Data centres arrive faster and with less warning than the grid's planners assume, so getting connected holds back new American sites.
    row: grid
    stage: methods
    falsifier: New sites being connected to the grid as fast as they are built.
  - id: trades_short
    position: builders_bind
    attribution: author
    holders: [hobart_skilled]
    text: Too few electricians, welders and other tradespeople hold back the building of data centres, so the largest technology firms keep paying to train them.
    row: data_centres
    stage: methods
    falsifier: Data-centre projects facing no delays tied to shortages of skilled trades.
  - id: lead_changes
    position: lead_rotates
    text: The lab with the best model keeps changing, because the leader uses its chips to serve its popular model while rivals train the next one.
    falsifier: One lab keeping the best model for several years running.
  - id: models_held_back
    position: held_back
    text: A formal pause looks unlikely; instead the biggest labs, loosely in step, slow the public release of their most powerful models.
    row: family_5
    stage: products
    falsifier: Labs releasing their best models to the public as soon as they are trained.
  - id: through_incumbents
    position: liable_wrappers
    text: Firms increasingly buy AI's work through a party with assets and a licence that can be held liable, such as an established service firm.
    row: verification
    stage: early_adoption
    falsifier: Buyers taking AI's work on long, unpredictable tasks from parties that cannot answer for its mistakes.
  - id: ai_bills_rise
    position: tokens_climb
    text: Firms' spending on AI per employee keeps rising, because what they use grows faster than the price of each unit falls.
    test: {fact: ramp_spend, gt: ramp_spend_year_ago}
    expect_state: holding
    falsifier: Spending on AI per employee levelling off or falling while prices keep dropping.
  - id: tasks_distilled
    position: tokens_climb
    text: Much narrow work AI does is turned into cheap fixed routines, so spending on each such task rises for a while and then stops.
    falsifier: Spending on well-defined tasks staying high after they are solved.
    attribution: author
    holders: [hobart_ghost]
  - id: ai_unpopular
    position: backlash
    text: AI grows more unpopular even as more people use it, giving politicians on both the left and the right reason to campaign against it.
    row: family_3
    stage: adaptation
    falsifier: Public approval of AI rising clearly and politicians campaigning in its favour.
  - id: jobs_become_data
    position: train_replacements
    text: Some jobs move from doing the work to supplying the data that trains AI to do it.
    falsifier: Few occupations showing workers shifting to producing training data.
  - id: chips_finance_buyers
    position: vendor_finance
    text: NVIDIA keeps financing its own customers in return for a share of their income, and uses such deals to gain a say over who gets computing capacity.
    falsifier: NVIDIA's revenue staying almost wholly one-off sales of hardware.
  - id: rent_surplus
    position: shared_bet
    text: The largest technology firms build more computing than they need and rent the spare to rivals, so the industry becomes one shared bet on demand for AI.
    falsifier: The largest firms keeping their computing for their own use and renting none of it out.
  - id: ads_pay
    position: ads_fund
    text: Advertising comes to pay for free AI assistants, because they can spot what people want to buy before search does, though keeping users' trust will be hard.
    falsifier: Ads in assistants driving users away or earning far less per user than ads in search.
  - id: trades_scattered
    position: local_knowledge
    attribution: author
    holders: [hobart_n1]
    text: Law, contracting and other trades scattered by place stay split among many small firms, while the AI tools each trade uses gather around a few vendors.
    falsifier: A handful of labs ending up running, and profiting from, most professional work directly.
  - id: records_gain
    position: records_hold
    text: Coding agents slow new firms' purchases of ready-made software but make the programs that hold a business's core records worth more.
    falsifier: Software that holds a business's records losing customers as fast as other software.
  - id: lab_margins_below
    position: labs_below_software
    text: The labs' margins are pulled down because the staff who deploy their models grow with their customers, which a pure software business avoids.
    falsifier: Labs reporting gross margins at or above classic software's while running large teams inside their customers.
  - id: niches_filled
    position: niches_open
    text: Cheap AI makes many small services worth selling that were never worth paying a person for, and filling these niches is how AI lifts growth.
    falsifier: New businesses in small information niches not rising as AI's costs fall.
  - id: generalists_gain
    position: generalists
    text: The gap in value between versatile workers who manage AI and narrow specialists keeps widening.
    falsifier: Specialists keeping their value over versatile workers.
  - id: lab_owns_services_firm
    position: up_the_stack
    holders: [eilla_lazarov]
    text: A frontier lab launches or majority-owns a professional services firm, under its own brand or at arm's length, by September 2028.
    due: 2028-09-11
    # Not read from OpenAI's deployment company (row ownership.openai_deployment_co.lab_majority_owned.pt): Lazarov wrote
    # on 11 Sep 2026, after that company's launch, that no lab had yet done this. The row stays as a record.
    falsifier: No frontier lab owning a professional services firm, such as a law, accounting or consulting practice, by September 2028. Its author wrote in September 2026 that no lab had yet done so, after OpenAI had launched its deployment company, so that company does not settle it.
  - id: ai_premiums_2032
    position: assurance_layer
    holders: [deloitte_ai_insurance]
    attribution: author
    text: Insurers write several billion dollars a year of cover for AI's failures worldwide by 2032 [cite:deloitte_ai_insurance].
    due: 2032-12-31
    falsifier: AI cover staying a small line that insurers bundle into other policies through 2032.
  - id: firm_size_barbell
    position: barbell
    text: Firms in AI-exposed industries do not all grow bigger by 2029; they consolidate in infrastructure and splinter in applications.
    due: 2029-12-31
    falsifier: Average firm size rising in AI-exposed industries, applications included, by 2029.
  - id: conglomerate_premium
    position: conglomerate_returns
    text: Groups that run many unrelated businesses with AI come to be valued above the sum of their parts.
    falsifier: AI-run groups trading at a discount to the sum of their parts.
  # The firm (/firm): twelve claims added on 5 Oct 2026, each on a position that page seats.
  - id: firms_do_not_dissolve
    position: boundary_holds
    text: Firms in the industries most exposed to AI do not shrink towards nothing as agents cut the cost of dealing.
    falsifier: Average firm size in the most exposed industries falling sharply while it holds elsewhere. This site reads firm size by industry for one year only, so nothing tests it yet.
  - id: asking_leaks
    position: context_costly
    text: Firms keep inside the work that would reveal what they know, and independent agents dealing for firms in open markets stay rare.
    falsifier: Independent agents dealing on firms' behalf at scale in open markets, for work that turns on the firm's own knowledge. Nobody publishes a count of it.
  - id: liability_priced_apart
    position: liability_owns
    text: Insurers go on writing AI's mistakes out of their standard policies, so whoever deploys an agent carries the loss unless it buys separate cover.
    test: {fact: insurer_ledger, gte: 1}
    rival_test: {fact: insurer_ledger, gte: 1}
    falsifier: Standard liability policies covering AI's mistakes at no extra price. The rival view also expects exclusions first, so what would separate the sides is the premiums written for AI cover, which nobody publishes.
    expect_state: both
  - id: operators_bought
    position: liability_owns
    text: Buyers built around AI go on purchasing firms that sell services, more each year than the year before.
    test: {fact: rollup_service_deals, gt: rollup_service_deals_year_ago}
    falsifier: The yearly count of such purchases by the same searched buyers flat or falling. The count is a floor from one search of the larger buyers, and it shows what buyers did, not that owning paid.
    expect_state: holding
  - id: ownership_pays
    position: liability_owns
    text: Service firms bought by owners built around AI earn higher margins afterwards than rivals that only buy the same tools, in trades not billed by the hour.
    falsifier: Such firms' margins falling back to their trades' ordinary level within a few years of purchase. This site holds no margin for any of them.
  - id: lab_runs_operations
    position: up_the_stack
    attribution: site
    text: A frontier lab, or a company it controls, comes to own an ordinary operating business in a licensed trade by the end of 2028.
    due: 2028-12-31
    falsifier: No frontier lab owning an operating business in a licensed trade by the end of 2028. The labs' deal ledger leaves out purchases of businesses that are not AI or technology firms, so no count on this site would see it.
  - id: firms_rent
    position: rent_by_default
    text: Use of models stays spread across several labs and open models, with the concentration of routed tokens among labs below [test:firms_rent], and few firms train or run their own.
    test: {fact: token_hhi, lt: 0.25}
    rival_test: {fact: token_hhi, lt: 0.25}
    falsifier: Use concentrating on one lab's models while open ones fall further behind, or a current survey finding most large firms running their own. The reading is developers' routed tokens, not firms' spending, and the rival speaks of who runs a model, not whose it is, so it accepts the same reading. A router's traffic is all rented, so this reading can show spread among sellers and cannot show renting against owning.
    expect_state: both
  - id: sensing_owns
    position: rent_by_default
    holders: [larson_router]
    text: A model of a firm's own pays only where the firm senses something no one else can; elsewhere a system trained on many firms' results does better.
    falsifier: Systems tuned on a firm's own history beating pooled ones in trades where no firm senses anything scarce. The only evidence so far is its author's own simulation.
  - id: line_not_side
    position: barbell
    text: Firms that adopt AI move routine, recordable decisions to the centre and leave fast-changing and time-critical ones with local units; they do not centralise across the board.
    falsifier: Adopting firms centralising decisions of every kind, the fast-changing included, and doing better than those that leave them local. No series on this site records where decisions are taken.
  - id: edge_floor
    position: edge
    holders: [larson_hayek]
    text: Work that must be decided faster than a message can reach a data centre, or on little power, is run on the spot, whoever holds the knowledge.
    falsifier: Time-critical work such as driving and industrial control moving to distant data centres as networks improve.
  - id: check_binds
    position: checking_order
    attribution: site
    text: More knowledge work is held back by the lack of a check than by what the work requires, so what a firm keeps is the checking and the answering.
    falsifier: A later run of this site's census, under the same rule, finding more payroll passing its screen than waiting on a check without new checks having been built; or models checking their own work as reliably as an outside check does. The census is a screen scored by AI models, not a record of observations, so no nightly test reads it.
  - id: pooled_premium
    position: conglomerate_returns
    holders: [larson_conglomerate]
    text: A group that runs many businesses with AI is valued above the sum of its parts only if it shares what each learns across them; a holding company that keeps them apart is not.
    falsifier: Groups run with AI trading below the sum of their parts whether or not they pool what they learn, or holding companies that keep their businesses apart earning the premium too. No such group is listed with separately valued parts.
# The four places the money can sit, moving up the stack: the migration essay's rule (rent goes to whatever cannot be
# routed around, and moves when that is fixed) applied from the model to the customer. Each place names the sub-layers
# that would be paid there, the readings that show it, and two tests of one fact and one operator: money arriving,
# and money moving on. Under installation the chip makers are paid first whichever place the money settles in.
  # The shape of the firm (/firm, folio seven): three claims added on 5 Oct 2026.
  - id: managers_last
    position: pyramid_bottom_up
    attribution: site
    text: Through 2028, firms that adopt AI shrink their entry-level and junior ranks before they remove layers of management.
    due: 2028-12-31
    falsifier: Adopting firms removing layers of management while entry-level hiring holds up. Its authors give no dates, so the date is this site's; no series here records layers or hiring by rank.
  - id: layers_fall
    position: middle_thins
    text: Firms that adopt AI end up with fewer layers between the people who do the work and the chief executive.
    falsifier: A later count finding the layers of adopting firms unchanged or rising, or the flattening explained by something other than AI. This site holds no count of layers.
  - id: someone_answers
    position: accountable_top
    attribution: site
    text: Through 2030, firms with no employees stay rare in lawful, regulated trades, because someone has to decide in the cases no instruction covers and answer for the result.
    due: 2030-12-31
    falsifier: Firms with no employees doing consequential work at scale in regulated trades by the end of 2030. Nobody publishes a count of them.
shifts:
  grounded_in: [up_the_stack, distribution_wins]
  places:
    - id: model
      name: The model
      scarce: Only a handful of labs can build the best models, and buyers pay for the gap to the next best.
      squeezed_by: Open models closing the gap, and cheaper models good enough for most work.
      sublayers: [frontier_labs, neolabs, open_weight_labs]
      readings:
        - {fact: labs_gp_share, label: "the labs' share of the stack's gross profit, estimated"}
        - {fact: open_lag, label: how far open models trail the best closed one}
        - {fact: open_premium, label: what closed models charge over open ones at the same skill}
        - {fact: open_share, label: open models' share of routed tokens}
      arriving: {fact: labs_gp_share, gt: labs_gp_share_year_ago, says: the labs' share of gross profit is above a year before}
      leaving: {fact: open_lag, lt: 3, says: open models trail the best closed one by under three months}
      claims: [gap_stays_short]
    - id: running
      name: Running it
      scarce: Serving models quickly, cheaply and reliably, at the scale buyers need.
      squeezed_by: Routers and open serving software that make one provider as good as another.
      sublayers: [inference_serving, routing_gateways, agent_infra]
      readings:
        - {fact: inference_rr_growth, label: "inference firms' run-rate growth, median"}
        - {fact: lab_rr_growth, label: "the labs' run-rate growth, median"}
        - {fact: h100_rent_yoy, label: "rent for NVIDIA's most-rented AI chip, against a year before"}
      arriving: {fact: inference_rr_growth, gt: lab_rr_growth, says: inference firms' run-rates grow faster than the labs'}
      claims: [compute_no_crash]
    - id: knowledge
      name: The firm's own knowledge
      scarce: A firm's own records, permissions and ways of working, which no model can learn from the public web.
      squeezed_by: Labs buying or copying the firms that hold it, and general assistants that pick up a workflow from a few connectors.
      sublayers: [vertical_ai, coding_agents, deployment_services, evals]
      readings:
        - {fact: app_rr_growth, label: "application firms' run-rate growth, median"}
        - {fact: lab_deals_now, label: companies above the model layer bought by labs and compute firms in a year}
        - {fact: agentforce_arr, label: "Salesforce's yearly revenue from its AI agents, including Slackbot (company-stated, a floor)"}
      arriving: {fact: app_rr_growth, gt: lab_rr_growth, says: application firms' run-rates grow faster than the labs'}
      leaving: {fact: lab_deals_now, gt: lab_deals_year_ago, says: labs and compute firms buy more of the layers above them than a year before}
    - id: front_door
      name: The front door
      scarce: The assistant a customer opens first, which chooses the suppliers behind it.
      squeezed_by: Customers switching assistants easily, and operating systems or browsers that open first.
      sublayers: [consumer_ai]
      readings:
        - {fact: front_door_hhi, label: "concentration of the visits chatbots send to websites (StatCounter, CC BY-SA)"}
        - {fact: gemini_app_users, label: "people using Google's Gemini app in a month (company-stated)"}
        - {fact: copilot_seats, label: "paid seats for Copilot inside Microsoft's office tools (company-stated, a floor)"}
      arriving: {fact: front_door_hhi, gte: 0.25, says: one or two assistants send most of the visits}
      leaving: {fact: front_door_hhi, lt: front_door_hhi_year_ago, says: that concentration is below a year before}
  foot_claims: [chips_collect]

scenarios:
  progress:
    - {id: stall_capability, label: Capability stalls}
    - {id: stall_money, label: The money stalls}
    - {id: steady, label: Steady progress}
    - {id: automated_research, label: AI automates research}
    - {id: loss_of_control, label: Control slips away}
  rules:
    - {id: unclear, label: The rules stay unsettled}
    - {id: priced, label: Courts and insurers price the risk}
    - {id: licensed, label: Oversight comes first}
  cells:
    - progress: stall_capability
      rules: unclear
      argued_by: [scaling_myths]
      says: Scaling runs out before whole jobs are in reach, and the gains come from spreading what already works.
      signposts: [frontier_uneven, reliability_lags]
      binds_next: [family_2]
    - progress: stall_money
      rules: unclear
      argued_by: [cahn_2024, covello]
      says: The spending outruns the revenue it needs, and the losses fall on the investors who paid for it.
      signposts: [capex_ahead]
      binds_next: [capital]
    - progress: steady
      rules: unclear
      argued_by: [moll_imas, normal_tech, jones_tonetti]
      says: Capability keeps improving, firms adopt it at the pace of past technologies, and growth rises without exploding.
      signposts: [no_growth_jump, firms_normal]
      binds_next: [family_2, family_3]
    - progress: steady
      rules: priced
      argued_by: [hadfield_koh, normal_tech]
      says: Clear rules settle who pays for AI's mistakes, and adoption speeds up where they do.
      signposts: [insurers_exclude, checking_sold]
      binds_next: [verification]
    - progress: steady
      rules: licensed
      argued_by: [hadfield_koh]
      says: Agents and the firms behind them must register before they deal; licensing who may build the models, Kapoor and Narayanan argue, would not work.
      signposts: []
      binds_next: [family_3]
    - progress: automated_research
      rules: unclear
      argued_by: [ai_2027, restrepo, macaskill_moorhouse]
      says: Each model speeds up the research behind the next and output breaks away; in Restrepo's model, wages then settle at the cost of the computing that could replace a person.
      signposts: [rli_reached, horizon_fast, bet_fast_side]
      binds_next: [energy, data_centres, accelerators]
    - progress: automated_research
      rules: licensed
      argued_by: [ai_2027]
      says: In the story's slower ending, a committee of the leading lab and the government slows the race until the systems can be checked.
      signposts: [rli_reached]
      binds_next: [family_5]
    - progress: loss_of_control
      rules: unclear
      argued_by: [kulveit_gradual, critch_2024]
      says: Either a race produces systems nobody can check, or people are slowly made irrelevant as AI takes over the work, thought and choices that gave them a say.
      signposts: []
      binds_next: []
  anchors:
    - {source: eo_14365, date: 2025-12-11, text: The American president ordered moves against state AI laws and called for a light national standard.}
    - {source: iso_exclusions, date: 2026-01, text: Standard exclusions for harm caused by generative AI became available for insurers to attach to general liability policies.}
    - {source: colorado_sb26_189, date: 2026-05-14, text: "Colorado replaced its AI Act with a narrower law on automated decisions, which applies from January 2027."}
    - {source: eu_2026_1744, date: 2026-07-27, text: "The European Union's changes to its AI Act came into force, putting off its rules for high-risk AI until December 2027 and August 2028."}

agree:
  - id: tokens_thin
    text: Selling access to a model that others can match, token by token, is a thin business.
    holders: [hobart_pacing, nk_up_the_stack]
    dissent: [sundheim]
    dissent_text: Sundheim, whose firm holds stakes in two of the labs, says customers mostly stay with a lab even when they could switch, and margins are high.
  - id: someone_answers
    text: Someone has to answer for what an AI agent does before it can be trusted with work that matters.
    holders: [hadfield_koh, normal_tech]
    dissent: []
  - id: checking_costs
    text: Checking AI's work becomes a costly task of its own.
    holders: [jones_b, cai_data]
    dissent: []
  - id: use_first
    text: People use AI well before firms reorganise around it.
    holders: [normal_tech, brs_jcurve]
    dissent: [ai_2027]
    dissent_text: In AI 2027's story the economy is remade within a few years once AI can do the work of the best researchers.
