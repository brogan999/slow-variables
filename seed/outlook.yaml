  - id: board_pycia
    who: Simon Board and Marek Pycia
    field: economic theorists who study bargaining and how sellers set prices over time
    finding: A monopolist selling a durable good is normally forced down by buyers who wait for discounts; when every buyer can take another option instead, the only equilibrium is the seller charging the monopoly price every period, a price set against what buyers can get elsewhere.
    work: Outside Options and the Failure of the Coase Conjecture
    venue: American Economic Review
    year: 2014
    url: https://www.aeaweb.org/articles?id=10.1257/aer.104.2.656
    retrieved_at: 2026-09-22
    http_status: 200
    content_hash: 1ce9fb79ac09548ed216d369cc2614388bddf283e17c5390d7a10de732a78fa1
    quote: the seller charges a constant price in every period equal to the monopoly price
  - id: nk_up_the_stack
    who: Arvind Narayanan and Akash Kapur
    field: Narayanan is a Princeton computer scientist; Kapur, a senior fellow at New America, studies how AI is governed
    finding: Selling access to frontier models tends towards a commodity business, where competition likely pushes prices to cost, so the labs' likeliest path to lasting profit is moving up the stack into products and deployments built into their customers' work, which escapes the trap at the price of lock-in. The builders of past infrastructure rarely kept the value, with cloud computing and the leading chip foundry as partial exceptions.
    work: "Up the Stack: How AI's Escape From the Commodity Trap Risks Enterprise Lock-in"
