    holders: [hobart_neocloud]
    attribution: author
    mechanism: The largest technology firms build more computing than they need and rent the spare to rivals, turning each firm's bet into one bet, shared across the industry, that demand for AI keeps growing.
    case: Labs and clouds already buy capacity from one another in every direction.
    kill_shot: The largest firms keeping their computing for their own use and renting none of it out.
    rival: money_runs_out
    visible: false
  - id: ads_fund
    folio: value
    title: Advertising pays for free AI
    holders: [hobart_rocketship, hobart_peanut]
    attribution: author
    mechanism: Assistants can see what people want to buy earlier than search does, so advertisers will pay to reach them, and ads fund the free versions.
    case: Search shows how much advertisers pay for a clear sign of what someone wants; assistants can see that want earlier.
    kill_shot: Ads in assistants driving users away or earning far less per user than ads in search.
