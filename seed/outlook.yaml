  firms_using_ai: {indicator: btos_firm_use, max_age_days: 60, expect: {lt: 0.35}}
  paid_share: {metric: chatgpt_paid_share, max_age_days: 400}
  junior_gap: {metric: canaries_junior_senior_gap, dims: {quintile: most_exposed}, max_age_days: 200}
  junior_gap_control: {metric: canaries_junior_senior_gap, dims: {quintile: least_exposed}, max_age_days: 200}
  gdp_pc_over_peak: {metric: real_gdp_per_capita_over_peak, max_age_days: 200, expect: {gte: 0}}
  gdp_pc_over_peak_best: {metric: real_gdp_per_capita_over_peak, pick: max, since: 2026-04-01}
  gdp_pc_yoy: {metric: real_gdp_per_capita_yoy, max_age_days: 200, expect: {gt: 0}}
