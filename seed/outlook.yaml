    title: The software that keeps the records gains
    holders: [hobart_rnd]
    attribution: author
    mechanism: Coding agents let firms build their own tools instead of buying them, but the programs that hold a business's core records are hard to replace and every new tool needs them.
    case: Firms build more of their own software with coding agents while still running on the same systems of record.
