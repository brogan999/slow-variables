    content_hash: 733a540fc0a78a77a961dd2d8772f7c8ca322e01740b8ea46caedda620417b38
positions:
  # I · capability
  - id: compounding
    folio: capability
    title: AI speeds up its own research, and the gains compound
    holders: [ai_2027]
    attribution: author
    mechanism: Each model helps write the code and run the experiments that build the next one, so progress feeds on itself.
    case: AI coding agents improved faster in late 2025 and early 2026 than even these forecasters expected, and they brought their dates forward again [cite:ai_futures_update], though their own check finds events running a little slower than the story [cite:ai_futures_q25].
    kill_shot: Whole jobs staying far out of reach while single skills race ahead, which is the pattern a pace set by the slowest step predicts.
    rival: slowest_task
    visible: true
  - id: slowest_task
    folio: capability
    title: Research moves at the pace of its slowest step
    holders: [jones_b]
    attribution: author
    mechanism: Superhuman speed on some steps leaves the others, still slow, setting the pace of the whole.
    case: The best models finish ever longer software tasks, yet only a small part of the whole paid projects they are set.
    kill_shot: A huge speed-up on a single step making overall progress explode, the test Jones himself proposes, since that would show the bottlenecks to be weak.
    rival: compounding
    visible: true
  - id: not_reliability
    folio: capability
    title: Getting a task right is not getting it right every time
    holders: [agent_reliability]
    attribution: author
    mechanism: Agents must be dependable, not just accurate, before they are given work that matters, and dependability has improved far more slowly than accuracy.
    case: The same agents that solve more tasks each year still give different answers when the same task is run again.
    kill_shot: Reliability rising as fast as accuracy.
    rival: compounding
    visible: true
  - id: coverage_bought
    folio: capability
    title: The missing steps can be bought
    holders: [jones_b]
    attribution: extension
    mechanism: If progress moves at the pace of the steps AI cannot take [cite:jones_b], the scarce thing is the next step a model can be taught, and that can be paid for, with practice tasks (exercises a model is scored on while it trains) and graders (programs that do the scoring) sold to the labs, and with the work of fitting a model to the steps a firm's own jobs need.
    case: One firm that sells the labs expert-written practice work, Surge AI, was reported in 2025 to have passed [fact:surge_revenue] in yearly revenue.
    kill_shot: The next model taking the missing steps by itself, so that paying to teach them buys nothing a lab would not soon have anyway.
    rival: compounding
    visible: false
  - id: lossy
    folio: capability
    title: Self-improvement leaks
    holders: [lambert]
    attribution: author
    mechanism: The research AI can automate is narrow, and the judgement of a few top researchers, not more agents, still sets the pace.
    case: AI already helps build AI, yet Lambert sees no fast take-off coming and expects the trend, looked back on, to seem closer to a steady line.
    kill_shot: Each new model's gains on AI research arriving faster than the last's, with nothing lost along the way.
    rival: compounding
    visible: false
  - id: scaling_limits
    folio: capability
    title: Bigger models alone will not get there
    holders: [scaling_myths]
    attribution: author
    mechanism: Scaling laws promise better guessing of the next word, not any particular new ability, and good data is getting ever costlier.
    case: What scaling laws measure is how well a model guesses the next word, not whether it can do a job.
    kill_shot: Size alone producing abilities that no change in method explains.
    rival: compounding
    visible: false

  # II · products
  - id: assurance_layer
    folio: products
    title: Checking AI's work becomes a business of its own
    holders: [hadfield_koh]
    attribution: extension
    mechanism: Someone has to verify what an agent did and answer when it is wrong, and buyers will pay for that. Hadfield and Koh argue for the registration and the accountability; this site carries it to a market.
    case: Gartner, which advises companies on what to buy, has published a guide to the platforms that sell such checking, and since January 2026 insurers have been able to attach optional standard wording that excludes harm from generative AI.
    kill_shot: Checking staying a free feature of the labs' and cloud companies' own platforms.
    rival: bundled
    visible: true
  - id: bundled
    folio: products
    title: Checking stays a free feature of the big platforms
    holders: []
    attribution: site
    mechanism: The labs and cloud companies already test and watch their own models, and can give that away to keep their customers.
    case: A lab that wants firms to trust its agents has every reason to supply the checks itself.
    kill_shot: Independent checkers winning large contracts that the platforms' free tools could have filled.
    rival: assurance_layer
    visible: false
  - id: smart_squeeze
    folio: products
    title: Apps that resell the labs' models get squeezed
    holders: [larson_squeeze]
    attribution: author
    mechanism: An app cannot pay less than the lab charges for its model, nor charge much more than going to the lab directly would cost its customers.
    case: As far as Larson knows, labs sell to apps at the prices they list for everyone, so an app's margin is only what its own additions are worth.
    kill_shot: Labs selling to apps below their public prices.
    rival: apps_keep
    visible: true
  - id: apps_keep
    folio: products
    title: Apps keep their margin through what they build around the model
    holders: []
    attribution: site
    mechanism: Data, workflow and the customer relationship are hard to copy, even when the model underneath is not.
    case: Firms pay for tools that fit their work, not for raw access to a model.
    kill_shot: Apps' margins falling as their customers' use rises.
    rival: smart_squeeze
    visible: false
  - id: fences
    folio: products
    title: Big platforms fence out agents that are not their own
    holders: [hobart_inference, larson_coasean]
    attribution: author
    mechanism: A platform that owns the customer loses that tie if someone else's agent does the shopping, so it pays to keep outside agents out and run its own.
    case: Amazon went to court to keep an AI browser's shopping agent off its site, and later blocked Meta's shopping assistant.
    kill_shot: Platforms opening to outside agents through shared rules and protocols.
    rival: opens
    visible: true
  - id: opens
    folio: products
    title: Platforms let outside agents in, on terms they set
    holders: [shahidi_etal]
    attribution: author
    mechanism: Platforms will set rules for how outside agents may use them, much as websites tell search engines' crawlers what they may read.
    case: Etsy and Walmart have agreed to let shoppers buy through OpenAI's chatbot, Etsy on an open standard for agents to pay.
    kill_shot: Platforms blocking or suing outside agents more often than they sign them up.
    rival: fences
    visible: false
  - id: verified_data
    folio: products
    title: Checked practice work is the next shortage
    holders: [cai_data]
    attribution: author
    mechanism: Teaching models long work whose results are hard to check needs practice tasks and graders that people must build.
    case: Buyers pay for tasks a model can be trained to improve on, and those are scarce.
    kill_shot: Models learning such work from practice they set and grade themselves.
    rival: self_made
    visible: false
  - id: self_made
    folio: products
    title: Models make their own practice
    holders: []
    attribution: site
    mechanism: Where a computer can check the answer, as in mathematics and code, a model can practise without people writing the answers, and the checking can spread from there.
    case: A task whose answer a machine can check can be practised endlessly, at the cost of the computing alone.
    kill_shot: Progress stalling in work a machine cannot grade until people build the graders.
    rival: verified_data
    visible: false

  # III · adoption
  - id: frictions
    folio: adoption
    title: Adoption is slow because the frictions are real
    holders: [normal_tech]
    attribution: author
    mechanism: Firms have to rebuild processes, train people and learn where liability falls before a tool pays, and that takes decades, not years.
    case: The share of American firms using AI has risen at the pace of past technologies, not faster, and OpenAI's chief executive has said the whole industry was too ambitious about timelines [cite:altman_inertia].
    kill_shot: Measured adoption jumping to the pace this site calls fast.
    rival: invisible
    visible: true
  - id: invisible
    folio: adoption
    title: Adoption is not slow; it is hard to see
    holders: [coyle_poquiz]
    attribution: author
    mechanism: Most use of AI is free and its gains come as quality and saved time, which the official statistics do not price.
    case: The biggest AI assistant counts far more weekly users than paying subscribers, so most of its weekly users pay nothing.
    kill_shot: Official statistics capturing AI's gains in quality and saved time as use spreads.
    rival: frictions
    visible: true
  - id: junior_first
    folio: adoption
    title: Junior hiring shows it first
    holders: [canaries]
    attribution: author
    mechanism: A firm that can do a junior's work with AI hires fewer juniors before it lets anyone go.
    case: In the jobs most exposed to AI, young workers have fallen behind older ones; in the least exposed jobs they have not.
    kill_shot: Young workers falling behind in the least exposed jobs as well, which would point to a cause other than AI.
    rival: other_causes
    visible: true
  - id: other_causes
    folio: adoption
    title: Young workers' troubles have causes other than AI
    holders: []
    attribution: site
    mechanism: Interest rates, the hiring boom after the pandemic and its unwinding hit young workers first, whatever AI does.
    case: The study itself describes a pattern rather than proving its cause; the gap survives controls for occupations' exposure to interest-rate increases but narrows once workers' education is taken into account.
    kill_shot: The gap staying confined to the most exposed jobs as those other causes fade.
    rival: junior_first
    visible: false
  - id: simple_first
    folio: adoption
    title: Agents arrive first where wants are simple and agents already work
    holders: [shahidi_etal]
    attribution: author
    mechanism: Handing a task to an agent is easiest where people already hire agents and can say simply what they want.
    case: Selling a house is easier to delegate than buying one, and the first traction is in job search, property and matching.
    kill_shot: Agents spreading first in markets where people rarely hire human agents.
    rival: context_costly
    visible: false
  - id: context_costly
    folio: adoption
    title: Asking reveals what you want, so firms keep work inside
    holders: [larson_coasean]
    attribution: author
    mechanism: When everyone has the same models, what a firm knows about its own needs is its edge, and asking the market for help gives it away.
    case: Larson points to the largest retail platforms shutting out independent shopping agents in favour of their own.
    kill_shot: Independent agents dealing on firms' behalf at scale in open markets.
    rival: simple_first
    visible: false
  - id: checking_order
    folio: adoption
    title: What goes first is set by the cost of checking, not the cost of doing
    holders: [hadfield_koh]
    attribution: extension
    mechanism: A task is handed over when checking the result costs less than doing it. Hadfield and Koh argue about accountability; this site carries the argument to the order of adoption.
    case: Code that comes with tests is handed to AI before contracts that come with none.
    kill_shot: Work that is hard to check being handed over as fast as work that is easy to check.
    rival: frictions
    visible: false

  # IV · reorganisation
  - id: modest_growth
    folio: reorganisation
    title: Growth rises, but does not explode
    holders: [moll_imas, jones_tonetti]
    attribution: author
    mechanism: An explosion would need fast automation across the economy, spending that follows it, demand that absorbs the output, no cyberattacks by or with AI destroying value, and AI that automates research, all at once; and work is a chain of tasks that substitute poorly for one another, so AI that follows the pattern of past automation raises growth only slowly [cite:jones_tonetti].
    case: Moll and Imas expect AI's abilities to keep leaping and still think growth of four to five percent a year, which would itself be historic, is the more reasonable baseline [cite:moll_imas].
    kill_shot: A quarter before 2034 in which output per person clears the bet's line above the highest level it had reached a year or more before.
    rival: fast_growth
    visible: true
  - id: fast_growth
    folio: reorganisation
    title: AI compresses a century of progress into a decade
    holders: [macaskill_moorhouse]
    attribution: author
    mechanism: Once AI's thinking rivals the whole of humanity's, it keeps growing far faster than the number of people, research speeds up enormously and industry follows, so output can break away within a decade of AI matching human researchers.
    case: MacAskill and three others have bet, at odds of four to one against them, on growth exploding before 2034 [cite:bet_fast_side], and in Korinek and colleagues' model a fast path looks like the others until about 2027 [cite:korinek_etal], so slow readings now do not count against it.
    kill_shot: AI's research effort rivalling humanity's without technological progress speeding up.
    rival: modest_growth
    visible: true
  - id: intensity_first
    folio: reorganisation
    title: Work gets more intense before it frees time
    holders: [stevenson]
    attribution: author
    mechanism: A tool that makes work easier first raises what people are expected to produce, as washing machines raised the standard of a clean house.
    case: Appliances in the middle of the twentieth century raised standards of cleanliness long before they shortened the hours spent on housework.
    kill_shot: Paid hours in the most exposed work falling before output rises.
    rival: time_first
    visible: true
  - id: time_first
    folio: reorganisation
    title: Machines buy people time
    holders: [keynes]
    attribution: extension
    mechanism: As output per hour rises, people take part of the gain as leisure and share out the work that remains. Keynes argued it of machines in general in 1930; this site carries it to AI.
    case: If AI multiplies what an hour of work produces, the same needs can be met with fewer hours.
    kill_shot: Hours in the most exposed work rising as AI spreads.
    rival: intensity_first
    visible: false
  - id: relational
    folio: reorganisation
    title: Work built on people dealing with people gains
    holders: [imas_scarce]
    attribution: author
    mechanism: As machines make other things cheap, spending moves to work where the person is part of what is bought.
    case: Richer households spend much more on care, teaching and hospitality.
    kill_shot: That work's share of spending and jobs falling as AI spreads.
    rival: jagged_wages
    visible: false
  - id: jagged_wages
    folio: reorganisation
    title: Wages follow a jagged path, and the displaced can lose again
    holders: [restrepo, athey_scott_morton]
    attribution: extension
    mechanism: Where better algorithms set the pace, wages jump and fall as tasks are automated [cite:restrepo]; where AI is sold with market power, Athey and Scott Morton add, workers can pay again when its price rises [cite:athey_scott_morton].
    case: In Restrepo's model labour's share of income heads towards nothing once computing can do any work, even as total wages rise.
    kill_shot: Wages keeping pace with output as AI takes on more tasks.
    rival: relational
    visible: false
  - id: centralises
    folio: reorganisation
    title: Decisions move to the centre
    holders: [brynjolfsson_hitzig]
    attribution: author
    mechanism: AI captures the local knowledge that used to justify leaving decisions to people on the spot.
    case: Early evidence, by the authors' account, fits bigger firms and less local autonomy.
    kill_shot: Firms getting smaller and more decentralised as they adopt AI.
    rival: local_knowledge
    visible: false
  - id: local_knowledge
    folio: reorganisation
    title: Knowledge on the spot keeps decisions there
    holders: [hayek]
    attribution: extension
    mechanism: What matters for most decisions is knowledge of particular times and places, which changes constantly and by its nature cannot reach the centre as statistics. Hayek argued it about central planning; this site carries it to AI.
    case: The knowledge Hayek meant is local and fleeting and cannot be gathered into statistics; this site adds that a model trained on what is written may lack it.
    kill_shot: Firms that move decisions to the centre with AI outperforming those that leave them local.
    rival: centralises
    visible: false
  - id: referrals_fall
    folio: reorganisation
    title: Answers replace visits, and the web that trained AI loses its income
    holders: [stiglitz_ventura_bolet]
    attribution: author
    mechanism: Sites that produce information are paid by visits, and AI that answers directly sends fewer of them.
    case: Cloudflare counts AI companies' crawlers, the programs that read websites for them, taking far more pages than they send visitors back, on news sites as elsewhere [cite:cloudflare_crawl], though it warns the count may be overstated where an app does not say where its visitors came from [cite:cloudflare_ratio].
    kill_shot: Visits to publishers from search and AI answers rising.
    rival: paid_access
    visible: false
  - id: paid_access
    folio: reorganisation
    title: AI companies pay for what they read
    holders: []
    attribution: site
    mechanism: As answers replace visits, publishers charge the AI companies directly, by licence or by the page.
    case: Cloudflare, which stands between many websites and their visitors, bought an AI data marketplace to build a system in which AI developers pay for the content they train on [cite:cloudflare_human_native].
    kill_shot: Publishers' income falling even where they charge AI companies.
    rival: referrals_fall
    visible: false

  # V · value
  - id: commodity
    folio: value
    title: Tokens become a commodity where a model is not the best tool
    holders: [hobart_round_trip, hobart_pacing]
    attribution: author
    mechanism: Where some labs give their models away, the marginal cost of serving the cheapest models comes down to the chips and power that run them, and a lab has more pricing power where its model is the best tool for the job.
    case: Open models trail the best closed ones by [fact:open_lag], months rather than years.
    kill_shot: Labs keeping a premium on models that open ones already match.
    rival: price_holds
    visible: true
  - id: price_holds
    folio: value
    title: Labs charge for their lead and let buyers go
    holders: [larson_durability]
    attribution: author
    mechanism: Buyers who will not pay a lab's price leave for an open model rather than wait for a discount, so the lab is not bid down to cost; it charges what its lead over the open alternative is worth and serves fewer buyers, and as open models close the gap its price and its market both shrink. Simon Board and Marek Pycia proved the first step for a monopolist selling a durable good whose buyers all have another option [cite:board_pycia].
    case: Near-frontier open models sell for a small fraction of the best model's price without, as Larson reads it, forcing the best model's price down.
    kill_shot: Labs cutting the best model's price to keep its sales while open models still improve too slowly for buyers to wait for them.
    rival: commodity
    visible: true
  - id: up_the_stack
    folio: value
    title: Labs escape by moving up the stack, and lock their customers in
    holders: [nk_up_the_stack]
    attribution: author
    mechanism: Selling access to a model tends towards a commodity business, so labs move into products and into deployments built into their customers' work, where switching is costly.
    case: Cloud computing escaped the same trap by becoming software, and the leading chip foundry by being almost alone.
    kill_shot: The labs' revenue staying mostly in selling access to their models by the token.
    rival: commodity
    visible: true
  - id: distribution_wins
    folio: value
    title: The biggest platforms win with models that are good enough
    holders: [hobart_complements]
    attribution: author
    mechanism: A platform with the most users gains most by serving good-enough models to all of them and selling better ones on top, whoever built them.
    case: Hobart reads the reports that Meta may use other firms' models for some of its answers this way.
    kill_shot: The owners of the best models taking users from the biggest platforms.
    rival: up_the_stack
    visible: false
  - id: router_power
    folio: value
    title: Routers gain power
    holders: [larson_router]
    attribution: author
    mechanism: A neutral router that pools many firms' checked outcomes learns to solve their problems, new kinds above all, faster than any one firm alone, and pricing by outcome belongs with it.
    case: In Larson's own simulation, with the model held fixed, a harness trained on many firms' outcomes beat what each firm learned from its own, most of all on new kinds of problems.
    kill_shot: Firms learning as well from their own outcomes as a router does from everyone's.
    rival: router_fades
    visible: false
  - id: router_fades
    folio: value
    title: A router works itself out of a job
    holders: []
    attribution: site
    mechanism: The better a router works, the more easily buyers move to the cheapest model that is good enough, the harder sellers compete on price, and the less anyone needs a router.
    case: This is the line in this site's essay on the migrating bottleneck, and Larson's argument contradicts it.
    kill_shot: Routers' share of traffic and their margins rising as models converge.
    rival: router_power
    visible: false
  - id: scarce_input_collects
    folio: value
    title: Whoever holds the scarcest input collects
    holders: []
    attribution: site
    mechanism: When every input is needed at once, the one hardest to get sets the pace and its owner takes the profit, until the industry builds its way out.
    case: NVIDIA and AMD take [fact:chips_gp_share] of the gross profit they share with Microsoft's cloud arm and the estimates for OpenAI and Anthropic, the only cloud and lab figures this site can measure.
    kill_shot: The chip makers' share falling while chips stay scarce.
    rival: up_the_stack
    visible: false

  - id: money_runs_out
    folio: value
    title: The spending runs ahead of the revenue, and investors take the loss
    holders: [cahn_2024]
    attribution: author
    mechanism: The spending on data centres has to be paid back by revenue that has not arrived yet, and the chips it buys lose value fast, so if the revenue comes late the investors take the loss.
    case: The biggest cloud and platform companies spend [fact:capex_to_revenue] as much a year on buildings and equipment as AI earns in revenue.
    kill_shot: AI's revenue growing into the spending before the chips it bought are out of date.
    rival: durable_labs
    visible: false
  - id: build_runs_late
    folio: value
    title: The build-out runs late while use keeps rising
    holders: [cahn_2025]
    attribution: author
    mechanism: Demand for computing runs into a supply chain that has not grown as fast, from the few firms that make the most advanced chips and the machines that make them to generators, cooling and skilled builders, so data centres are finished late while use keeps rising.
    case: Cahn wrote in December 2025 that a few such delays had already been reported publicly.
    kill_shot: The new capacity coming online on schedule, with the price of computing falling as it arrives, the other outcome Cahn names.
    rival: money_runs_out
    visible: false
  - id: durable_labs
    folio: value
    title: The labs are durable businesses with high margins
    holders: [sundheim]
    attribution: author
    mechanism: Customers could switch between models as easily as between clouds but mostly do not, and staying at the frontier costs too much capital for more than a handful of labs.
    case: Sundheim, whose firm holds stakes in OpenAI and Anthropic, points to the labs' coding tools and the paid access to their models as businesses customers stick with.
    kill_shot: Customers switching between models freely on price, or more than a handful of labs staying at the frontier.
    rival: money_runs_out
    visible: false
  - id: consumers_keep
    folio: value
    title: Consumers keep most of the value
    holders: [nordhaus]
    attribution: extension
    mechanism: Competition and imitation pass most of an innovation's value to the people who use it, through lower prices; the innovators keep a sliver. Nordhaus measured it across American nonfarm business from 1948 to 2001; this site carries it to AI.
    case: Across American nonfarm business from 1948 to 2001, innovators kept, by his central estimate, about two cents of each dollar of value they created [cite:nordhaus].
    kill_shot: AI firms' profits growing as fast as the value their users get.
    rival: price_holds
    visible: false
  - id: edge
    folio: value
    title: AI's everyday work moves onto people's own devices
    holders: [paik_edge]
    attribution: author
    mechanism: Once a small model on a phone or laptop is good enough, running it there is cheaper and faster than paying a data centre for each request, and the meter stops.
    case: Open models a few steps behind the best keep getting better, and each release widens what a device can do on its own.
    kill_shot: Everyday use staying in cloud data centres even as capable open models shrink.
    rival: cloud_keeps
    visible: false
  - id: cloud_keeps
    folio: value
    title: The cloud keeps the thinking
    holders: []
    attribution: site
    mechanism: The best models stay too large for a device, and people want the best model for work that matters.
    case: Almost all paid use today runs through the labs' and clouds' own services.
    kill_shot: A large share of everyday requests answered on the device.
    rival: edge
    visible: false
  # Part 16: positions from Sean Cai's and The Diff's posts, paid ones included, in fresh wording and never quoted.
  - id: real_work
    folio: capability
    title: Training data comes from real work inside firms
    holders: [cai_mar26]
    attribution: author
    mechanism: Practice tasks written by outside contractors cannot teach a model long work whose results are hard to check, in fields such as biology and security; only records of how experts actually do that work can.
    case: The labs are turning from staged practice tasks towards records of real work, and pay for access to them.
    kill_shot: Staged practice tasks going on improving models at long, hard-to-check office work.
    rival: verified_data
    visible: false
  - id: data_moats
    folio: value
    title: Labs may pull apart by industry, on the records they buy
    holders: [hobart_scarcity]
    attribution: author
    mechanism: The labs' general skills converge, so what separates them is the specialist business records each has bought, and each grows strongest in the trades it bought most from.
    case: Labs are buying records from an airline and from start-ups that have wound down, and the gains may spill into neighbouring fields.
    kill_shot: The labs staying interchangeable in every industry, with none ahead in a trade because of the data it bought.
    rival: commodity
    visible: false
  - id: data_fragments
    folio: value
    title: The data market stays split among specialists
    holders: [cai_commodities]
    attribution: author
    mechanism: Each field and each kind of data needs its own experts and its own checks, so no one seller can be best at all of them.
    case: Sellers focused on one field keep winning lab budgets from the large all-purpose vendors.
    kill_shot: One or two sellers coming to handle most of what the frontier labs buy.
    rival: data_consolidates
    visible: false
  - id: data_consolidates
    folio: value
    title: A few large sellers take most of the data market
    holders: []
    attribution: site
    mechanism: Labs want one supplier that can recruit experts at volume, check quality and pass security reviews, and those costs favour the largest sellers.
    case: Recruiting, checking and security reviews may cost less per task the larger the seller.
    kill_shot: Specialist sellers taking a growing share of the labs' data budgets.
    rival: data_fragments
    visible: false
  - id: firms_train
    folio: products
    title: Tuning open models for firms becomes one business
    holders: [cai_jul26]
    attribution: author
    mechanism: Hosting models, selling data and custom training each lead to the same product, an open model fitted to a firm's own work and billed by use.
    case: Firms want models fitted to their own work and run where they control them, and open models are good enough to start from.
    kill_shot: These firms staying in separate businesses rather than converging on selling tuned models by use.
    rival: general_wins
    visible: false
  - id: general_wins
    folio: products
    title: General models overtake models built for one field
    holders: [cai_verifiable, cai_mar26]
    attribution: author
    mechanism: Each new general model from the labs learns many fields at once, so a model trained for one field keeps its edge only until the next release.
    case: Cai expects the gains from custom training to be nearly wiped out by each general release, outside regulated niches where data is scarce.
    kill_shot: Models built for one field keeping their lead over each new general release.
    rival: firms_train
    visible: false
  - id: cost_binds
    folio: capability
    title: Cost, not ability, becomes the limit
    holders: [cai_jun26]
    attribution: author
    mechanism: Once many agents can work on a task at once, what limits the work is the cost of the computing and the systems around it, not what a single model can do.
    case: Agents working in parallel multiply what a model can finish, at a price.
    kill_shot: Valuable office tasks staying out of AI's reach even where computing is cheap.
    rival: not_reliability
    visible: false
  - id: deployers_scarce
    folio: adoption
    title: Engineers who fit AI to each firm are the scarce ingredient
    holders: [hobart_fde, cai_preseed]
    attribution: author
    mechanism: Every firm's work is different, and fitting a model to it takes engineers who understand both the model and the firm, of whom there are few.
    case: Labs, investors and software firms all compete for these engineers, and labs buy the consultancies that employ them.
    kill_shot: These roles becoming easy to fill, and their pay premium fading.
