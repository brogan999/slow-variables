  - id: vc_inference_serving
    folio: value
    layer: serving_orchestration
    sublayer: inference_serving
    title: "Serving a published model is a price-taking business on rented chips; the serving firms are escaping into running each customer's own tuned model, and the chip and cloud owners are buying them"
    holders: []
    attribution: site
    mechanism: "Inference is running a trained model to answer requests. Serving firms such as Fireworks, Baseten, Together, Modal, Replicate, RunPod, DeepInfra and Hyperbolic rent or buy chips, load open-weight models (whose trained settings, the weights, are published) or a customer's own model, and sell the answers by the token (a fragment of a word) or by the hour of chip time. David Ricardo, an English economist who asked in 1817 why landlords grew rich when bread grew dear, found that the owner of the scarcest input collects a rent: profit above what it takes to keep a business going, earned because something holds rivals off. This site judges that serving a published model is close to a commodity, since many hosts offer the same model and compete on price towards the cost of chips and power; what a host adds is software that makes each chip answer faster and cheaper, which rivals learn."
    case: "Prices are falling: this site reads the running-models input as easing, from the price of the cheapest flagship model on OpenRouter, a marketplace that routes developers' requests to many models. Open models, which any host can serve, took [fact:open_share] of the tokens among OpenRouter's most used models, though its users lean towards cheap models. Nebius's filing names Fireworks and Together as rivals to its own managed service, which runs all the major open models and lets customers bring their own, and warns that larger rivals may cut prices or bundle. The serving firms describe a way out: Fireworks says nearly all the tokens it serves come from models specialised on customers' own data, and Baseten says its engineers work inside customers to tune and serve their models; both grew revenue sharply and raised large rounds in 2026. Chip and cloud owners are buying serving firms: Nebius agreed in May 2026 to buy Eigen AI and that month took Clarifai's technology and leaders; Nscale agreed in July 2026 to buy Anyscale; Crusoe bought Atero in August 2025; AMD bought Brium in June 2025 and has since bought or taken on other firms that speed up serving; d-Matrix bought Wallaroo.ai in August 2026; and the model labs Mistral and Zhipu agreed in February and June 2026 to buy serving firms. This site holds these firms' reported revenue paces but does not yet publish a reading for the layer."
    kill_shot: "Hosts of the same open model keeping different prices for long, with buyers staying with the dearer one; or serving firms keeping or widening their margins (what they keep from each sale after paying their costs) while chip rents fall and more hosts offer the same models."
    rival: models_differ
    direction: commoditising
    commoditising: "This site judges that an answer from a published model is becoming a commodity: the same good from many hosts, with the clouds, the neoclouds (newer cloud firms built to rent out AI chips) and the chip makers all offering it. William Nordhaus, an economist who measured how much of the value of new inventions their makers keep as profit, found that it is a small part; most goes to buyers as lower prices. David Teece, an economist who studied why the firm that invents something often fails to keep the returns, called the inputs a product needs to reach its customers complementary assets; the chips and powered buildings a serving firm needs are owned mostly by others, which is why their owners can absorb the software on top."
    stays_scarce: "This site judges that what stays scarce is the engineering to run each new model fast on each new chip, and, for hosts that tune and run a customer's own model, the position of holding that model. Hamilton Helmer, a strategy consultant who studied why some firms keep earning more than their investors could expect elsewhere, found that a lasting advantage is a benefit behind a barrier. The likeliest here is scale economies (pooling many customers' uneven demand keeps shared chips busy, and a rival must match the volume to match the cost), but the chip and cloud owners can pool as well, so this site does not count it proven."
    powers: []
    converts_if: "A host keeps its customers' tuned models, and the loop of data that improves them, so moving to a rival means rebuilding the model: switching costs in Helmer's sense (what a customer would lose by moving to a rival). That route holds only if a tuned model keeps beating each new general model. Ronald Coase, an economist who studied why some work is done inside firms rather than bought, and Oliver Williamson, an economist who studied contracts and found that a buyer that depends on an asset built for it can be squeezed by whoever owns it, would otherwise expect the owners of chips and clouds to keep buying the serving software, as they are."
    bottlenecks:
    - inference
    - accelerators
    - data_centres
    visible: false
    sources:
    - baseten_series_f_2026
    - fireworks_series_d_2026
    - nbis_20f_2025
  - id: vc_routing_gateways
    folio: value
    layer: serving_orchestration
    sublayer: routing_gateways
    title: "Choosing a model is being given away; a gateway keeps a rent only as the place where developers pay for many models"
    holders: []
    attribution: site
    mechanism: "A router or gateway sits between an app and the models: it sends each request to a model chosen for price, speed or quality, switches when one fails, and keeps one bill. OpenRouter, which the payments company Stripe agreed in August 2026 to buy, sells access to many models through one account; Martian and Not Diamond sell the choice of model; Portkey, Helicone, LiteLLM and TrueFoundry sell a gateway a firm runs itself, LiteLLM's as open source (code published for anyone to use and change for free). David Ricardo, an English economist who asked in 1817 why landlords grew rich when bread grew dear, found that the owner of the scarcest input collects a rent: profit above what it takes to keep a business going, earned because something holds rivals off. This site judges that the routing itself is easy to copy, while a marketplace that many developers and many model sellers both use can hold them the way a payments network does."
    case: "Developers on OpenRouter spread their tokens (the fragments of words that models read and write, by which use is billed) across many models: this site's first readings of how concentrated its traffic is show no single model dominating, though too few weeks have passed to read a direction, and open models took [fact:open_share] of the tokens among its most used models. Stripe's agreement in August 2026 to buy OpenRouter puts what Stripe calls a leading AI model gateway inside a payments firm, which fits the judgement that its value lies in the bill as much as in the choice. The clouds offer their own catalogues: Google's filing describes a platform with many models, its own, other firms' and open ones. This site cannot measure how much a router saves, because the spread of list prices is set almost entirely by one very expensive model, so its routing gauge carries no reading. The router positions this site records disagree on whether pooling many firms' outcomes makes a router choose better than any one firm can."
    kill_shot: "Routers charging more for the choice of model itself, and buyers paying it, because choices learned from many firms' outcomes beat what each firm manages alone."
    rival: router_power
    direction: commoditising
    commoditising: "This site judges that picking a model for each request is becoming a commodity: open-source gateways do it, the clouds' catalogues do it, and the labs' own tools do it for their models. William Nordhaus, an economist who measured how much of the value of new inventions their makers keep as profit, found that it is a small part; most goes to buyers."
    stays_scarce: "This site judges that what stays scarce is the marketplace itself: one account, one bill and one set of terms across many model sellers, and the record of what traffic went where. Hamilton Helmer, a strategy consultant who studied why some firms keep earning more than their investors could expect elsewhere, found that a lasting advantage is a benefit behind a barrier. Network economies (each user makes the product more valuable to the others) would fit a marketplace, but developers use several routers or go straight to the labs, so this site does not count the barrier proven."
    powers: []
    converts_if: "Pooling many firms' checked outcomes lets a router choose better than any firm alone, a network economy in Helmer's sense; or, inside Stripe, the marketplace becomes where AI agents themselves pay for models, so billing and credit create switching costs (what a customer would lose by moving to a rival)."
    bottlenecks:
    - routing
    - inference
    visible: false
    sources:
    - googl_10k_fy25
  - id: vc_agent_infra
    folio: value
    layer: serving_orchestration
    sublayer: agent_infra
    title: "Agent plumbing is mostly open source that labs and clouds buy or copy; the rent sits with whoever holds the connections into customers' systems"
    holders: []
    attribution: site
    mechanism: "An agent is a model that carries out a task by using software tools over minutes or hours. Agent infrastructure is what it needs, much of it open source (code published for anyone to use and change for free): frameworks for wiring model calls together (LangChain, CrewAI, Mastra), sandboxes where it can run code or a browser safely (Daytona, Browserbase and others), memory that lasts between sessions (Letta), and connectors that let it log in to and act in other software (Composio, Arcade, Nango, Merge). David Ricardo, an English economist who asked in 1817 why landlords grew rich when bread grew dear, found that the owner of the scarcest input collects a rent: profit above what it takes to keep a business going, earned because something holds rivals off. Oliver Williamson, an economist who studied contracts, found that an asset built for one buyer, worth far less anywhere else, ties that buyer to whoever holds it. This site judges that frameworks and sandboxes are generic, while connectors that hold a firm's permissions and links into its systems are specific to that firm, and harder to replace."
    case: "The clouds sell agent building as part of their platforms: Microsoft's filing describes Azure AI Foundry as a platform to design, customise and manage AI applications and agents, Google's describes Vertex AI as one for building agents as well as models, and CoreWeave's describes its own agent-building tools. The labs and clouds are also buying the plumbing: Nebius agreed in February 2026 to buy Tavily, which gives agents web search; OpenAI took on the Cirrus Labs team in April 2026 and agreed in June 2026 to buy Ona, which gives agents secure cloud workspaces; Anthropic agreed in May 2026 to buy Stainless, which makes toolkits and servers for connecting models to other software; Meta took in Moltbook in March 2026 and Stilla in September 2026. Platforms are deciding whether to let outside agents in: this site's ledger of big platforms fencing out agents that are not their own records [fact:fences_ledger] such events so far. This site reads agents' ability as easing, meaning the length of task they can finish keeps growing fast; that gauge measures agents, not the economics of their plumbing, for which this site has no reading."
    kill_shot: "An open-source framework or sandbox firm earning a lasting margin (what it keeps from each sale after paying its costs) while the labs and clouds give the same thing away; or connector firms losing customers as fast as framework firms once the labs and clouds ship their own connectors."
    rival: records_hold
    direction: commoditising
    commoditising: "This site judges that frameworks, sandboxes and simple memory are becoming commodities: most began as open source, the clouds bundle them, and the labs buy the teams that build them. William Nordhaus, an economist who measured how much of the value of new inventions their makers keep as profit, found that it is a small part; most goes to buyers. David Teece, an economist who studied why the firm that invents something often fails to keep the returns, called the inputs a product needs to reach its customers complementary assets; a generic one, which anyone can supply, earns an ordinary return, not a rent."
    stays_scarce: "This site judges that what stays scarce is the working link into a firm's own software: the permissions, the audit trail and the map of which system holds what. That context helps only the firm it came from, so it does not compound across customers, but it is specific in Williamson's sense. The software that keeps a firm's records can also refuse or charge for outside agents, which is where the rival view places the rent. Hamilton Helmer, a strategy consultant who studied why some firms keep earning more than their investors could expect elsewhere, found that a lasting advantage is a benefit behind a barrier; switching costs (what a customer would lose by moving to a rival) are the likeliest here, but this site does not count them proven for any connector firm yet."
    powers: []
    converts_if: "A connector firm becomes the standard way agents are given permission into business software across many firms, which could give it network economies in Helmer's sense (each user makes the product more valuable to the others), or its links into each customer's systems become switching costs. Ronald Coase, an economist who studied why some work is done inside firms rather than bought, would otherwise expect the labs and clouds to keep absorbing this layer, as the buying so far suggests."
    bottlenecks:
    - agents
    - deployment_platforms
    visible: false
    sources:
    - crwv_10k_fy25
    - googl_10k_fy25
    - msft_10k_fy26
  - id: vc_deployment_services
    folio: value
    layer: deployment_application
    sublayer: deployment_services
    title: "Fitting AI into a firm earns a services margin that grows with headcount; a rent lasts only where the deployer leaves behind software the customer runs its work on"
    holders: []
    attribution: site
    mechanism: "Deployment firms send engineers into a customer to connect AI models to its data, systems and daily work. The industry calls them forward-deployed engineers: staff who sit with the customer rather than at head office. This site judges Palantir the largest listed firm doing this work, though Palantir describes itself as selling software platforms. The labs have set up their own deployment arms, among them the OpenAI Deployment Company and a venture Anthropic formed with Blackstone and other investors (reports in this site's records differ on who the others are) to serve companies owned by private-equity firms (investment firms that buy whole companies); and consultancies sell the same work. David Ricardo, an English economist who asked in 1817 why landlords grew rich when bread grew dear, found that the owner of the scarcest input collects a rent: profit above what it takes to keep a business going, earned because something holds rivals off. This site judges that the scarce input here is people who understand both the models and the customer's business, and that selling their hours earns a wage-like margin, because each new customer needs more of them. Oliver Williamson, an economist who studied contracts, found that an asset built for one buyer, worth far less anywhere else, ties that buyer to whoever holds it. This site judges that the rent appears only when the deployment leaves behind such an asset: software and a map of the customer's data that its work comes to run on."
    case: "Palantir's filing describes the route from services to software. It sells platforms that connect a customer's data and operations to large language models (the kind of AI model that reads and writes text) made by other firms; its software engineers working with existing customers run deployments and look for new uses; and it runs short workshops, which it calls bootcamps, that build working tools on a customer's own data within days. It also warns that pilots (trial projects) given at little or no cost may never turn into paying contracts. Much of its revenue comes from existing customers widening their use, and the average revenue from its largest customers rose in 2025 over 2024. No single customer reached the size at which the filing must report it in any year from 2023 to 2025, though governments bring in much of its revenue, and it names large software firms, government contractors and systems integrators (firms that assemble other companies' technology for a client) among its rivals. The labs are buying this layer: this site's record of acquisitions shows OpenAI agreeing to buy Tomoro as it launched the Deployment Company, and the Deployment Company agreeing to buy Northslope, both consultancies that put AI to work in large firms; and Poolside, a lab, buying Fern Labs, a deployment firm. This site's records also hold the Anthropic venture buying Fractional AI and Casper Studios, firms that build AI systems for clients; the record of acquisitions leaves those two out of its count under its written rules, because no single buyer controls the venture. Whether the work pays off is unsettled: in one survey of large firms, most AI pilots built into their systems showed no measurable effect on profit, though another survey, which counts differently, finds many more reaching everyday use."
    kill_shot: "Deployment firms keeping or widening their margins while the models need less fitting with each release and the labs give deployment away to win model sales; or, the other way, deployment staff becoming easy to hire while customers still stay with the firm that first fitted their systems."
    rival: deployers_scarce
    direction: holding
    commoditising: "This site judges that generic integration, wiring a model to a firm's documents and common business software, is becoming a commodity: the clouds and labs ship connectors (links that let a model read and act in other software) and tools for building agents (AI programs that carry out tasks on their own), and each new model needs less hand-fitting. William Nordhaus, an economist who measured how much of the value of new inventions their makers keep as profit, found that it is a small part; most goes to buyers. David Teece, an economist who studied why the firm that invents something often fails to keep the returns, called the inputs a product needs to reach its customers complementary assets. This site judges that the deployer owns neither the model nor the customer's records, so on generic work it earns an ordinary services return."
    stays_scarce: "This site judges that what stays scarce is engineers who can turn a firm's messy data and unwritten habits into working systems, and, once that is done, the map of the customer's data and operations that the system runs on. Hamilton Helmer, a strategy consultant who studied why some firms keep earning more than their investors could expect elsewhere, found that a lasting advantage is a benefit behind a barrier. Switching costs (what a customer would lose by moving to a rival) are the likeliest here, and Palantir's expanding customers fit them, but its filing reports expansion, not how many customers leave, so this site does not count the power proven. The rival view holds that these engineers are scarce enough to collect a scarcity rent themselves, not a wage-like margin."
    powers: []
    converts_if: "A deployer's work ends in its own platform, which the customer's operations come to run on, so replacing it means rebuilding the work, not repointing it: switching costs in Helmer's sense. Ronald Coase, an economist who studied why some work is done inside firms rather than bought, and Williamson would add that a lab owning the deployer keeps its model inside that platform, which is why the labs are buying consultancies. The rent stays with services margins if the models learn to fit themselves to a firm's work."
    bottlenecks:
    - deployment_platforms
    - agents
    - applications
    visible: false
    sources:
    - palantir_10k_fy25
