  - id: vc_synthetic_data
    folio: value
    layer: training_input
    sublayer: synthetic_data
    title: "Generated data is a feature of whoever owns the model and the chips, not a business of its own"
    holders: []
    attribution: site
    mechanism: "Synthetic data is training data that a model or a program generates: made-up records that mimic real ones, worked problems with their answers, rewritten or translated text. Sellers include Datology, Tonic, Mostly AI, Rendered.ai and Synthesis AI; Gretel was one until NVIDIA bought it in 2025. David Ricardo, an English economist who asked in 1817 why landlords grew rich when bread grew dear, found that the owner of the scarcest input collects a rent: profit above what it takes to keep a business going, earned because something holds rivals off. Kenneth Arrow, an economist who studied how markets handle knowledge, argued that information is hard to own because copying it is cheap. This site judges that generated data is the plainest case of both: its inputs are a model and computing, which the labs and chip makers already own, so a separate seller has little scarce to charge for, unless it starts from data or a way of checking that others lack."
    case: "This site has no reading of this market's size or prices: it holds no revenue for any seller here, and the training-data input carries no tightness reading. The one move it records is NVIDIA's purchase of Gretel in April 2025, a chip maker taking a data generator in-house. This site judges that the cost of generating falls with the price of running models, which this site reads as easing. A paper this site watches is titled as a study of how generated data can make AI agents (models that carry out tasks by using software tools) forget how to find skills they had learned; this site has read only the title. The best case for a stand-alone seller, in this site's judgement, is privacy: sellers such as Tonic and Mostly AI make made-up copies of real records that banks, hospitals and other regulated firms can use without exposing real people's details, a need a lab's general model does not meet by itself. This site judges that need real but holds no reading of what it earns. No writer this site tracks argues that stand-alone generators win, so this unit names no rival view."
    kill_shot: "An independent seller of generated data keeping a lasting margin (what it keeps from each sale after paying its costs) while the labs' own models generate data ever more cheaply; or the labs paying more for generated data than for data from people in the same field."
    rival: none_found
    direction: commoditising
    commoditising: "This site judges that generation itself is a commodity whose cost follows the price of running models down. William Nordhaus, an economist who measured how much of the value of new inventions their makers keep as profit, found that it is a small part; most goes to buyers as lower prices and better products. David Teece, an economist who studied why the firm that invents something often fails to keep the returns, called the inputs a product needs to reach its customers complementary assets; this site judges that the model and the chips a generator needs are held by the labs and chip makers, not by the generator."
    stays_scarce: "This site judges that what stays scarce is the check: generated data is only as good as the test of whether it is right. Where a program can check, as when code runs or a proof holds, generated practice is abundant; where it cannot, people must check it, and that scarcity sits with the expert-data sellers and environment makers, not here. Hamilton Helmer, a strategy consultant who studied why some firms keep earning more than their investors could expect elsewhere, found that a lasting advantage is a benefit behind a barrier; this site finds none proven among the generators."
    powers: []
    converts_if: "A generator becomes the kind of copy a regulator accepts in place of real records, such as privacy-safe versions of health or bank data, turning its rent into a regulated one; or its way of checking generated data proves hard to learn, which Helmer calls process power (a way of working that takes rivals years to learn). Ronald Coase, an economist who studied why some work is done inside firms rather than bought, and Oliver Williamson, an economist who studied contracts and found that a buyer that depends on an asset built for it can be squeezed by whoever owns it, would otherwise expect the owners of models and chips to keep generation inside, as NVIDIA did."
    bottlenecks:
    - training_data
    - inference
    visible: false
  - id: vc_data_licensing
    folio: value
    layer: training_input
    sublayer: data_licensing
    title: "Licensed content earns a rent only for archives no one else holds that keep growing; the rest is priced near what it costs to copy"
    holders: []
    attribution: site
    mechanism: "Data licensing is AI companies paying the owners of text, images, audio or records for the right to train on them or to show them in answers. The middlemen this site tracks include TollBit and ProRata, which charge AI companies for reading publishers' pages; Protege, Created by Humans, Defined.ai and Human Native, which broker datasets; and the RSL Collective, which backs a standard way for sites to state their licence terms to AI crawlers (the programs that read websites for AI companies). David Ricardo, an English economist who asked in 1817 why landlords grew rich when bread grew dear, found that the owner of the scarcest input collects a rent: profit above what it takes to keep a business going, earned because something holds rivals off. This site judges that an archive sold once becomes, in effect, part of every model trained on it, while content that keeps coming, such as a forum where people keep writing or a daily news service, can be sold again each year."
    case: "This site holds no reading of licence prices or of how much AI companies pay content owners, and the training-data input carries no tightness reading. It records Cloudflare, which stands between many websites and their visitors, buying Human Native, an AI data marketplace, in January 2026, and its outlook records Cloudflare counting most AI companies' crawlers taking far more pages than they send visitors back. A writer this site follows reports a lab buying an airline's records and data sellers buying those of start-ups that have wound down, which fits the judgement that records of real work, which no one else holds, are what sell. Against this unit, the rival view holds that AI companies will pay for what they read far more widely than for unique archives, and reads Cloudflare's purchase as a step towards a system in which AI developers pay for the content they train on. From the other side, if AI companies can train on public, generated or scraped material instead, even unique archives have little to charge for."
    kill_shot: "Owners of large, still-growing archives failing to win lasting payments because AI companies train on public, generated or scraped material instead; or ordinary web pages fetching licence prices as high as unique archives do."
    rival: paid_access
    direction: holding
    commoditising: "This site judges that ordinary web text is already a commodity for training: it has been read, copied into many open collections, and cannot be taken back. Kenneth Arrow, an economist who studied how markets handle knowledge, argued that information is hard to own because copying it is cheap. Andrei Hagiu and Julian Wright, economists who asked when data keeps rivals out, found it does so only when it is proprietary, keeps its value and is hard to copy; an archive sold to many labs fails the first test, and old text fails the second once it is in the models."
    stays_scarce: "This site judges that archives which are unique, legally clean and still growing stay scarce: a platform's ongoing conversations, a publisher's daily reporting, a firm's records of how its experts work. The power belongs to the owners of those archives, most of whom sit outside this layer; the brokers in it earn a fee. Hamilton Helmer, a strategy consultant who studied why some firms keep earning more than their investors could expect elsewhere, found that a lasting advantage is a benefit behind a barrier; this site finds none proven for the brokers today."
    powers: []
    converts_if: "Courts or lawmakers settle that training on content needs the owner's permission, turning the owners' rent into a regulated one; or a licensing standard such as RSL becomes what AI crawlers must honour, which could give the brokers network economies in Helmer's sense (each publisher and each AI buyer that joins makes the market more useful to the others). Ronald Coase, an economist who studied why some work is done inside firms rather than bought, would expect the largest buyers to strike direct deals with the largest archives and leave the brokers the long tail."
    bottlenecks:
    - training_data
    visible: false
  - id: vc_evals
    folio: value
    layer: training_input
    sublayer: evals
    title: "Testing AI is being folded into the labs' and clouds' platforms; an independent tester keeps a rent only where buyers need a judge who is not the seller"
    holders: []
    attribution: site
    mechanism: "Evaluation firms test what a model or an agent can do and watch it once it is running, which the industry calls observability: logging what it did and flagging its mistakes. They include Braintrust, LangSmith (from LangChain), Arize, Galileo, Patronus, Vals AI, Confident AI, Atla, and LMArena, which ranks models by public votes. David Ricardo, an English economist who asked in 1817 why landlords grew rich when bread grew dear, found that the owner of the scarcest input collects a rent: profit above what it takes to keep a business going, earned because something holds rivals off. This site judges that testing tools sit close to the models and chips they test, so the firms that sell those can give testing away as a feature; what a buyer cannot get from the seller is a verdict from someone who is not the seller."
    case: "The buying runs one way. CoreWeave's filing says it bought Weights & Biases in 2025, whose tools developers use to build, evaluate, deploy and monitor models and agents; that the unit's results were not material to CoreWeave's; and that the premium it paid over the value of the assets was put down mainly to the team and the expected gains from combining the two. The Humanloop team joined Anthropic in August 2025. OpenAI took on the founders of Context.ai in April 2025, bought Promptfoo, which attacks models to find security flaws, in March 2026, and agreed in December 2025 to buy neptune.ai, which tracks how models train. Fireworks, a serving firm, offers testing on its own platform beside tuning and serving. On the other side, the ledger this site keeps of signs that checking AI's work is sold as a category of its own records [fact:evals_ledger] such events so far. Nobody publishes whether good testing is in short supply, so this input carries no tightness reading."
    kill_shot: "Independent testers growing faster than the labs' and clouds' own testing tools and keeping their margins (what they keep from each sale after paying their costs) as the platforms give testing away."
    rival: assurance_layer
    direction: commoditising
    commoditising: "This site judges that testing tools, the logging, the scoring against a set of questions and the dashboards, are becoming a commodity: open-source versions exist and the platforms bundle them. Public benchmarks (standard published tests used to compare models) go stale: once a test is published, models are trained towards it. Kenneth Arrow, an economist who studied how markets handle knowledge, argued that information is hard to own because copying it is cheap, and a published test is information."
    stays_scarce: "This site judges that what stays scarce is a verdict the buyer trusts because the tester does not sell the model: tests for regulated work, for insurers and for buyers choosing between labs, built on private tasks no model has been trained on. Hamilton Helmer, a strategy consultant who studied why some firms keep earning more than their investors could expect elsewhere, found that a lasting advantage is a benefit behind a barrier; the one that would fit here is branding (buyers paying more for the same thing because of who made it), and this site does not find it proven for any tester yet."
    powers: []
    converts_if: "Regulators or insurers require an outside tester's sign-off before AI is used in some kinds of work, turning the tester's rent into a regulated one; or one tester's name becomes the mark buyers insist on, which Helmer calls branding. Ronald Coase, an economist who studied why some work is done inside firms rather than bought, and Oliver Williamson, an economist who studied contracts and found that a buyer that depends on an asset built for it can be squeezed by whoever owns it, would otherwise expect the labs and clouds to keep buying testers whose tools become specific to their models, as they have so far."
    bottlenecks:
    - evaluations
    - agents
    visible: false
