  # The shape of the firm (/firm, folio seven): thirteen sources added on 5 Oct 2026, each fetched that day.
  - id: drago_laine_pyramid
    who: "Luke Drago and Rudolf Laine"
    short: "Drago and Laine"
    field: "writers on AI and the economy who founded Workshop Labs and, on their own account, now work at Thinking Machines, an AI company"
    finding: "AI empties the white-collar pyramid from the bottom: entry-level hiring stops first, then junior roles go, then managers, then nearly everyone but the executives, then the executives, and at a small number of firms every employee. They give no dates and call the last stage their most speculative."
