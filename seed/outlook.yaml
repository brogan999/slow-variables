    short: "Christensen and colleagues"
    field: "Christensen studied why leading firms lose their lead; Raynor and Verlinden are his co-authors on this article"
    finding: "While a product is not yet good enough, the money goes to whoever builds the integrated system that fixes what is lacking. Once it is more than good enough the design becomes modular, the assembler becomes interchangeable, and the profit moves to the parts that now limit performance."
    work: "Skate to Where the Money Will Be"
    venue: "Harvard Business Review, 2001. The article is paywalled after its opening; the argument was read in a transcript of a talk Christensen gave in 2004"
