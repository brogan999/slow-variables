  - id: akerlof
    who: "George Akerlof"
    field: "an economist who studied markets in which sellers know more than buyers"
    finding: "Where sellers know the quality of what they sell and buyers do not, everything sells at a price for the average, owners of good goods withdraw, and the market can shrink to nothing. Guarantees, brand names and licences grew up as answers."
