    field: the writer of The Diff, a newsletter on finance and technology, after work in digital advertising and investment research
    finding: Once some AI labs give their models away as open weights, the marginal cost of serving the cheapest models comes down to the chips and power that run them; he reads a chip-equipment maker's investment in an open-model lab as keeping AI labs many and chip demand high.
