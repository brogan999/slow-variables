  - id: brynjolfsson_hitzig
    who: Erik Brynjolfsson and Zoë Hitzig
    field: Brynjolfsson directs Stanford's Digital Economy Lab; Hitzig studies AI's effects on society, now at the Anthropic Institute and at OpenAI when the chapter was written
    finding: AI can capture the local, unwritten knowledge that once argued for leaving decisions to people on the spot, so decisions centralise, with bigger firms, more concentrated industries and less room for local managers.
    work: AI's Use of Knowledge in Society
    venue: The Economics of Transformative AI (National Bureau of Economic Research)
    year: 2026
