  - id: sutton
    who: "Rich Sutton"
    field: "a computer scientist who studies how machines learn"
    finding: "Across decades of AI research, methods that build in what people know helped for a while and then stalled, and were overtaken by general methods, search and learning, that improve as computing gets cheaper."
