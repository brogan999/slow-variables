    quote: "what is essential and yet hard to improve"
  - id: catalini
    who: "Christian Catalini, Xiang Hui and Jane Wu"
    short: "Catalini and colleagues"
    field: "economists who study what it costs to verify work"
    finding: "The cost of having a machine do a task falls with computing power, while the cost of checking the result is held up by people's time. So people's capacity to verify becomes the limit on growth, and the profit moves to whoever holds trustworthy ground truth and underwrites the liability."
