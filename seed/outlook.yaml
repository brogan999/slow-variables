    finding: "A firm of AI workers can copy its best worker and merge what the copies learn, so dealing inside the firm gets cheaper and firms grow much larger. One giant firm is not inevitable, because planning inside still needs profit and loss outside to say whether it is working. The authors put their own confidence low."
