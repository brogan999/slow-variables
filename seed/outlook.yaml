  - id: vc_consumer_ai
    folio: value
    layer: deployment_application
    sublayer: consumer_ai
    title: "In consumer AI the rent goes to whoever owns the daily habit, and users keep most of the value"
    holders: []
    attribution: site
    mechanism: "Consumer AI is the assistants and apps people use for themselves: OpenAI's ChatGPT, Meta AI inside Meta's apps, Google's Gemini in its app and in Search, Perplexity's answer engine, and companion apps such as Character.AI and Replika, which act as a friend or partner. Many people use them free; some pay a subscription, and advertising may pay for the rest. David Ricardo, an English economist who asked in 1817 why landlords grew rich when bread grew dear, found that the owner of the scarcest input collects a rent: profit above what it takes to keep a business going, earned because something holds rivals off. This site judges that in consumer AI the scarce input is a user's habit, the app someone opens without thinking, and that it is held by firms that already own people's phones, feeds and searches, plus ChatGPT, which built one of its own. A newer kind of consumer AI, the personal agent (an assistant that carries out tasks for its user, such as booking, shopping, filling in forms and paying, rather than only answering), adds a second question beside the habit: who stands where the user pays."
    case: "The platforms are putting AI where their users already are. Meta's filing says Meta AI is available across its apps, as a stand-alone app, on its AI glasses and on the web, and that Meta earns substantially all its revenue from advertising. Google's filing says its Gemini model runs across Search and the Gemini app, and warns that as AI enters Search it may earn money differently than it has in the past. OpenAI reaches consumers through ChatGPT directly; its paying subscribers stand at [fact:paid_share] of its weekly users on this site's latest reading, two different counts, so this is not the share of users who pay. The owners of habits are buying small consumer apps: this site's record of acquisitions shows OpenAI buying Roi, Torch, Hiro Finance and NextSlide, Meta buying Manus and Limitless, and Amazon agreeing to buy Bee. Users are getting much of the value: Stanford's Digital Economy Lab estimated what American users would have to be paid to give up generative AI (AI that writes text or makes images on request), and its total rose sharply between the middle of 2025 and early 2026; the survey counts only Americans. This site holds no revenue readings for the companion apps. A wave of personal agents arrived in 2026. Meta says its Muse, launched in September 2026, runs in a sandbox of its own (a separate computer in Meta's cloud, walled off from other users, with its own web browser), books travel, fills in forms and buys things, checks with the user before it sends an email or makes a purchase, and pays through Link, a checkout service built by Stripe; Meta also says Muse is free for most uses with paid plans for more, and does not share users' conversations with Muse, or the data in their Muse workspace, with its ad systems. Instinct, a start-up whose users text it, and whose concierge feature makes phone calls for them, uses its own phone number and computer to carry out tasks, TechCrunch reported when it raised a new round in September 2026 from investors including Sequoia Capital, Benchmark and Coatue, a month after its previous one. Manus, whose makers describe it as a general-purpose agent for research and complex tasks, announced in December 2025 that it was joining Meta. Assistant Benchmark, a site that tests assistants people can text on the same published tasks, ranked Muse first and Instinct second in its tests as of September 2026; the site, created by David Pawlan, says it scored the assistants it tested after real use; it had tested only some of those it lists, so these are one site's results, not a survey of users."
    kill_shot: "A consumer AI app with no existing platform behind it, such as a personal agent like Instinct, taking a large, paying audience from Meta, Google and ChatGPT and holding it; or consumer AI firms' revenue growing as fast as the value users say they get."
    rival: durable_labs
    direction: holding
    commoditising: "This site judges that answering an everyday question is a commodity: many free assistants do it well enough, and the price to the user is zero. William Nordhaus, an economist who measured how much of the value of new inventions their makers keep as profit, found that it is a small part; most goes to users as lower prices and better products. On his finding, the gap between what users would pay and what they are charged is the value they keep. The rival view holds that the labs are durable, high-margin businesses whose customers mostly do not switch, which would leave more of the value with the makers."
    stays_scarce: "This site judges that what stays scarce is the user's attention and habit, the personal history an assistant builds up about each user, and the payment and advertising systems that turn attention into money. David Teece, an economist who studied why the firm that invents something often fails to keep the returns, called those inputs complementary assets; Meta and Google held theirs before AI arrived. Hamilton Helmer, a strategy consultant who studied why some firms keep earning more than their investors could expect elsewhere, found that a lasting advantage is a benefit behind a barrier. Network economies (each user makes the product more useful to the others) and scale economies hold in the platforms' existing businesses, but this site finds none proven for AI assistants themselves, where one user's chat does not make another's better and people use several at once. This site judges that agents which act, not just answer, could move both the habit and the point of payment: if people hand their errands to one agent, the firm running it stands between them and every shop they buy from, and could take a cut of each purchase, as card networks and app stores do, or charge sellers to be chosen. Whether that rent goes to the platforms that already own the habit, such as Meta with Muse and Manus, or to newcomers such as Instinct is open; one tester's early rankings are not evidence of lasting use. Because Meta says Muse keeps users' conversations with it, and the data in their Muse workspace, out of its ad systems, this site judges that, for now, the source suggests any money Muse makes would come from subscriptions or purchases rather than advertising."
    powers: []
    converts_if: "An assistant's memory of each user becomes costly to leave, turning a habit into switching costs in Helmer's sense (what a user would lose by moving to a rival); or assistants learn what people want to buy early enough that advertisers pay more to reach them than in search, turning attention into the kind of rent search earned. It fails to convert if memories become easy to carry from one assistant to another. A third route opens with agents that buy for their users: the agent becomes the place where payment happens, and its owner takes a fee on each purchase, a rent on the sale rather than on attention. That fails to convert if users can move their saved cards, logins and preferences to a rival agent easily, or if shops and payment firms such as Stripe keep the fee."
    bottlenecks:
