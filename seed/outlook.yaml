    - pretraining
    - inference
    - accelerators
    visible: false
  - id: vc_human_data
    folio: value
    layer: training_input
    sublayer: human_data
    title: "Expert-data sellers broker a skill the labs cannot yet make for themselves; what they sell belongs to the buyer, so their rent lasts only while the labs need people"
    holders: []
    attribution: site
    mechanism: "Human-data sellers such as Scale AI, Surge AI, Mercor, Handshake, Turing and Invisible find experts (doctors, lawyers, programmers, scientists), pay them to write questions and answers, grade a model's attempts and set down how they do their work, and sell the result to the AI labs to train on. David Ricardo, an English economist who asked in 1817 why landlords grew rich when bread grew dear, found that the owner of the scarcest input collects a rent: profit above what it takes to keep a business going, earned because something holds rivals off. This site judges that the scarce input here is expert time, found quickly and checked well, and that the seller is a broker of it: the work is made to one lab's order and becomes that lab's to keep. Kenneth Arrow, an economist who studied how markets handle knowledge, argued that information is hard to own because copying it is cheap; here the buyer, not the seller, ends up owning it. The leading sellers are now also selling downstream, to ordinary companies rather than labs. Ronald Coase, an economist who studied why some work is done inside firms rather than bought, and Oliver Williamson, an economist who studied contracts and found that whoever has built something useful to only one partner can be squeezed by that partner, explain why the labs pull this layer towards them. This site judges that the move to ordinary companies is the same logic run in reverse: a supplier integrating forward (taking on the next step of the work, closer to the final user) so that it is not at the mercy of a few concentrated buyers."
    case: "Demand has risen fast on the readings this site holds, all of them company posts or press reports rather than audited figures. Mercor's reported yearly revenue pace, counted before what it pays out to its experts, grew sharply between the start of 2026 and June, and this site reads the expert-data market as emerging; Surge AI was reported to have passed [fact:surge_revenue] of yearly revenue for 2024 without raising outside money. Handshake says that in 2024 the labs wanted qualified experts at scale, that finding and managing them was slow and scattered, and that talent became the bottleneck, and that its long ties with universities spare it the heavy recruiting spending its rivals bear. The labs are pulling the layer closer. Meta bought a minority of Scale AI's shares without votes in June 2025; its filing says it has no significant influence over Scale, but Scale's founder moved to Meta and the two widened their commercial ties. At the time, Scale counted Google, Microsoft and OpenAI among its customers. Scale now says its data underpins work at many of the leading labs, and that it has added large businesses and more government work. Mercor agreed in July 2026 to buy Deeptune, a maker of practice tasks for training, and said the pair would serve companies deploying AI agents (programs that carry out several steps of a task on their own) as well as labs. The leading sellers now offer ordinary companies evaluation (testing an AI system on the firm's own work), post-training (further training of a finished model on narrower material), and help putting systems to work and keeping them running; all of it is on their own pages, not in any filing. Mercor launched an enterprise product in March 2026 that it says maps how a firm's staff do their work, turns that into tests and rules for the firm's agents, and checks their output as they run. Surge AI's enterprise page offers to build tests around a firm's own work, compare models on quality, cost and speed, watch them once live and, where that is not enough, design a training programme and build its data. Scale AI's page says it builds, deploys and runs AI systems for businesses in fields such as energy, insurance and health. Handshake's page says it builds agents inside a client's own systems, lowers what they cost to run and trains models the client owns; in July 2026 it wrote that its tests let a firm find which work can move to cheaper models, among them open-weight ones (models whose trained settings are published so anyone can run them). None of them says how much of its revenue comes from these buyers. Whether expert data is actually short, this site cannot say: nobody publishes its prices or how long buyers wait, so the training-data input carries no tightness reading, and this site's tally of sellers naming labs as customers rises and falls with what sellers choose to disclose."
    kill_shot: "A seller keeping or widening its margin (what it keeps from each sale after paying its costs) as more sellers enter and the labs hire experts directly, because something it owns, a pool of experts no rival can reach or a record of graded work, grows more valuable with every lab it serves; or a seller earning a lasting margin from ordinary companies on tests and graded records that carry from one client to the next, which would show the rent outlasting the labs' need for people."
    rival: data_consolidates
    direction: holding
    commoditising: "This site judges that ordinary labelling, the tagging of pictures and text on which the first data firms were built, is a commodity: many sellers, interchangeable work, and prices set by the pay of the workers. Andrei Hagiu and Julian Wright, economists who asked when learning from customers' data keeps rivals out, found it does so only when the data is proprietary, keeps its value, and improves the product for every customer. For the seller, expert data made to one lab's order fails the first and last of those tests, since the lab owns it and it helps only that lab, and it goes stale as each new model masters what it taught."
    stays_scarce: "This site judges that what stays scarce, for now, is the ability to find, vet and pay many experts in a narrow field quickly, and to check their work well enough that a lab trusts it; Handshake's account of its university network and Mercor's stress on its talent network, matching and speed are both claims to that. Hamilton Helmer, a strategy consultant who studied why some firms keep earning more than their investors could expect elsewhere, found that a lasting advantage is a benefit behind a barrier. This site finds none proven here: the benefit of a large expert network is real, but experts can work for several sellers at once and the labs can hire them directly, so the barrier is not yet shown."
    powers: []
    converts_if: "A seller's graded records, pooled across many buyers, become what Helmer calls a cornered resource (preferential access to something others need), such as checked outcomes of expert work that improve every buyer's model; or a seller becomes so built into a lab's training that switching costs (what a customer would lose by moving to a rival) hold it. Coase and Williamson would expect the labs to bring such work inside as it becomes specific to them. Meta's stake in Scale AI is the largest step towards it this site records, but it stops short: the stake carries no votes, and Meta's filing says it gives Meta no significant influence over Scale. The move to ordinary companies is a second route: if tests and graded records built for one firm improve the service for the next, they pass the tests of Hagiu and Wright and would compound; if each job stays made to one client's order, the sellers have swapped a few lab buyers for many consulting clients, paid for their people's time, and the rent stays thin."
