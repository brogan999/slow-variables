  - id: conglomerate_returns
    folio: reorganisation
    title: The conglomerate comes back
    holders: [hoffman_conglomerate]
    attribution: author
    mechanism: AI lets one centre see and run many unrelated businesses, removing the overhead that made conglomerates trade at a discount.
    case: Hoffman points to founders folding their companies into AI-run groups and to industrial chiefs who say the old case for scale has run out.
