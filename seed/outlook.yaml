    quote: "that little planned society"
  - id: grossman_hart
    who: "Sanford Grossman and Oliver Hart"
    short: "Grossman and Hart"
    field: "economists who studied contracts and what ownership is for"
    finding: "No contract can list every decision about an asset, so ownership is the right to decide whatever the contract leaves out. Giving that right to one party takes it from another and blunts the second party's reason to invest, so one firm should own another only when the gain outweighs that loss."
    work: "The Costs and Benefits of Ownership: A Theory of Vertical and Lateral Integration"
    venue: "Journal of Political Economy, 1986. The link opens the journal's record with the abstract; the article was read in full in a scan of the journal's pages"
    year: 1986
    url: https://ideas.repec.org/a/ucp/jpolec/v94y1986i4p691-719.html
    retrieved_at: 2026-10-05
