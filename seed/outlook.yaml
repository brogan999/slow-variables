  - id: larson_durability
    who: Soren Larson
    field: a writer on how money moves between AI labs and the apps built on them, who co-founded Crosshatch, a personalised-AI start-up that shut down in July 2025
    finding: Applying Board and Pycia, buyers who will not pay a lab's price leave for an open model rather than wait for a discount, so the lab keeps charging a monopoly price instead of being bid down by waiting buyers; but that price reflects only its lead over the open alternative, so as open models close the gap its price and its market both shrink, and its revenue erodes faster than its lead; and if open models improve fast enough that buyers would rather wait for them, a pace he judges low, the lab is bid down after all, so he doubts today's high margins will last.
    work: Durability of Frontier AI
    venue: hypersoren.xyz
    year: 2026
    url: https://hypersoren.xyz/posts/durability-of-frontier-ai/
    retrieved_at: 2026-09-22
