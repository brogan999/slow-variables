    finding: Past automation raised productivity through ever better machines, but work is a chain of tasks that substitute poorly for one another, so weak links tame the explosion; if AI follows the pattern of past automation, growth rises only slowly, and even if machines everywhere improve as fast as they have in making computers, growth passes seven percent by 2030 but explodes only decades later.
