  - id: vc_vertical_ai
    folio: value
    layer: deployment_application
    sublayer: vertical_ai
    title: "A trade's own AI app keeps a rent where it holds the trade's workflow, records and approvals; where it only packages a general model, each lab release takes the margin"
    holders: []
    attribution: site
    mechanism: "Vertical AI apps are built for one trade: Harvey and Legora for lawyers, OpenEvidence, Abridge and Ambience for doctors, Hebbia and Rogo for finance, Sierra and Decagon for customer service. They buy models from the labs and wrap them in the forms, checks and records of one kind of work. David Ricardo, an English economist who asked in 1817 why landlords grew rich when bread grew dear, found that the owner of the scarcest input collects a rent: profit above what it takes to keep a business going, earned because something holds rivals off. David Teece, an economist who studied why the firm that invents something often fails to keep the returns, found that the profit often goes to whoever holds the complementary assets: the distribution, the trade's trust and the systems a product needs to reach its buyers. This site judges that a vertical app earns a rent only where it holds such assets that a lab cannot copy by training a better general model."
    case: "Several of these firms report revenue rising fast. Harvey's co-founder said in September 2026 that its annual recurring revenue (what customers have signed up to pay in a year) had grown sharply since January; Legora's chief executive describes the same kind of rise; Decagon told a reporter in August 2026 that its revenue had crossed a large milestone, and a research firm estimates that its run-rate (a recent month's revenue scaled up to a year) rose sharply from the end of 2025; and a research firm estimates that OpenEvidence's run-rate rose sharply between the end of 2025 and July 2026. All of these are company, press or research-firm figures, not audited ones. The apps are building their own assets: Harvey said in September 2026 that it had released its first open-weight model (one whose trained settings are published) tuned for legal work, and that it aims to help law firms build AI they own. OpenEvidence has content partnerships with the New England Journal of Medicine, the Journal of the American Medical Association and the American Medical Association; it gave its research agent free to verified American clinicians in 2025, and it said in March 2026 that most practising American physicians use it every day. Menlo Ventures, a venture-capital firm (one that invests in young companies), found in its survey that start-ups took [fact:startup_app_share] of what American firms spent on AI apps, though the survey leaves out AI built into incumbents' existing software. The labs and platforms are moving into the same trades. Anthropic said early in 2026 that its Cowork product has plugins (add-ons that give its model the tools and instructions for one job) for roles such as sales, legal and finance, and that it had widened its reach into health care; Microsoft's filing describes a cloud business, once called Nuance Healthcare, that sells AI to the health care industry; and this site's record of acquisitions shows OpenAI buying Torch, a health-care technology start-up, in January 2026. The same record shows labs and platforms buying vertical apps: Mistral bought Emmi AI and agreed to buy Pimento, OpenAI bought Crixet, Microsoft bought Fintool and Amazon bought NLX. Where the work is regulated, rules slow everyone: a start-up, UpDoc, said in December 2025 that the Food and Drug Administration had given its diabetes app the first clearance for medical software using large language models that talk to patients, though the agency's own record of the clearance does not describe it that way. Harvey's own test of expert legal work found the best general models finishing few of its tasks end to end in May 2026, a vendor's test not yet repeated by anyone else."
    kill_shot: "Vertical apps' prices and margins falling each time the labs release a better general model, with customers switching to the labs' own specialist products; or, the other way, a vertical app keeping its customers and prices after a lab ships a rival product for the same trade."
    rival: smart_squeeze
    direction: holding
    commoditising: "This site judges that a vertical app that adds only prompts (the written instructions given to a model) and a trade's vocabulary to a general model is becoming a commodity, since each general release learns more trades at once. William Nordhaus, an economist who measured how much of the value of new inventions their makers keep as profit, found that it is a small part; most goes to buyers as lower prices and better products. Kenneth Arrow, an economist who studied how markets handle knowledge, argued that information is hard to own because copying it is cheap; a clever way of asking a model a legal question is information of that kind."
    stays_scarce: "This site judges that what stays scarce is the place in the trade's daily work (the tool a lawyer drafts in or a doctor's notes are written by), the trade's own records the app is allowed to see, licensed content the trade trusts, such as the medical journals OpenEvidence draws on, and approvals that only a regulator or a licensed professional can give. Andrei Hagiu and Julian Wright, economists who asked when learning from customers' data keeps rivals out, found it does so only when the data is proprietary, keeps its value and improves the product for every customer; much of a trade's data belongs to each client and helps only that client. Hamilton Helmer, a strategy consultant who studied why some firms keep earning more than their investors could expect elsewhere, found that a lasting advantage is a benefit behind a barrier. Switching costs (what a customer would lose by moving to a rival) and branding (buyers paying more because of the name) are the candidates, but these firms are young and publish no figures on customers leaving, so this site counts neither proven."
    powers: []
    converts_if: "A vertical app becomes the system of record for its trade, the software that holds a firm's matters, patients or cases, so switching costs in Helmer's sense hold customers when the labs catch up; or a regulator's approval, or the trade's liability rules, make the app's checked record something a lab cannot simply match, turning its rent into a regulated one. Ronald Coase, an economist who studied why some work is done inside firms rather than bought, would otherwise expect the labs to keep buying the apps whose trades they want."
    bottlenecks:
    - applications
    - training_data
    - evaluations
    visible: false
