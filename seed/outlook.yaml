    field: "Garicano is an economist who studies how firms organise what they know; Saa-Requejo is his co-author at the Silicon Continent newsletter"
    finding: "A firm that rents its models can be squeezed by its supplier: on access, on price, by work that will not move to another model, and by the supplier learning the firm's own know-how from the way it is used. Their remedy is to rent the model, own the layer above it and keep a second supplier."
