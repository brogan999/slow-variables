  - id: larson_router
    who: Soren Larson
    field: a writer on how money moves between AI labs and the apps built on them, who co-founded Crosshatch, a personalised-AI start-up whose closure he announced in November 2025
    finding: A neutral router that pools many firms' checked outcomes learns to solve their problems, new kinds above all, faster than any one firm alone, so paying for AI by the outcome belongs with it; in his simulation the model was held fixed, and what won was a harness trained on other firms' outcomes.
    work: Router Power
    venue: hypersoren.xyz
