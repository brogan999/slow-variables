  # The firm (/firm, docs/argument/firm.md): fetched 5 Oct 2026. A venue says which version was read where the link opens a record or a restatement.
  - id: coase
    who: "Ronald Coase"
    field: "a British economist who asked why firms exist when prices can co-ordinate work"
    finding: "A firm exists because using a market has costs: finding out prices, bargaining and writing a contract for each exchange. A firm grows until organising one more job inside costs as much as buying it outside or having another firm do it."
    work: "The Nature of the Firm"
