  - id: athey_scott_morton
    who: Susan Athey and Fiona Scott Morton
    field: economists who study competition and technology; both served as chief economist of the US antitrust division
    finding: When AI is sold by firms with market power, the workers it displaces can lose twice, once when cheap AI cuts their pay and again when its price later rises.
    work: Artificial Intelligence, Competition, and Welfare
    venue: The Economics of Transformative AI (National Bureau of Economic Research)
    year: 2026
    url: https://conference.nber.org/conf_papers/f227494.pdf
