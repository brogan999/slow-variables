  - id: vc_post_training
    folio: value
    layer: training_input
    sublayer: post_training
    title: "Tuning a model for one customer is becoming a feature of the clouds and the serving firms; a rent survives only where the tuned model keeps learning inside the customer's work"
    holders: []
    attribution: site
    mechanism: "Post-training is everything done to a model after its first, general training, changing its weights (the settings, fixed in training, that hold what the model has learned): tuning it on a firm's own examples, training it by trial and error against graders, and, in its newest form, continual learning, in which the model keeps updating as it is used. Sellers include Thinking Machines Lab, Prime Intellect, Adaptive ML, Predibase, Arcee, Unsloth, Trajectory and Baseten. David Ricardo, an English economist who asked in 1817 why landlords grew rich when bread grew dear, found that the owner of the scarcest input collects a rent: profit above what it takes to keep a business going, earned because something holds rivals off. Oliver Williamson, an economist who studied contracts, found that an asset built for one buyer, worth far less anywhere else, ties that buyer to whoever holds it. This site judges that a model tuned to one firm's work is such an asset, but that the tuning itself is a service anyone with chips and open tools (software published for anyone to use and change for free) can offer."
    case: "The clouds and serving firms already sell tuning beside the chips. Google's filing describes Vertex AI as a platform for tuning and deploying custom models and agents from many models, its own and others'; Nebius says its managed service lets companies tune open and custom models; Fireworks says its platform offers tuning, reinforcement learning and testing on top of serving; Baseten says its engineers work inside customers to post-train and serve their models. Compute firms and labs are buying the specialists: CoreWeave's filing records its purchase of OpenPipe, and this site's ledger records Anthropic buying Runhouse in April 2026 and Thinking Machines Lab taking on the Workshop Labs team the same month. Continual learning is young. The highest step this site has seen in production is a pipeline, described by its maker Trajectory, in which a newly trained add-on (an adapter, a thin layer of extra settings) can go live within about an hour; Baseten says it trains a small helper model on the fly from live traffic. Harvey says it worked with Fireworks to post-train its legal model by reinforcement learning in realistic legal work, which this site's ladder of continual learning files as research, not production. Models that keep folding a firm's knowledge into their weights as they work exist only in research. Nobody publishes what post-training costs, so this input carries no tightness reading."
    kill_shot: "Independent tuning firms keeping their margins while the clouds and serving firms bundle tuning with the chips; or, the other way, each new general model wiping out the gains from tuning so firms stop paying for it at all."
    rival: general_wins
    direction: commoditising
    commoditising: "This site judges that a one-off tuning of an open model on a firm's examples is becoming a commodity: open-source tools such as Unsloth do it for free, the clouds and serving firms bundle it, and each new general model narrows the gain. William Nordhaus, an economist who measured how much of the value of new inventions their makers keep as profit, found that it is a small part; most goes to buyers as lower prices and better products."
    stays_scarce: "This site judges that the skill to run reinforcement learning at scale without damaging what the model already knew, and the record of a customer's own work that a continually learning model feeds on, stay scarce. On the tests of Andrei Hagiu and Julian Wright, economists who asked when learning from customers' data keeps rivals out, a customer's record helps only that customer, so it does not compound across customers; but it is specific in Williamson's sense. Hamilton Helmer, a strategy consultant who studied why some firms keep earning more than their investors could expect elsewhere, found that a lasting advantage is a benefit behind a barrier; this site finds none proven among the tuning firms today."
    powers: []
    converts_if: "Continual learning works in production at scale, so a model that has learned a firm's work for months is costly to replace: switching costs in Helmer's sense (what a customer would lose by moving to a rival) for whoever runs it. Ronald Coase, an economist who studied why some work is done inside firms rather than bought, would add that the rent then goes to whoever holds that model, a cloud, a lab, a serving firm or the customer itself, and not necessarily to the firm that did the tuning."
