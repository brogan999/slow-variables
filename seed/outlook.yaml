# What happens from here (Part 11, section D): named writers' positions on each crux of the argument, the claims
# they imply, and the test each claim is read against tonight. Every source is public and free, fetched on 22 Sep
# 2026; a work's finding is written fresh in plain words, never copied. A position is `author` when its holders argue
# it, `extension` when this site carries an author's argument further than they did, `site` when it is this site's
# own; every position names its rival. A claim's test is one fact and one operator; `rival_test` is what the rival
# expects of the same reading, and when both hold the page says tonight settles nothing. A claim with `due` is about
# reaching a level by that date. Quotes: at most one per source, under fifteen words, checked against the source.

