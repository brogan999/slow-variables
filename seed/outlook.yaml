  - id: vc_rl_environments
    folio: value
    layer: training_input
    sublayer: rl_environments
    title: "Practice tasks for training are made to order for a few labs; they hold value only where the grader checks work that is hard to check"
    holders: []
    attribution: site
    mechanism: "Reinforcement learning trains a model by trial and error: it attempts a task, a grader (a program or a person that scores the attempt) marks it, and the model is nudged towards what scored well. An environment is the practice ground: a copy of a website, a codebase, a spreadsheet or a job, with tasks set inside it and a grader attached. Sellers such as Mechanize, Fleet, Halluminate, Matrices, Applied Compute and Plato build them for the labs. David Ricardo, an English economist who asked in 1817 why landlords grew rich when bread grew dear, found that the owner of the scarcest input collects a rent: profit above what it takes to keep a business going, earned because something holds rivals off. This site judges that building the practice ground is ordinary software work, so any rent sits in the grader: tasks whose right answer only an expert can judge are scarce, and tasks a machine can check are not."
    case: "This site counts the sellers from one public directory, which in July 2026 showed a small specialist market rather than a crowd; that count says the business exists, not whether it pays. Nobody publishes what environments cost or how long buyers wait, so the post-training input carries no tightness reading. The best sign for the makers is that larger firms are paying to own them. CoreWeave's filing says it bought OpenPipe, a platform for training AI agents by reinforcement learning, in September 2025, and soon after launched, with its Weights & Biases unit, a service that lets customers train this way without managing the machines. In July 2026 Mercor, a seller of expert data, agreed to buy Deeptune, an environment maker, and World Labs, a new lab, bought SceniX, a robotics firm this site files under environments. Buyers that pay to own makers, rather than rent their tasks, are judging that good environments and graders are worth having in-house. Against this unit, the rival view holds that models will set and grade their own practice, and a writer this site follows reports the labs turning from staged practice tasks towards records of real work inside firms; either would leave even expert-graded environments with little to sell."
    kill_shot: "Models learning long work whose results are hard to check from practice they set and grade themselves, so the labs stop buying expert-graded environments; or environment makers keeping a lasting margin (what it keeps from each sale after paying its costs) on tasks a machine can already grade."
    rival: self_made
    direction: holding
    commoditising: "This site judges that the practice ground itself, a copied website or a sandbox where code runs, is becoming a commodity: open-source tools and the clouds' own services supply it, and a lab can build one in-house. Andrei Hagiu and Julian Wright, economists who asked when learning from customers' data keeps rivals out, found it does so only when the data is proprietary, keeps its value, and improves the product for every customer. An environment built to one lab's order belongs to that lab, helps only that lab, and goes stale once models master its tasks, since a task every model passes teaches nothing."
    stays_scarce: "This site judges that graders for work whose outcome is hard to judge, such as a legal filing, a clinical call or a long engineering job, stay scarce, together with the experts who can write them. Hamilton Helmer, a strategy consultant who studied why some firms keep earning more than their investors could expect elsewhere, found that a lasting advantage is a benefit behind a barrier; this site finds none proven among environment makers, whose tasks can be rebuilt by a buyer that has seen them."
    powers: []
    converts_if: "A maker holds graders for a field every lab needs and cannot build, which Helmer calls a cornered resource (preferential access to something others need); or it collects graded outcomes from real work inside firms, which improve with every buyer and go stale slowly. Ronald Coase, an economist who studied why some work is done inside firms rather than bought, and Oliver Williamson, an economist who studied contracts and found that a buyer that depends on an asset built for it can be squeezed by whoever owns it, would expect the labs and compute firms to buy makers whose graders become specific to their training, as the buying so far suggests."
    bottlenecks:
    - post_training
    - training_data
    - evaluations
    visible: false
    sources:
