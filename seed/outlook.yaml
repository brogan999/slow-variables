  - id: vc_neolabs
    folio: value
    layer: model
    sublayer: neolabs
    title: "A new lab earns a rent only where its specialty lies off the big labs' path; elsewhere its asset is its people"
    holders: []
    attribution: site
    mechanism: "Neolabs are younger AI labs outside the big frontier group, most founded in the last few years and mostly funded by investors before they sell much: Mistral, which publishes the weights (the trained settings) of some of its models, Safe Superintelligence, Thinking Machines Lab, Reflection AI and Periodic Labs among the general and research labs; ElevenLabs, Black Forest Labs and others in voice, images and video; Physical Intelligence and Skild AI in robots. David Ricardo, an English economist who asked in 1817 why landlords grew rich when bread grew dear, found that the owner of the scarcest input collects a rent: profit above what it takes to keep a business going, earned because something holds rivals off. For a new lab the scarce input is its researchers and its bet on a route the big labs are not taking. This site judges that where that route leads somewhere the frontier labs are heading anyway, the new lab competes with them for chips and money on worse terms, and its people are worth more to a big lab than its business is to investors."
    case: "This site has revenue readings for few of the neolabs. The voice specialist ElevenLabs reports a run-rate (a recent month's revenue scaled up to a year) that rose fast from the end of 2025 to April 2026 and more slowly since, evidence that a specialist off the big labs' path can earn money. For Mistral, a year of revenue at the current pace is well below the equity it has raised, though that gap has narrowed during 2026. The frontier labs' own costs are the hurdle: training at the frontier costs so much that, on this site's reading, even the leading labs' revenue is well below what they have raised. The specialists face a different test: open models trail the best closed ones by only [fact:open_lag], so a new lab's lead in a general model is short-lived, while a specialty in voice, video, robots or science may lie outside what the general labs train for. This site's acquisition ledger counts only purchases of firms in the layers above the models, so it cannot show a neolab being bought, or its leaders hired, by a bigger lab. This site judges which neolabs sit off the big labs' path; it does not measure it."
    kill_shot: "A lab founded since 2023 taking the lead on general models and holding it while charging for it; or the specialists' niches being matched by the frontier labs' general models, with the specialists' prices falling to the general labs' level."
    rival: lead_rotates
    direction: commoditising
    commoditising: "This site judges that a general model from a new lab is commoditising fastest of all: it competes with the frontier labs above it and the open-weight labs below it. Kenneth Arrow, an economist who studied how markets handle knowledge, argued that information is hard to own because copying it is cheap; a research idea, once published or seen in a product, spreads to labs with more chips. William Nordhaus, an economist who measured how much of the value of new inventions their makers keep as profit, found that it is a small part; most goes to buyers."
    stays_scarce: "This site judges that what stays scarce is the small number of researchers who can lead a frontier training run (the training of the most capable model of its time), and in the specialties, the data and tuning for one kind of work (a voice, a robot's movements, a laboratory's experiments) that general labs have not collected. Andrei Hagiu and Julian Wright, economists who asked when learning from customers' data keeps rivals out, found it does so only when the data is proprietary, keeps its value and improves the product for every customer; a specialty that passes those tests may hold. Hamilton Helmer, a strategy consultant who studied why some firms keep earning more than their investors could expect elsewhere, found that a lasting advantage is a benefit behind a barrier; this site finds no such power proven in the neolabs today."
    powers: []
    converts_if: "A specialist's product becomes the tool a trade works in, so switching costs (what a customer would lose by moving to a rival) hold customers after the general labs catch up; or its data from customers and experiments passes Hagiu and Wright's tests and becomes a cornered resource, Helmer's term for preferential access to something others need. A general neolab converts only if its different route (a new way to train, or a model that learns after it is released) proves both better and hard to copy."
    bottlenecks:
    - pretraining
    - post_training
    - continual_learning
    - training_data
    - capital
    visible: false
  - id: vc_open_weight_labs
    folio: value
    layer: model
    sublayer: open_weight_labs
    title: "Open-weight labs give the model away, so they keep little of its value but cap what the closed labs can charge"
    holders: []
    attribution: site
    mechanism: "An open-weight lab publishes its model's weights, the trained settings that are the model, so anyone can run it on their own chips or rent it from a host. This site's open-weight labs include DeepSeek, Alibaba's Qwen team, Moonshot, MiniMax, Zhipu and StepFun, all of them Chinese; Meta's Llama models are open too, though this site counts Meta among the frontier labs and Mistral among the new labs. David Ricardo, an English economist who asked in 1817 why landlords grew rich when bread grew dear, found that the owner of the scarcest input collects a rent: profit above what it takes to keep a business going, earned because something holds rivals off. A model anyone can copy is not scarce, so the lab that publishes it collects little rent on it; this site judges that it earns instead through hosting its own model, selling a better closed version, or serving a parent company or state that wants the model to exist."
    case: "These readings cover all open models, including Meta's and Mistral's, not only this group's. Open models trail the best closed ones by [fact:open_lag] on this site's latest reading, and on OpenRouter, a service that routes developers' requests to many models, they took [fact:open_share] of the tokens among its most used models, though OpenRouter's users lean towards cheap models and firms that buy from the labs directly never appear there. This site reads the open models' gap to the closed frontier on Epoch's capability index (a score from Epoch, a research group that tracks AI, combining many tests of what a model can do) as unclear: it moves both ways between readings. The labs' finances differ: for MiniMax and Zhipu, a year of revenue at the current pace now exceeds what they raised in their share listings, the only rounds this site records for them; for DeepSeek it is far below."
    kill_shot: "Closed labs keeping their prices on models that open ones already match, with open models' share of use falling; or an open-weight lab earning a lasting profit on the model itself rather than on hosting, services or a parent."
    rival: price_holds
    direction: commoditising
    commoditising: "The open model is a commodity by design: many hosts serve the same weights and compete on price, so the price of running it falls towards the cost of the chips and power. William Nordhaus, an economist who measured how much of the value of new inventions their makers keep as profit, found that it is a small part; most goes to buyers as lower prices and better products. This site judges open-weight labs are the clearest case of it in AI: the buyers and the hosts keep most of what the model is worth."
    stays_scarce: "This site judges that what stays scarce is the skill to train a model near the frontier on fewer chips, which some of these labs have shown, and the chips themselves, which export rules make harder for Chinese labs to buy. Hamilton Helmer, a strategy consultant who studied why some firms keep earning more than their investors could expect elsewhere, found that a lasting advantage is a benefit behind a barrier; this site finds none proven for the open-weight labs, because a skill that shows up in a published model can be studied and copied."
    powers: []
    converts_if: "An open-weight lab's parent earns what the lab gives away: a cloud whose customers come for the free model and stay for the services, which David Teece, an economist who studied why inventors often fail to keep the returns from what they invent, would call owning the complementary assets (the hosting, sales and systems a product needs to reach buyers). Or giving the model away becomes counter-positioning in Helmer's sense, a model a closed lab cannot copy without cutting into its own paid business, with the parent collecting the reward."
