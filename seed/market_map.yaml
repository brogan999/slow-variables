# The granular value-chain market map (Part 33). Categories and leaves are Alex's taxonomy; every sub-layer has one default
# category, and an entity's own places in seed/entities.yaml override it. Excluded entities are off the map only.
credit: Taxonomy by Alex Brogan (published 28 Sep 2026, Part 33). Placements are this tracker's, from the sources named on
  each place; defaults follow each company's primary sub-layer.
layers:
- id: physical_compute
  number: 1
  name: Physical inputs and compute supply
- id: models
  number: 2
  name: Models and capability production
- id: data_training_verification
  number: 3
