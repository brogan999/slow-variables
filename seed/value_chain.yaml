    why: "Emerging, not proven. A cornered resource is preferential access to something others need. It owns X, a large real-time stream of posts and an audience that Grok can reach directly; the benefit is data and distribution, and the barrier is that no rival owns X. But the segment also sells X's data to others under data licences, advertising on X fell in the latest quarter, and the audience figure is xAI's own, so this site does not count the barrier as proven."
