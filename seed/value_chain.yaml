- entity: scale_ai
  role: candidate
  units:
  - vc_human_data
  market: "Scale AI sells human data: training data made or checked by people, from simple labelling to expert work, which AI labs use to teach and test their models. It also sells applications: AI systems built on top of models, which its enterprise page says it builds, deploys and runs for businesses and delivers to governments. It calls its data engine the foundation of model building at many of the major frontier labs (the firms building the most capable AI systems); that is its own description. In June 2025 Meta, which also builds frontier models, bought a non-voting minority stake; Meta's quarterly filing says Meta has no significant influence over Scale's operations. The deal also widened Scale's commercial work for Meta, paid money from the investment out to Scale's shareholders, and took Scale's founder, Alexandr Wang, to Meta to work on its AI, while he stayed on Scale's board; by July 2026 Scale described him as its chairman. After a year under an interim chief executive, it named Francis deSouza, a former Google Cloud and Illumina executive, as chief executive from August 2026. Its enterprise page says it builds, deploys and runs AI systems for businesses, names fields such as energy, insurance, health, retail and life sciences, and says its systems work with any leading model or with open-source ones (models whose makers publish them for anyone to run and change). This site reads that as a move from selling data to the labs towards doing the work for ordinary companies. How big the market becomes depends on whether labs keep buying human data from outside firms, and on whether its applications business grows into a second market."
  customers: "Frontier labs, large businesses and governments. At the time of the Meta deal, a press report in this site's records named Google, Microsoft and OpenAI, all rivals of Meta, among its customers. In July 2026 it named BP and Mayo Clinic as new business customers and said its work for the US and other governments had grown; it lists the US Department of War among the organisations it serves. Its enterprise page carries praise from executives at Howard Hughes and Global Atlantic, both business customers. The sources do not say whether rival labs cut their work with Scale after Meta's investment, and this site has no record of it either way. This site judges the data business is concentrated in a few labs, Meta among them, and that the government and business side is broader."
  concentration: concentrated
  powers:
  - power: switching_costs
    why: "Emerging, not proven. Hamilton Helmer, a strategist, listed seven sources of lasting profit and required each to have both a benefit and a barrier to copying. The benefit is repeat government and business work; this site judges the barrier is the security approval and integration a government buyer would have to redo to move its programmes elsewhere. This site has no measure of customers staying for that reason."
