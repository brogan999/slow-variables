  market: "Alphabet sits in two parts of the chain. As a cloud, Google Cloud rents computing, storage and AI services, offering both graphics processors (GPUs) and its own tensor processing units (TPUs, chips Google designs for the maths AI models run on; the filing names Ironwood as its seventh generation), plus Vertex AI, a platform for building on its Gemini models and other companies' models, and Workspace office software. As a frontier lab (a company building the most capable AI models), it develops the Gemini models, which the filing says run across all of its largest consumer products, including Search through AI Overviews and AI Mode. The filing says the cost of developing its general AI models sits in Alphabet-wide costs rather than in the Google Cloud segment, and that cloud margins are generally lower than advertising margins. It spent heavily on capital (buildings and equipment) in 2025 and said it expected to raise that spending significantly in 2026. This site's filed figures show the Google Cloud operating margin (the share of sales left after running costs) rising sharply over the past year from the lowest among the big clouds. This site judges its market is both renting AI computing and selling AI inside its most widely used consumer products, and that owning chips, models and distribution together is rare."
  customers: "Advertisers across the world pay for most of Alphabet's revenue, and the filing names no customer large enough to report separately. Google Cloud sells to businesses and developers; the filing says its remaining performance obligations (revenue contracted but not yet recognised) relate primarily to Google Cloud, and that it has a number of large, long-duration commercial agreements. It also says it has made debt and equity investments in companies with which it signed commercial arrangements at or near the same time, and that if such an investment were impaired it might have to reduce the related contracted revenue; the filing does not name those companies. This site's records hold equity investments by Google in Anthropic, which has also signed for Google's TPU capacity. Alphabet enters significant leases with outside data-centre operators, and has given credit backstops (promises to cover a borrower's debts if it defaults) to data-centre entities it does not control."
  concentration: diffuse
  powers:
