- entity: sk_hynix
  role: candidate
  units:
  - vc_memory_networking
  market: "SK hynix makes DRAM (the working memory a processor reads and writes constantly), NAND (storage that keeps data when power is off) and high-bandwidth memory, or HBM (DRAM dies, single chips cut from a silicon wafer, stacked and placed beside an AI chip so they can feed it fast). Its own results post for 2025 says record results came from AI memory, that its HBM revenue grew sharply, that demand for ordinary server memory also rose sharply, and that it was the first in the industry to complete the preparations to mass-produce HBM4, the next generation, while still supplying the previous one. It is building new factories in Korea and advanced packaging plants (where chips and memory are mounted together) in Korea and Indiana. It files no reports with the US regulator, so this site records no filed figures for it; its only source here is that short post, which is the company describing itself, not an audited filing. This site judges memory to be historically cyclical and commoditised, and a record year says nothing on its own about the next downturn."
  customers: "The results post names no customers and gives no concentration figures. It describes demand from AI memory and from server memory and storage. That a few AI chip designers buy most HBM is this site's judgement from the market's shape, not from this source."
  concentration: concentrated
  powers:
  - power: process_power
    why: "Emerging, not proven. Its post says it was the first in the industry to be ready to mass-produce HBM4 and supplies both current generations at once; this site judges the benefit is earlier orders at the best prices, and the barrier is how long it takes to learn to stack dies with good yield (the share of units that work)."
  - power: scale_economies
    why: "Emerging, not proven. This site judges it one of three firms with DRAM factories at the newest processes; the cost of a new factory keeps newcomers out, though not its two peers."
