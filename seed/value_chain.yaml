  - "Its work inside large firms, where it sits beside engineering teams and systems integrators, holds customers better than a lab selling the same agent directly. David Teece, an economist who studied why inventors often fail to keep the returns, found that profit tends to go to whoever holds the assets a product needs to reach buyers. Here the labs hold the model and Cognition holds the enterprise relationship; this site judges the model the harder of the two to replace, so the labs, not Cognition, hold the asset that decides who keeps the gain."
