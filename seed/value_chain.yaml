- entity: mercor
  role: candidate
  units:
  - vc_human_data
  market: "Mercor runs a marketplace that connects experts, such as doctors, bankers and lawyers, with AI labs and businesses that pay them to train and test AI models. The experts write the questions, judge the answers and turn their own work into evaluations (tests a model can be scored and trained against). It says it sits where the labour market meets AI research, and it says its latest money goes to a larger talent network, better matching and faster delivery. Its Form D (the notice a private company files with the US regulator when it sells shares without a public offering) shows a Delaware company, formed in 2022, that sold all of the shares offered in its late-2025 round without paying any placement agent (a bank paid to find investors), and that declined to disclose its revenue. In this site's records its gross revenue run-rate (the latest month's billings scaled up to a year, before paying its experts, as this site reads 'gross') grew steeply in the first months of 2026; that figure comes from its chief executive and from a press report citing a person who knows its finances, so it is self-reported, not audited. In July 2026 it bought Deeptune, a maker of training environments (simulated workplaces where a model practises tasks and is graded). How big the market becomes depends on how long labs keep paying people to teach models, and whether businesses outside the labs start paying too."
  customers: "AI labs and businesses; the sources name none. A press headline in this site's records ties its growth to AI labs buying expert data. This site judges its revenue is concentrated in a few frontier labs."
  concentration: concentrated
  powers:
  - power: network_economies
    why: "Emerging, not proven: Hamilton Helmer, a strategist who listed seven sources of lasting profit and required each to have both a benefit and a barrier to copying, counts a network as a power when each new user makes the product better for the rest. More experts could let Mercor fill more lab projects faster, which draws more projects and so more experts. The barrier is weak while experts can sign up with several vendors at once and this site tracks many rival vendors; there is no retention evidence."
  depends_on:
  - training_data
  - post_training
  - evaluations
  - capital
  rent_kind: scarcity
  appropriability: weak
  complementary_assets: generic
  asset_owner: platforms
  durability: short
  must_be_true:
  - "Labs keep buying expert work from outside firms rather than hiring the experts themselves. Ronald Coase, an economist, asked why firms make some things in-house and buy others, and found they buy when using the market costs less than organising the work themselves; this site reads Mercor's case as that recruiting and checking experts across many fields is cheaper done once for many labs."
  - "Its network compounds. On the tests of Andrei Hagiu and Julian Wright, economists who set out tests for when data really keeps rivals out, among them whether what a firm learns from one customer improves the product for the others, what Mercor learns about which expert does which task well has to improve matching for every lab, not only the lab that paid for the project."
  - "What it keeps from each dollar a lab pays holds up as rival vendors compete for the same experts and the same projects."
  - "Businesses outside the labs start paying for expert-built evaluations and training environments, which is where its Deeptune purchase points."
  - "Demand for people to teach models does not fall away as models learn from graded outcomes and from data they generate themselves."
  would_disprove:
  - "Its self-reported run-rate flattening or falling while labs' spending keeps rising."
  - "Labs moving expert work in-house or buying vendors outright; a fall in this site's count of labs buying from the training-input layer would be one sign."
  - "The data market splitting among specialist vendors by field, leaving no gain from one broad network."
  - "No named business customer outside the labs as its environments business grows."
