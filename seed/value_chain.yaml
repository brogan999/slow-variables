# The value-chain company profiles: this site's judgement, drafted by a model from each company's own filing and
# the site's readings (scripts/value_chain_sources.py fetches the filings). Layer judgements are outlook positions
# with a `layer`. No figures: scale comes from observations.
companies:
- entity: asml
  role: candidate
  units:
  - vc_semis
  market: "ASML sells lithography machines, the tools that print a chip's circuit pattern with light onto a wafer (a thin silicon disc later cut into chips), plus the service, upgrades and software that keep them running. Its most advanced line uses extreme ultraviolet light (EUV, light of a very short wavelength that can print the finest features). Its newest EUV design, High-NA (optics that gather more light, to print still finer features), has gone mostly to customers' research sites, and the filing says ASML has now released its first full-specification High-NA machine to its first customer. The filing says ASML is currently the world's only maker of EUV machines, and names Canon and Nikon as rivals only in the older deep-ultraviolet machines. Its buyers are chip factories making logic (processors) and memory. In 2025 its logic sales grew, driven by foundries (factories that make chips to other firms' designs) building for AI demand, while its memory sales fell; sales of older machines in China were stronger than it expected. ASML files a 20-F (the annual report foreign companies file with the US regulator) under IFRS, the international accounting rules, so this site's filing reader records no figures for it."
  customers: "A small group of chip makers: the leading logic foundries and the memory makers. The filing does not name them, but says its largest customer's share of its sales rose in 2025 and that its sales lean heavily on its two largest customers. The rankings shift from year to year."
  concentration: concentrated
  powers:
  - power: cornered_resource
    why: "An exclusive arrangement with Carl Zeiss SMT, its sole supplier of optics, in which ASML holds a stake, and no EUV rival named in its own filing; this site judges the benefit is pricing and the barrier is the long joint optics work a rival would have to repeat."
  - power: scale_economies
    why: "This site judges that each EUV generation takes years of research spread over every machine sold, so a rival would need the same volume of sales to carry the same cost."
  - power: switching_costs
    why: "Customers design their factory processes around its machines and buy its service and upgrades for years after; its service and upgrade sales grew faster than machine sales in 2025, though the filing says part of that came from upgrades to installed EUV machines being counted there instead of as machine sales."
  depends_on:
  - chip_equipment
  - foundry
  - memory
  - capital
  - minerals
  rent_kind: scale_network
  appropriability: tight
  complementary_assets: specialised
  asset_owner: innovator
  durability: long
  must_be_true:
  - "The world keeps building factories for the newest processes (the latest generations of chip-making, which print the smallest features) in logic and memory faster than old ones retire, so demand for EUV machines grows rather than just replacing worn tools."
  - "Chip makers keep shrinking features with lithography rather than with other processes that would need fewer of its machines; the filing names competition from alternative technologies or manufacturing processes only in general terms."
  - "High-NA EUV reaches mass production and customers adopt it on the finest layers, so the next generation is also ASML's alone."
  - "Zeiss and ASML's other single-source suppliers can grow output fast enough that their capacity does not cap its sales for years at a time."
  - "Export rules between the United States, the Netherlands and China do not shut it out of a large block of buyers while a state-backed rival learns to build competing machines."
  would_disprove:
  - "A rival, including a state-backed Chinese maker, shipping working EUV-class machines to a paying customer's factory."
  - "Leading chip makers delaying or skipping High-NA for the finest layers and staying with older EUV plus extra patterning steps (printing the same layer more than once)."
  - "Its largest customers cutting orders for new EUV machines while AI chip demand still rises, showing the factories were built ahead of need."
  - "New export rules removing China from its buyers without other regions making up the older-machine sales."
