  market: "Nebius is a neocloud, a newer cloud built to rent out AI computing. It rents clusters of NVIDIA graphics processors (GPUs), including the GB200 and GB300 systems, in a data centre it owns in Finland and in built-to-order or shared sites in the United States, Europe and Israel, and sells software on top, including Token Factory, which serves open AI models and charges by the token (a small chunk of text a model reads or writes) instead of by the GPU-hour. It also owns smaller businesses, among them Avride, a self-driving developer. The company was called Yandex N.V. until 2024, when it sold all its businesses in Russia, which were almost all of the group at the time, and kept the AI cloud and a few smaller units. It files a 20-F (the annual report foreign companies file with the US regulator), but prepares its accounts under US accounting rules. This site holds filed figures on its debt, including its total debt and borrowing rates, but no filed revenue or capital-spending figures for it. This site judges its market is AI computing for customers the big clouds do not serve first, plus overflow capacity for the big clouds themselves."
  customers: "Until recently mostly short-term customers, the filing says. It has since signed multi-year contracts to provide dedicated GPU capacity to Microsoft, at a new site in New Jersey, and to Meta; both contracts give the buyer service credits (discounts owed when service falls short) or the right to end tranches (separate portions of the deal) if delivery is late. One Meta order obliges Meta to buy any capacity in certain clusters that Nebius fails to sell to other customers. Its largest customer took a large part of 2025 revenue, and one customer owed most of its receivables (money customers owe it) at the end of 2025. It relies on NVIDIA for its GPUs and named a strategic partnership with NVIDIA in March 2026. It funds itself with convertible notes (loans that can turn into shares), share sales, and advance payments from these large contracts. This site judges that the racks it rents out are a generic asset, which anyone with money, power and a supply of chips can assemble; the scarce inputs behind its business belong to others, NVIDIA's chips on one side and the demand of a few big buyers on the other."
