- entity: broadcom
  role: club
  units:
  - vc_semis
  market: "Broadcom sells two things. The first is chips, and in AI that means custom accelerators (chips it designs to each big buyer's own plan, which it calls XPUs) plus the Ethernet switches, network cards and optical parts that connect them. The second is infrastructure software, mostly VMware, which lets a company run many virtual computers on its own servers. Its semiconductor segment, the chip business it reports separately, brought in most of its revenue in the year to November 2025. This site judges its AI market grows if the largest buyers shift from buying NVIDIA's chips to designing their own, because Broadcom does design and production work for such buyers. This profile judges its rent for its AI chip role, custom accelerators and networking, not for VMware."
  customers: "Hyperscalers (the handful of companies that run the largest clouds), AI data-centre builders, and OEMs (original equipment makers that build servers, switches and racks). The filing says distributors take a large part of its sales and a few end customers a large part of its revenue, and it expects that concentration to continue. It does not name the custom-chip buyers."
  concentration: concentrated
  powers:
  - power: scale_economies
    why: "It reuses the same high-speed connection circuits and packaging know-how across many customers' custom chips; this site judges the benefit is a lower cost per design than a buyer designing alone would bear, and the barrier is the volume across customers that a newcomer design partner lacks."
  depends_on:
