- entity: meta
  role: club
  units:
  - vc_consumer_ai
  - vc_frontier_labs
  market: "Meta runs Facebook, Instagram, Messenger, WhatsApp and Threads, and its 10-K (the annual report US companies file with their regulator) says it earns substantially all its revenue from advertising on Facebook and Instagram. Its AI work sits on both sides of that business. It builds its own models. It released the Llama family openly, but its newest flagship, Muse Spark, released in April 2026, is its first frontier model without open weights; the 10-K says it expects to train a mix of open and closed models from here (an open model is one whose trained settings are published so anyone can run it). It offers Meta AI, an assistant available inside its apps, as a stand-alone app, on its AI glasses and on the web. And it uses AI to choose which posts and ads each person sees, which the 10-K credits with better ad targeting and measurement. It states a goal of building superintelligence, which it defines as AI that surpasses human intelligence. To pay for this it spends heavily on data centres: this site's records from its filings show its capital spending (money spent on buildings and machines) growing much faster than its revenue in 2025 and again so far in 2026, and its 10-K lists large commitments, mostly for data centres and for computing capacity rented from other firms. In October 2025 it entered an arrangement to co-develop a data-centre campus in Louisiana, in which it holds a minority interest. In June 2025 it bought a non-voting minority stake in Scale AI, a seller of training data made by people; its filings say it has no significant influence over Scale's operations, and Scale's founder joined Meta to work on its AI. This site's records also hold Meta agreeing to buy Manus and buying Limitless in December 2025 and Stilla in September 2026, and buying or hiring teams from other small AI firms in March 2026. Manus, maker of a general-purpose AI agent (software that carries out tasks such as research and building things for its user, rather than only answering), announced in December 2025 that it was joining Meta, but in April 2026 China's top economic planner, which reviews foreign investment, blocked the deal and ordered it withdrawn. In September 2026 Meta launched Muse, a personal agent that Meta says runs in its own walled-off computer in Meta's cloud with its own web browser, books travel, fills in forms and buys things after checking with the user, pays through Link, a checkout service built by Stripe, is free for most uses with paid plans for more, and does not share users' conversations with Muse, or the data in their Muse workspace, with Meta's ad systems. The question is whether AI adds to or eats into the advertising business that pays for it."
  customers: "Advertisers pay for substantially all of it, the 10-K says. It also says most of its revenue comes from marketers advertising on Facebook and Instagram, that they make no long-term commitments, and that the loss of marketers or cuts in their spending could seriously harm the business. It names no large customer. The users it reaches are counted in billions of daily visitors, a figure Meta measures itself and warns may be inaccurate. Meta AI earns no direct revenue that the 10-K reports; in September 2026 Meta began selling its models and agents to businesses and developers through a new line, Meta Enterprise Platform. This site judges the paying base is diffuse, spread across many advertisers."
  concentration: diffuse
  powers:
  - power: network_economies
    why: "Hamilton Helmer, a strategy consultant who studied why some firms keep earning more than their rivals, found that a lasting advantage needs both a benefit and a barrier to copying. In Meta's social apps the benefit is that each user makes the apps more useful to friends and more valuable to advertisers; the barrier is that a rival must assemble a comparable audience first. The 10-K shows the audience still growing in 2025, with more ads shown and a higher average price per ad, so this site counts the power proven in its social apps. It finds no evidence yet that the power extends to Meta AI itself, where one person's chat does not improve another's."
  - power: scale_economies
    why: "Emerging, not proven. This site judges that the cost of training models and building ad-ranking systems is spread over Meta's very large audience and ad sales, so each user costs it less than a smaller rival; but the barrier holds only against newcomers, not against Google or the frontier labs (the firms building the most capable AI systems), which spend at similar scale and are its main AI rivals."
  - power: counter_positioning
    why: "Emerging, not proven, and weakening. Counter-positioning is a newcomer's model the incumbent could copy only by damaging its own business. The benefit is that Meta can give AI away inside its apps and let advertising pay; the barrier is that a lab living on subscriptions and paid access to its models would give up that revenue by doing the same. But the labs can add advertising too, and in September 2026 Meta itself began selling its models and agents to businesses and developers through Meta Enterprise Platform, on top of paid Muse plans, the same paid access a lab lives on; so this site does not count the barrier as proven."
  depends_on:
  - accelerators
  - data_centres
  - energy
  - pretraining
