  market: "xAI builds Grok, a frontier model (one of the most capable AI systems of its time), and since February 2026 has been part of SpaceX, where it forms the AI segment (a separately reported business line). That segment sells advertising on X, the social network xAI absorbed in 2025; subscriptions to X and Grok; data licences; API access (a connection other software uses to send requests to Grok and pay per use); and, since 2026, cloud services, renting its own computing power to other firms. Its 10-Q (the quarterly report US companies file with their regulator) says the segment's revenue rose sharply in the latest quarter mainly because it began selling that computing capacity, while advertising fell during a move to a new ad system. The segment still runs at an operating loss (costs above revenue). It runs its own Colossus data centres, measuring their installed power draw in gigawatts (a gigawatt is a very large amount of electric power, about what a big power station produces), though the 10-Q also cites rising cloud computing costs, and it is buying Cursor, a coding-tool company. How big the market becomes depends on whether it earns its return from Grok or from renting out the machines built to train it."
