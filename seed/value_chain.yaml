    why: "Its post says it was the first in the industry to be ready to mass-produce HBM4 and supplies both current generations at once; this site judges the benefit is earlier orders at the best prices, and the barrier is how long it takes to learn to stack dies with good yield (the share of units that work)."
  - power: scale_economies
    why: "This site judges it one of three firms with DRAM factories at the newest processes; the cost of a new factory keeps newcomers out, though not its two peers."
