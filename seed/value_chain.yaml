- entity: handshake_ai
  role: candidate
  units:
  - vc_human_data
  market: "Handshake AI, launched in 2025, is the part of Handshake that supplies AI labs with expert people to test and judge their models: they write subject-specific questions, assess the answers and grade their quality, in fields from law and finance to virology. Handshake runs the whole job itself, finding and training the experts, checking quality and producing the data on its own software. Its supply comes from its parent: Handshake is a careers network that links students and graduates with universities and employers, and it calls itself the largest early-career network in the world; that is its own description. Handshake AI says it draws experts straight from its university partners, so their degrees are verified rather than self-reported, and that this lets it spend less on recruiting than rivals do. In this site's records Handshake told the press that the unit's gross revenue run-rate (the latest month's billings scaled up to a year) went from nothing to a large figure in little more than a year; that is self-reported, not audited. How big the market becomes depends on how long labs keep paying graduate-level experts to teach models."
  customers: "Leading AI labs, which the sources do not name. This site judges its revenue is concentrated in a few frontier labs."
  concentration: concentrated
  powers:
  - power: cornered_resource
    why: "Emerging, not proven: Hamilton Helmer, a strategist who listed seven sources of lasting profit and required each to have both a benefit and a barrier to copying, counts preferential access to a valued input as a power. The benefit is cheaper, credential-checked recruiting through long-standing university partnerships. The barrier is unproven: universities are not bound to one partner, and the same graduates can work for rival vendors."
  depends_on:
  - training_data
  - post_training
  - evaluations
  - capital
  rent_kind: scarcity
  appropriability: weak
  complementary_assets: generic
  asset_owner: platforms
  durability: short
  must_be_true:
  - "Labs keep buying expert judgement from outside firms. Ronald Coase, an economist, asked why firms make some things in-house and buy others, and found they buy when using the market costs less than organising the work themselves; Handshake says it reaches graduate experts more cheaply than rivals that spend heavily on recruiting, and a lab keeps buying only while that stays cheaper than doing the work itself."
  - "Its university network stays a cheaper and more trusted route to experts than rivals' recruiting, and universities keep endorsing the work for their students."
  - "Its supply compounds. On the tests of Andrei Hagiu and Julian Wright, economists who set out tests for when data really keeps rivals out, among them whether what a firm learns from one customer improves the product for the others, knowing which graduates do which lab task well has to improve the service for every lab, not just one."
  - "Demand for graduate-level human judgement outlasts models learning from graded outcomes and from data they generate themselves."
  would_disprove:
  - "University partners limiting the work or signing with rival vendors."
  - "Labs moving expert work in-house or buying vendors outright; a fall in this site's count of labs buying from the training-input layer would be one sign."
  - "Its self-reported run-rate flattening while rivals' keep rising."
