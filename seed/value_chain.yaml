  market: "Lovable lets people who cannot code build websites and apps by describing what they want to an AI in plain words, and then host them (run them on its own servers so others can use them); it has added hosting, databases, logins and payments so the result can be a working business, not only a mock-up. It says people have created a very large number of projects since it launched in November 2024 and that its users' apps draw a very large number of visits each month. It says it draws on several models, matching each part of a job to the one best suited, and post-trains open-source models (further trains freely published models on its own data). Its Form D (the notice a private company files with the US regulator when it sells shares without a public offering) shows a Delaware company formed in 2023 that had sold most of the shares offered in its mid-2026 round without paying any placement agent (a bank paid to find investors), and that declined to disclose its revenue. Its revenue figures in this site's records come from the company itself and rose sharply between mid-2025 and mid-2026; they are not audited. How big the market becomes depends on how many people and firms start making their own software, and whether the labs (the firms building the most capable AI systems) let a middleman keep that work."
