  market: "Fireworks sells inference (running a trained model to answer requests) for companies' developer teams, plus tools to fine-tune models (further train them on a customer's own data), train them with reinforcement learning (rewarding good answers) and evaluate them. It serves hundreds of open-weight models (models whose trained settings are published so anyone can run them). Its founders, who had built AI infrastructure at Meta, left PyTorch, an AI software framework, in 2022 on the bet that open models would catch up with closed ones and firms would want to own their AI. It calls itself the market leader in AI inference; that is its own description. It says its annualised revenue run-rate (the latest month's revenue scaled up to a year) passed a large milestone in 2026, and that almost all the tokens (units of text a model reads and writes) it serves come from models specialised on customers' own data; both are self-reported. An analyst's estimate in this site's records also shows a steep rise through early 2026. NVIDIA and AMD, the chip makers, are among its investors. How big the market becomes depends on whether serving open models stays a skilled service or becomes a commodity (a product bought on price alone)."
  customers: "It names Samsung, Uber, DoorDash, Notion, Shopify and Upwork, and says Cursor's coding models and Harvey's legal AI are built with it; Harvey, in a post in this site's records, says it post-trained a model with Fireworks, starting from an open model. It says it serves many thousands of companies. SpaceX, which owns xAI, a frontier lab (a firm building the most capable AI systems), agreed in June 2026 to buy Cursor; the deal was awaiting regulatory approval at SpaceX's quarterly filing for the middle of 2026. The sources give no revenue by customer; this site judges the base is broad but that a few large application companies weigh heavily."
  concentration: moderate
  powers:
  - power: switching_costs
    why: "Emerging, not proven. Hamilton Helmer, a strategist, listed seven sources of lasting profit and required each to have both a benefit and a barrier to copying. The benefit is repeat business from models tuned on a customer's data and improved by its users' feedback on Fireworks' stack. The barrier is weak: Fireworks' own pitch is that customers own their models, and open-weight models run on many rivals' platforms. This site has no retention evidence."
  depends_on:
  - accelerators
