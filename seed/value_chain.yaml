  market: "CoreWeave is a neocloud, a newer cloud built only to rent out AI computing. It rents large clusters of NVIDIA graphics processors (GPUs) with the networking, storage and management software to run them, and has bought developer-tool companies including Weights & Biases. The filing says it has been among the first to bring each new NVIDIA system to market and expects to be among the first with NVIDIA's next platform, Rubin. Customers mostly sign multi-year take-or-pay contracts (they pay for reserved capacity whether or not they use it), and it pays for its build-out mainly with debt secured on specific assets and backed by those contracts, plus company-level shares and debt. Its revenue and remaining performance obligations (revenue contracted but not yet recognised) grew steeply, and it has reported a net loss every year shown in the filing. This site judges its market is the overflow of AI computing demand that the big clouds and labs cannot or will not build themselves, and that its size depends on how long that overflow lasts."
  customers: "A few very large buyers. The filing says Microsoft, its top customer, accounted for most of its revenue in 2025 and that no other customer reached the reporting threshold. It has signed contracts under which OpenAI and Meta committed to large multi-year purchases and expects both to become significant customers; it also has a stock issuance agreement with OpenAI. It expects its dependence on a limited number of customers to continue. NVIDIA supplies all of its GPUs, since its customer contracts specify NVIDIA chips, and bought CoreWeave shares in January 2026; this site's records also hold an arrangement giving NVIDIA access to CoreWeave capacity left unsold. Its competitors include the big clouds, several of which are its customers. This site judges that the racks it rents out are a generic asset, which anyone with money, power and a supply of chips can assemble; the scarce inputs behind its business belong to others, NVIDIA's chips on one side and the demand of a few big buyers on the other."
