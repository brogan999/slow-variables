- entity: micron
  role: candidate
  units:
  - vc_memory_networking
  market: "Micron makes memory chips: DRAM (the working memory a processor reads and writes constantly), NAND (the storage that keeps data when power is off) and high-bandwidth memory, or HBM (DRAM dies, single chips cut from a silicon wafer, stacked and placed beside an AI chip so they can feed it data very fast). It sells to cloud firms, server makers, phone and PC makers and car makers, and reorganised in 2025 around business units, one of which serves the largest cloud buyers and holds all its HBM sales to data centres. Memory has long been a cyclical, commodity market: its 10-K (the annual report US companies file with their regulator) warns that an oversupplied market pushes prices down, and that heavy investment, including by Chinese state-backed makers, threatens oversupply. This site's filed figures show the swing: Micron made a gross loss (sales below the direct cost of making them) in 2023, and has since swung from losses to a gross margin, the share of sales kept after those costs, among the highest this site has recorded for it. How big the market becomes depends on whether AI keeps memory short, and for how long."
  customers: "Its ten largest customers account for a large part of revenue, and the 10-K singles out one unnamed customer, mostly served by the cloud memory unit, as a large buyer. Customers are generally reluctant to sign long fixed-price contracts, so prices and volumes are renegotiated as the market moves. A 2023 Chinese government ruling bars operators of critical information infrastructure in China from buying its products."
  concentration: concentrated
  powers:
  - power: scale_economies
    why: "Emerging, not proven. This site judges that a memory factory at the newest process costs so much that only a few firms can build one; the benefit holds against newcomers, but not against Samsung or SK hynix, which build at the same scale or larger."
  depends_on:
  - memory
  - accelerators
  - packaging
  - chip_equipment
  - capital
  rent_kind: scarcity
  appropriability: weak
  complementary_assets: specialised
  asset_owner: incumbents
  durability: short
  must_be_true:
  - "AI keeps raising the amount of memory each unit of computing needs, so memory demand grows faster than the makers can add capacity, cycle after cycle."
  - "HBM stays a different product from ordinary DRAM, bought on stacking skill and a long qualification (testing and approval) with each chip designer rather than on price per bit, the smallest unit of stored data."
  - "Micron keeps pace with SK hynix on each new HBM generation, including HBM4, instead of arriving after the best prices are gone."
  - "The memory makers do not all add so much capacity at once that the old glut returns."
  - "Chinese state-backed makers such as CXMT do not reach the newest processes and flood ordinary DRAM with cheap supply."
  would_disprove:
  - "Memory prices and Micron's gross margin falling back toward their 2023 lows while AI spending is still rising."
  - "Chip designers buying HBM on price alone and moving volume freely between suppliers from one generation to the next."
  - "Micron's HBM4 reaching volume later than its rivals' or failing a major customer's qualification."
  - "The memory makers' combined spending on new factories rising far faster than the growth in memory bits shipped."
