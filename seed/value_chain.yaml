- entity: nvda
  role: club
  units:
  - vc_semis
  market: "NVIDIA designs accelerators, chips built to do the huge number of simple sums that training and running AI models needs, mostly graphics processors (GPUs). It sells them as chips and as whole server racks, with the networking gear that ties many of them together and the software developers write their code against (CUDA, its programming platform). It does not make the chips itself: foundries, factories that make chips to other firms' designs, make its wafers (the silicon discs chips are cut from). Its filing says it brings out a new data-centre architecture every year. How big it can become depends, in this site's judgement, on how long the big buyers keep raising their spending on AI data centres."
  customers: "The filing lists cloud providers, newer specialist clouds it calls neoclouds, model makers, companies and governments. Most chips reach them through server makers and assemblers, so the direct customers are middlemen. In the year to January 2026 its largest direct customer and its second largest each took a large part of revenue, and the filing says some indirect buyers, reached through those channels, were also each large enough to disclose. This site judges that those end buyers are largely the same few companies designing chips of their own."
  concentration: concentrated
  powers:
  - power: switching_costs
    why: "Years of AI code, tools and staff skills are written for CUDA, so moving to another chip means rewriting and retesting; this site's filed figures show the benefit in a gross margin (the share of sales left after the direct cost of making them) well above AMD's even as rivals shipped."
  - power: scale_economies
    why: "This site judges that as one of the largest buyers of wafers, advanced packaging and memory it spreads a very large research budget over the most units, and that a new architecture every year is a pace a smaller rival cannot fund from its own sales."
  depends_on:
  - foundry
  - packaging
  - memory
  - accelerators
  - networking
  - energy
  - data_centres
  - capital
  rent_kind: scarcity
  appropriability: tight
  complementary_assets: specialised
  asset_owner: innovator
  durability: medium
  must_be_true:
  - "Spending on AI data centres by the largest cloud and platform companies keeps rising into the 2030s instead of being cut back after a stretch where AI revenue fails to cover it."
  - "Chips the big buyers design themselves (Google's, Amazon's, Meta's, and those Broadcom builds for them) stay a minority of AI computing shipped, so NVIDIA's buyers cannot replace it with their own designs."
  - "NVIDIA's gross margin stays well above AMD's and Broadcom's after supply of chips, packaging and memory catches up with demand, which would show the rent (profit above what it takes to keep a business going, earned because something holds rivals off) rests on software lock-in and not only on shortage."
  - "Software that lets the same model code run on any chip does not make the choice of chip a matter of price alone."
  - "It keeps first call on the leading foundry's newest process and on advanced packaging (mounting the chip and its memory together on one base), and that foundry keeps operating in Taiwan without interruption."
  - "Export controls stop short of shutting it out of markets beyond China, and a China-only product line is not the price of staying in the rest."
  - "Its own lending, guarantees and equity stakes in customers stay small next to sales, so demand is paid for by buyers and not by NVIDIA's balance sheet."
  would_disprove:
  - "The site's non-NVIDIA share of AI computing shipped rising until chips from other designers make up most of the AI computing shipped, and still climbing."
  - "NVIDIA's quarterly gross margin falling towards AMD's while the site's accelerator tightness word reads easing."
  - "A top direct customer's share of revenue falling sharply in the same year that customer announces a larger own-chip deployment."
  - "The largest cloud companies cutting capital spending quarter after quarter."
  - "New export rules requiring licences for sales to allied countries or to the Gulf, or a new write-down of chips it cannot sell."
  - "The site's reading of circular financing, chip makers funding the customers who buy their chips, growing faster than NVIDIA's revenue."
  - "The site's chip makers' share of gross profit with the cloud and labs falling while chips stay short, which would undercut the view that whoever holds the scarcest input collects."
