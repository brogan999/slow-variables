  - "It is paid in a way that shares in a medicine's value, such as licence fees, payments when a drug passes a milestone, or royalties (a share of each sale), rather than only fees for using its software; the sources give no terms."
  - "Its lead lasts long enough to become a power in the sense of Hamilton Helmer, a strategy consultant who found that a lasting advantage needs both a benefit and a barrier to copying. This site finds none proven today: its first model is published for anyone to build on, Alphabet's 10-K says its Isomorphic Labs applies AI to drug discovery, and the general frontier labs (the firms building the most capable AI systems), among them OpenAI, one of its own investors, could turn to the same problem."
