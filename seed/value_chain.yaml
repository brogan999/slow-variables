  - vc_agent_infra
  market: "Databricks, funded by private investors, calls itself the Data and AI company. It sells a platform, run on the big clouds of Amazon, Microsoft and Google, where companies store, clean and analyse their data and build AI on it. Its parts include the Lakehouse, its data-warehousing product (a database built for analysis); Unity Catalog, which controls who may see and use each piece of data; and a growing set of AI products. Among them are Agent Bricks, for building AI agents (software that carries out tasks rather than only answering), which it says measures how well models do on a customer's own task and then tunes them; Lakebase, a database it says is built for agents; Genie, which it calls an AI coworker that answers questions from a company's data; and Unity AI Gateway, which sends requests to different models and controls what they cost. In September 2025 it agreed a multi-year partnership with OpenAI to offer OpenAI's models, including its flagship model of the time, natively inside its platform, and it says it was among the first to host gpt-oss, OpenAI's open-weight model (one whose trained settings are published so anyone can run it). In August 2026 it said its revenue run-rate (the latest period's revenue scaled up to a year) had passed a large milestone after growing sharply, that its adjusted free cash flow (cash left after running costs and investment, on its own adjusted measure) was positive over the past year, and that it had closed a large strategic funding round led by Coatue; all of this is self-reported. The market map this site uses places it in inference serving (running trained models to answer requests) through computing clusters that the clouds manage. This site judges that serving is one part of a business that is mainly a data platform, and that its agent products place it equally in agent infrastructure. How big the market becomes depends on whether companies build their AI where their data already sits."
  customers: "Companies of every size. It says many thousands of organisations use it, including adidas, AT&T, Bayer, Block, Mastercard, Rivian and Unilever and most of the largest US companies, and that many customers each spend with it at a high annual rate; these are its own counts. OpenAI is a customer as well as a partner: the partnership release says OpenAI uses Databricks to process AI data for ChatGPT. The sources give no revenue by customer; this site judges the base is broad. David Teece, an economist who studied why the firm that invents something often fails to keep the returns, called the inputs a product needs to reach its buyers complementary assets, and found that whoever holds them often keeps the profit. This site judges that the one that matters here is the governed store of each company's data, and the permissions over it, which Databricks holds for its customers; the chips and data centres it runs on are generic and rented from the clouds."
  concentration: diffuse
  powers:
  - power: switching_costs
    why: "Emerging, not proven. Hamilton Helmer, a strategy consultant who studied why some firms keep earning more than their rivals, required each lasting advantage to have both a benefit and a barrier to copying. The benefit is repeat and growing spending from companies whose data pipelines, permissions and now agents are built on its platform; its self-reported growth and count of large-spending customers point that way. The barrier is untested: the sources give no figures on customers staying or leaving, its own site lists open-source technologies behind its platform, and the clouds it runs on sell data and agent platforms of their own."
  depends_on:
  - inference
  - agents
  - routing
  - deployment_platforms
  - data_centres
  rent_kind: scarcity
  appropriability: weak
  complementary_assets: specialised
  asset_owner: innovator
  durability: short
  must_be_true:
  - "Companies build their AI agents where their data already sits rather than inside the clouds' own platforms or the labs' products; Microsoft's 10-K describes Azure AI Foundry, and Alphabet's describes Vertex AI, as platforms for building agents, sold alongside the computing Databricks rents from them."
  - "The clouds keep hosting it on fair terms while selling rival platforms. Oliver Williamson, an economist who studied contracts, found that a buyer that depends on an asset built for it can be squeezed by whoever owns it; this site judges Databricks depends on the clouds' computing, but that computing is generic and sold by several clouds, which limits the squeeze."
  - "Models stay interchangeable enough that companies want a neutral place to choose and govern them; its AI gateway and its hosting of OpenAI's models, including the open-weight gpt-oss, rest on that. This site judges that if a single lab's models pulled far ahead and that lab sold directly to companies, the neutral layer would matter less."
  - "Serving models inside its platform earns more than a commodity price (a price set by competition alone); this site judges that serving a published model is close to a commodity, so its margin must come from governance and closeness to the data."
  - "OpenAI keeps its models available natively on Databricks, rather than steering companies to its own enterprise products."
  - "Its self-reported growth and cash flow hold up in audited accounts, which this site does not yet hold."
  would_disprove:
  - "Large customers moving their agent work to a cloud's own agent platform or a lab's enterprise product while keeping only their data on Databricks."
  - "Its reported growth slowing sharply while the clouds' own AI platforms grow faster."
  - "OpenAI ending or narrowing the partnership."
  - "Price cuts on its model serving without a matching rise in use."
  - "Audited accounts, once published, showing large customers leaving or cutting their spending."
