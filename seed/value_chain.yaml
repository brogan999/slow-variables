  market: "Baseten sells inference (running a trained model to answer requests) and post-training (further training a finished model on a customer's own data and tasks) to companies building AI products. It runs models for customers on dedicated capacity or through ready-made model connections, in its cloud, in the customer's own or across both, and its engineers embed with customers to post-train and tune specialised models. Its case is that open-weight models (models whose trained settings are published so anyone can run them) are now good enough to replace closed models for many firms, which then want to own a model shaped by their own data. It says its revenue and the volume it serves both grew steeply over the past year; that is self-reported. This site's other readings, from a press report and an analyst's estimate, also show a steep rise in early 2026. Its Form D (the notice a private company files with the US regulator when it sells shares without a public offering) shows an offering of shares first sold in June 2026, mostly sold at filing, with no placement agent and revenue not disclosed. How big the market becomes depends on whether serving open models stays a skilled service or becomes a commodity (a product bought on price alone)."
  customers: "Fast-growing AI application companies. It names Cursor, Notion, Lovable, Harvey, HubSpot, OpenEvidence, Abridge, Decagon and Parallel. SpaceX, which owns xAI, a frontier lab (a firm building the most capable AI systems), agreed in June 2026 to buy Cursor; the deal was awaiting regulatory approval at SpaceX's quarterly filing for the middle of 2026. The sources give no revenue by customer; this site judges a few large application companies weigh heavily."
  concentration: moderate
  powers:
  - power: switching_costs
    why: "Emerging, not proven. Hamilton Helmer, a strategist, listed seven sources of lasting profit and required each to have both a benefit and a barrier to copying. The benefit is repeat business from customers whose post-trained models and tuned serving run on Baseten. The barrier is weak: Baseten's own pitch is that customers own their models, and open-weight models run on many rivals' platforms. This site has no retention evidence."
