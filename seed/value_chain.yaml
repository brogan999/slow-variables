    why: "Emerging, not proven. Hamilton Helmer, a strategy consultant who studied why some firms keep earning more than their rivals, found that a lasting advantage needs both a benefit and a barrier to copying; a cornered resource is preferential access to something others need. The benefit is answers grounded in leading journals' full text; the barrier would be that rivals cannot get the same licences. The releases do not say the licences are exclusive, and the journals could license others, so this site does not count the barrier as proven."
