  market: "Anysphere makes Cursor, a code editor (the program in which developers write and read code) built around AI that suggests code, answers questions about a codebase and runs agents (AI programs that carry out whole tasks on their own). It is now part of SpaceX, the rocket and satellite company that also owns xAI, a lab building frontier models (the most capable AI systems of their time). SpaceX's 10-Q (the quarterly report US companies file with their regulator) says it took an option to buy Cursor in April 2026, exercised it in June 2026 and signed a merger agreement paying in its own shares, subject to regulators' approval; it also says that alongside the option it agreed to give Cursor computing capacity and to work with it on improving xAI's Grok models and developing new ones jointly. Cursor's own post says the purchase was completed in August 2026. Cursor says the deal gives it access to what it calls the largest fleet of AI chips in the world, to train stronger models that cost less to run, and that same month it released a Grok model, the family xAI builds, made with SpaceX. Before the deal it said in November 2025 that its in-house models generated more code than almost any other model in the world, and that its revenue had passed a large milestone; press reports in this site's records, citing people familiar with the company, show its run-rate (a recent month's revenue scaled up to a year) rising sharply between February and June 2026. These figures are self-reported or sourced to people close to it, not audited. Because Cursor is now a business line inside SpaceX, the question of a trillion-dollar company applies to SpaceX and xAI as a whole; this profile judges Cursor as a business line whose fate depends on the conditions in this site's xAI profile."
  customers: "Individual developers and engineering teams; it says millions of developers and many large engineering organisations use it. It gives no revenue by customer. This site judges the base is diffuse, though it cannot tell how much of the revenue large companies bring."
  concentration: diffuse
  powers:
  - power: switching_costs
    why: "Emerging, not proven. Hamilton Helmer, a strategy consultant who studied why some firms keep earning more than their rivals, found that a lasting advantage needs both a benefit and a barrier to copying. The benefit is the daily habit of developers who live in its editor and the settings and history a team builds up there; this site judges the barrier weak, because rivals offer much the same and a developer can try another editor alongside it, and it has no figures on users leaving."
