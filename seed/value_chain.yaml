- entity: apple
  role: club
  units:
  - vc_inference_serving
  - vc_consumer_ai
  market: "Apple designs and sells the iPhone, Mac, iPad, wearables and home devices, and sells services on them: the App Store, cloud storage, subscriptions, advertising, AppleCare and payments. Its 10-K (the annual report US companies file with their regulator), for the year to September 2025, says it designs nearly the entire solution for its products, from hardware and operating system to apps and services, and relies on outsourcing partners, mostly in Asia, to build them. The 10-K mentions artificial intelligence mainly among its risks: safety, copyright and regulation. Apple's machine-learning research site describes the models behind Apple Intelligence, its AI features: a small model that runs on the device itself, tuned for the chips Apple designs (Apple silicon), and a larger model that runs on Private Cloud Compute, Apple's own server platform, which it presents as part of its commitment to users' privacy. A software framework lets app developers build on these models. Apple says both models match or beat open models of similar size (models whose trained settings are published so anyone can run them); that is its own test, and a comparison with models of similar size, not with the frontier models (the most capable AI systems, from firms such as OpenAI and Google). The market map this site uses places Apple in edge inference: running a trained model on the user's own device rather than in a data centre. This site judges that Apple's AI market is not selling AI itself but keeping people on its devices and in its services: the 10-K shows its Services gross margin (the share of sales left after the direct cost of providing them) far above its Products gross margin, and rising again in 2025. How big this becomes depends on whether AI makes people buy new devices and stay in its services, or moves their daily habit to assistants that live in other companies' apps."
  customers: "People and businesses that buy its devices, directly and through indirect channels such as mobile carriers and other resellers; the 10-K says most of its net sales in 2025 went through indirect channels, and that its carriers accounted for a large share of its trade receivables (money customers owe it). The United States is its largest market; its sales in Greater China (China mainland, Hong Kong and Taiwan) fell in 2025. It also earns revenue from licensing arrangements with Google and other companies to offer their search services on its devices, and a commission on some purchases made through its App Store. The 10-K names no single customer as a large share of its net sales; the only single-customer exposure it discloses is in trade receivables. David Teece, an economist who studied why the firm that invents something often fails to keep the returns, called the inputs a product needs to reach its buyers complementary assets, and found that whoever holds them often keeps the profit; this site judges that Apple holds its own: the devices, the chips it designs, the App Store and the habits of the people who carry them."
  concentration: diffuse
  powers:
  - power: network_economies
    why: "Emerging, not proven. Hamilton Helmer, a strategy consultant who studied why some firms keep earning more than their rivals, required each lasting advantage to have both a benefit and a barrier to copying. The 10-K describes the loop: customers' decisions to buy its hardware depend in part on third-party apps, and developers weigh Apple's market position and expected sales when deciding whether to build for it. It does not show the barrier: it says its minority share of the global smartphone, computer, tablet and wearables markets can push developers toward rivals with larger shares, and that some rivals have large bases of active devices of their own. This site judges that the benefit shows in a Services gross margin far above its Products margin, but the filing does not tie that margin to the loop. Under the site's written rules that makes Apple's rent (profit above what it would earn in a fully competitive market) a scarcity rent, one that lasts while an input is short or a firm is first, and its durability short until a filing shows the barrier. This site finds no evidence that the loop extends to AI features, where one person's use does not improve another's."
  - power: switching_costs
    why: "Emerging, not proven. This site judges that an assistant which knows a user's messages, photos and habits on the device could make leaving costly. The barrier is untested: the 10-K reports no AI revenue or use, and assistants from other firms can run on the same phone."
  depends_on:
  - foundry
  - memory
  - inference
  - applications
  - deployment_platforms
  rent_kind: scarcity
  appropriability: weak
  complementary_assets: specialised
  asset_owner: innovator
  durability: short
  must_be_true:
  - "AI makes people keep buying and replacing its devices and keeps them in its services; the 10-K says competitors imitate its features and cut prices aggressively, and that Apple holds a minority share of the global markets for smartphones, personal computers, tablets and wearables."
  - "Running AI on the device stays good enough for everyday requests, so that its own chips, rather than rented data-centre chips, carry most of the work; Apple compares its small model with open models of similar size, not with the frontier models."
  - "When a request needs a stronger model than its own, Apple keeps the user inside its own interface and on its own terms, rather than users opening ChatGPT, Google's Gemini or another lab's app directly."
  - "Its revenue from letting Google and others offer search on its devices survives the remedies a US court ordered against Google in September 2025; the 10-K says that order may still change in further proceedings or on appeal, and that a reversal on appeal could bring remedies barring Google from offering Apple commercial terms for search placement. This site judges it must also survive any shift of people's questions from search to AI assistants."
  - "Courts and regulators leave it room to charge on its App Store; the 10-K describes a US court order barring it from charging a commission on certain purchases and a fine from the European Commission in April 2025 under the EU's Digital Markets Act. This site judges that if AI agents (assistants that act for their users, booking and buying) become where people pay, Apple keeps a share only while those purchases still pass through its devices and store."
  - "Its suppliers keep delivering; the 10-K says it relies on single-source partners for many components, some of them custom parts available from only one source, and on partners in Asia for final assembly of substantially all its hardware."
  would_disprove:
  - "Its Services gross margin falling for several years in a row."
  - "Device sales falling, or people keeping their phones longer, after its AI features launch."
  - "Its own models falling so far behind that it hands most AI requests to another firm's model, with that firm's brand shown to the user and much of the value paid to it."
  - "Appeals ending with Google barred from offering Apple commercial terms for search placement, or search revenue shrinking as people ask AI assistants instead."
  - "Regulators forcing it to allow other app stores and payment systems widely enough that its store commission falls."
