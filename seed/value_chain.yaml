    why: "One infrastructure serves Search, YouTube, Gemini and Google Cloud; this site judges the benefit is a lower cost for each unit of AI computing, and the barrier is the volume across its consumer products that a cloud-only rival does not have."
  - power: process_power
    why: "Process power is a way of working that takes rivals years to learn. It has designed TPUs through generation after generation alongside its own models, and the filing says it focuses on driving efficiency in its data centres; this site judges that designing chips and models together drives part of that efficiency, that the benefit is AI computing that depends less on buying NVIDIA's chips, and that the barrier is the years of joint chip, software and model work a rival would have to repeat."
