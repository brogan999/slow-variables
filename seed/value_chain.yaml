  market: "Amazon's cloud arm, Amazon Web Services (AWS), is a segment it reports separately. It rents on-demand computing, storage, databases, analytics and AI and machine-learning services to developers and to organisations of every size, from start-ups to government agencies. The filing says its cash capital spending (money spent on buildings and equipment) rose sharply in 2025, mostly on technology infrastructure, the majority of it to support AWS growth, and that it expected that spending to increase again in 2026. Having lengthened the estimated useful life of its servers in 2024, it shortened it for some servers and network equipment in 2025, citing the faster pace of AI technology, which raised its depreciation (the yearly charge for wear on equipment). This site's filed figures show the AWS operating margin (the share of sales left after running costs) holding steady through that record spending. This site judges its market to be the rented computing on which companies and AI labs train and run models, and that its size depends on how much AI work moves into the cloud rather than staying on companies' own machines or moving to the labs' own data centres."
  customers: "Developers and enterprises of all sizes; the filing discloses no customer large enough to report separately, and it says AWS holds most of its long-term customer commitments not yet recognised as revenue. It names Anthropic, a maker of AI models: Amazon has invested in Anthropic through convertible notes (loans that can turn into shares) and non-voting preferred shares (shares that rank ahead of ordinary shares for payouts but carry no vote), recorded large gains on those stakes in 2025, and has a commercial arrangement with Anthropic mainly for AWS cloud services, including the use of AWS's own chips. This site's records also hold an Anthropic commitment to Microsoft's cloud, so Anthropic is not AWS's alone. David Teece, an economist who studied why inventors often fail to keep the returns from what they invent, found that the firm holding the complementary assets (the distribution, sales and systems a product needs to reach buyers) often keeps the profit; this site judges that Amazon holds its own: its data centres and its customers."
  concentration: diffuse
