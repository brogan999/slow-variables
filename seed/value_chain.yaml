  market: "Harvey sells AI software for lawyers: tools to research, draft, review contracts and documents, and store a firm's files, plus agents (AI programs that carry out multi-step work on their own) that customers build and run on it. It says customers had built a very large number of custom agents on it by March 2026, and that its legal engineers (staff who combine legal training with technical skill) work beside customers to build and improve them. In August 2026 this site's records hold Harvey saying it had worked with Fireworks, a firm that runs and tunes models, to post-train (further train for legal work) a model starting from an open one, as a research preview; by September 2026 it described this as its first post-trained open-weight model (one whose trained settings are published). It also published its own test of legal work, in which, by its account in May 2026, the best general models finished few tasks end to end. Its Form D (the notice a private company files with the US regulator when it sells shares without a public offering) shows a Delaware company formed in 2022 that sold shares from late August 2026 without paying any placement agent (a bank paid to find investors) and declined to disclose its revenue. Its annual recurring revenue (what customers have signed up to pay in a year) grew sharply through 2026 according to its co-founder and press reports; those figures are self-reported, not audited. How big the market becomes depends on whether law firms pay for a legal specialist once general models learn the law."
  customers: "Law firms and companies' in-house legal teams. It says most of the largest US law firms by revenue and many of the world's biggest companies use it, and names NBCUniversal, HSBC, DLA Piper International, Corrs Chambers Westgarth and McCann FitzGerald among recent customers. OpenAI's venture fund is among its investors. It gives no revenue by customer. This site judges the base is moderately concentrated in large firms."
