- entity: samsung
  role: candidate
  units:
  - vc_memory_networking
  - vc_semis
  market: "Samsung Electronics is a conglomerate. Its chip division makes DRAM (working memory), NAND (storage) and high-bandwidth memory, or HBM (DRAM dies, single chips, stacked beside an AI chip so they can feed it fast), designs phone processors and camera sensors, and runs a foundry (a factory that makes chips designed by others). It also makes phones, televisions, home appliances, displays and car electronics. Its business report for 2025 says that, with low inventory and supply constraints in memory, it expanded HBM sales, and that it aims to supply HBM4 for new AI chips, both graphics processors and custom ones. The same report, citing the research firm DRAMeXchange, shows its share of world DRAM revenue falling in both 2024 and 2025. It signed a foundry contract with Tesla running to 2033. Samsung files no reports with the US regulator, so this site records no filed figures for it; its source here is its English business report."
  customers: "The report lists its major customers across the whole company, alphabetically: Alphabet, Apple, Deutsche Telekom, Hong Kong Techtronics and Supreme Electronics. It does not break out the buyers of its memory or HBM, which this site judges are far more concentrated than the company as a whole. The one long contract it lists is Tesla's, for foundry work."
  concentration: diffuse
  powers:
  - power: scale_economies
    why: "This site judges it one of three firms with DRAM factories at the newest processes, with cash from phones and appliances to keep building through a downturn; the barrier holds against newcomers, less so against SK hynix."
