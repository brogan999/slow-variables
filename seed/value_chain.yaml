- entity: openai
  role: candidate
  units:
  - vc_frontier_labs
  market: "OpenAI builds frontier models (the most capable AI systems of their time, trained on huge amounts of text and computing power) and sells them as products people and firms use directly, above all ChatGPT, its chat app, for which this site's records hold a very large weekly user count reported by OpenAI, and through an API (a connection that lets other companies' software send requests to the model and pay per use). Running a model to answer a request is called inference. OpenAI is now a public benefit corporation, or PBC (a for-profit company whose charter also commits it to a stated public purpose), and Microsoft, its long-standing investor, holds a large minority stake after the 2025 recapitalisation (a reorganisation of who owns the company). Its newer deals push toward selling whole systems to businesses: with Amazon it is building a runtime (the software layer an AI agent works inside, keeping memory of prior work and access to a firm's tools and data) for Amazon's cloud customers, and Amazon's cloud is the only outside cloud allowed to resell Frontier, its platform for running teams of AI agents inside a company. Microsoft may now pursue the most advanced AI on its own or with others, and OpenAI may now release open-weight models (models whose trained settings are published so anyone can run them) that meet capability criteria the agreement sets. This site's recorded revenue run-rate (the latest month's revenue scaled up to a full year) for OpenAI has grown steeply but in mid-2026 sat below Anthropic's. Run-rate figures are self-reported: the labs publish them or are the source behind press reports of them, and this profile rests on company and partner announcements, not audited filings. How big the market becomes depends on whether businesses pay for systems built around a model or only for the cheapest model that is good enough."
  customers: "Consumers, most directly through ChatGPT, businesses and developers, plus other large companies that build on its models: Amazon will tailor OpenAI models for its own customer-facing apps. Microsoft keeps rights to OpenAI's models and products into the 2030s, and a revenue-share agreement between the two stays in place until an expert panel confirms that OpenAI has reached artificial general intelligence (AI that matches people across most work). API products OpenAI builds with third parties must run on Microsoft's Azure cloud, while its other products may run on any cloud. The sources name no revenue share by customer; this site judges the base is broad, with a direct line to consumers through ChatGPT, but that Microsoft and Amazon stand between OpenAI and many business buyers."
  concentration: moderate
