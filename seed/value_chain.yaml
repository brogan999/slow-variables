  - vc_frontier_labs
  market: "Alphabet sits in two parts of the chain. As a cloud, Google Cloud rents computing, storage and AI services, offering both graphics processors (GPUs) and its own tensor processing units (TPUs, chips Google designs for the maths AI models run on; the filing names Ironwood as its seventh generation), plus Vertex AI, a platform for building on its Gemini models and other companies' models, and Workspace office software. As a frontier lab (a company building the most capable AI models), it develops the Gemini models, which the filing says run across all of its largest consumer products, including Search through AI Overviews and AI Mode. The filing says the cost of developing its general AI models sits in Alphabet-wide costs rather than in the Google Cloud segment, and that margins on its revenue outside advertising, Google Cloud among it, are generally lower than advertising margins. It spent heavily on capital (buildings and equipment) in 2025 and said it expected to raise that spending significantly in 2026; in 2026 it also began selling new shares and mandatory convertible preferred stock, set up a programme to sell more shares over time, and borrowed heavily in several currencies. This site's filed figures show the Google Cloud operating margin (the share of sales left after running costs) rising sharply over the past year from the lowest among the big clouds. This site judges its market is both renting AI computing and selling AI inside its most widely used consumer products, and that owning chips, models and distribution together is rare."
  customers: "Advertisers across the world pay for most of Alphabet's revenue, and the filing names no customer large enough to report separately. Google Cloud sells to businesses and developers; the filing says its remaining performance obligations (revenue contracted but not yet recognised) relate primarily to Google Cloud, and that it has a number of large, long-duration commercial agreements. It also says it has made debt and equity investments in companies with which it signed commercial arrangements at or near the same time, and that if such an investment were impaired it might have to reduce the related contracted revenue; the filing does not name those companies. Google invested again in Anthropic in April 2026 and promised more if Anthropic meets performance targets; Alphabet's quarterly filing records forward funding commitments of that kind, tied to milestones, on a strategic investment it does not name. Anthropic has also signed for Google's TPU capacity. Alphabet enters significant leases with outside data-centre operators, and has agreed to backstop payments on certain third-party data-centre leases (to cover them if the tenant defaults), with the right to take over the leases."
  concentration: diffuse
  powers:
  - power: scale_economies
    why: "One infrastructure serves Search, YouTube, Gemini and Google Cloud; this site judges the benefit is a lower cost for each unit of AI computing, and the barrier is the volume across its consumer products that a cloud-only rival does not have."
  - power: process_power
    why: "Process power is a way of working that takes rivals years to learn. It has designed TPUs through generation after generation alongside its own models, and the filing says it focuses on driving efficiency in its data centres; this site judges that designing chips and models together drives part of that efficiency, that the benefit is AI computing that depends less on buying NVIDIA's chips, and that the barrier is the years of joint chip, software and model work a rival would have to repeat."
