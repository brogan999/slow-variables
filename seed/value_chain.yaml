  market: "Cognition makes Devin, a coding agent: an AI tool that writes, tests and fixes software on its own, working from a task an engineer sets. It also owns Windsurf, a code editor (the program in which developers write and read code), which this site's records show it agreed to buy in July 2025. It calls itself an independent agent lab: it says it works with all the major labs (the firms that build the most capable AI systems) and uses the model best suited to each task, and it has begun training models of its own, which it says customers choose for cost and speed. It says its revenue run-rate (a recent month's revenue scaled up to a year) grew sharply between May and September 2026; that figure is self-reported, from its own posts, not audited. It has opened offices in several countries to work beside customers. How big the market becomes depends on whether firms keep paying an independent agent maker once the labs sell their own coding agents directly."
  customers: "Large companies and government. It names Citi, Mercedes-Benz, Goldman Sachs, Santander, Dell, NVIDIA, GE Aerospace, the US Army and the US Navy, and says systems integrators (firms that assemble technology for clients), among them Infosys and Cognizant, build Devin into the work they deliver. It gives no revenue by customer. This site judges the base is moderately concentrated in large firms."
  concentration: moderate
  powers:
  - power: switching_costs
    why: "Emerging, not proven. Hamilton Helmer, a strategy consultant who studied why some firms keep earning more than their rivals, found that a lasting advantage needs both a benefit and a barrier to copying. The benefit is repeat business as Devin is wired into a firm's code, tools and approval steps; the barrier is the setup a customer would redo to move. But a rival agent can be tried alongside it, Cognition itself offers every lab's model, and it publishes no figures on customers leaving, so this site does not count the barrier as proven."
