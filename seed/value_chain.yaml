  market: "Oracle sells database and business software and, increasingly, Oracle Cloud Infrastructure (OCI): rented computing from virtual machines and GPU (graphics processor) servers to bare-metal servers (whole machines rented without sharing), used for AI training and inference (running trained models), plus storage and networking. It also runs its database inside other companies' clouds, which it calls multicloud. The filing says cloud infrastructure became the larger part of its cloud revenue in the year to May 2026. To grow OCI it is spending heavily: its capital spending (money on buildings and equipment) rose steeply, its free cash flow (cash from operations after that spending, a measure the company itself reports), slightly negative the year before, turned deeply negative, and it issued new bonds, has mandatory convertible preferred shares (which must turn into ordinary shares later) outstanding, set up a programme to sell new shares into the market over time, from which it had sold none by the end of May 2026, and signed long leases with outside data-centre developers and large commitments to chip and equipment suppliers. Its remaining performance obligations (revenue contracted but not yet recognised) grew steeply, which the filing puts down mainly to certain significant cloud contracts signed in the year. This site judges its market is renting AI computing at very large scale to a few big buyers, a business whose size depends on those buyers' ability to pay."
  customers: "The filing names no AI customer. It says that in certain OCI offerings it is more concentrated among a number of large customers, that some customers may be highly leveraged (heavily borrowed), and that it takes prepayments on some committed contracts to manage credit risk. This site's records hold a press-reported agreement for OpenAI to buy computing from Oracle, which the filing does not itemise; nor does the filing mention the Stargate project by name. Oracle's older database and application customers are many and spread out. This site judges that the racks it rents out for AI are a generic asset, which anyone with money, power and a supply of chips can assemble; the scarce inputs behind that business belong to others, NVIDIA's chips on one side and the demand of a few big buyers on the other."
