  - "TPUs stay competitive with NVIDIA's chips generation after generation, and outside customers keep choosing them, turning a cost advantage into a cloud business."
  - "The Google Cloud margin keeps rising as the contracted backlog turns into revenue, even as the filing warns that margins outside advertising, cloud among them, are generally lower than advertising's."
