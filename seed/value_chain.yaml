- entity: palantir
  role: candidate
  units:
  - vc_deployment_services
  market: "Palantir sells software platforms that connect a large organisation's data to its daily operations, and its 10-K (the annual report US companies file with their regulator) names four: Gotham, Foundry, Apollo and AIP. AIP, its AI platform, connects customers securely to large language models (AI systems trained on huge amounts of text) made by other firms, and gives them tools to build agents (AI programs that carry out tasks on their own) on top. At the heart of its software is what it calls the Ontology, a map of how a customer's data relates to its real operations. It runs short workshops, which it calls bootcamps, that build working tools on a customer's own data within days, and it says it embeds its staff directly with customers. It warns that pilots given at little or no cost may never turn into paying contracts. Government customers brought in most of its revenue in 2025 and commercial customers the rest, and its revenue from US commercial customers rose steeply that year. How big the market becomes depends on whether fitting AI to a firm's operations stays a job for a software platform like Palantir's, or passes to the labs (the firms building the most capable AI systems), which have set up deployment arms of their own."
  customers: "Governments and large companies. The 10-K says no single customer reached the threshold at which the filing reports a customer's share of revenue in any year from 2023 to 2025, and that the average revenue from its twenty largest customers rose in 2025 over 2024. But its risk factors warn that a limited number of customers account for a substantial portion of its revenue, because existing customers have widened their use, and its notes show one customer owing it a large share of its receivables (money customers owe for work already billed) at the end of both 2024 and 2025. Many of its contracts can be ended by the customer at will, and the US federal government cannot take up contract options more than a year ahead. This site judges the base is moderately concentrated: no single buyer reaches the reporting threshold, but a limited number of customers, led by governments, carry much of it."
  concentration: moderate
  powers:
  - power: switching_costs
    why: "Emerging, not proven. Hamilton Helmer, a strategy consultant who studied why some firms keep earning more than their rivals, found that a lasting advantage needs both a benefit and a barrier to copying. The benefit is repeat, widening business from customers whose operations come to run on its Ontology; the barrier is the work a customer would have to redo to rebuild that map elsewhere. The 10-K reports customers expanding but gives no figure for how many leave, so this site does not count the barrier as proven; under its written rules that makes the rent a scarcity rent and its durability short until a filing shows customers staying."
  depends_on:
  - inference
  - agents
  - deployment_platforms
  - applications
  rent_kind: scarcity
  appropriability: weak
  complementary_assets: specialised
  asset_owner: innovator
  durability: short
  must_be_true:
  - "Its platform, not the model, stays where customers' work runs. AIP uses models made by others; this site judges that helps Palantir while the models are interchangeable, and hurts it if one lab's model becomes the product customers ask for by name."
  - "The labs' own deployment arms do not take its commercial customers. This site's records hold the OpenAI Deployment Company agreeing to buy Tomoro in May 2026 and Northslope in July 2026, both firms that put AI to work inside large companies, and Poolside, a lab, buying Fern Labs, a deployment firm, in November 2025. David Teece, an economist who studied why inventors often fail to keep the returns, found that profit tends to go to whoever holds the assets a product needs to reach buyers; here that is the customer relationship and the map of its data, which this site judges Palantir holds today for its own customers, and which the labs' deployment arms are trying to win."
  - "Its margins hold as it sends more staff into customers. Its contribution margin, its own measure of revenue left after the cost of serving and winning customers, rose in both its government and commercial segments in 2025. This site judges that a business that must grow its engineers with each customer earns a services margin (the thinner margin of a firm that sells its staff's time) rather than a software margin (the wider one of a firm that sells the same code again at little extra cost)."
  - "Its short pilots and bootcamps keep turning into long, paid contracts, which the 10-K warns may not happen."
  - "Governments and its other largest customers keep renewing their contracts, although many can be ended at will, budgets can stall, and the 10-K warns that a limited number of customers carry a substantial portion of its revenue."
  would_disprove:
  - "Large commercial customers moving their AI work to a lab's deployment arm or a lab's own platform."
  - "Its contribution margin falling as the staff it embeds with customers grows."
  - "Revenue from existing customers flattening while pilots fail to convert, which the 10-K names as a risk."
  - "A large government customer ending contracts for convenience or letting options lapse."
