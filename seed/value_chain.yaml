- entity: amd
  role: candidate
  units:
  - vc_semis
  market: "AMD sells processors for servers (EPYC), AI accelerators (Instinct, graphics processors, or GPUs, built for AI), chips for personal computers and games consoles, and programmable chips for industry. It offers rack-scale designs for AI and its own open software platform, ROCm, to compete with NVIDIA's CUDA, the software developers write AI code against. This site judges it the main other seller of general-purpose AI accelerators besides NVIDIA, and that its AI market is whatever share buyers give to a second source, an alternative supplier they can switch orders to: large if buyers want to stop depending on one supplier, small if NVIDIA and custom chips split the market between them."
  customers: "Large cloud companies, server makers and assemblers. The filing says a small number of customers account for a substantial part of revenue. In October 2025 it signed an agreement with OpenAI to deploy a very large amount of its GPUs, measured by the electricity they will draw, and at the same time issued OpenAI a warrant, a right to buy AMD shares at a nominal price, that vests as OpenAI meets GPU purchase milestones and AMD's share price hits targets."
  concentration: moderate
  powers: []
