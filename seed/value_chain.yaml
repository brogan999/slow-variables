- entity: chai_discovery
  role: candidate
  units:
  - vc_neolabs
  market: "Chai Discovery, founded in 2024 and based in San Francisco, builds AI models for pre-clinical drug discovery (the laboratory stage before a medicine is tested in people). Its models predict how molecules such as proteins, DNA and drugs fit together, and design new molecules from scratch, especially antibodies (proteins the immune system uses to latch onto a target). In September 2024 it released a model for predicting molecular structure, free to use through a web page, including for commercial drug discovery, and published its weights (the trained settings) and code under an open licence that lets anyone use and change them; it said the model scored slightly above AlphaFold, another structure-prediction model, on one published test; that is its own comparison. Its later models reach scientists at drug companies through its software platform; the sources do not say their weights are published. It says the model it released in 2025 was the first of its kind to reach high success rates in laboratory tests when designing antibodies from scratch, which it calls a step change over earlier computational methods, and that its latest model improves on it; both claims are self-reported. In July 2026 it announced a large Series C round (a later stage of venture funding) led by Index Ventures with Kleiner Perkins, Sequoia Capital and Dimension; OpenAI, which Chai's 2024 release thanks among its early backers, joined this round as an existing investor. How big the market becomes depends on whether designed molecules become medicines, and on who keeps the profit when they do."
  customers: "Large drug companies. The Series C release names Eli Lilly and Pfizer as partners whose scientists use its platform, and investors quoted in it say its models are already used at some of the world's largest drug makers. The sources give no revenue and no contract terms. This site judges its customers today are few and large. David Teece, an economist who studied why the firm that invents something often fails to keep the returns, called the inputs a product needs to reach its buyers complementary assets, and found that whoever holds them often keeps the profit; here they are the laboratories, clinical trials, regulatory approvals and sales forces that turn a designed molecule into a sold medicine, and this site judges they belong to the drug companies it sells to."
