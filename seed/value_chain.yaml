  market: "OpenEvidence answers doctors' clinical questions with AI, citing medical research, and offers a research agent that reads many studies and writes a report. Its answers draw on content from partners it names, among them the New England Journal of Medicine, the American Medical Association's JAMA journals, the National Comprehensive Cancer Network and the Cochrane Library. It offers its research agent free to verified US clinicians, and neither of its press releases says who pays for the service. It calls itself the fastest-growing application for physicians in history and says, in March 2026, that most practising US physicians use it daily; these are its own descriptions, made in press releases it issued itself. This site's records hold the company saying its run-rate (a recent month's revenue scaled up to a year) passed a large milestone in 2025, and a research firm's estimate that it rose sharply by July 2026; neither is audited. How big the market becomes depends on whether a free tool with doctors' daily attention can charge someone for it without losing that trust."
  customers: "Its users are doctors and other clinicians; the sources do not say that they pay, or who does, so this site cannot name its paying customers or say how concentrated they are. Alex Brogan judged the base diffuse, since it is spread across many clinicians and institutions."
