- entity: scale_ai
  role: candidate
  units:
  - vc_human_data
  market: "Scale AI sells human data: training data made or checked by people, from simple labelling to expert work, which AI labs use to teach and test their models. It also sells applications: software it builds and runs for businesses and governments on top of AI models. It calls its data engine the foundation of model building at many of the major frontier labs (the firms building the most capable AI systems); that is its own description. In June 2025 Meta, which also builds frontier models, bought a non-voting minority stake; Meta's quarterly filing says Meta has no significant influence over Scale's operations. The deal also widened Scale's commercial work for Meta, paid money from the investment out to Scale's shareholders, and took Scale's founder, Alexandr Wang, to Meta to work on its AI, while he stayed on Scale's board; by July 2026 Scale described him as its chairman. After a year under an interim chief executive, it named Francis deSouza, a former Google Cloud and Illumina executive, as chief executive from August 2026. How big the market becomes depends on whether labs keep buying human data from outside firms, and on whether its applications business grows into a second market."
  customers: "Frontier labs, large businesses and governments. At the time of the Meta deal, a press report in this site's records named Google, Microsoft and OpenAI, all rivals of Meta, among its customers. In July 2026 it named BP and Mayo Clinic as new business customers and said its work for the US and other governments had grown; it lists the US Department of War among the organisations it serves. The sources do not say whether rival labs cut their work with Scale after Meta's investment, and this site has no record of it either way. This site judges the data business is concentrated in a few labs, Meta among them, and that the government and business side is broader."
  concentration: concentrated
  powers:
  - power: switching_costs
    why: "Emerging, not proven: Hamilton Helmer, a strategist, listed seven sources of lasting profit and required each to have both a benefit and a barrier to copying. The benefit is repeat government and business work; this site judges the barrier is the security approval and integration a government buyer would have to redo to move its programmes elsewhere. This site has no measure of customers staying for that reason."
  depends_on:
  - training_data
  - post_training
  - evaluations
  - applications
  - capital
  rent_kind: scarcity
  appropriability: weak
  complementary_assets: generic
  asset_owner: platforms
  durability: short
  must_be_true:
  - "Labs keep buying human data from outside firms rather than building their own expert teams. Ronald Coase, an economist, asked why firms make some things in-house and buy others, and found they buy when using the market costs less than organising the work themselves; a lab keeps buying only while an outside vendor finds and checks experts more cheaply than it could."
  - "Rival labs keep trusting Scale with their training plans while a rival lab, Meta, holds a sizeable minority stake by a Scale spokesperson's account, and its founder works there. Oliver Williamson, an economist who studied contracts, found that firms bring in-house the work tied closely to their own plans; a lab's data requests reveal what it is trying to teach its models, which is the kind of work a firm is wary of handing to anyone tied to a rival. Meta's stake carries no vote, which is Scale's answer to that worry."
  - "Its applications business for firms and governments grows into a second large market, so Scale does not rest on the few labs that buy most human data."
  - "Human expert data stays needed as models learn more from graded outcomes and from data the models generate themselves."
  would_disprove:
  - "Frontier labs other than Meta dropping Scale as a named supplier, or naming rival vendors in its place."
  - "Labs building their own expert teams or buying data vendors outright; a fall in this site's count of labs buying from the training-input layer would be one sign."
  - "Its government and business customers staying a small side business beside the lab work."
  - "Meta taking a larger or voting stake, which would turn Scale into a supplier tied to one lab."
