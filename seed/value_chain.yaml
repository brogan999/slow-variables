  market: "TSMC is a foundry, a company that manufactures chips other firms design, printing them on wafers (thin silicon discs later cut into chips). It also does the advanced packaging (CoWoS and SoIC, ways of mounting a processor and its memory together on one base) that AI accelerators need. High-performance computing, which includes AI chips, made up most of its revenue in 2025, and chips at its most advanced nodes (its newest manufacturing processes, which print the smallest features) made up most of its wafer revenue. Its filing calls its scale and capacity, particularly for advanced technologies, a major competitive advantage. This site judges its market grows with every chip designer's AI demand, whoever among them wins. TSMC files a 20-F (the annual report foreign companies file with the US regulator) under IFRS, the international accounting rules, so this site's filing reader records no filed figures for it."
  customers: "Many customers, but its ten largest took most of its revenue in 2025, a share that has risen each year since 2023, while its single largest customer's share fell over the same years. The filing does not name them. The NVIDIA, Broadcom and AMD filings each name TSMC among the foundries that make their wafers."
  concentration: concentrated
  powers:
  - power: scale_economies
    why: "Its filing calls its scale and capacity at advanced technologies a major competitive advantage; this site judges that a factory for the newest process costs so much that only the foundry with the most such orders can fill one."
  - power: process_power
    why: "This site judges it brings new processes to high yield (the share of working chips per wafer) faster than rivals, learning that takes years; its filing notes that others have invested heavily to compete."
  - power: switching_costs
    why: "This site judges that a chip is designed to one foundry's rules, so moving costs a redesign and many months, and that packaging ties the chip to the same supplier."
