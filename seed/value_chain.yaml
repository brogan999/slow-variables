  market: "Microsoft sells software and cloud services. Its Intelligent Cloud segment (a part of the business it reports separately) holds Azure, its public cloud: computing, storage and AI services rented from its own data centres around the world and billed mostly by how much customers use. The filing says Azure offers AI computing at very large scale, the latest models, and hardware that includes chips Microsoft designs itself alongside chips from partners. It also sells AI inside products businesses already pay for, such as its office software and GitHub. In the year to June 2026 Azure revenue grew strongly, and the filing says the gross margin percentage of its cloud business (the share of sales left after the direct cost of providing it) fell because of spending on AI infrastructure and rising AI use. It warns that its AI and cloud investments will keep raising costs and may lower operating margins. This site judges its market to be both renting computing for training AI models and for inference (running a trained model to answer requests), and selling AI features to the companies that already run on its software. How big that becomes depends on whether AI revenue grows into the spending."
  customers: "Businesses of every size, developers and governments; the filing gives no single customer's share of total revenue. It does name OpenAI. Microsoft holds a large minority stake in OpenAI, accounted for by the equity method (it records a share of OpenAI's results rather than adding in OpenAI's whole accounts), which makes OpenAI a related party (a company close enough that dealings with it must be disclosed); it discloses revenue from commercial arrangements with OpenAI, including revenue-sharing payments, and holds rights to OpenAI's models and other intellectual property for use in its products. The filing says some partners that supply AI models are also significant Azure customers and may change how much they buy. Its commercial remaining performance obligations (revenue already contracted but not yet delivered or recognised) grew sharply; this site's records, from an earlier Microsoft quarterly filing, show a large part of that backlog came from OpenAI. This site's records also hold an Anthropic commitment to buy Azure computing. The CoreWeave and Nebius filings name Microsoft as a large buyer of their capacity, so Microsoft also rents from neoclouds (newer clouds that specialise in renting AI chips). David Teece, an economist who studied why inventors often fail to keep the returns from what they invent, found that the firm holding the complementary assets (the distribution, sales and systems a product needs to reach buyers) often keeps the profit; this site judges that Microsoft holds its own: its data centres and its customers."
  concentration: moderate
  powers:
  - power: switching_costs
    why: "Companies run their identity, office software, servers and data on Microsoft together, and the filing names hybrid cloud (linking a customer's own data centres with Azure) as Azure's advantage; this site judges the benefit shows in an Intelligent Cloud operating margin (the share of sales left after running costs) that this site's filed figures put at or near the top of the big clouds, and the barrier is the cost of moving years of systems. This holds for the work firms already run there; this site judges it is not yet proven for AI work in particular."
  - power: scale_economies
