  market: "Mercor runs a marketplace that connects experts, such as doctors, bankers and lawyers, with AI labs and businesses that pay them to train and test AI models. The experts write the questions, judge the answers and turn their own work into evaluations (tests a model can be scored and trained against). It says it sits where the labour market meets AI research, and it says its latest money goes to a larger talent network, better matching and faster delivery. Its Form D (the notice a private company files with the US regulator when it sells shares without a public offering) shows a Delaware company, formed in 2022, that sold all of the shares offered in its late-2025 round without paying any placement agent (a bank paid to find investors), and that declined to disclose its revenue. In this site's records its gross revenue run-rate (the latest month's billings scaled up to a year, before paying its experts, as this site reads 'gross') grew steeply in the first months of 2026; that figure comes from its chief executive and from a press report citing a person who knows its finances, so it is self-reported, not audited. In March 2026 it launched Mercor Enterprise AI for ordinary companies: its co-chief executive wrote that it maps how a firm's staff actually work, turns that into evaluations and rules for the firm's AI agents (programs that carry out several steps of a task on their own), checks every output as the agents run and feeds corrections back, using tools first built for the labs. In July 2026 it agreed to buy Deeptune, a maker of training environments (simulated workplaces where a model practises tasks and is graded), and said the pair would serve companies deploying agents in their own work as well as labs. How big the market becomes depends on how long labs keep paying people to teach models, and whether businesses outside the labs start paying too."
