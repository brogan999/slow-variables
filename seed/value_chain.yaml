  - inference
  - applications
  rent_kind: scale_network
  appropriability: weak
  complementary_assets: specialised
  asset_owner: innovator
  durability: medium
  must_be_true:
  - "Advertising keeps paying for the AI build-out. The 10-K says its AI work will need more spending on infrastructure and staff, and this site's records show capital spending rising far faster than revenue; ad revenue must keep growing fast enough to carry those costs and the losses of Reality Labs, its glasses and headsets division, which the 10-K says depends on profits earned elsewhere. In the second quarter of 2026 its operating income fell from a year earlier even as ad revenue grew."
  - "AI keeps making its ads work better, so advertisers keep paying more per ad; the 10-K reports more ads shown and a higher average price per ad in 2025, and credits its AI with better targeting and measurement."
  - "People keep turning to Meta AI inside apps they already use rather than moving their questions, shopping and time to assistants from OpenAI or Google. William Nordhaus, an economist who measured how much of the value of new inventions their makers keep, found that most goes to users; this site judges a free assistant only pays Meta if the attention it holds can be sold to advertisers."
  - "Its own models stay close enough to the best to power its products, so it need not pay rival labs for the capability; the 10-K lists competitors whose AI may be better or cheaper among its risks, and its latest 10-Q already lists rising third-party AI token costs, spending on other providers' models, among the reasons its costs grew."
  - "Regulators let it keep showing personalised ads. The 10-K says the European Commission ruled in April 2025 that its offer of a paid subscription with no ads did not comply with EU rules, a decision it has appealed."
  - "Its minority stake in Scale AI, which carries no vote, and its purchases of small AI firms add skills and products without drawing new limits from competition authorities, whose past scrutiny of its acquisitions the 10-K describes."
  - "People let Muse act for them, booking and buying rather than only chatting, and Meta earns from that work through subscriptions or a share of what Muse buys, since Meta says Muse keeps users' conversations with it, and the data in their Muse workspace, out of its ad systems; for now, the source suggests, that leaves subscriptions and purchases rather than advertising. This site judges that an agent shopping for its user could draw spending away from the ads that pay Meta today, so the agent must earn at least what it displaces."
  - "Meta's own agents do not depend on buying agent makers that regulators can block; China blocked its purchase of Manus, the agent maker it agreed to buy in December 2025, and ordered the deal withdrawn."
  would_disprove:
  - "Capital spending rising while advertising revenue growth slows for several quarters in a row."
  - "Meta AI's use growing without any rise in ad prices, ads shown or time spent in its apps."
  - "Meta licensing another lab's model to run its main products, a sign its own models fell behind."
  - "A regulator's order forcing it to show much less personalised ads across Europe or the United States."
  - "Its data-centre venture partners or cloud suppliers renegotiating terms because Meta cut its capacity plans."
  - "People using Muse to shop and book while time spent and ads shown in Meta's apps fall, with no subscription or purchase revenue from Muse making up the gap."
  - "A regulator blocking another of its AI purchases, a sign that buying agent makers cannot fill gaps in Meta's own agents."
