# The five stocks of "AI as Normal Technology" (Narayanan & Kapoor). Valve ids match store.VALVES.
buckets:
  - id: methods
    name: Methods
    order: 1
    stock: Capabilities and methods — what the frontier can do on benchmarks and in the lab.
    valve: invention_to_product
    speed_limit: None inherent; capability can move fast. The paper's claim is that this stock is not the bottleneck.
  - id: products
    name: Products
    order: 2
    stock: Reliable, integrated products built on those methods.
    valve: product_to_adoption
    speed_limit: Reliability, integration, evaluation and liability — the 50%→80% gap and the "last mile" of productisation.
  - id: early_adoption
    name: Early adoption
    order: 3
    stock: Individuals and firms using the products, at any depth.
    valve: adoption_to_adaptation
    speed_limit: Human and organisational speed — training, procurement, trust, ROI measurement (electrification took decades).
  - id: adaptation
    name: Adaptation
    order: 4
    stock: Workflows, institutions, labour markets and regulation reorganised around the technology.
    valve: return_arrow
    speed_limit: Complementary innovation, regulation, safety brakes and the pace of institutional change.
  - id: return_arrow
    name: Return arrow
    order: 5
    stock: Deployment feedback flowing back into invention — data, RL environments, continual learning.
    valve: leak
    speed_limit: Whether the deployment→training channel is open and how far it substitutes for external bottlenecks.
