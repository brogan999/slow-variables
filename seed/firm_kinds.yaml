# What happens to each kind of firm (/firm/kinds, plan Part 44). A kind is an archetype tied to the census industries
# behind it (`naics`, rows of the bundle's industries table) and, where the roll-up trades list has one, to its trade
# (`trade`, a key of seed/census_trades.yaml). The export sums the figures. Everything else here is the page's own
# words: `now` reports what the listed sources say; `next`, `later`, `shape`, `rung` and the anatomy are this site's
# judgement, drafted by claude-opus-5-5 on 6 Oct 2026 and labelled as judgement on the page. `shape` gives, for each
# layer (managers, professionals, sales, office support), a word from `shape_words` for how it compares with today.
# Sources carry a fetch record; each was fetched on the day. Text types no digit.
kinds:
- id: accounting
  name: Accounting practice
  naics:
  - '541200'
  trade: accounting
  rung: heavy
  signs: A licensed accountant for audits and reviews; the firm's own reviewer for tax returns and books
  now: Buyers built around AI own these firms more than sell to them, and this is the trade with the most of them. One group
    reports a tax pilot that cut preparation time and says it does not expect to need fewer accountants. One bookkeeping firm
    says its software closes the books with no person involved and logs every step. Every figure is the operators' own.
  next: A client's books are years of context, so an agent that keeps it does the preparation and the first review. The practice
    becomes reviewers and client partners, with few preparers and few trainees.
  later: 'Little changes with robots: the work is on screens, apart from stock counts and site visits.'
  shape:
    next:
    - same
    - thinner
    - same
    - much_thinner
    later:
    - same
    - much_thinner
    - same
    - gone
  needs:
  - check
  - trail
  - signoff
  - juniors
  - deploy
  - context
  - record
  wrong: A roll-up reporting, after a full tax season, revenue per person no higher than ordinary firms; or a state board
    disciplining a firm over audit work an agent prepared.
  sources:
  - crete_rebrand
  - crete_reuters
  - pilot_cpa
  - nasba_aps
- id: law
  name: Law firm
  naics:
  - '541100'
  trade: legal
  rung: heavy
  signs: A named lawyer on every piece of work; outside a few places, only lawyers may own the firm
  now: 'The census passes almost none of a lawyer''s own work, and courts keep finding filings with invented citations. New
    firms are built with agents drafting and lawyers reviewing everything. England''s regulator has licensed one firm run
    on AI for small debt claims, on conditions: it may not propose case law, the client approves each step, and named solicitors
    answer for the output.'
  next: 'A firm''s precedents and each client''s history are held by the agent. Leverage turns over: fewer associates under
    each partner, and more matters for each lawyer who signs.'
  later: Robots do not bear on it.
  shape:
    next:
    - same
    - thinner
    - same
    - thinner
    later:
    - same
    - much_thinner
    - same
    - much_thinner
  needs:
  - check
  - trail
  - signoff
  - cover
  - juniors
  - context
  wrong: A large firm publishing steady hiring of junior lawyers after years of agent use; or firms owned by non-lawyers failing
    to grow where they are allowed.
  sources:
  - crosby
  - sra_garfield
  - charlotin
  - az_abs
- id: software
  name: Software and IT services company
  naics:
  - '513200'
  - '541500'
  trade: it_services
  rung: light
  signs: The engineer who reviews and accepts the change; no licence
  now: The trade furthest along, because tests are a check everyone accepts. One large company says AI writes a sizeable share
    of its new code, which engineers then review. A randomised trial found experienced developers slower with AI while believing
    themselves faster. The largest outsourcers employ fewer people than a year ago, in a weak market as well.
  next: Agents hold the codebase and its history. Engineers specify, review and answer; managers who relayed information thin
    out; the junior rung is the open question.
  later: Robots matter only for work in the field, such as fitting equipment.
  shape:
    next:
    - thinner
    - thinner
    - same
    - much_thinner
    later:
    - thinner
    - much_thinner
    - same
    - gone
  needs:
  - check
  - identity
  - juniors
  - deploy
  wrong: A repeat of the trial with current tools still finding a slowdown; or the outsourcers' headcount recovering as demand
    does.
  sources:
  - google_q3
  - metr_dev
  - it_rpe
  - anthropic_work
- id: bank
  name: Bank or lender
  naics:
  - 5220A1
  - '522200'
  rung: heavy
  signs: The bank's own risk function, and a registered supervisor for anything sold as advice
  now: Agents are in service and operations, not in deciding who gets credit. One bank projected fewer people in operations;
    two lenders that cut service staff for a chatbot took people back. In April the American bank regulators rewrote their
    rules for models and left agents out of them, so a bank has no approved way to show an examiner that an agent is under
    control.
  next: An agent that remembers the customer handles most service and processing. People sit in risk, exceptions and the decisions
    an examiner will ask about.
  later: Branches and cash are the only physical part, and they are already shrinking for other reasons.
  shape:
    next:
    - same
    - thinner
    - thinner
    - much_thinner
    later:
    - same
    - thinner
    - thinner
    - gone
  needs:
  - signoff
  - trail
  - identity
  - fallback
  - check
  - context
  wrong: The regulators extending the old model rules to agents unchanged; or the banks that took people back finding they
    need few.
  sources:
  - occ_2026_13
  - jpm_entrepreneur
  - klarna_entrepreneur
  - cba_acs
  - lotj_arxiv
- id: insurer
  name: Insurer or insurance broker
  naics:
  - '524100'
  - '524200'
  trade: insurance_agencies
  rung: heavy
  signs: A licensed adjuster or agent; under bills now proposed, a person for any refusal to pay
  now: One insurer built on AI grew its premiums far faster than its staff and says it spends much less than rivals on handling
    claims, while still losing money. Two American states have bills that leave sorting, fraud scoring and approvals to software
    and require a person only to refuse a claim. On brokers this site found almost nothing.
  next: Software takes in a claim, checks it and pays it. People remain for refusals, disputes and large or strange risks,
    and for selling to businesses.
  later: Robots or drones inspect damage; repair stays with other trades.
  shape:
    next:
    - same
    - thinner
    - thinner
    - much_thinner
    later:
    - same
    - thinner
    - much_thinner
    - gone
  needs:
  - trail
  - signoff
  - cover
  - check
  - fallback
  wrong: That insurer's staff growing in step with its premiums; or the bills on refusals failing.
  sources:
  - lemonade_q2
  - nj_a5494
- id: hospital
  name: Hospital or medical practice
  naics:
  - '622100'
  - '621100'
  trade: medical_practices
  rung: heavy
  signs: A licensed clinician, everywhere but one state's trial
  now: 'What has spread is note-taking: software that writes up the visit. Clinicians report less burnout; an independent
    review finds no clear saving. One American state lets a company renew routine prescriptions without a doctor signing,
    after doctors reviewed its first decisions, with insurance that covers the software. The state''s own medical board asked
    for a halt and was refused.'
  next: An agent holding the patient's whole record drafts, orders and follows up routine care. Clinicians examine, decide
    and sign, each for more patients; the office behind them thins.
  later: 'This is where robots would matter most and are furthest off: bodies are fragile, and the work the census cannot
    see is most of a hospital.'
  shape:
    next:
    - same
    - same
    - same
    - much_thinner
    later:
    - same
    - thinner
    - same
    - gone
  needs:
  - check
  - signoff
  - cover
  - trail
  - staged
  - fleet
  wrong: Harm in that state's trial, or other states copying it quickly; or a controlled trial finding note-taking software
    does nothing for burnout.
  sources:
  - abridge_jama
  - phti_scribes
  - doctronic_me
  - fsmb_ai
- id: staffing
  name: Staffing and business-support firm
  naics:
  - '561300'
  - '561400'
  trade: contact_centres
  rung: light
  signs: Nobody by law; the customer who expects a person
  now: The trade with the most figures and the most reversals. One software company says it runs support with far fewer people.
    The large contact-centre operators report flat or falling revenue. The one careful study found an assistant made agents
    faster, novices most. Firms that removed people too quickly brought some back. For staffing agencies themselves there
    are targets and little else.
  next: An agent that remembers each customer and learns from corrections takes first contact. The firm sells results, not
    seats, and keeps a small team for the cases that escalate.
  later: Agency work that is physical, such as warehouse shifts, goes the way of the warehouses.
  shape:
    next:
    - thinner
    - thinner
    - same
    - much_thinner
    later:
    - thinner
    - thinner
    - same
    - gone
  needs:
  - check
  - fallback
  - outcome
  - context
  wrong: The large operators' revenue recovering; or the companies that cut support staff quietly hiring them back.
  sources:
  - salesforce_ktvu
  - cnxc_pulse
  - crescendo_next
  - klarna_entrepreneur
- id: consultancy
  name: Management consultancy
  naics:
  - '541600'
  rung: light
  signs: A partner, on the firm's name alone
  now: 'The evidence is thin and mostly second-hand. What is on record is a failure: a large firm repaid part of a government
    fee after its report was found to cite things that did not exist. There is no licence and no accepted check for advice,
    so the client cannot verify it and reputation carries the sale.'
  next: Research, analysis and drafts come from agents that hold the firm's past work. Fewer, more senior people sell, frame
    the question and stand behind the answer.
  later: Robots do not bear on it.
  shape:
    next:
    - same
    - much_thinner
    - same
    - much_thinner
    later:
    - same
    - much_thinner
    - same
    - gone
  needs:
  - check
  - juniors
  - capture
  - cover
  wrong: A leading firm publishing its headcount by level and showing junior intake holding steady.
  sources:
  - deloitte_ap
- id: property
  name: Property manager or estate agent
  naics:
  - '531000'
  trade: property_management
  rung: moderate
  signs: The agent who holds clients' money; licensing varies by place
  now: The clearest roll-up case. One British buyer of letting agencies says each of its staff handles several times the usual
    number of homes, with software doing messages, rent and the arranging of repairs; its investor says margins rose where
    the software is fully in use. Both are the company's own account. The physical part, repairs and viewings, is still people.
  next: Software that knows each building and tenant runs the tenancy. People win landlords, handle disputes and hold the
    client money.
  later: Of the service trades this is the one robots change most, through maintenance, and there is no evidence of it yet.
  shape:
    next:
    - thinner
    - thinner
    - same
    - much_thinner
    later:
    - thinner
    - thinner
    - same
    - gone
  needs:
  - record
  - check
  - identity
  - fleet
  - deploy
  wrong: An independent count putting that buyer's homes per person near the ordinary level; or complaints rising at the agencies
    it bought.
  sources:
  - dwelly_tnw
  - gc_services
  - uk_cmp
- id: freight
  name: Freight and logistics operator
  naics:
  - '488500'
  - '484000'
  - '493100'
  trade: freight
  rung: moderate
  signs: A registered broker or carrier
  now: Most of the payroll here is not office work, so the census sees little of it. In the office part, the largest American
    freight broker reports each person handling many more shipments than a few years ago, a company measure that mixes AI
    with other changes. Driverless trucks are hauling freight on fixed routes, and one retailer counts its warehouse robots
    in very large numbers.
  next: Quoting, booking and tracking run without people. The broker's office becomes a small desk for exceptions and customers.
  later: 'The trade robots reach first: fixed routes and warehouses now, general handling later. The yard and the road are
    where the firm changes most.'
  shape:
    next:
    - same
    - thinner
    - thinner
    - much_thinner
    later:
    - thinner
    - thinner
    - thinner
    - gone
  needs:
  - identity
  - check
  - fleet
  - record
  wrong: The broker's gain reversing when freight volumes recover; or the driverless operator missing its fleet target.
  sources:
  - chr_fw
  - aurora_q2
  - amazon_million
- id: manufacturer
  name: Manufacturer
  naics:
  - '336100'
  - '336300'
  - '336400'
  - 3330A1
  rung: moderate
  signs: Whoever answers for product safety and for the workers beside the machines
  now: This site found almost nothing on agents in a manufacturer's offices, and says so. On the floor the base is ordinary
    industrial robots, installed in large numbers every year. The best-documented humanoid trial is a single task at a single
    car plant, since retired.
  next: Planning, purchasing and scheduling are run by agents that know the plant. Engineers and managers remain; clerical
    work thins.
  later: The kind of firm most exposed to robots and least sure of the date. One carmaker plans humanoids on a line within
    a few years; a veteran roboticist expects hands to stay far short of human ones for a decade.
  shape:
    next:
    - same
    - thinner
    - same
    - much_thinner
    later:
    - thinner
    - thinner
    - same
    - gone
  needs:
  - check
  - fleet
  - cover
  wrong: A carmaker publishing a humanoid's cost per task below a worker's; or the dated plan slipping.
  sources:
  - ifr_wr
  - figure_bmw
  - hyundai_rdn
  - brooks_2026
- id: retailer
  name: Retailer
  naics:
  - '455000'
  - 4450A1
  - '458100'
  rung: light
  signs: The store operator; pharmacy and alcohol aside, no licence
  now: 'The largest retailer says its headcount will stay flat while the work changes. An AI model set to run a small shop
    lost money and invented a payment account. Two physical experiments were withdrawn: checkout without cashiers, and robots
    that scanned shelves.'
  next: Agents buy, price and plan stock within limits a person sets. Head office thins; the shop floor does not.
  later: Warehouses first, as in freight. The shop floor changes last, because shoppers are there.
  shape:
    next:
    - thinner
    - thinner
    - same
    - much_thinner
    later:
    - thinner
    - thinner
    - thinner
    - gone
  needs:
  - identity
  - incident
  - fleet
  - check
  wrong: The largest retailer's headcount falling well before the decade ends; or a repeat of the shop experiment turning
    a profit unaided.
  sources:
  - walmart_fortune
  - vend1
  - jwo_mpr
