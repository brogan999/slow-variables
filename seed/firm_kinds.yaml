stages:
- id: now
  name: Now
  what: Agents that work on screens
  rests_on: What operators and regulators have published, and this site's census. Most operator figures are their own.
- id: next
  name: Next
  what: Agents that keep context and learn on the job
  rests_on: Judgement. Models cannot yet be taught on the job; the writers this site reads date it from late in this decade
    to well into the next.
  sources:
  - dwarkesh_timelines
  - lotj_arxiv
  - metr_horizon
- id: later
  name: Later
  what: Robots that do physical work with that context
  rests_on: Extrapolation. The evidence is a few trials and plans; bank forecasts put the real rise late in the next decade,
    and a veteran roboticist later still.
  sources:
  - gs_humanoid
  - ms_humanoid
  - brooks_2026
rungs:
  heavy: The law says who may sign, and the firm answers for the work
  moderate: A registration, bond or safety duty sits with the firm
  light: No licence; the customer's trust and the contract carry it
shape_words:
  gone: gone
  much_thinner: much thinner
  thinner: thinner
  same: about the same
  wider: wider
anatomy:
  title: The anatomy of an AI-run firm
  note: This site's picture of where the kinds of firm on this page are heading. It is a model of an idea, joined from the
    arguments on the page before; no reading tests it whole.
  parts:
  - id: top
    name: The people who answer
    does: Set the task, sign the work, hold the licence, face the customer, and pay when it is wrong. Few, senior, and named.
  - id: check
    name: The checking layer
    does: Tests, reviewers and records that settle whether work was done right. Where no check exists, a person's judgement
      stands in, and this is where most work waits.
  - id: base
    name: The working base
    does: Agents now; agents that keep context next; robots later. Wide, cheap, and not employed.
  - id: rented
    name: Rented
    does: The models themselves, bought by the token from whoever sells them cheapest.
  - id: owned
    name: Owned
    does: 'What cannot be bought: customers, the firm''s records and context, its licences, its sensors and sites.'
needs:
- id: check
  name: A check for work that has none
  what: An accepted way to settle whether a return, a citation, a report or a repair was done right, without a senior person
    reading all of it.
  opportunities:
  - outcome_verification
- id: trail
  name: A record of what the agent did, and who approved it
  what: A log a regulator, a peer reviewer or a court will accept.
  opportunities:
  - agent_audit_trail
- id: signoff
  name: Sign-off for regulated work
  what: A way to show an examiner or a board that an agent is under control, where the old rules leave agents out.
  opportunities:
  - regulated_assurance
  - licensed_autonomous_service
- id: cover
  name: Insurance priced for an agent's mistakes
  what: Cover that names the software, so the firm that signs is not carrying the whole loss.
  opportunities:
  - ai_warranty
- id: identity
  name: Identity, permissions and spending limits for agents
  what: Proof of whose agent this is and what it may do, inside a client's systems or with a client's money.
  opportunities:
  - agent_authority_registry
  - permission_connectors
  - agent_payments
- id: deploy
  name: Help putting it to work
  what: Engineers who sit inside the firm, since firms cannot rebuild their own work unaided.
  opportunities:
  - deploy_to_platform
  - deployment_talent
- id: capture
  name: Writing down how the firm works
  what: The unwritten rules of a trade, captured so an agent can follow them.
  opportunities:
  - context_engineering_service
- id: context
  name: Context that stays with one customer
  what: An agent that remembers a client and improves on that client's work.
  opportunities:
  - continual_learning_in_customer
- id: record
  name: The trade's system of record
  what: The place a trade's matters, tenancies or loads are kept, with approvals built in.
  opportunities:
  - vertical_system_of_record
- id: outcome
  name: Selling the result, and settling it
  what: Pricing by the finished job, with a measure both sides trust.
  opportunities:
  - outcome_priced_rollup
  - agent_payments
- id: incident
  name: Someone to call when an agent goes wrong
  what: Response and repair after an agent misbehaves in the open.
  opportunities:
  - agent_incident_response
- id: juniors
  name: Training people when the junior work is gone
  what: A way to make senior people once the routine work that trained them is done by software.
  opportunities: []
- id: fallback
  name: People on call
  what: A person a customer can reach on demand, without the firm keeping a full team idle.
  opportunities: []
- id: staged
  name: Running autonomy in stages
  what: Managing and proving the ramp from every case reviewed to the agent working alone.
  opportunities: []
- id: fleet
  name: Running robots and driverless fleets
  what: Maintenance, remote help and safety sign-off for machines that work beside people.
  opportunities: []
