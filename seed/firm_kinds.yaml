- id: freight
  name: Freight and logistics operator
  illustration: firm-freight
  naics:
  - '488500'
  - '484000'
  - '493100'
  trade: freight
  rung: moderate
  signs: A registered broker or carrier, under rules this page did not read
  now: Most of the payroll here is in driving and warehouse jobs, which the census does not score. In the office part, a large
    American freight broker reports each person handling markedly more shipments a day than at the end of 2022; it is a company
    measure, and the report does not separate what AI did from anything else. A company running driverless trucks says they
    are hauling freight on fixed routes and that it plans many more by the end of 2026. A retailer says it has put a very
    large number of mobile robots into its warehouses; they are not humanoids, meaning robots shaped like a person.
  next: Quoting, booking and tracking run without people. The broker's office becomes a small desk for exceptions and customers.
  later: 'In this site''s view the trade robots reach first: fixed routes and warehouses now, general handling later. The
    yard and the road are where the firm changes most.'
  shape:
    next:
    - same
    - thinner
    - thinner
    - much_thinner
    later:
    - thinner
    - thinner
    - thinner
    - much_thinner
