- id: manufacturer
  name: Manufacturer
  illustration: firm-manufacturer
  naics:
  - '336100'
  - '336300'
  - '336400'
  - 3330A1
  rung: moderate
  signs: Whoever answers for product safety and for the workers beside the machines
  now: This site found almost nothing on agents in a manufacturer's offices, and says so. On the floor the base is ordinary
    industrial robots, installed in large numbers every year by the count of the robot makers' own federation. The humanoid
    trial with the most published detail is its maker's own account of a loading task at a car plant, and no other task; it
    ran for most of a year and ended when the maker retired that generation of robot for its successor.
  next: Planning, purchasing and scheduling are run by agents that know the plant. Engineers and managers remain; clerical
    work thins.
  later: The kind of firm most exposed to robots and least sure of the date. One carmaker plans humanoids on a line within
    a few years; a veteran roboticist, who sells robots of another kind, expects robot hands to stay far short of human ones
    beyond 2036.
