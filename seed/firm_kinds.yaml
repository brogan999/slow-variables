# What happens to each kind of firm (/firm/kinds, plan Part 44). A kind is an archetype tied to the census industries
# behind it (`naics`, rows of the bundle's industries table) and, where the roll-up trades list has one, to its trade
# (`trade`, a key of seed/census_trades.yaml). The export sums the figures. Everything else here is the page's own
# words: `now` reports what the listed sources say; `next`, `later`, `shape`, `rung` and the anatomy are this site's
# judgement, drafted by claude-opus-5-5 on 6 Oct 2026 and labelled as judgement on the page. `shape` gives, for each
# layer (managers, professionals, sales, office support), a word from `shape_words` for how it compares with today.
# `illustration` names a record in seed/illustrations.yaml: a picture made with AI image generation, never evidence.
# Sources carry a fetch record; each was fetched on the day. Text types no digit but a year.
kinds:
- id: accounting
  name: Accounting practice
  illustration: firm-accounting
  naics:
  - '541200'
  trade: accounting
  rung: heavy
  signs: A licensed accountant for audits and reviews only; tax returns and bookkeeping need no licensed signature
  now: Buyers built around AI own these firms more than sell to them, and this site lists more such buyers here than in any
    other trade. An owner of many such firms reports a tax trial that cut preparation time; its chief said the year before
    that the aim was not to replace accountants and that he did not expect AI to end the need for them. A bookkeeping firm
    says its software runs the books from sign-up to the monthly close with no person involved and logs every decision. Every
    figure is the operators' own.
  next: A client's books are years of context, so an agent that keeps it does the preparation and the first review. The practice
    becomes reviewers and client partners, with few preparers and few trainees.
  later: 'Little changes with robots: the work is on screens, apart from stock counts and site visits.'
  shape:
    next:
    - same
    - thinner
    - same
    - much_thinner
    later:
    - same
    - thinner
    - same
    - much_thinner
  needs:
  - check
  - trail
  - signoff
  - juniors
  - deploy
  - context
  - record
  wrong: A buyer of such firms reporting, after a full tax season, revenue per person no higher than ordinary firms; or a
    state board disciplining a firm over audit work an agent prepared.
  sources:
  - crete_rebrand
  - crete_reuters
  - pilot_cpa
  - nasba_aps
- id: law
  name: Law firm
  illustration: firm-law
  naics:
  - '541100'
  trade: legal
  rung: heavy
  signs: A named lawyer on every piece of work; outside a few places, only lawyers may own the firm
  now: 'The census passes none of the work in a lawyer''s own role, mostly because no check that exists today settles it.
    A researcher''s running list holds a great many court decisions in which a filing relied on material AI had made up; more
    of those filings came from people acting without a lawyer than from lawyers. A new firm says its agents research and draft
    while its lawyers review all of the work; that is the firm''s own account. The regulator for England and Wales has authorised
    a firm run on AI for small debt claims, on conditions: it may not propose case law, it acts only on a step the client
    has approved, and named solicitors answer for the output.'
  next: 'A firm''s precedents and each client''s history are held by the agent. The ratio of junior lawyers to partners turns
    over: fewer associates under each partner, and more matters for each lawyer who signs.'
  later: Robots do not bear on it.
  shape:
    next:
    - same
    - thinner
    - same
    - thinner
    later:
    - same
    - thinner
    - same
    - thinner
  needs:
  - check
  - trail
  - signoff
  - cover
  - juniors
  - context
  - outcome
  - staged
  wrong: A large firm publishing steady hiring of junior lawyers after years of agent use; or firms owned by non-lawyers failing
    to grow where they are allowed.
  sources:
  - crosby
  - sra_garfield
  - charlotin
  - az_abs
- id: software
  name: Software and IT services company
  illustration: firm-software
  naics:
  - '513200'
  - '541500'
  trade: it_services
  rung: light
  signs: The engineer who reviews and accepts the change; no licence
  now: 'By adoption this is the trade furthest along. This site''s reading is that tests give it a check most engineers accept,
    though the census passes less of its payroll than it does in accounting. A large company said in 2024 that AI wrote a
    sizeable share of its new code, which engineers then reviewed. A randomised trial with the tools of early 2025 found experienced
    developers slower with AI while believing themselves faster. The same group''s repeat with later tools pointed the other
    way, towards a speed-up, and its authors call that result unreliable because many developers would no longer work without
    AI. Among the large Indian outsourcers the counts are mixed: the biggest employs fewer people than a year before, another
    employs more, and the reporting cites weak demand as well as AI.'
  next: Agents hold the whole body of a company's code and its history. Engineers specify, review and answer; managers who
    relayed information thin out; the junior rung is the open question.
  later: Robots matter only for work in the field, such as fitting equipment.
  shape:
    next:
    - thinner
    - thinner
    - same
    - much_thinner
    later:
    - thinner
    - thinner
    - same
    - much_thinner
  needs:
  - check
  - identity
  - juniors
  - deploy
  wrong: A sound repeat of the trial, with developers who cannot opt out, still finding a slowdown; or the outsourcers' headcount
    recovering as demand does.
  sources:
  - google_q3
  - metr_dev
  - metr_uplift_update
  - it_rpe
  - anthropic_work
- id: bank
  name: Bank or lender
  illustration: firm-bank
  naics:
  - 5220A1
  - '522200'
  rung: heavy
  signs: The bank's own risk function
  now: What is on record here is in service and operations; this site found nothing on agents deciding who gets credit. A
    bank's consumer chief projected fewer people in operations and account services, with no date. A payments lender that
    froze hiring and leaned on a chatbot said quality fell and began hiring service staff again. A bank that declared service
    jobs redundant in favour of a voice bot called it an error and reversed it. In April 2026 the American bank regulators
    reissued their guidance on managing models, put generative and agentic AI outside its scope, and said they would ask for
    views on AI later. This site reads that as leaving a bank with no agreed template for showing a regulator's examiner that
    an agent is under control.
  next: An agent that remembers the customer handles most service and processing. People sit in risk, exceptions and the decisions
    an examiner will ask about.
  later: Branches and cash are the only physical part.
  shape:
    next:
    - same
    - thinner
    - thinner
    - much_thinner
    later:
    - same
    - thinner
    - thinner
    - much_thinner
  needs:
  - signoff
  - trail
  - identity
  - fallback
  - check
  - context
  wrong: The regulators bringing agents under the model guidance unchanged; or the bank that projected fewer operations staff
    reporting no fall.
  sources:
  - occ_2026_13
  - jpm_entrepreneur
  - klarna_entrepreneur
  - cba_acs
  - lotj_arxiv
- id: insurer
  name: Insurer or insurance broker
  illustration: firm-insurer
  naics:
  - '524100'
  - '524200'
  trade: insurance_agencies
  rung: heavy
  signs: A licensed adjuster or seller, under licensing rules this page did not read; under a bill now proposed, a person
    for the final refusal of some claims
  now: An insurer built on AI reports premiums, the payments its customers make for cover, growing far faster than its staff
    and says rivals spend far more than it does on handling claims, by its own estimate of the industry; it still loses money.
    A bill introduced in New Jersey would leave sorting, fraud scoring and approvals to software and bar software from making
    the final refusal, for home, motor and flood cover only; it has not reached a committee. A wider bill in Florida, which
    would have required a qualified person to make every refusal, died in March 2026. On brokers this site found almost nothing.
  next: Software takes in a claim, checks it and pays it. People remain for refusals, disputes and large or strange risks,
    and for selling to businesses.
  later: Robots or drones inspect damage; repair stays with other trades.
  shape:
    next:
    - same
    - thinner
    - thinner
    - much_thinner
    later:
    - same
    - thinner
    - much_thinner
    - much_thinner
  needs:
  - trail
  - signoff
  - cover
  - check
  wrong: That insurer's staff growing in step with its premiums; or the New Jersey bill dying as Florida's did, leaving no
    state that requires a person for a refusal.
  sources:
