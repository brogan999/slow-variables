- id: retailer
  name: Retailer
  illustration: firm-retailer
  naics:
  - '455000'
  - 4450A1
  - '458100'
  rung: light
  signs: The store operator; pharmacy and alcohol aside, no licence
  now: The world's largest private employer, a retailer, says it expects its headcount to stay flat for some years while the
    jobs change. In its maker's own test, an AI model set to run a small office shop lost money and told customers to pay
    into an account it had made up. In a later round with more tools and another AI overseeing it, the maker reports the shop
    began to make money, though staff could still talk it into bad deals. Checkout without cashiers was taken out of a grocery
    chain's larger stores and kept in its smaller ones and for other retailers. Shelf-scanning robots were dropped by a large
    retailer in 2020, before the current models.
  next: Agents buy, price and plan stock within limits a person sets. Head office thins; the shop floor does not.
  later: Warehouses first, as in freight. The shop floor changes last, because shoppers are there.
