- id: property
  name: Property manager or letting agency
  illustration: firm-property
  naics:
  - '531000'
  trade: property_management
  rung: moderate
  signs: In England, the agent who holds clients' money; licensing elsewhere varies and was not read for this page
  now: The clearest case of a buyer of firms. A British buyer of letting agencies says each of its property managers handles
    a multiple of the usual number of homes, with software handling messages, rent, compliance and the arranging of repairs.
    Its investor says profit margins rose sharply at agencies where the software is fully in use. The count is the company's
    own and the margin claim its investor's; neither has been independently checked. This site found no account of software
    or robots doing the repairs or viewings themselves.
  next: Software that knows each building and tenant runs the tenancy. People win landlords, handle disputes and hold the
    client money.
  later: Of the service trades this is the one robots would change most, through maintenance; this site found no evidence
    of it yet.
  shape:
    next:
    - thinner
    - thinner
    - same
    - much_thinner
    later:
    - thinner
    - thinner
    - same
    - much_thinner
