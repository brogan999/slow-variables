  - nj_a5494
  - fl_hb527
  - fl_hb527_status
- id: hospital
  name: Hospital or medical practice
  illustration: firm-hospital
  naics:
  - '622100'
  - '621100'
  trade: medical_practices
  rung: heavy
  signs: A licensed clinician, everywhere but one state's trial
  now: 'The use on record is note-taking: software that writes up the visit. In a study with no comparison group, whose authors
    include staff of the software''s maker, fewer clinicians reported burnout after a month of use. An independent institute''s
    report, drawn from interviews with early users, calls the financial effect unclear. Utah has waived its licensing law
    to let a company''s software renew routine prescriptions without a doctor signing, once doctors have reviewed its early
    decisions for each class of drug; the company says its malpractice insurance covers the software. Members of the state''s
    medical licensing board asked for a halt in April 2026. The state declined, saying doctors were still reviewing every
    renewal in the opening phase.'
  next: An agent holding the patient's whole record drafts, orders and follows up routine care. Clinicians examine, decide
    and sign, each for more patients; the office behind them thins.
  later: 'This is where robots would matter most and are furthest off: bodies are fragile, and much of a clinician''s work
    needs hands, which the census sets aside as physical.'
  shape:
    next:
    - same
    - same
    - same
    - much_thinner
    later:
    - same
    - thinner
    - same
    - much_thinner
  needs:
  - check
  - signoff
  - cover
  - trail
  - staged
  wrong: Harm in that state's trial, or other states copying it quickly; or a controlled trial finding note-taking software
    does nothing for burnout.
  sources:
  - abridge_jama
  - phti_scribes
  - doctronic_me
  - doctronic_tnw
  - fsmb_ai
- id: customer_support
  name: Customer-support and business-support firm
  illustration: firm-support
  naics:
  - '561400'
  trade: contact_centres
  rung: light
  signs: Nobody by law; the customer who expects a person
  now: The trade with the most figures and the most reversals, nearly all of them about customer support. A software company
    that sells AI agents says it now runs its own support with far fewer people. A large contact-centre operator reports revenue
    slightly down on a year before; the largest by headcount expects little or no growth. The best-measured study this site
    found, of an AI assistant working beside support staff inside a company, found the staff faster, novices most. A payments
    firm that leaned on a chatbot says quality fell and is hiring support staff again. Staffing agencies, a neighbouring trade
    this page does not draw, have a target from a large agency and little else.
  next: An agent that remembers each customer and learns from corrections takes first contact. The firm sells results, not
    seats, and keeps a small team for the cases that escalate.
  later: 'Robots do not bear on it: the work is done on screens and telephones.'
  shape:
