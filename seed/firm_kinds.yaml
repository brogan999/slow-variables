  name: Management consultancy
  illustration: firm-consultancy
  naics:
  - '541600'
  rung: light
  signs: A partner, on the firm's name alone
  now: 'The evidence is thin and mostly second-hand. What is on record is a failure: a large firm agreed to repay part of
    a government fee after its report was found to quote a court judgment and cite research papers that did not exist; the
    department said the report''s recommendations stood. This site''s reading is that there is no licence and no accepted
    check for advice, so the client cannot verify it and reputation carries the sale.'
  next: Research, analysis and drafts come from agents that hold the firm's past work. Fewer, more senior people sell, frame
    the question and stand behind the answer.
  later: Robots do not bear on it.
