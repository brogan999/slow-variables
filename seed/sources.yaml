# `sources`: every source with a connector or a manual row; health is derived from data/fetchlog.jsonl at export, never stored here.
# `skipped`: sources the briefs name that are read but not ingested, each with the reason (rendered on /sources).
sources:
  - id: metr
    name: METR time horizons (v1.1)
    org: METR
    url: https://metr.org/time-horizons/
    kind: api
    default_tier: 1
    cadence: per_release
    lens: both
    connector: metr
    license: "METR; analysis code MIT at https://github.com/METR/eval-analysis-public"
    attribution: "METR, Measuring AI Ability to Complete Long Tasks (Horizon v1.1)"
    expect_series: ["metr.*.horizon_50.pt", "metr.*.horizon_80.pt", "metr.suite.doubling_time_days.pt"]
    people: ["Beth Barnes", "Thomas Kwa", "Ben West"]
  - id: sec_xbrl
    name: SEC EDGAR XBRL company facts
    org: U.S. Securities and Exchange Commission
    url: https://www.sec.gov/edgar/sec-api-documentation
    kind: xbrl
    default_tier: 4
    cadence: quarterly
    lens: capture
    connector: sec_xbrl
    license: "Public domain (U.S. government); fair-access policy requires a descriptive User-Agent"
    attribution: "SEC EDGAR, XBRL company facts API"
    expect_series: ["sec.nvda.revenue.q", "sec.nvda.gross_profit.q", "sec.orcl.rpo.q"]
  - id: metr_blog
    name: METR research posts
    org: METR
    url: https://metr.org/blog/
    kind: html
    default_tier: 6
    cadence: per_release
    lens: diffusion
    connector: manual
    license: "METR"
    attribution: "METR, Time Horizon 1.1 (29 Jan 2026)"
    people: ["Thomas Kwa", "Ben West"]
  - id: epoch
    name: Epoch AI data hub — AI companies
    org: Epoch AI
    url: https://epoch.ai/data/ai-companies
    kind: csv
    default_tier: 5
    cadence: daily
    lens: both
    connector: epoch
    license: "CC BY 4.0"
    attribution: "Epoch AI, 'Data on AI Companies' (CC BY 4.0), epoch.ai/data"
    expect_series: ["epoch.*.round_equity_usd.pt", "epoch.*.revenue_run_rate_usd.pt"]
    people: ["Jaime Sevilla", "Tamay Besiroglu"]
  - id: bls
