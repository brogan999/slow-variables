  - {id: amazon_news, name: About Amazon company news, org: Amazon, url: "https://www.aboutamazon.com/news", kind: html, default_tier: 4, cadence: irregular, lens: capture, connector: manual, license: "Amazon; short quotation", attribution: "About Amazon"}
