  - {id: techcrunch, name: TechCrunch, org: Yahoo Inc., url: "https://techcrunch.com/", kind: html, default_tier: 7, cadence: irregular, lens: capture, connector: manual, license: "TechCrunch; short quotation", attribution: "TechCrunch (quoting Sam Altman on X)"}
  - {id: siliconangle, name: SiliconANGLE, org: SiliconANGLE Media, url: "https://siliconangle.com/", kind: html, default_tier: 5, cadence: irregular, lens: capture, connector: manual, license: "SiliconANGLE; short quotation", attribution: "SiliconANGLE (relaying the WSJ report)"}
  - {id: yahoo_finance, name: Yahoo Finance (syndicated Investing.com), org: Yahoo Inc., url: "https://finance.yahoo.com/", kind: html, default_tier: 5, cadence: irregular, lens: capture, connector: manual, license: "Syndicated; short quotation", attribution: "Investing.com via Yahoo Finance; CDS data ICE Data Services"}
  - {id: ramp, name: Ramp AI Index (Ramp Economics Lab), org: Ramp, url: "https://ramp.com/data/ai-index", kind: html, default_tier: 3, cadence: monthly, lens: both, connector: manual, license: "Ramp Economics Lab; cited with attribution", attribution: "Ramp AI Index, Ramp Economics Lab", robots_ok: true}
  - {id: openai_blog, name: OpenAI research posts, org: OpenAI, url: "https://openai.com/news/", kind: html, default_tier: 7, cadence: irregular, lens: diffusion, connector: manual, license: "OpenAI; short quotation", attribution: "OpenAI", robots_ok: true, people: ["OpenAI research organization"]}
  - {id: openai_news_feed, name: OpenAI news feed (watchlist), org: OpenAI, url: "https://openai.com/news/rss.xml", kind: rss, default_tier: 7, cadence: irregular, lens: diffusion, connector: feeds, license: "RSS", attribution: "OpenAI", watch: {research_acceleration: "research acceleration|automated research|research intern|agent-workday|AI researcher", self_improvement: "self-improv|recursive|R&D automation|automating AI research"}}
