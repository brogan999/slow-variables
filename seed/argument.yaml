  - {who: "Paul A. David", work: "The Dynamo and the Computer: An Historical Perspective on the Modern Productivity Paradox", where: "American Economic Review 80(2), 1990", url: "https://ideas.repec.org/a/aea/aecrev/v80y1990i2p355-61.html"}
  - {who: "Everett M. Rogers", work: "Diffusion of Innovations", where: "Free Press, first edition 1962; the five attributes as defined in the fifth edition, 2003", url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC12530589/"}
  - {who: "Wikipedia", work: "Everett Rogers", where: "biography: the Carroll, Iowa farm, his father and hybrid seed corn", url: "https://en.wikipedia.org/wiki/Everett_Rogers"}
  - {who: "Bryce Ryan and Neal C. Gross", work: "The Diffusion of Hybrid Seed Corn in Two Iowa Communities", where: "Rural Sociology 8, 1943", url: "https://www.encyclopedia.com/education/encyclopedias-almanacs-transcripts-and-maps/diffusion-theory"}
