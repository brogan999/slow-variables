# /story (plan Part 46): the argument as a run of figures reused from the other pages. Words only: no digit and no
# number word anywhere in this file, and no finding the source page does not make. A panel is one reused figure:
# `figure` is the component (in web/src/components/`file`), `loader` the web/data reader it draws from, `route` and
# `anchor` where the full figure lives, `kind` what it is (chart, model, illustration, mixed), `words` the two sentences
# set above it, and `carry` the caveats set beneath it, because the figure's long foot is hidden here. A carry line a
# staff review made mandatory on the source page is pinned in tests/test_story.py. `needs` names a condition in
# story.CONDITIONS: without it the panel is left out whole. A carry line written as {text, when} is shown only while
# its condition holds, so a sentence about tonight's result cannot outlive the result.
eyebrow: The whole argument in figures
title: The story in pictures
lede: >-
  This is the site's argument as a run of figures, from what is measured today to what people forecast. Each one is
  taken from the page that holds its sources, its limits and its numbers.
disclosure:
  - >-
    Each panel is a figure from another page, cut down: its long foot and its table of numbers are on that page, a
    click away.
  - >-
    A chart draws records. A model is a drawing of an idea and measures nothing. An illustration was made with AI image
    generation and is not evidence. Hatching always marks a judgement, an estimate or a score held with low confidence,
    never a plain record.
  - >-
    This page was drafted by Claude, a model made by Anthropic. Anthropic and its rivals are drawn in several panels
    and their heads are among the forecasters; each is placed by the same rule from its own record.
closing:
  words: >-
    That is the argument as it stands tonight: some of it measured, some of it judged, and some of it not yet readable
    by anyone. Every panel links to the page that holds its records.
  strip: >-
    A few ideas from stories, drawn as if they had been built. They come from the Futures idea bank and are evidence of
    nothing.
acts:
  - id: I
    anchor: act-now
    illustration: story-act-1
    sentence: The machine improves quickly; the buildings, habits, rules and balance sheets around it change slowly.
    panels:
      - id: clocks
        figure: FourClocks
        file: FourClocks.tsx
        loader: argument
        kind: chart
        route: /argument
        anchor: folio-pace
        needs: clocks_chart
        words:
          - What the best models can do is timed on a different clock from the firms that try them and the hours worked with them.
          - Each line is one link of the chain, set against its own first reading, so the steepness is the data's.
        carry:
          - "Log scale: each line is divided by its own first reading, so the lines show growth and not size."
          - The methods line follows the best model so far and leaves out readings its tester flags as beyond what its tests can measure.
          - Some of these readings are measured and some are reported; the full figure stamps each.
      - id: lag
        figure: LagModel
        file: DiffusionFigures.tsx
        loader: diffusion
        kind: model
        route: /diffusion
        anchor: fig-lag
        words:
          - Arvind Narayanan and Sayash Kapoor, two Princeton computer scientists, argue that a technology arrives in stages, and each stage has to wait for the one before.
          - The drawing shows the order of the stages and what holds each one back.
        carry:
          - A drawing of Narayanan and Kapoor's argument, not of any data.
          - "The spacing, the slopes and the heights are drawn for the eye and measure nothing: the drawing shows that each stage waits for the last, not how long the wait is."
      - id: gauges
        figure: StageGauges
        file: DiffusionFigures.tsx
        loader: diffusion
        kind: chart
        route: /diffusion
        anchor: fig-gauges
        words:
          - Each mark is one published gauge, read against a rule written down before the number came in.
          - "Read each row's word, and count the marks that say emerging: a gauge with no verdict yet is not a slow one."
        carry:
          - Emerging means a gauge has readings but no verdict yet, which is not the same as slow.
          - An outlined mark shares a source with a gauge already counted and casts no vote of its own.
          - A mark does not show how large a reading is.
      - id: readings
        figure: ReadingsFigure
        file: ArgumentFigures.tsx
        loader: argument
        kind: chart
        route: /argument
        anchor: fig-readings
        words:
          - These are the slow variables the site is named after, each set against the range an ordinary technology would be in by now and the range that would mean something faster.
          - A mark hanging beneath its strip is a number the site has not scored.
        carry:
          - Each strip has its own scale, so compare a mark with its own ranges and not with the row above.
          - The chip makers' share is a share of the gross profit the site can measure, which includes an estimate for OpenAI and Anthropic; the value users keep is one survey's estimate.
          - A number hanging beneath a strip is one the site has not scored, and a hatched mark rests on an estimate.
          - The lower rows have no range and are graded by whether the number rose or fell, never as fast or slow.
      - id: whole
        figure: WholeFigure
        file: CensusFigures.tsx
        loader: census
        kind: chart
        route: /census
        anchor: fig-whole
        words:
          - The strip is the whole knowledge payroll the census scored, and its darkest part is what passes the hand-over screen.
          - The screen asks whether work could be handed over and checked, which is not the same as saying it has been or will be.
        carry:
          - "From the census: a screen scored by three AI models, not a claim about what AI can do and not a forecast."
          - The white line marks the smaller part that all three models pass.
          - The last part of the strip is everything else, which the full figure breaks down.
      - id: screen
        figure: ScreenFigure
        file: CensusFigures.tsx
        loader: census
        kind: chart
        route: /census
        anchor: fig-screen
        words:
          - For most of the work that does not pass, the reason the scoring models gave most often is that nothing which already exists would settle whether it was done right.
          - The middle bars overlap, so they do not add up.
        carry:
          - "From the census: a screen scored by three AI models, not a claim about what AI can do and not a forecast."
          - Each middle bar is the reason given most often by the models that voted no, so the bars overlap and each is a floor for its question.
          - Work left out before the vote, as physical or as a sign-off a person answers for, is drawn apart.
  - id: II
    anchor: act-money
    illustration: story-act-2
    sentence: The money arrives before the results, and who keeps it depends on what is scarce.
    panels:
      - id: perez
        figure: PerezCurve
        file: PerezCurve.tsx
        loader: argument
        kind: model
        route: /argument
        anchor: perez
        words:
          - "Carlota Perez, an economist who studies how technologies get paid for, found that a new one is financed in two parts: the first led by finance, the second by production, with a turning point between."
          - The marker is placed by a published rule, and it says where the readings put us, not how the cycle ends.
        carry:
          - "Schematic, after Perez: the curve is her shape and not data."
          - The marker is placed by this site's published rule from its own readings; it names a phase of the cycle and forecasts nothing.
      - id: stack
        figure: StackPlate
        file: ArgumentParts.tsx
        loader: capture
        kind: chart
        route: /capture
        anchor: layers
        needs: profit_stack
        words:
          - Each column is a quarter's gross profit across the parts of the industry the site can measure.
          - The hatched part at the top is an estimate for the labs, and the applications are left out because they publish nothing the site can use.
        carry:
          - The hatched part is an estimate for OpenAI and Anthropic, not a filed figure.
          - Applications publish no gross profit the site can use, so they are left out, not guessed.
          - The shares are of the profit the site can measure, not of the whole industry's.
      - id: labs
        figure: LabsPlate
        file: CaptureFigures.tsx
        loader: capture
        kind: chart
        route: /capture
        anchor: labs
        words:
          - For each lab with enough on record, the bars set a year of sales at the latest pace beside the money investors have paid in and the payments the lab has signed up to.
          - The sales are run-rates told to the press or stated by the lab, and the payments are the full amounts written in the deals.
        carry:
          - "Sales are run-rates as reported: not booked revenue and not audited, and each lab is drawn at the date of its own latest report."
          - Money raised and payments signed are floors, and a payment is the full amount written in a deal that runs for years, not money paid.
          - Labs with too little on record are listed without a bar.
          - A sales figure from a press report is hatched and one stated by the lab is solid, by the same rule for every lab, the maker of the model that drafted this page included.
      - id: ties
        figure: TiesPlate
        file: CaptureFigures.tsx
        loader: capture
        kind: chart
        route: /capture
        anchor: ties
        needs: ties
        words:
          - The figure asks which of the companies that sell to the labs also own part of them or stand behind their debts.
          - Each band is a tie between a supplier or investor and a lab, as thick as the full amount written in the deals between them.
        carry:
          - The full amounts written in signed deals, not money paid.
          - The ledger records no direction, so a band is a tie, not a flow.
          - Paler bands with a broken edge are disputed deals.
          - A few very large deals make up most of the total, and the ledger holds only what this site has found, so it is a floor.
      - id: chain
        figure: ChainFigure
        file: ValueChainFigures.tsx
        loader: valueChain
        kind: mixed
        route: /value-chain
        anchor: fig-chain
        words:
          - The industry runs as a chain, from power and chips to the people who use the products.
          - The bars count the companies the tracker follows at each step, and the marks beneath are this site's judgement of which way each part's profit is heading.
        carry:
          - A bar is the tracker's reach, the companies it follows, not the size of any market.
          - Each direction is a judgement, not a measurement, drafted by Claude, a model made by Anthropic, whose own part of the chain is among those judged.
          - A part with no mark has not been written up yet, which is not a judgement that it matters less.
      - id: scale
        figure: ScalePlate
        file: MigrationFigures.tsx
        loader: argument
        kind: chart
        route: /argument/migration
        anchor: fig-scale
        words:
          - The scarcest input gets paid, so the site scores how tight each input is on a single scale from slack to severe.
          - A hollow mark is an input with no score, which has no place on the scale and is not the same as slack.
        carry:
          - A hatched mark is a score held with low confidence; it is drawn apart and not ranked with the rest.
          - A hollow mark has no score and no place on the scale.
          - Inputs that sit close together are in no meaningful order.
          - text: Some of the readings behind these scores are close to the age at which they stop counting.
            when: ages_near
      - id: path
        figure: BindingPath
        file: BottleneckFigures.tsx
        loader: bottleneckMap
        kind: model
        route: /bottlenecks
        anchor: fig-path
        words:
          - A stage of AI's spread moves no faster than the scarcest thing it needs.
          - The boxes show where an input is scored tight tonight and where a named writer expects something to bind.
        carry:
          - "The boxes are the same width on purpose: nothing measures how much passes through a stage."
          - A row listed as expected is a named writer's claim, or this site's, not a reading.
          - A stage with no score is unmeasured, which is not the same as free.
          - A hatched square in the tight colour is a score marked low in confidence.
      - id: anatomy
        figure: Anatomy
        file: FirmKinds.tsx
        loader: firmKinds
        kind: model
        route: /firm/kinds
        anchor: fig-anatomy
        words:
          - "This is the site's own picture of where firms are heading: people who answer for the work, a layer that checks it, a working base, and a line between what is rented and what is owned."
          - It is a model joined from arguments, and no reading tests it whole.
        carry:
          - "This site's own picture, drafted by a model: a judgement about where firms are heading, not a measurement of any firm."
          - It is joined from arguments made on other pages, and no reading tests it whole.
  - id: III
    anchor: act-next
    illustration: story-act-3
    sentence: What happens from here is disputed, and a dispute can be read only where someone has written down a test.
    panels:
      - id: reach
        figure: DisputeReach
        file: OutlookFigures.tsx
        loader: outlook
        kind: chart
        route: /outlook
        anchor: fig-settle
        words:
          - The writers disagree, and each mark is one of their disputes.
          - A hollow mark is a dispute on which nothing has been read yet, and a dark mark means a reading met a claim's line, not that either side has the better of the argument.
        carry:
          - "A dark mark does not mean either side has the better of the argument: a single claim that met its line fills it, whether or not the rival expected the same reading."
          - text: In most disputes no claim on either side has a test, so nothing the site reads bears on them yet.
            when: most_disputes_untested
          - Some of the writers drawn have ties to Anthropic, the maker of the model that drafted these figures; each tie is given with its source on the full page.
      - id: tally
        figure: TallyBars
        file: BoardFigures.tsx
        loader: board
        kind: chart
        route: /predictions
        anchor: fig-tally
        words:
          - The site keeps a ledger of dated forecasts and gives each a word every night.
          - A bar shows shares, so a short section and a long one look alike.
        carry:
          - A bar shows shares; the counts are in the table on the full page.
          - The words are this site's reading tonight, not a final verdict.
          - "A dated forecast by someone else has no word for wrong: one scored behind reads as slower than said."
      - id: leans
        figure: LeanBars
        file: BoardFigures.tsx
        loader: board
        kind: mixed
        route: /predictions
        anchor: fig-leans
        needs: leans
        words:
          - Where a forecast is too early to tell, a model was asked which way it leans.
          - Every bar is hatched because it draws a judgement and not a reading, and a lean changes no word on the board.
        carry:
          - A model's judgements, not readings, and every bar is hatched to say so.
          - The judge is a model made by Anthropic; some of these forecasts are about Anthropic and its rivals, and no person reviewed each lean.
          - Bars are shares, so a section with few leans can draw the longest bar.
      - id: timeline
        figure: TimelinePlate
        file: SingularityParts.tsx
        loader: singularity
        kind: chart
        route: /singularity
        anchor: timeline
        words:
          - Each row is a milestone and each mark is the year a forecaster gave for it.
          - "Read across a row to see how far apart the years are, and remember they are not the same kind of year: some are deadlines, some a most likely year, some the end of a range."
        carry:
          - "The scale is not even: the years around now get most of the width."
          - A forecast is placed at the start of its year, so one due by the end of this year sits left of today while its window is still open.
          - A row counts forecasts, not people, and mixes claims that do not mean the same thing.
          - The heads of Anthropic and of rival labs are among the forecasters, each placed by the same rule from its own record.
      - id: said
        figure: SaidAgainstGiven
        file: LongRunFigures.tsx
        loader: singularity
        kind: chart
        route: /singularity
        anchor: fig-said
        words:
          - Each mark sets the year a forecast was made against the year it named.
          - The marks fall toward the lower right because different people made different claims in different years, not because anyone here changed a date.
        carry:
          - No forecaster's earlier and later date for the same claim is on record, so the shape is not evidence that forecasts are converging.
          - Neither scale is even, so height is not distance, and no trend line is fitted.
          - A mark set beside another is tied back by a short line to the date it was made.
          - The heads of Anthropic and of rival labs are among the forecasters drawn, each placed by the same rule from its own record.
      - id: worlds
        figure: WorldsGrid
        file: LongRunFigures.tsx
        loader: singularity
        kind: model
        route: /singularity
        anchor: fig-worlds
        words:
          - The site keeps several worlds open and crowns none.
          - A world reads consistent until a signpost in one of its cells fails, so consistent here means not ruled out.
        carry:
          - Consistent means not ruled out, and nothing more.
          - text: No signpost on the grid holds or fails tonight, so the grid is no evidence that any world is on its way.
            when: no_world_signpost_read
          - The placing of each world is this site's, a drawing of an idea.
      - id: fiction
        figure: FictionLag
        file: LongRunFigures.tsx
        loader: singularity
        kind: chart
        route: /singularity
        anchor: fig-lag
        words:
          - Stories are not forecasts, and nothing in this last figure is evidence for any date above.
          - Of the imagined inventions that were later built, it counts the wait between the story and the thing, and most ideas in the bank are not marked built at all.
        carry:
          - "The fiction lane: stories, not forecasts, and not evidence for any date."
          - It counts only ideas the idea bank marks as built, so it shows how long the built ones took and is no guide to how long a story written today will wait.
          - Whether and when an idea was built is the bank's own mark, not this site's finding.
