    - id: bbd_work_use_daily
      word: consistent_with_normal
      reason: The one reading on the site, from late 2025, is a little under the normal ceiling, so it was read as normal.
        It is close to the edge, and the same survey's weekly-use series has kept climbing since, so daily use has probably
        risen into the gap between the bands by now; that is the strongest reason this could be wrong by a step.
    - id: canaries_entry_level_gap
      word: faster_than_normal
      reason: 'The two readings on the site sit between the bands, nearer the fast floor than the normal ceiling, and the
