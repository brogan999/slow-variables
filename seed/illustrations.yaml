# Illustrations placed outside Futures (plan Part 44b): one 720 by 480 WebP each in web/public/illustrations/, copied
# byte for byte from the owner's delivery of 6 Oct 2026 and never re-encoded. He made them with his own image pipeline
# from this site's prompt sheet (docs/briefs/illustration-prompts-2026-10.md). `sha256` is the served file's, checked
# against the delivery's SHA256SUMS and manifest; `original_sha256` is the PNG master's, which is not committed.
# `model`, `revision`, `subject_brief` and `prompt` are the manifest's (`prompt` is the last one run: for an edit model
# it is the correction applied to the scene the brief describes). `alt` is this site's. `stage` is set where the
# placement names next or later: such a scene pictures this site's judgement, not anything observed. `page` is where
# the image is shown; `waits_for` marks one recorded for a page that does not exist yet and shown nowhere.
# Decision: the delivery flagged firm-freight and firm-retailer for small background markings. Both are used: the
# markings are not legible text at this size. Each record's `note` carries the delivery's own flag.
# On the page every one carries the credit "Illustration made with AI image generation; not evidence".
