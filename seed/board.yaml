# The ten questions the owner asks of capability, and the instrument this site reads for each, if any.
questions:
  - {question: "Can models handle genuinely new problems?", indicator: arc_agi_frontier}
  - {question: "Can they keep learning without forgetting?", indicator: continual_learning_level}
  - {question: "Can they tell cause from coincidence?", indicator: null, note: "No public test measures it yet."}
  - {question: "Can they carry a long project through on their own?", indicator: metr_horizon_50}
  - {question: "Do they know when they are unsure?", indicator: null, note: "HAL, a Princeton benchmark, scores how predictable agents' failures are; this site stores it but does not draw it yet."}
  - {question: "Is AI speeding up its own research?", indicator: rsi_agent_workdays_per_human}
  - {question: "Will data and computing run short?", indicator: epoch_data_exhaustion_year, note: "Whether data made by machines keeps its quality has no public test."}
  - {question: "Are they reliable enough for work where mistakes are costly?", indicator: pass_hat_k_tau_bench, note: "HAL also scores consistency, robustness and safety; only accuracy and overall reliability are drawn."}
  - {question: "Can we verify what they are aiming at?", indicator: null, note: "No public test verifies a model's goals."}
  - {question: "Do bigger models still surprise us?", indicator: surprise_index}
