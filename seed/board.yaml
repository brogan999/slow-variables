  chips_finance_buyers: [circular_financing_scale]
  labs_buy_deployers: [lab_vertical_integration_exit_bell]
  lab_margins_below: [lab_recoupment_ratio]

words:
  happening: {label: "Happening", meaning: "Tonight's reading is what the prediction says."}
  not_happening: {label: "Not happening", meaning: "Tonight's reading is against it, or its own test fails."}
  slower: {label: "Slower than said", meaning: "Moving the way it says, but behind the timetable it gave."}
  both: {label: "Both sides expect this", meaning: "The reading fits this prediction and its rival alike, so it settles nothing yet."}
  too_early: {label: "Too early to tell", meaning: "No reading can test it yet, the reading is too old, or its date has not come."}

