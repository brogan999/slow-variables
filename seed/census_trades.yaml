# The trades on the census page's combined list (plan Part 38): where AI roll-ups are, what they have bought, and the
# census figure for the trade. A roll-up is filed once, under the trade the roll-up directory gives it and the country
# it gives (us, elsewhere), or unstated where the directory has no row for it. A deal is filed under its target's
# trade, which may not be its buyer's. One census figure per trade: `naics` selects one industry row of the bundle,
# `card` one of its deal cards (used for the figure only when there is no `naics`), and `no_figure` says why neither fits.
# `swept` lists the buyers searched for published acquisitions (tests/test_manual.py pins the same set).
