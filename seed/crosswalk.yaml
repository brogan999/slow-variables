# First-class: the same observations carry a diffusion address and a capture address (v2 §3). Shared indicators are
# derived at load from each indicator's two addresses; `check` fails an indicator whose pair has no row here.
crosswalk:
  - {bucket_id: methods, layer_id: model, relation: same_valve, note: "Capability growth is the model layer's product; inference price at fixed capability ⇄ price-per-token pass-through; open-weights lag ⇄ open-vs-closed gap."}
  - {bucket_id: methods, layer_id: compute_physical, relation: input_to, note: "Compute growth and hardware perf-per-dollar feed the methods stock."}
  - {bucket_id: products, layer_id: serving_orchestration, relation: same_valve, note: "Productisation runs through serving, routing and agent infrastructure."}
  - {bucket_id: products, layer_id: deployment_application, relation: same_valve, note: "Uplift RCTs, pilot→production and app-layer margin net of inference measure the same valve."}
  - {bucket_id: early_adoption, layer_id: adopters, relation: same_valve, note: "BTOS, BBD, Ramp and the Anthropic Economic Index are adoption from both ends."}
  - {bucket_id: adaptation, layer_id: labour_consumers, relation: same_valve, note: "Productivity, wages, employment and consumer surplus."}
  - {bucket_id: adaptation, layer_id: deployment_application, sublayer_id: deployment_services, relation: leak_from, note: "Deployment/FDE services capture part of the surplus that adaptation creates."}
  - {bucket_id: return_arrow, layer_id: training_input, relation: return_arrow, note: "Expert data, RL environments and continual-learning infra are the deployment→invention channel; lab recoupment ⇄ capex-to-revenue."}
  - {bucket_id: leak, layer_id: compute_physical, relation: leak_from, note: "Margin stacking, HHI, circular financing: surplus exiting the chain at semis and cloud. Interpretive spine: Teece, Nordhaus, Perez, Ding (docs/interpretation)."}
  - {bucket_id: return_arrow, layer_id: model, relation: return_arrow, note: "Inside the labs: agent work on the labs' own research and lab recoupment are deployment feeding back into invention."}
  - {bucket_id: adaptation, layer_id: model, relation: input_to, note: "Backlash, safety brakes and paused runs are adaptation acting back on the model layer."}
  - {bucket_id: methods, layer_id: training_input, relation: input_to, note: "The public text stock and other training inputs bound how fast the methods stock can grow."}
  - {bucket_id: adaptation, layer_id: adopters, relation: same_valve, note: "Adaptation inside adopting organisations and sectors: regulated devices, state bills, call-centre uplift, reported executive impact."}
  - {bucket_id: products, layer_id: model, relation: same_valve, note: "Reliability, calibration and the gap between internal and external deployment decide what the model layer can productise."}
  - {bucket_id: early_adoption, layer_id: model, relation: same_valve, note: "Buyers spreading work across several labs is adoption breadth read from the model layer."}
  - {bucket_id: early_adoption, layer_id: labour_consumers, relation: same_valve, note: "People adopting directly: consumer and worker use counted from the household side."}
  - {bucket_id: leak, layer_id: labour_consumers, relation: leak_from, note: "Consumer surplus is where most of the value goes if the capture thesis fails: the leak to labour and consumers."}
