  domains: [culture, politics, security]
- title: The Quantum Thief
  author: Hannu Rajaniemi
  year_written: 2010
  set_in_words: centuries ahead
  lane: uploads
  line: In a solar system of uploaded collectives, copied minds made to work and a Martian city where time is money, a master
