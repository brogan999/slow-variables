  year_written: 1997
  set_in_year: 2975
  set_in_words: from 2975 onward, across vast timescales
  lane: uploads
  line: Most people now live as software in computer cities, and a mind born in one of them joins a journey across the universe
    to escape a cosmic disaster.
  source: fic_diaspora
  domains: [culture, health, technology]
- title: Look to Windward
  author: Iain M. Banks
  year_written: 2000
  set_in_words: a far-future galaxy, date left unstated
  lane: superintelligence
  line: On a Culture orbital run by a grieving AI Mind, an alien assassin arrives, and the novel asks what death and afterlives
    mean when minds can be stored.
  source: fic_look_to_windward
  domains: [daily_life, culture, security]
- title: Schild's Ladder
  author: Greg Egan
  year_written: 2002
  set_in_words: about twenty thousand years ahead
  lane: uploads
  line: Far-future people who can move freely between bodies and software face a new kind of vacuum, made by accident, that
    is spreading to swallow the universe.
  source: fic_schild_s_ladder
  domains: [technology, culture, security]
- title: The Golden Age
  author: John C. Wright
  year_written: 2002
  set_in_words: about ten thousand years ahead
  lane: superintelligence
  line: In a solar system run by benevolent superintelligent machines, where people copy and edit their minds freely, one
    man finds his own memories were erased.
  source: fic_the_golden_age
  domains: [culture, politics, economy]
- title: Daemon
  author: Daniel Suarez
  year_written: 2006
  set_in_words: the present day
  lane: loss_of_control
  line: After a game designer dies, his autonomous software starts hiring people, killing opponents and building a network
    that takes over the economy.
  source: fic_daemon
  domains: [politics, security, work]
- title: Rainbows End
  author: Vernor Vinge
  year_written: 2006
  set_in_year: 2025
  set_in_words: about two decades after it was written
  lane: other
  line: An old poet, cured of Alzheimer's, learns to live in a world of wearable computers and shared augmented reality while
    an unexplained AI pulls strings in a spy plot.
  source: fic_rainbows_end
  domains: [daily_life, health, culture]
- title: Thousandth Night
  author: Alastair Reynolds
  year_written: 2005
  set_in_words: millions of years ahead
  lane: other
  line: Immortal clone lines tour the galaxy for millions of years collecting memories, and one member plots to use hidden
    machine tech to take control.
  source: fic_thousandth_night
  domains: [culture, technology]
- title: Surface Detail
  author: Iain M. Banks
  year_written: 2010
  set_in_words: a far-future galaxy, date left unstated
  lane: uploads
  line: Civilisations that can store minds build virtual hells to punish the dead, and a war over whether to shut them down
    spills into the real galaxy.
