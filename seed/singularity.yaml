# The singularity timeline (plan Part 17). The forecasts are ledger predictions (seed/predictions.yaml, ledger
# `singularity`, in this site's words, credited and linked); this file places them on lanes and adds what a
# timeline needs: the readings each lane leans on, ten things to watch, four worlds read through the outlook's
# scenario grid, an unscored lane of fiction, and every source with its fetch record. Prose types no number; only
# years stand as digits. A quote is exact, under fifteen words, from a public work, and carries no figure.
intro: 'People have been dating the arrival of machines smarter than us since the 1960s. This page puts their calls on one
  line, from the mathematicians who first imagined an intelligence explosion to this summer''s revised timelines, and reads
  each against what this site measures tonight. Nobody on it is crowned: the page shows who said what, when they said it,
  what would prove them wrong, and which way the evidence leans so far.'
