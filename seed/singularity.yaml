questions:
- id: horizon
  question: Does the length of task an AI can finish keep doubling as fast as the fastest forecasts need?
  reads: horizon_doubling
  fast: Doubling at or faster than the pace the fastest scenarios assume.
  slow: The doubling time stretching out, or the horizon stalling at a day or two of work.
  label: doubling time of the task length
- id: uplift
  question: Does AI speed up the people who build it, when that is tested in a controlled trial?
  reads: dev_rct_uplift
  fast: Trials showing developers finishing work much faster with AI than without it.
  slow: Trials showing little or no gain, as the first one did.
  label: speed-up in the latest controlled trial
- id: researcher
  question: Does any lab reach an AI that does the work of its own researchers?
  reads: rsi_agent_workdays_per_human
  fast: Independent tests showing agents doing more research work than the people overseeing them.
  slow: The measure staying a lab's own claim, with no outside test.
  label: a lab's own count of AI workdays per human workday
- id: power
  question: Does the power for the largest training runs actually get built?
  reads: epoch_training_power_growth
  fast: The power drawn by the largest training runs keeps growing at its recent pace.
  slow: The growth slowing as grid connections and turbines run short.
  label: doubling time of the power the largest training runs draw
- id: money
  question: Does the spending on computing survive, and does revenue catch up with it?
  reads: capex_to_revenue
  fast: Spending staying high while the revenue it is meant to earn closes the gap.
  slow: A cut in spending plans, or revenue falling further behind.
  label: building and equipment spending against AI revenue
- id: rivals
  question: Do open and Chinese models stay only a few months behind the best closed ones?
  reads: open_lag
  fast: The gap staying short, so no single lab can pull away.
  slow: The gap widening as the leading labs hold their best models back.
  label: months open models trail the best closed ones
- id: brakes
  question: Do the labs keep pulling their own brakes, pausing a run or holding a model back?
  reads: safety_brake_events
  fast: Few brakes, and releases that go ahead as soon as the models are ready.
  slow: More pauses and gated releases, of the kind a lab announces itself.
  label: brakes the labs announced in the last year
- id: jobs
  question: Do young workers in the jobs most exposed to AI fall further behind?
  reads: junior_gap
  fast: Hiring of young workers in exposed jobs falling well behind older workers.
  slow: The gap staying small, or closing.
  label: gap between young and older workers in exposed jobs
- id: growth
  question: Does output per person break away from its old growth rate?
  reads: gdp_pc_yoy
  fast: Growth in output per person well above its long-run pace.
  slow: Growth near its usual rate, year after year.
  label: output per person, change on a year
- id: robots
  question: Do robots leave the lab and do useful physical work at scale?
  fast: Robots doing everyday physical work outside factories, sold in large numbers.
  slow: Robots staying in demonstrations and controlled settings.
worlds:
- id: managed_explosion
  label: A managed explosion
  short: Managed explosion
  text: Superintelligence arrives within a few years and the economy grows faster than ever, but governments and labs slow
    down enough to keep the systems checked.
  argued_by:
  - ai_2027
  - macaskill_moorhouse
  cells:
  - progress: automated_research
    rules: licensed
- id: long_diffusion
  label: A long diffusion
  short: Long diffusion
  text: AI keeps improving but spreads at the pace of earlier technologies, growth rises without exploding, and the disruption
    falls on particular jobs and places.
  argued_by:
  - moll_imas
  - normal_tech
  - jones_tonetti
  cells:
  - progress: steady
    rules: unclear
  - progress: steady
    rules: priced
  - progress: steady
    rules: licensed
- id: loss_of_control
  label: Control slips away
  short: Control slips
  text: Either a race produces systems nobody can check, or people are slowly made irrelevant as AI takes over the work, thought
    and choices that gave them a say.
  argued_by:
  - ai_2027
  - kulveit_gradual
  - critch_2024
  cells:
  - progress: loss_of_control
    rules: unclear
  - progress: automated_research
    rules: unclear
