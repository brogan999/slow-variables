# The value-chain atlas (plan Part 48; src/ai_tracker/chain_atlas.py): a call on each business that could be built, and
# what each future the outlook's grid fills does to it. Every entry is a model's judgement in words, made under the
# Part 39 policy: never a reading and never a status, and no evaluator, metric, tally or query tool reads this file.
# A take, a reason and a `kills` type no figure. A future is named progress/rules, as seed/outlook.yaml names its cells;
# one left out changes nothing. To withdraw a judgement, delete it.
made_by:
  model: claude-opus-5-5
  date: '2026-10-07'
  method: One model read each published business beside the site's readings of the value chain and each future the outlook's
    grid fills, gave the business a call with one line of reasoning and the one thing that would undo it, and said in words
    what each future does to it. A future it left out changes nothing.
  reviewed_by: a separate reviewing run of the same model; no person reviewed each one
calls:
- id: build
  name: Build
  says: Scarce in most futures, and the profit can be kept.
- id: cond
  name: Build on a condition
  says: Worth building as a way in, or once one thing is true.
- id: 'no'
  name: Don't build alone
  says: Useful work whose profit is not kept. A feature of something else.
effects:
  stronger: stronger
  weaker: weaker
  breaks: breaks
  unchanged: unchanged
stages:
  now: First bet
  next: Second bet
  later: Third bet
  endgame: The endgame
businesses:
  regulated_assurance:
    call: build
    take: Start here. The buyer must have it and the seller can never supply it.
    kills: Regulators accept the seller's own tests.
    futures:
      stall_capability/unclear:
        effect: stronger
        reason: If models stop improving, regulated firms settle on what exists and need it signed off.
      steady/priced:
        effect: stronger
        reason: Courts and insurers ask who vouched for the system, and the seller cannot vouch for itself.
      steady/licensed:
        effect: stronger
        reason: A regulator that licenses agents needs approved outside testers.
      automated_research/licensed:
        effect: stronger
        reason: A slowed race is slowed until systems can be checked, and this is the checking.
  outcome_verification:
    call: build
    take: The best standalone business on the map. Every future that makes agents matter makes proof scarcer.
    kills: The labs ship self-checking that buyers accept.
    futures:
      steady/priced:
        effect: stronger
        reason: Once a payer is liable for an agent's mistakes, it will pay for proof that the work was done right.
      automated_research/unclear:
        effect: stronger
        reason: More agent work with fewer people watching makes an outside check the only check.
  agent_audit_trail:
    call: build
    take: Unglamorous and durable. As many futures strengthen it as any business here, and none weakens it.
    kills: The audit record becomes a free feature of the software that runs the agent.
    futures:
      steady/priced:
        effect: stronger
        reason: A claim cannot be settled without a record of what the agent did.
      steady/licensed:
        effect: stronger
        reason: A regulator asks for the record before it asks for anything else.
      automated_research/unclear:
        effect: stronger
        reason: Faster agents doing more work leave more to reconstruct after the fact.
      automated_research/licensed:
        effect: stronger
        reason: Checking a system before release starts from its record.
  agent_authority_registry:
    call: build
    take: 'A monopoly-like prize: every counterparty has to ask whoever holds the registry. The fight is with identity providers
      and banks, so take a regulated niche first.'
    kills: An identity provider bundles it for free.
    futures:
      steady/priced:
        effect: stronger
        reason: A liable party needs to know which agent acted for whom before it pays or sues.
      steady/licensed:
        effect: stronger
        reason: Registration before dealing is this business written into law.
  vertical_system_of_record:
    call: build
    take: The strongest application bet. The records and the approvals stay when the models change.
    kills: A general model is allowed to hold the records and sign.
    futures:
      steady/priced:
        effect: stronger
        reason: The trade's own approvals are what a court or an insurer recognises.
  licensed_autonomous_service:
    call: build
    take: The endgame. The biggest prize, and it needs a licence and a balance sheet. Arrive through sign-off and verification.
    kills: Regulators license the software itself, with no firm behind it.
    futures:
      steady/priced:
        effect: stronger
        reason: Buyers want one accountable party, and a licence makes the firm that party.
      steady/licensed:
        effect: stronger
        reason: Oversight that decides who may act favours firms that already hold a licence.
  continual_learning_in_customer:
    call: cond
    take: A good way in with a modest profit. Build it for the record it leaves inside the customer, not for the model.
    kills: The labs offer learning inside the customer themselves.
    futures:
      automated_research/unclear:
        effect: stronger
        reason: When the frontier moves quickly, what was learned inside a customer's own work is the part a lab's next
          release does not replace.
  deploy_to_platform:
    call: cond
    take: The fastest way into a customer today, and it expires. If agents do the fitting, the labour premium goes.
    kills: Agents fit themselves into a firm without engineers.
    futures:
      stall_capability/unclear:
        effect: stronger
        reason: With no better model coming, the gains come from fitting what exists into firms.
      steady/unclear:
        effect: stronger
        reason: Adoption at the pace of past technologies means years of fitting work.
      automated_research/unclear:
        effect: weaker
        reason: Agents that can do the fitting remove the labour this business sells.
  ai_warranty:
    call: cond
    take: 'Too early alone: there is no loss data to price yet. Strong once verification and the audit trail supply it.'
    kills: Insurers price agent risk from their own claims first.
    futures:
      steady/priced:
        effect: stronger
        reason: Priced risk is what a warranty sells, and insurers that exclude AI leave the gap open.
  policy_aware_routing:
    call: cond
    take: No future on the grid touches it. Small unless access to models really does split by country, which the grid does
      not yet cover.
    kills: One supplier is approved everywhere.
    futures: {}
  agent_incident_response:
    call: cond
    take: Small and certain. A natural next product for whoever already holds the audit trail.
    kills: Failures stay rare or stay private.
    futures:
      steady/priced:
        effect: stronger
        reason: Each claim needs someone to say what went wrong.
      steady/licensed:
        effect: stronger
        reason: Reporting rules make an investigation compulsory after a failure.
      automated_research/licensed:
        effect: stronger
        reason: A slowed race treats each failure as evidence, and someone has to gather it.
  outcome_priced_rollup:
    call: cond
    take: A financing play more than an AI one. It works only while clients accept fixed fees and nobody prices the liability.
    kills: Clients bid the saving away at renewal, or liability lands on the roll-up.
    futures:
      stall_capability/unclear:
        effect: stronger
        reason: Stable tools let an owner plan the saving and keep it.
      steady/unclear:
        effect: stronger
        reason: Slow adoption leaves rivals billing by the hour for longer.
      stall_money/unclear:
        effect: weaker
        reason: Buying firms takes capital, and there is less of it.
      steady/priced:
        effect: weaker
        reason: Liability for the work lands on the owner, who did not price it.
  energy_aware_compute:
    call: cond
    take: The power shortage is the most real thing on the map. It takes capital and sites, and the profit follows whoever
      controls the grid connections.
    kills: Grid connections catch up with demand.
    futures:
      stall_capability/unclear:
        effect: weaker
        reason: If capability stalls, demand for new computing eases, and so does the premium for power.
      stall_money/unclear:
        effect: weaker
        reason: A funding stall stops the building that makes sites scarce.
      automated_research/unclear:
        effect: stronger
        reason: Research run by models needs far more computing, and power is what limits it.
      automated_research/licensed:
        effect: weaker
        reason: A deliberate slowdown caps the computing the leaders may use.
  agent_payments:
    call: cond
    take: A monopoly-like prize that exists only if agents buy from agents, which the grid does not yet cover. Build it
      when that trade is visible, and beat the payment firms on proof, not on payments.
    kills: Payment networks add hold-until-verified themselves.
    futures: {}
  permission_connectors:
    call: cond
    take: Worth it only as the standard; the runner-up earns nothing. The software vendors and the labs are racing for it.
    kills: A lab's protocol becomes the default.
    futures:
      steady/licensed:
        effect: stronger
        reason: Permission that must be granted and recorded before an agent acts favours one standard way to grant it.
  outcome_router:
    call: 'no'
    take: Useful and unprofitable. The saving goes to the user, so make it a feature.
    kills: Pooled outcome data proves impossible to copy.
    futures:
      stall_money/unclear:
        effect: stronger
        reason: When money is tight, firms care more about paying less for each task.
  context_engineering_service:
    call: 'no'
    take: A thin profit that weakens once rules settle or agents learn on their own. Do it inside deployment or the system
      of record.
    kills: Unwritten knowledge stays out of reach of any model.
    futures:
      stall_capability/unclear:
        effect: stronger
        reason: Firms pay to have their unwritten rules written down when the model will not learn them alone.
      steady/unclear:
        effect: stronger
        reason: Slow adoption keeps the knowledge in people's heads for longer.
      steady/priced:
        effect: weaker
        reason: A buyer wants its working knowledge held by whoever carries the risk, not by a service firm.
      automated_research/unclear:
        effect: weaker
        reason: Better models learn a firm's habits from its records without the service.
  pooled_expert_records:
    call: 'no'
    take: Demand rests on what the labs will pay, and that falls if the money stalls.
    kills: Labs keep paying for graded expert work at any price.
    futures:
      stall_money/unclear:
        effect: weaker
        reason: Labs are the buyers of graded expert work, and data budgets are cut early when money is short.
  open_weight_post_training:
    call: 'no'
    take: The skill is scarce today and the profit is not kept. Tuning ends up a feature of a learning model or a trade's
      system.
    kills: Open models stay hard to tune for years.
    futures:
      stall_money/unclear:
        effect: weaker
        reason: Customers put off tuning projects when budgets fall.
      automated_research/licensed:
        effect: weaker
        reason: Oversight of the leading systems tends to reach open models and who may adapt them.
  deployment_talent:
    call: 'no'
    take: The only business here that a future breaks outright. A good service firm, not a durable one.
    kills: Agents never learn to do the fitting.
    futures:
      stall_capability/unclear:
        effect: stronger
        reason: Spreading what already works takes people who can deploy it.
      automated_research/unclear:
        effect: breaks
        reason: If agents do the deployment, there is nobody left to train.
