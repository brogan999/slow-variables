priors_by: The planning assumptions of the site's owner, reworded by a model. They are what the calls on this page take
  for granted, not readings and not findings. Where one follows a writer the site introduces elsewhere, it says so.
priors:
- id: customers
  name: About customers
  assumptions:
  - text: Customers want the problem solved, not another tool.
    exception: Technical buyers who want control.
    weakened_by: Self-serve tools outgrowing done-for-you services in the same trade.
  - text: Customers want fewer suppliers to hold accountable.
    exception: Where the best part from each supplier is worth the trouble.
    weakened_by: Firms adding AI suppliers faster than they consolidate them.
  - text: The way in is the customer's most pressing problem.
    exception: Where a regulator dictates the order.
    weakened_by: Products that began with a minor convenience taking the main budget later.
  - text: When something important fails, customers want someone solvent to put it right.
    exception: Low-stakes work.
    weakened_by: Buyers accepting agents with no named party behind them.
  - text: Customers want to be able to leave a model or supplier, even when they stay.
    exception: When a supplier is far ahead.
    weakened_by: 'Firms giving up the means to switch: a single lab''s tools throughout, and no other supplier tested.'
  - text: Customers expect better economics over time, though the bill may still rise if they use more.
    weakened_by: Prices holding while quality stalls.
- id: systems
  name: About the systems
  assumptions:
  - text: Producing an answer and proving it right stay separate jobs.
    weakened_by: Agents becoming cheap and reliable at checking their own work.
  - text: What a firm knows is local and goes stale, so it has to be kept fresh and tied to results.
    weakened_by: Agents learning a firm's unwritten rules from its records alone.
    after:
      who: Friedrich Hayek
      href: /firm
  - text: 'An agent''s right to act stays limited: capability does not confer permission.'
    weakened_by: Firms letting agents sign, pay and commit with no limit set, and no losses following.
  - text: 'Physics still matters: energy, delay, memory and distance limit where AI can run.'
    weakened_by: Efficiency gains outrunning demand for years.
  - text: Different work needs different models and places to run.
    weakened_by: A single supplier being best on price and quality for most tasks.
- id: markets
  name: About markets and institutions
  assumptions:
  - text: 'Adoption lags capability: budgets, rules and trust move slower than the models.'
    weakened_by: Firms' use of AI rising as fast as the models improve.
    after:
      who: Arvind Narayanan and Sayash Kapoor
      href: /diffusion
  - text: 'Competition moves the shortage and does not remove it: when a part becomes plentiful, the profit moves to what
      is still scarce.'
    weakened_by: Profits falling across the whole chain at once.
    after:
      who: the site's migration essay, which follows Eliyahu Goldratt and David Ricardo
      href: /argument/migration
  - text: Responsibility has to land on someone.
    weakened_by: A court or regulator treating an agent's act as nobody's.
  - text: Customers differ, so shared infrastructure will sit beside local set-up and judgement.
    weakened_by: A single configuration serving most firms in a trade.
  - text: 'Evidence has to change decisions: a rating with no source, no test and no review date becomes decoration.'
    weakened_by: Calls on this page being kept after the readings under them have moved.
