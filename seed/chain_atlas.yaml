# The value-chain atlas (plan Part 48; src/ai_tracker/chain_atlas.py): a call on each business that could be built, and
# what each future the outlook's grid fills does to it. Every entry is a model's judgement in words, made under the
# Part 39 policy: never a reading and never a status, and no evaluator, metric, tally or query tool reads this file.
# A take, a reason and a `kills` type no figure. A future is named progress/rules, as seed/outlook.yaml names its cells;
# one left out changes nothing. `categories` and `shifts` (Part 48b) say what is scarce on each part of the map and how each
# future moves it; `chains` (Part 48d) tie the site's migration predictions to parts and businesses, `builds` says which
# `primitives` each business builds, and `priors` are the owner's planning assumptions, not judgements of the model; `reading` names the tightness gauge whose scored word replaces the judged `now`. To withdraw a judgement, delete it.
made_by:
  model: claude-opus-5-5
  date: '2026-10-08'
  method: One model read each published business beside the site's readings of the value chain and each future the outlook's
    grid fills, gave the business a call with one line of reasoning and the one thing that would undo it, and said in words
    what each future does to it. A future it left out changes nothing. The same model then said, for each part of the map
    in scope, what is scarce there, how short it is now, in the transition and at the mature state, and which futures tighten
    or ease it, each with a reason. The second group of futures are each a model's summary of what named writers on the
    outlook argue, and were judged the same way. It also tied each of the site's migration predictions to parts of the map
    and to businesses, and said which of the owner's lasting things each business builds.
  reviewed_by: separate reviewing runs of the same model, which changed calls, takes, words and reasons, withdrew some effects
    and moves and added others; no person reviewed each one
calls:
- id: build
  name: Build
  says: Scarce in most futures, with a profit worth the fight.
- id: cond
  name: Build on a condition
  says: Worth building as a way in, or once one thing is true.
- id: 'no'
  name: Don't build alone
  says: Useful work whose profit is not kept. A feature of something else.
effects:
  stronger: stronger
  weaker: weaker
  breaks: breaks
  unchanged: unchanged
stages:
  now: First bet
  next: Second bet
  later: Third bet
  endgame: The endgame
businesses:
  regulated_assurance:
    call: build
    take: Start here. Where a rule asks for an outside sign-off, the seller cannot be the one who gives it.
    kills: Regulators accept the seller's own tests.
    futures:
      steady/priced:
        effect: stronger
        reason: Courts and insurers ask who vouched for the system, and the seller cannot vouch for itself.
      steady/licensed:
        effect: stronger
        reason: Registration before dealing gives a regulator a point at which to ask for an outside sign-off.
      automated_research/licensed:
        effect: stronger
        reason: A race slowed until systems can be checked makes an outside check worth more.
      owners/closed_lead:
        effect: stronger
        reason: The more a firm depends on one seller, the more it needs someone else to vouch for what is sold.
  outcome_verification:
    call: build
    take: Strong on its own. The more work agents do, the scarcer the proof that it was done right.
    kills: The labs ship self-checking that buyers accept.
    futures:
      steady/priced:
        effect: stronger
        reason: Once a payer is liable for an agent's mistakes, it will pay for proof that the work was done right.
      automated_research/unclear:
        effect: stronger
        reason: More agent work with fewer people watching makes an outside check worth more, unless agents come to check
          themselves.
      owners/agents_trade:
        effect: stronger
        reason: A buyer's agent needs proof that the work was done before it pays.
  agent_audit_trail:
    call: build
    take: Unglamorous and durable. Whoever pays, licenses or investigates starts from the record.
    kills: The audit record becomes a free feature of the software that runs the agent.
    futures:
      steady/priced:
        effect: stronger
        reason: A claim cannot be settled without a record of what the agent did.
      steady/licensed:
        effect: stronger
        reason: Registration is only useful if what a registered agent did can be read back afterwards.
      automated_research/unclear:
        effect: stronger
        reason: Faster agents doing more work leave more to reconstruct after the fact.
      owners/agents_trade:
        effect: stronger
        reason: A deal between agents is settled from the record.
  agent_authority_registry:
    call: build
    take: 'A monopoly-like prize: every counterparty has to ask whoever holds the registry. The fight is with the identity
      firms, so take a regulated niche first.'
    kills: An identity firm bundles it for free.
    futures:
      steady/priced:
        effect: stronger
        reason: A liable party needs to know which agent acted for whom before it pays or sues.
      steady/licensed:
        effect: stronger
        reason: Registration before dealing is this business written into law.
      stall_capability/unclear:
        effect: weaker
        reason: If whole jobs stay out of reach, agents keep working inside a person's own session, and no separate identity
          is needed.
      owners/agents_trade:
        effect: stronger
        reason: A stranger's agent has to show whom it acts for before anyone deals with it.
  vertical_system_of_record:
    call: build
    take: A strong application bet. It holds if the records and the approvals stay when the models change.
    kills: A general model is allowed to hold the records and sign.
    futures:
      steady/priced:
        effect: stronger
        reason: The trade's own approvals are what a court or an insurer is likeliest to recognise.
      automated_research/unclear:
        effect: weaker
        reason: Models that improve this fast are the case in which customers move to the labs' own products.
      owners/closed_lead:
        effect: weaker
        reason: Labs that move into their customers' work compete for the same place.
  licensed_autonomous_service:
    call: build
    take: The endgame. It needs a licence and a balance sheet, so arrive through sign-off and verification.
    kills: Regulators license the software itself, with no firm behind it.
    futures:
      steady/priced:
        effect: stronger
        reason: Buyers want one accountable party, and a licence makes the firm that party.
      steady/licensed:
        effect: stronger
        reason: Oversight that decides who may act favours firms that already hold a licence.
      stall_capability/unclear:
        effect: weaker
        reason: A firm that sells the finished job needs agents that can finish it.
      stall_money/unclear:
        effect: weaker
        reason: Its own first need is capital, and there is less of it.
  continual_learning_in_customer:
    call: cond
    take: A good way in with a moderate profit. Build it for what it learns inside the customer's work, which the customer
      would lose by leaving.
    kills: The labs offer learning inside the customer themselves.
    futures:
      automated_research/unclear:
        effect: weaker
        reason: When each model speeds up the next, a new release is likelier to overtake what the customer's model learned.
      stall_capability/unclear:
        effect: stronger
        reason: With no better general model coming, what a model learns inside one customer keeps its value.
      owners/open_frontier:
        effect: stronger
        reason: When the base model is free, what a model learns inside one customer is the part worth paying for.
      owners/on_device:
        effect: stronger
        reason: A model that runs beside the customer's data can learn from it there.
      owners/closed_lead:
        effect: weaker
        reason: Labs that move into their customers' work offer the learning themselves.
  deploy_to_platform:
    call: cond
    take: A quick way into a customer today that may not last. If agents do the fitting themselves, there is no scarce labour
      left to charge for.
    kills: Agents fit themselves into a firm without engineers.
    futures:
      stall_capability/unclear:
        effect: stronger
        reason: With no better model coming, the gains come from fitting what exists into firms.
      steady/unclear:
        effect: stronger
        reason: Adoption at the pace of past technologies means years of fitting work.
      automated_research/unclear:
        effect: weaker
        reason: Agents that can do the fitting remove the labour this business sells.
      owners/closed_lead:
        effect: weaker
        reason: Labs that deploy inside their customers' work do this fitting themselves.
  ai_warranty:
    call: cond
    take: 'Too early alone: there is too little loss data to price yet. Strong once verification and the audit trail supply
      it.'
    kills: Insurers price agent risk from their own claims first.
    futures:
      steady/priced:
        effect: stronger
        reason: Once rules settle who pays, the risk can be priced, though the same future lets insurers price it themselves.
      owners/agents_trade:
        effect: stronger
        reason: A firm that lets an agent spend for it wants someone standing behind the agent.
  policy_aware_routing:
    call: cond
    take: Its worth turns on how far governments decide which models a firm may use. Where they do, this business keeps
      a firm inside the line, though the routing itself can be copied.
    kills: One supplier is approved everywhere.
    futures:
      owners/country_split:
        effect: stronger
        reason: A firm barred from a supplier has to stay inside the models it is allowed and switch when one is cut off.
  agent_incident_response:
    call: cond
    take: A natural next product for whoever already holds the audit trail. Demand waits on failures that are public.
    kills: Failures stay rare or stay private.
    futures:
      steady/priced:
        effect: stronger
        reason: Each claim needs someone to say what went wrong.
      steady/licensed:
        effect: stronger
        reason: A registered agent has a named party behind it, who must answer when it fails.
      automated_research/unclear:
        effect: stronger
        reason: Faster agents doing more work fail in more places, and each failure has to be explained.
  outcome_priced_rollup:
    call: cond
    take: 'An ownership play more than an AI one: the asset is the client and the AI is bought in. It works only while clients
      accept fixed fees.'
    kills: Clients bid the saving away at renewal.
    futures:
      steady/unclear:
        effect: stronger
        reason: Slow adoption leaves rivals billing by the hour for longer.
      stall_money/unclear:
        effect: weaker
        reason: Buying firms takes capital, and there is less of it.
  energy_aware_compute:
    call: cond
    take: Power is short today. It takes capital and sites, and the profit follows whoever controls the connections to the
      power grid.
    kills: Connections to the power grid catch up with demand.
    futures:
      stall_capability/unclear:
        effect: weaker
        reason: If capability stalls, demand for new computing eases, and so does the premium for power.
      stall_money/unclear:
        effect: weaker
        reason: A funding stall stops the building that makes sites scarce.
      automated_research/unclear:
        effect: stronger
        reason: Research run by models needs far more computing, and power is what limits it.
      automated_research/licensed:
        effect: weaker
        reason: A deliberate slowdown eases the rush for new computing, and with it the premium for power.
      owners/open_frontier:
        effect: stronger
        reason: Free models move the cost to the computing that runs them.
      owners/on_device:
        effect: weaker
        reason: Work done on the device is not rented from a data centre.
  agent_payments:
    call: cond
    take: A monopoly-like prize that exists only if agents come to deal with each other. Build it when that trade is visible,
      and beat the payment firms on proof, not on payments.
    kills: Payment networks themselves hold the money until the work is checked.
    futures:
      stall_capability/unclear:
        effect: weaker
        reason: Agents that cannot finish whole jobs do not buy from other agents.
      owners/agents_trade:
        effect: stronger
        reason: Agents that order work for people have to pay for it, and pay on proof.
  permission_connectors:
    call: cond
    take: Worth most as the standard; without that, what is left is each customer's wiring. The software vendors and the
      labs want the same place.
    kills: A lab's protocol becomes the default.
    futures:
      owners/closed_lead:
        effect: weaker
        reason: A lab built into its customers' work can make its own protocol the default.
      owners/agents_trade:
        effect: stronger
        reason: Agents that deal across firms need a way into each firm's systems.
  outcome_router:
    call: 'no'
    take: Useful and unprofitable. The saving goes to the user, so make it a feature.
    kills: Pooled outcome data proves impossible to copy.
    futures:
      owners/open_frontier:
        effect: stronger
        reason: With many good models to choose from, the choice is worth more.
      owners/closed_lead:
        effect: weaker
        reason: A customer built into one lab's products has less left to route.
      owners/country_split:
        effect: weaker
        reason: A firm allowed only some models has less left to route.
  context_engineering_service:
    call: 'no'
    take: A thin profit that weakens once agents learn a firm's habits on their own. Do it inside deployment or the system
      of record.
    kills: Unwritten knowledge stays out of reach of any model.
    futures:
      stall_capability/unclear:
        effect: stronger
        reason: Firms pay to have their unwritten rules written down when the model will not learn them alone.
      steady/unclear:
        effect: stronger
        reason: Slow adoption keeps the knowledge in people's heads for longer.
      automated_research/unclear:
        effect: weaker
        reason: Better models learn a firm's habits from its records without the service.
  pooled_expert_records:
    call: cond
    take: One kind of buyer, the labs. Worth building while they buy graded work from outside.
    kills: Labs bring expert work in-house.
    futures:
      stall_money/unclear:
        effect: weaker
        reason: Labs are the buyers of graded expert work, and a lab short of money buys less of it.
  open_weight_post_training:
    call: 'no'
    take: The skill is scarce today and the profit is not kept. Tuning ends up a feature of a model that learns inside the
      customer, or of a trade's system.
    kills: Open models stay hard to tune for years.
    futures:
      automated_research/unclear:
        effect: weaker
        reason: If each model speeds up the next, the leading labs pull away from open models.
      owners/open_frontier:
        effect: stronger
        reason: Tuning is the work that turns a free model into a product.
      owners/country_split:
        effect: stronger
        reason: A firm shut out of the closed models needs an open one tuned to its work.
  deployment_talent:
    call: 'no'
    take: A good service firm, not a durable one.
    kills: Agents never learn to do the fitting.
    futures:
      stall_capability/unclear:
        effect: stronger
        reason: Spreading what already works takes people who can deploy it.
      automated_research/unclear:
        effect: breaks
        reason: If agents do the deployment, there is nobody left to train.
      steady/unclear:
        effect: stronger
        reason: Adoption at the pace of past technologies means years of work for people who can deploy.
not_judged:
  loss_of_control/unclear: No writer on the site says what this future does to any business, and a model's guess at it would
    be decoration.
times:
- id: now
  name: Now
  says: What the site reads tonight, and a model's judgement where it has no reading. No future changes it.
- id: transition
  name: Transition
  says: The years in which AI is capable but firms are still fitting it into how they work. Shortages here come from the
    pace of adoption, not the pace of the models.
- id: mature
  name: Mature state
  says: A hypothesis of what stays scarce once firms have fitted AI in. Nothing here is a forecast with a date.
scarcity:
  slack: probably slack
  easing: probably easing
  moderate: probably moderate
  tight: probably tight
  severe: probably severe
moves:
  tightens: tightens
  eases: eases
ground:
- id: scarcer
  name: Ground that gets scarcer
  says: Shorter at the mature state than today.
- id: holds
  name: Ground that holds
  says: About as short later as it is today.
- id: eases
  name: Ground that eases
  says: Shorter today than at the mature state.
categories:
  power_and_sites:
    scarce: Sites already connected to the power grid
    reading: energy
    now: severe
    transition: severe
    mature: severe
    reason: Connections to the power grid take longer to build than anything else in the chain, so the shortage eases last
      and least.
  data_centre_infrastructure:
    scarce: Heavy electrical gear, and the trades who install it
    reading: data_centres
    now: tight
    transition: tight
    mature: moderate
    reason: Factories for the gear and trained crews can be added in a few years, faster than connections to the power grid.
  semiconductor_supply_chain:
    scarce: Capacity at the newest chip-making processes
    reading: foundry
    now: moderate
    transition: moderate
    mature: moderate
    reason: A plant for the newest process takes years to build and longer to run well, so capacity grows without catching
      demand.
  memory_storage_and_networking:
    scarce: The fast stacked memory that sits beside an AI chip
    reading: memory
    now: moderate
    transition: moderate
    mature: easing
    reason: Memory is a cyclical business whose makers add capacity when prices rise.
  compute_providers:
    scarce: Rentable computing at a price that works
    now: moderate
    transition: moderate
    mature: easing
    reason: Many firms are building capacity to rent, and what they rent out is much alike.
  compute_utilization_and_control:
    scarce: Knowing where each job should run
    now: easing
    transition: moderate
    mature: moderate
    reason: Few firms need it while computing is simply short; it matters more once supply is uneven by place and price.
  general_purpose_models:
    scarce: A lead over the next-best model
    reading: pretraining
    now: easing
    transition: easing
    mature: easing
    reason: Open models chase the frontier within months, so a lead lasts only while it is renewed.
  modality_native_models:
    scarce: Data for sound, images and science
    now: easing
    transition: easing
    mature: easing
    reason: General models keep absorbing other kinds of input, which leaves a specialist's lead narrow and steady.
  specialized_models:
    scarce: A field's own data and trust
    now: easing
    transition: easing
    mature: easing
    reason: A field's data is hard to gather, but each better general model needs less of it.
  model_compression_and_adaptation:
    scarce: The skill of shrinking a model without losing quality
    now: easing
    transition: moderate
    mature: easing
    reason: As more work moves to cheaper and smaller models, the skill is wanted more before tools spread it.
  data_origination:
    scarce: Experts whose judgement can be checked
    now: moderate
    transition: moderate
    mature: easing
    reason: Experts in narrow fields are hard to recruit in quantity; the need falls as models learn from their own use.
  data_rights_and_exchange:
    scarce: Rights to archives nobody else holds
    now: moderate
    transition: moderate
    mature: moderate
    reason: An archive is licensed and stays its owner's, so the shortage neither clears nor grows.
  data_transformation:
    scarce: Clean, traceable data from live work
    now: easing
    transition: moderate
    mature: easing
    reason: The cleaning is being automated by the same models it feeds.
  synthetic_data:
    scarce: 'Little: whoever owns the model can make it'
    now: slack
    transition: slack
    mature: slack
    reason: A model's owner can generate it at will, so nothing here stays short.
  training_environments:
    scarce: Realistic practice tasks that can be graded
    now: moderate
    transition: moderate
    mature: easing
    reason: Many new sellers have entered, and building environments is a skill that spreads quickly.
  reward_and_verification_systems:
    scarce: A trusted way to grade work
    now: moderate
    transition: tight
    mature: tight
    reason: Grading gets harder as tasks get longer and less clear-cut.
  post_training_and_learning_infrastructure:
    scarce: A model that keeps learning without forgetting
    now: tight
    transition: tight
    mature: moderate
    reason: Deployment makes the lack of learning felt before research closes the gap.
  evals_and_assurance:
    scarce: A judge who is not the seller
    now: moderate
    transition: tight
    mature: tight
    reason: The more that rides on a model, the more a buyer needs someone other than its maker to vouch for it.
  inference_supply:
    scarce: 'Little: serving is priced like a commodity'
    reading: inference
    now: easing
    transition: easing
    mature: slack
    reason: Prices for running a model have fallen steadily, and many firms offer the same service.
  inference_optimization:
    scarce: Engineers who can make serving cheaper
    now: moderate
    transition: moderate
    mature: easing
    reason: Each new model and chip needs the work done again, though the methods are published and copied.
  routing_and_gateways:
    scarce: A record of which choice worked
    now: slack
    transition: slack
    mature: slack
    reason: Open tools, the clouds and the labs give the choosing away; only the record of where traffic went is hard to
      copy.
  context_and_memory:
    scarce: A firm's own knowledge, kept fresh and permissioned
    now: moderate
    transition: tight
    mature: tight
    reason: Every deployment needs it, and it has to be rebuilt firm by firm.
  agent_runtimes:
    scarce: 'Little: the plumbing is mostly free'
    reading: agents
    now: easing
    transition: easing
    mature: slack
    reason: The labs and open projects give the software away.
  tools_and_actuation:
    scarce: Permission into the software that holds a firm's records
    now: moderate
    transition: moderate
    mature: moderate
    reason: Each system has an owner who decides who gets in, and that does not change quickly.
  security:
    scarce: Defences against agents being turned
    now: moderate
    transition: tight
    mature: tight
    reason: Attacks grow with what agents are allowed to do.
  identity_and_authority:
    scarce: Knowing which agent acts for whom
    now: easing
    transition: tight
    mature: tight
    reason: The need appears once agents act across firms, and no shared way of answering it exists yet.
  provenance_and_audit:
    scarce: A record of what an agent did that nobody can alter
    now: moderate
    transition: tight
    mature: tight
    reason: Every dispute and every review starts from the record, and few agents keep one.
  outcome_verification:
    scarce: Proof that an agent's work was done right
    now: moderate
    transition: tight
    mature: severe
    reason: Producing work gets cheaper while checking it does not.
  settlement_and_billing:
    scarce: A way to pay an agent only when the work is done
    now: slack
    transition: easing
    mature: moderate
    reason: Few agents pay for anything today; the need grows only if they start to.
  liability_and_risk_transfer:
    scarce: Someone solvent to stand behind an agent's work
    now: tight
    transition: tight
    mature: severe
    reason: Insurers are excluding AI from standard cover while firms put more work in agents' hands.
  technical_implementation:
    scarce: Engineers who can fit AI into a firm
    now: tight
    transition: tight
    mature: easing
    reason: Much of the fitting is done once at each firm, and tools and agents take over more of it.
  context_engineering:
    scarce: A firm's unwritten rules, written down
    now: tight
    transition: tight
    mature: moderate
    reason: The knowledge sits in people's heads, and models slowly get better at learning it from records.
  managed_ai_operations:
    scarce: People to keep agents running well
    now: moderate
    transition: tight
    mature: moderate
    reason: Running agents is new work that peaks while firms are still learning it.
  adoption_and_change:
    scarce: Managers willing to rebuild work around agents
    now: tight
    transition: tight
    mature: moderate
    reason: Firms change at the pace of their people, which is slower than the models.
  talent_production:
    scarce: People trained to deploy AI
    now: tight
    transition: moderate
    mature: easing
    reason: People can be trained faster than firms can be rebuilt, so this shortage passes first.
  horizontal_copilots:
    scarce: 'Little: the labs sell their own'
    now: slack
    transition: slack
    mature: slack
    reason: The labs sell assistants directly, and one is much like another.
  functional_enterprise_applications:
    scarce: A place in a department's daily work
    now: slack
    transition: easing
    mature: easing
    reason: The products are plentiful; what tightens slightly is room in a department's routine.
  vertical_workflow_software:
    scarce: A trade's records and approvals
    now: easing
    transition: moderate
    mature: moderate
    reason: A general model can draft the work but cannot hold the trade's records or sign for it.
  autonomous_services:
    scarce: A licence, and someone accountable for the result
    now: easing
    transition: moderate
    mature: tight
    reason: Licences are limited by law, and accountable firms cannot be created quickly.
  ai_native_rollups:
    scarce: Owners ready to sell, and clients on fixed fees
    now: easing
    transition: moderate
    mature: moderate
    reason: The firms worth buying are finite, and buyers are arriving.
  consumer_ai:
    scarce: A daily habit
    now: slack
    transition: slack
    mature: easing
    reason: Assistants are free and plentiful; the habit a few products hold is what is hard to win.
shifts:
  stall_capability/unclear:
    technical_implementation:
      move: tightens
      reason: The gains come from fitting what exists, so the people who do it stay short for longer.
    context_engineering:
      move: tightens
      reason: A model that will not learn a firm's habits needs them written down.
    adoption_and_change:
      move: tightens
      reason: Spreading what already works is the whole of the gain.
    general_purpose_models:
      move: eases
      reason: With no new frontier, the followers catch up.
    power_and_sites:
      move: eases
      reason: Demand for new computing eases, and with it the queue for power.
    talent_production:
      move: tightens
      reason: Spreading what already works takes people who can deploy it.
    identity_and_authority:
      move: eases
      reason: Agents that stay inside a person's session need no identity of their own.
    settlement_and_billing:
      move: eases
      reason: Agents that cannot finish whole jobs do not buy from each other.
  stall_money/unclear:
    power_and_sites:
      move: eases
      reason: Building slows, and the queue for connections shortens.
    semiconductor_supply_chain:
      move: eases
      reason: Orders for chips are cut.
    compute_providers:
      move: eases
      reason: Capacity built for demand that did not pay is rented cheaply.
    data_origination:
      move: eases
      reason: A lab short of money buys less expert work.
    data_centre_infrastructure:
      move: eases
      reason: Less is built, so the gear and the crews are easier to get.
  steady/unclear:
    adoption_and_change:
      move: tightens
      reason: Adoption at the pace of past technologies keeps the reorganising of work the limit for longer.
    technical_implementation:
      move: tightens
      reason: Adoption at the pace of past technologies means years of fitting work.
    context_engineering:
      move: tightens
      reason: Slow adoption keeps the knowledge in people's heads for longer.
    talent_production:
      move: tightens
      reason: Years of fitting work need people who can deploy.
  steady/priced:
    outcome_verification:
      move: tightens
      reason: A payer who is liable wants proof.
    provenance_and_audit:
      move: tightens
      reason: A claim is settled from the record.
    evals_and_assurance:
      move: tightens
      reason: Courts and insurers ask who vouched for the system.
    identity_and_authority:
      move: tightens
      reason: Liability follows whoever the agent acted for.
    security:
      move: tightens
      reason: Each claim needs someone to say how the agent was turned or went wrong.
    autonomous_services:
      move: tightens
      reason: Buyers want one accountable party, and there are few.
  steady/licensed:
    identity_and_authority:
      move: tightens
      reason: Registration before dealing requires it.
    provenance_and_audit:
      move: tightens
      reason: A registered agent has to be able to show what it did.
    security:
      move: tightens
      reason: A registered agent that is turned is its registrant's problem.
    evals_and_assurance:
      move: tightens
      reason: Registration gives a regulator a point at which to ask for an outside test.
    autonomous_services:
      move: tightens
      reason: Oversight favours firms that are already accountable, and there are few of them.
  automated_research/unclear:
    power_and_sites:
      move: tightens
      reason: Research run by models needs far more computing, and power is what limits it.
    semiconductor_supply_chain:
      move: tightens
      reason: The chips for that computing have to be made.
    compute_providers:
      move: tightens
      reason: Demand for computing outruns what is being built.
    outcome_verification:
      move: tightens
      reason: More work is done with fewer people watching.
    context_and_memory:
      move: tightens
      reason: Faster agents are held back by access to the firm's records, not by skill.
    technical_implementation:
      move: eases
      reason: Agents do more of the fitting themselves.
    context_engineering:
      move: eases
      reason: Better models learn a firm's habits from its records.
    talent_production:
      move: eases
      reason: There is less deployment work left for people.
    data_centre_infrastructure:
      move: tightens
      reason: The buildings and their power gear have to be built for that computing.
    general_purpose_models:
      move: tightens
      reason: When each model speeds up the next, the leading labs pull away.
    security:
      move: tightens
      reason: Faster agents doing more work can be turned in more places.
    provenance_and_audit:
      move: tightens
      reason: Faster agents doing more work leave more to reconstruct after the fact.
  automated_research/licensed:
    evals_and_assurance:
      move: tightens
      reason: The race is slowed until systems can be checked.
    general_purpose_models:
      move: tightens
      reason: The leading lab sits on the committee that slows the race, so its lead is kept.
  owners/open_frontier:
    post_training_and_learning_infrastructure:
      move: tightens
      reason: Tuning is where a free model is made to fit.
    compute_providers:
      move: tightens
      reason: The cost moves to the computing that runs the model.
    inference_optimization:
      move: tightens
      reason: Running a free model cheaply is the skill left to compete on.
    general_purpose_models:
      move: eases
      reason: Where an open model is good enough, the lead earns less.
  owners/closed_lead:
    general_purpose_models:
      move: tightens
      reason: Customers built into a lab's products cannot easily leave it.
    evals_and_assurance:
      move: tightens
      reason: A buyer tied to one seller needs a judge who is not that seller.
  owners/on_device:
    model_compression_and_adaptation:
      move: tightens
      reason: Shrinking a model to fit the device is the work.
    inference_supply:
      move: eases
      reason: Work done on the device is not bought from a host.
    compute_providers:
      move: eases
      reason: Everyday work leaves the data centre.
  owners/agents_trade:
    settlement_and_billing:
      move: tightens
      reason: Agents that buy have to pay.
    identity_and_authority:
      move: tightens
      reason: Each side needs to know whom the other acts for.
    outcome_verification:
      move: tightens
      reason: Payment waits on proof.
    tools_and_actuation:
      move: tightens
      reason: Dealing across firms needs a way into each firm's systems.
    provenance_and_audit:
      move: tightens
      reason: A deal between agents is settled from the record.
    liability_and_risk_transfer:
      move: tightens
      reason: A firm that lets an agent deal for it wants someone standing behind the agent.
  owners/country_split:
    routing_and_gateways:
      move: tightens
      reason: Keeping a firm inside the models it is allowed is work the free tools do not do.
    compute_providers:
      move: tightens
      reason: A state that fears being cut off runs models at home, which needs computing there.
    general_purpose_models:
      move: tightens
      reason: Inside each fence fewer makers are allowed to sell, so those that are face less competition.
    post_training_and_learning_infrastructure:
      move: tightens
      reason: A firm shut out of the closed models has an open one tuned instead.
future_groups:
- id: grid
  name: How far AI goes, and how the rules settle
- id: owners
  name: Who owns the models, where they run and who they deal for
ownership:
- id: open_frontier
  name: Open models are good enough for most work
  says: Open models come close enough to the best closed ones that much work runs on them, and the cost moves to the computing
    that runs them and the work of training them further.
  argued_by:
  - hobart_round_trip
  - cai_mythos
  bears_for:
  - gap_stays_short
  bears_against:
  - open_takes_volume
- id: closed_lead
  name: Labs charge for their lead and move up the stack
  says: The leading labs charge what their lead over open models is worth, and move into products and deployments inside
    their customers' work, where leaving is costly.
  argued_by:
  - larson_durability
  - nk_up_the_stack
  bears_for:
  - lock_in
  bears_against:
  - gap_stays_short
- id: on_device
  name: Everyday work moves onto devices
  says: For much everyday work the cheapest and fastest place to run AI is the device that already holds the data.
  argued_by:
  - paik_edge
  bears_for:
  - edge_inference
  - edge_floor
  bears_against: []
- id: agents_trade
  name: Agents deal in markets for people and firms
  says: Agents cut the cost of searching, bargaining and contracting and deal in markets for people and firms, first where
    the want is simple to state; they still lack a way to show whom each one acts for.
  argued_by:
  - shahidi_etal
  - hadfield_koh
  bears_for:
  - simple_markets_first
  bears_against:
  - agents_fenced
  - asking_leaks
- id: country_split
  name: Governments decide which models a firm may use
  says: The governments of the two states that make the most capable models decide which countries and firms may use them,
    so a firm's choice of model is bounded by where it sits and where it operates.
  argued_by:
  - woodward_rogoyski
  - bcg_great_divide
  bears_for:
  - access_fenced
  bears_against:
  - open_reaches_all
waiting:
- name: Agents buy from agents, with no person in the deal
  why: The outlook's writers say agents could deal for people and firms; none argues that agents will trade with each other
    unattended, and no public count of such trade exists.
chain_states:
  holding: holding tonight
  failing: failing tonight
  untestable: cannot be tested yet
chain_when:
  now: Now
  next: Next
  watch: Watch
chains:
- id: data_centres_now
  parts:
  - power_and_sites
  - data_centre_infrastructure
  businesses:
  - energy_aware_compute
  says: While buildings and their power hookups bind, a business that finds where computing can run is selling into the
    shortage.
- id: capital_now
  parts: []
  businesses: []
  says: The site reads money as plentiful, so money alone is no advantage; the businesses that need most of it are weakened
    in the future where funding stalls.
- id: memory_packaging_now
  parts:
  - memory_storage_and_networking
  - semiconductor_supply_chain
  businesses: []
  says: No business here sells into memory or packaging; if they are short, the makers of memory and the firms that package
    chips are paid.
- id: practice_next
  parts:
  - training_environments
  - data_origination
  - reward_and_verification_systems
  businesses:
  - pooled_expert_records
  says: If the shortage moves here, graded expert work and the means of grading it are what the labs buy.
- id: agent_proof_watch
  parts:
  - outcome_verification
  - provenance_and_audit
  - identity_and_authority
  - settlement_and_billing
  - liability_and_risk_transfer
  businesses:
  - outcome_verification
  - agent_authority_registry
  - agent_audit_trail
  - ai_warranty
  - agent_payments
  - agent_incident_response
  says: If proof of what an agent did becomes the bottleneck, these businesses are the ones that sell it; the site cannot
    yet test whether it has.
primitives:
- id: record
  name: The record
  what: The customer's own state, permissions, traces and results.
  why: Models and suppliers change; the firm's memory has to stay.
- id: test
  name: The test
  what: The customer's own definition of good work, checked against real cases.
  why: Better output raises the need to know whether it is good.
- id: backing
  name: The backing
  what: Someone accountable, an audit trail, a warranty.
  why: Work with consequences needs a solvent party behind it.
- id: yardstick
  name: The yardstick
  what: Cost, speed, quality and reliability measured on the same terms.
  why: Buyers keep asking for proof that things improved.
- id: choice
  name: The choice
  what: The freedom to switch models, places to run and suppliers.
  why: Work differs and suppliers change.
