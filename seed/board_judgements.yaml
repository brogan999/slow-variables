# A model's lean on each forecast the board marks too early to tell (plan Part 39; Alex's decisions of 5 Oct 2026).
# Not a status and read by no status logic: src/ai_tracker/board.py attaches a lean only while a row is still too early.
# A reason types no figure (it names the reading; the page links to it), no size word and no address.
made_by:
  model: claude-opus-5-5
  date: 2026-10-05
  method: One model read each forecast with what would settle it, this site's readings and their history, and the evidence
    against, extended a trend where a reading had one, and gave a lean and a reason. Forecasts were judged in groups so
    that related ones stay consistent.
  reviewed_by: separate reviewing runs of the same model, which changed some leans and reasons and withdrew one judgement; no person reviewed each one
judgements:
- kind: exit
  id: consumers_keep_surplus
  lean: leans_false
  reason: This lean is on the site's narrow test, not on the broader idea that users gain more than makers, which is judged
    separately and leans true. The test sets a survey estimate of what American consumers would need to be paid to give
    AI up against the revenue of the leading labs, and on the latest readings that estimate is already less than two times
    the labs' combined annualised revenue. The estimate rose strongly between its two waves, but lab revenue has been multiplying
    several times over a year, so the gap is closing. The strongest point the other way is that the survey covers one country
    and consumers only, so the value users worldwide keep is surely far larger than the reading shows.
  rests_on:
  - consumer_surplus_wta
- kind: exit
  id: invention_side_warning
  lean: leans_true
  reason: The lab's own figures already show agents putting in more research workdays than people, and the length of task
    agents finish reliably has been growing quickly on outside tests. Extending that trend a year or two makes an independent
    confirmation probable, since the claim carries no deadline. What cuts the other way is that the only readings so far
    are self-reported, people still step in on about as many long tasks as not, and outside testers may never get the access
    needed to check.
  rests_on:
  - rsi_agent_workdays_per_human
  - rsi_intervention_rate_4_8h
- kind: ledger
  id: ai2027_quarter_remote_jobs_oct_2027
  lean: likely_false
  reason: Employment in the most exposed occupations is down only slightly on the year, and the share of work hours assisted
    by generative AI is small and, on its fitted trend, takes more than two years to grow as much again. Reaching a quarter
    of remote jobs done by AI within about a year would need a break far beyond anything in those readings. The strongest
    point the other way is that agents are improving quickly and entry-level hiring in exposed work is already weak.
  rests_on:
  - canaries_exposed_employment_yoy
  - bbd_work_hours_assisted
- kind: ledger
  id: ai2027_robot_economy_2028_2030
  lean: likely_false
  reason: This rests on general knowledge of how fast factories, supply chains and robot hardware scale. The scenario needs
    superintelligence first and then an industrial build-out far faster than anything seen, all inside three years, and
    the first step already looks late. The strongest point for it is that humanoid robot output is growing quickly from
    a tiny base, but that is ordinary industrial growth, not an economy of robot factories.
  rests_on: []
- kind: ledger
  id: ai2027_superhuman_coder_2027
  lean: leans_false
  reason: 'The task length agents complete reliably has been growing fast, and extending the reliable-horizon trend through
    2027 gets to tasks of some weeks. The bar here is much higher: any coding task of the best lab engineer, far faster
    and cheaper, and the gap between the reliable horizon and the headline horizon has not closed. The authors themselves
    moved their medians later. The case for it is that the trend has repeatedly beaten sceptics and coding is where labs
    concentrate effort.'
  rests_on:
  - metr_horizon_80
  - metr_horizon_50
- kind: ledger
  id: ai2027_superhuman_researcher_sep_2027
  lean: likely_false
  reason: A superhuman researcher needs a superhuman coder first plus research taste, and the coder milestone itself looks
    later than 2027. Self-reported lab figures show agents doing much research legwork, but people still step in on about
    as many long tasks as not, and no outside test shows an agent beating top researchers. Under a year is too short for
    that gap to close and be verified from outside. The strongest counterpoint is that the scenario's measurable predictions
