  lean: leans_true
  reason: Spending on expert-made training tasks, practice environments and bespoke fitting has grown alongside each stronger
    model, because the remaining gaps move to harder and more valuable work. I expect that to continue for some years. This
    rests on general knowledge of the market. A model that learns on the job from its own use would undercut it.
  rests_on: []
- kind: outlook
  id: data_drives_pretraining
  lean: leans_true
  reason: The core model design has changed little for years while gains have tracked more and better data, including purpose-made
    and synthetic data. With public text running short, new data sources look like the lever. The one reading here is old,
    and methods such as reasoning-time search and new training recipes have also carried large gains, so this is a moderate
    lean.
  rests_on:
  - epoch_data_exhaustion_year
- kind: outlook
  id: data_split
  lean: leans_true
  reason: The number of active sellers of training environments in the site's directory is still rising, and labs deliberately
    spread purchases across many specialists by field of expertise. Nothing so far suggests one or two sellers handling
    most of what the frontier labs buy. The strongest point against is that the largest expert-data firms are growing much
    faster than the rest, and labs may bring more of this work in-house or buy the sellers, which would thin the field.
  rests_on:
  - rl_environment_vendor_count
- kind: outlook
  id: deployers_paid
  lean: leans_true
  reason: Rests on general knowledge. Job postings and pay for engineers who sit with a customer and wire models into its
    work have risen sharply through 2025 and 2026, and both labs and start-ups say these hires limit how fast they can sell.
    The skill mixes engineering with client handling, which is slow to train. The strongest point against is that coding
    agents are making the integration work itself easier, and a premium this visible draws in consultants and laid-off engineers
    within a few years.
  rests_on: []
- kind: outlook
  id: edge_inference
  lean: leans_false
  reason: This rests on general knowledge. Small models keep getting better and some simple work, such as dictation and
    autocomplete, does run on phones and laptops. But the everyday uses that are growing fastest are long agent tasks and
    search-backed answers, which need the largest models and far more memory than personal devices have. The best case for
    Paik is that privacy and cost push routine requests onto devices once small open models are good enough for most of
    them.
  rests_on: []
- kind: outlook
  id: field_divergence
  lean: likely_true
  reason: Software and mathematics give instant, cheap checks, and that is where AI's research help is already clearest.
    Drug trials, materials synthesis and physics experiments run at the speed of the physical world, and nothing so far
    shortens them much. This rests on general knowledge. Automated labs and better simulation could narrow the gap over
    a longer span.
  rests_on: []
- kind: outlook
  id: field_models_fade
  lean: leans_true
  reason: Rests on general knowledge. In law, coding and finance the pattern so far is that each new general release overtakes
    models tuned for the field, and the best-known legal start-up dropped its own tuned model for the labs' general ones.
    Extending that pattern is the basis of the call. The strongest point against is that in biology, robotics, speech and
    other areas where the data is not text on the web, purpose-built models still lead, and that set of exceptions may prove
    wider than a few regulated niches.
  rests_on: []
- kind: outlook
  id: firm_size_barbell
  lean: leans_true
  reason: This rests on general knowledge. Infrastructure is plainly consolidating around a few clouds, chip makers and
    model labs, while applications are being built by very small teams and new business formation in software is high. The
    risk is that average size is dragged up by large incumbents absorbing the application layer by 2029, or that the model
    labs bundle applications themselves.
  rests_on: []
- kind: outlook
  id: firms_buy_data
  lean: leans_false
  reason: The largest expert-data seller's revenue has grown several times over in a year, but by press accounts that growth
    comes from a handful of labs, so the site's reading shows a bigger market, not a broader one. Firms outside the labs
    mostly lack the research staff to turn bought data into a better model, and they can rent the result instead. The strongest
    point against is that large software firms and banks have begun buying test sets and practice tasks to check agents,
    which could grow into real spending with no date to miss.
  rests_on:
  - expert_data_market_run_rate
- kind: outlook
  id: firms_centralise
  lean: toss_up
  reason: This rests on general knowledge. AI makes it cheaper for head office to see and decide what used to need a person
    on the spot, which favours the claim, and the largest firms have kept gaining share. But the same tools let very small
    teams do what once took a department, and the lean on the barbell forecast is that applications splinter, so the net
    effect on size and on where decisions sit is not something the evidence yet settles.
  rests_on: []
- kind: outlook
  id: generalists_gain
  lean: leans_true
  reason: The one reading is a posting premium for AI skills, which is large but compares adverts and not people, so it
    is weak support. From general knowledge, agents are taking over narrow, well-specified tasks first, which raises the
    value of people who can direct them across several fields. The counter is that deep specialists are the ones able to
    check AI output where errors are costly, and in law, medicine and engineering their pay has held.
  rests_on:
  - pwc_ai_skill_wage_premium
- kind: outlook
  id: grid_hookups
  lean: likely_true
  reason: Waits for grid connection in America run to years while data-centre plans arrive in months, and developers have
    turned to on-site gas and other workarounds for that reason. This rests on general knowledge up to mid-2026. Faster
    permitting and a cooling of AI spending are the things that could ease it.
  rests_on: []
- kind: outlook
  id: hours_rise_first
  lean: leans_true
  reason: The share of work hours assisted by AI is still small and rising steadily, and paid hours in exposed work have
    not fallen. From general knowledge, studies of early adopters find people taking on more tasks and wider scope, not
    shorter days, since employers capture time saved as extra output. What cuts against it is weak hiring at entry level,
    which is a cut in paid work arriving before any clear rise in measured output per worker.
  rests_on:
  - bbd_work_hours_assisted
- kind: outlook
  id: insurers_cover
  lean: leans_true
  reason: Rests on general knowledge. Purpose-built AI policies already exist from a large reinsurer and from several start-ups
    backed by established underwriters, and as standard policies gain AI exclusions, buyers who deploy agents are pushed
    toward separate cover. That makes the weaker claim of real sale to large buyers more likely than not, even though the
    multi-year premium forecast for 2032 looks too high. The strongest point against is that take-up so far is small and
    large buyers may simply self-insure or lean on vendor indemnities.
  rests_on: []
- kind: outlook
  id: jobs_become_data
  lean: likely_true
  reason: 'This rests on general knowledge, and the claim is a weak one: only that some jobs shift this way. Model labs
    and their suppliers already pay doctors, lawyers, programmers and other experts to write and grade examples, and that
    market has grown quickly. The caveat is scale, since this is contract work for a small number of people and may shrink
    if models learn to generate their own training material.'
  rests_on: []
- kind: outlook
  id: lab_margins_below
  lean: leans_true
  reason: The estimated gross margin of the frontier labs sits far below that of classic software, and the labs recoup well
    under what they spend. Both readings are old or rough, and the main drag today is the cost of compute rather than deployment
    staff, so Hobart's mechanism is only part of the story. Still, the labs are hiring engineers to work inside customers
    at pace, and the claim fails only if labs report software-like margins while doing so, which looks unlikely for some
    years.
  rests_on:
  - lab_gross_margin
  - lab_recoupment_ratio
- kind: outlook
  id: lab_owns_services_firm
  lean: likely_true
  reason: 'This rests on general knowledge of press reports, not a site reading. In 2026 the two leading labs each launched
    a deployment and services venture with private-equity backers, one of them under the lab''s own name, and each venture
    has since bought a consultancy. On the launch wording the forecast looks close to met already, with two years left.
    The doubt is ownership: at least one lab is reported to hold only a minority of its venture, and whether either holds
    a majority is not established, so a strict reading that demands control could still go the other way.'
  rests_on: []
- kind: outlook
  id: labs_buy_deployers
  lean: likely_true
  reason: The site's ledger shows the labs buying firms and teams at a brisk pace over the past year, though it counts all
    purchases, not only deployment consultancies. From general knowledge of press reports, the services ventures that the
    two leading labs launched in 2026 each bought an implementation consultancy within months to get staff quickly, so the
    falsifier, labs buying no such firms, has already failed. The strongest point against is that the labs also lean on
    partnerships with the large consultancies, which are too big to buy, and that a purchase made through a venture the
    lab only partly owns may not count as the lab buying.
  rests_on:
  - lab_vertical_integration_exit_bell
- kind: outlook
  id: labs_buy_exits
  lean: leans_true
  reason: 'The site''s count of purchases and team hires by labs and compute companies over the trailing year rose at each
    of the last three readings, and public listings remain rare for small data and tooling firms. Extending that rise even
    modestly makes being bought the common way out. The caveats are real: part of the rise reflects a more thorough search,
    one buyer accounts for much of it, and a funding squeeze at the labs would stop the buying quickly.'
  rests_on:
  - lab_vertical_integration_exit_bell
- kind: outlook
  id: labs_buy_records
  lean: leans_true
  reason: The labs are plainly buying more from the layer that supplies training inputs, and the expert-data market has
    grown very quickly. Records of real work from leading applications are scarcer and harder to copy than generic practice
    environments, whose sellers keep multiplying, which usually means falling prices. The main doubt is whether leading
    app companies will sell their records at all, since many see them as their own advantage against the labs.
  rests_on:
  - expert_data_market_run_rate
  - lab_procurement_signal
- kind: outlook
  id: labs_by_industry
  lean: leans_false
  reason: This rests on general knowledge. The labs do differ, with some stronger in coding and business use and others
    with consumers, but those differences come from product focus and model quality, not from purchased business records.
    General models have so far kept beating specialist ones in fields such as law and medicine. Hobart hedged the claim
    with a may, and it could still come true if exclusive data deals in a regulated trade give one lab a lasting edge there.
  rests_on: []
- kind: outlook
  id: lead_changes
  lean: leans_true
  reason: This rests on general knowledge. Over the past two years the top place on the main measures has passed back and
    forth among three labs, sometimes within months, and no lab has held it for several years running. Compute split between
    serving customers and training the next model is a fair account of why. The risk is that AI doing its own research lets
    one lab compound a lead, which is exactly what the labs themselves are betting on.
  rests_on: []
- kind: outlook
  id: link_overshoots
  lean: likely_true
  reason: This rests on general knowledge of how supply chains behave. The claim needs only one squeezed part to turn, and
    memory, older chips for rent and optical parts all have long histories of shortage followed by glut once new plants
    open. Rental prices for older chips have already eased at times. The claim would fail only if every scarce link stayed
    scarce, which would be without precedent in semiconductors.
  rests_on: []
- kind: outlook
  id: lock_in
  lean: leans_true
  reason: This rests on general knowledge. The largest consumer lab already earns most of its revenue from subscriptions,
    and the labs are pushing coding tools, seats and deployment by their own engineers because margins and loyalty are better
    there. The counterweight is that agents consume enormous volumes of tokens, so metered access could keep growing as
    fast as products do, and much product revenue is itself billed by use. This is a claim about where revenue comes from,
    not about customers being tied down, which is judged separately.
  rests_on: []
- kind: outlook
  id: lock_in_fails
  lean: leans_true
  reason: 'The only site reading on firms using more than one model is several years old, so this rests mostly on general
    knowledge. Businesses routinely route work across several labs, switching a model behind an application takes little
    effort, and bans on copying models have proved hard to enforce. This sits alongside the view that labs earn more from
    products: product revenue can grow without binding customers. The strongest point against is that memory, stored context
    and workflow tools built around one lab raise the cost of leaving over time.'
  rests_on:
  - enterprise_multi_homing_share
- kind: outlook
  id: lossy_loop
  lean: leans_true
  reason: By the lab's own count agents do much research work, yet people still intervene on about as many long tasks as
    not, and nothing independent shows research itself speeding up. The outside task-length trend has quickened in recent
    years, but that began before agents did much research and may reflect more compute and effort. I expect steady gains
    for the next few years. If research automation deepens while compute stays plentiful, acceleration could yet show up.
  rests_on:
  - rsi_agent_workdays_per_human
- kind: outlook
  id: models_held_back
  lean: leans_true
  reason: The site's count shows three announced brakes at one lab in the past year, including a release gated behind safeguards,
    and from general knowledge another leading lab has kept its strongest model to a limited set of partners in 2026 on
    security grounds. Gaps between a model being trained and being sold openly seem to be widening as cyber and biology
    risk thresholds are reached. The strongest point against is that these are the labs' own accounts, the paused run restarted
    within a month, and commercial rivalry punishes whoever waits longest, so 'loosely in step' is the fragile part.
  rests_on:
  - safety_brake_events
- kind: outlook
  id: models_not_utility
  lean: leans_true
  reason: This rests mostly on general knowledge. Buyers still choose models on quality, speed, reliability and the kinds
    of input handled, and pay large premiums for the best one in coding, which is not how anyone buys electricity. The case
    against is that for routine tasks many models are now good enough, and that part of the market already buys on price
    alone.
  rests_on: []
- kind: outlook
  id: niches_filled
  lean: leans_true
  reason: 'This rests on general knowledge. Falling costs are visibly producing small tools and services that no one would
    have staffed, and new business formation is high, so the falsifier looks unlikely to bite. The weaker part is the claim
    that this is the way AI lifts growth: so far the measurable lift comes from investment in data centres and from gains
    inside existing firms, and tiny niches may add little to measured output.'
  rests_on: []
- kind: outlook
  id: own_models
  lean: leans_false
  reason: The gap between open and closed models is small on the site's index, yet businesses' use of open models has stayed
    a small share, because renting the frontier is easier and general models improve faster than a firm can retrain its
    own. Supplying a model with a firm's documents at the moment of use has largely replaced training on them. Every firm
    is a very strong claim. It could yet come true in a looser sense if cheap tuning becomes a standard feature that the
    labs offer on their own models.
  rests_on:
  - open_vs_closed_gap
- kind: outlook
  id: real_work_data
  lean: leans_false
  reason: 'Records of real work are becoming more valuable, but staged tasks have not stopped teaching: on general knowledge,
    spending on built practice environments was still growing strongly in 2026 and labs keep reporting gains from them.
    I expect a mix, with staged tasks still doing much of the work. For fields where results are hard to check his point
    is strongest, and it may prove right later.'
  rests_on: []
- kind: outlook
  id: records_gain
  lean: leans_true
  reason: This rests on general knowledge. Agents need an authoritative store of customers, money and staff to act on, and
    firms very rarely rip out such systems, so their customer losses should stay lower than those of lighter tools that
    an agent can rebuild. The strongest evidence against is that investors marked down record-keeping software alongside
    everything else in 2026, fearing that agents turn it into a cheap database beneath someone else's product.
  rests_on: []
- kind: outlook
  id: rent_surplus
  lean: likely_true
  reason: This rests on general knowledge. The largest technology firms already rent large amounts of computing to labs
    that compete with their own models, and at least one lab now rents from a rival model maker. The claim fails only if
    the big firms keep all their capacity for themselves, which is the opposite of what they are doing. Whether the capacity
    is truly spare, rather than built to order for those tenants, is the part that remains open.
  rests_on: []
- kind: outlook
  id: rli_reached
  lean: leans_false
  reason: When the index of real freelance projects launched, the best agents completed only a tiny share, and most by the
    end of 2027 needs an enormous climb in little over a year. Benchmarks of this kind have gone from near nothing to mostly
    solved within two or three years before, so it is not far-fetched. The projects span design, video and other multi-tool
    work where agents remain weak, which tips me against the date, on general knowledge.
  rests_on: []
- kind: outlook
  id: self_hosting
  lean: likely_false
  reason: 'Open models trail the closed frontier only narrowly on the site''s index, yet most businesses still rent, because
    running models well needs scarce chips, power and skilled staff, and rented models improve without effort from the buyer.
    Most businesses do not even run their own email servers. The exceptions are real: defence, banks and firms in countries
    wary of foreign suppliers will host their own, but they are a minority.'
  rests_on:
  - open_vs_closed_gap
- kind: outlook
  id: simple_markets_first
  lean: leans_false
  reason: Rests on general knowledge. Agents have in fact taken hold first in coding, customer support and, among consumers,
    shopping and research, none of which are markets where people commonly hired a human agent. Job search has seen heavy
    use of AI by applicants and recruiters, but as writing aids that flood the market more than as agents that strike matches,
    and property remains guarded by listing rules and licences. The strongest point against is that the forecast may be
    read as covering only markets between two sides, where hiring is indeed the most advanced case.
  rests_on: []
- kind: outlook
  id: software_jobs_hold
  lean: leans_true
  reason: Employment in the occupations most exposed to AI is down only slightly over the year on the site's reading, well
    short of a wipe-out, and software work has so far shrunk at the junior end while total headcount is roughly flat. The
    claim as worded needs only that jobs are not wiped out, which is a low bar. The strongest point against is that the
    stricter test, employment falling as coding tools spread, is close to being met already, and agents that finish whole
    projects could turn a flat line into a clear decline.
  rests_on:
  - canaries_exposed_employment_yoy
- kind: outlook
  id: states_buy_in
  lean: likely_true
  reason: This rests on general knowledge. Governments have already taken equity in a leading chip maker and in suppliers
    of critical minerals, and state-owned funds in the Gulf and Asia hold stakes in labs and data-centre builders. The trend
    is towards more of this as AI is treated as a strategic industry. The claim would fail only if states went back to being
    lenders and customers alone, and a change of government could slow new stakes but would not undo existing ones.
  rests_on: []
- kind: outlook
  id: surplus_to_users
  lean: leans_true
  reason: 'The test is whether AI firms'' profits grow as fast as the value users get. In level, users are far ahead: the
    survey estimate of user value for one country alone is large and rising, while the labs make losses and competition
    among several similar models keeps prices down. What cuts the other way is that chip makers'' profits have lately grown
    at least as fast as the survey estimate, so a strict reading of the growth test could go against the claim, and a single
    lab pulling ahead could price accordingly. This differs from the site''s other test on user value, which sets one country''s
    consumer survey against worldwide revenue, a far easier bar for sellers to clear.'
  rests_on:
  - consumer_surplus_wta
- kind: outlook
  id: tasks_distilled
  lean: leans_true
  reason: This rests on general knowledge. Once a narrow task is done reliably, firms move it to small cheap models or to
    ordinary code written by an agent, and the price of a given level of capability has fallen steeply every year. Spending
    on that task then stops growing. What keeps total spending rising is that cheaper tasks get run far more and new harder
    tasks keep arriving, so the pattern may be hard to see outside individual tasks.
  rests_on: []
- kind: outlook
  id: through_incumbents
  lean: leans_false
  reason: Rests on general knowledge. So far buyers take AI's work mostly straight from labs and start-ups under ordinary
    software contracts with capped liability, and the fastest-growing sellers in law, support and coding are young firms
    without licences or deep balance sheets. Established service firms are adding AI, but their share of AI work bought
    does not look to be rising. The strongest point against is that long, unsupervised tasks in regulated fields have barely
    begun, and that is where a liable party matters most.
  rests_on: []
- kind: outlook
  id: trades_scattered
  lean: leans_true
  reason: This rests on general knowledge. Licensing, liability, local relationships and physical presence keep law, building
    and similar trades in many small firms, and AI tools for each are already gathering around a few vendors built on a
    few models. The threat is ownership rolling up small practices with AI and private capital, or a lab offering the service
    directly where rules allow, but neither looks likely to take most professional work.
  rests_on: []
- kind: outlook
  id: trades_short
  lean: leans_true
  reason: Shortages of electricians and other skilled trades were widely reported on large data-centre builds through mid-2026,
    and big technology firms have funded training schemes. With the build-out still growing, I expect that to continue,
    a judgement from general knowledge. Power and equipment supply are tighter limits than labour on many sites, and a spending
    slowdown would end the shortage quickly.
  rests_on: []
- kind: outlook
  id: training_cheapens
  lean: leans_false
  reason: Rests on general knowledge. Further training has become much cheaper, and a few of the biggest coding apps do
    train their own small models, yet they still send their hardest work to the labs' best models because users pay for
    quality at the frontier. As long as each new general release moves that frontier, owning a tuned model saves money only
    on routine calls. The strongest point against is that routine calls are most of the volume, so a quiet shift of the
    bulk of traffic to in-house models could satisfy the forecast while the frontier is still rented.
  rests_on: []
- kind: outlook
  id: tuning_converges
  lean: leans_false
  reason: 'Rests on general knowledge. The three kinds of firm named have different customers today: the data sellers earn
    nearly all their money from the labs, the hosts sell computing to developers, and only the custom trainers already do
    the forecast business. Some overlap is appearing, as hosts add training services, but a full merging into one business
    needs enterprise demand for tuned open models that has so far stayed modest. The strongest point against is that data
    sellers facing concentrated lab customers have a strong motive to move toward enterprises.'
  rests_on: []
- kind: outlook
  id: use_unpriced
  lean: leans_true
  reason: Rests on general knowledge. The history of free digital goods is that statistics capture spending on the tools
    but not the better quality or the time saved, and much AI use is free or flat-priced and happens inside households and
    unmeasured service work. Statistical offices have no method ready to adjust for answer quality. The strongest point
    against is that time saved inside firms does show up as measured productivity when the same output needs fewer paid
    hours, so 'most' may overstate the miss.
  rests_on: []
- kind: outlook
  id: verification_first
  lean: leans_false
  reason: Rests on general knowledge. The agent failures seen so far, such as deleted databases, wrong purchases and agents
    tricked by hidden instructions, trace to agents doing the work badly or being manipulated, and the first large market
    failure seems likely to be reported the same way. An inability to check what an agent did usually deepens a loss instead
    of starting it, so the public account will tend to blame skill or security. The strongest point against is that fraud
    by agents nobody can identify is exactly a checking failure, and that may well come first where money is involved.
  rests_on: []
- kind: outlook
  id: visits_fall
  lean: likely_true
  reason: This rests on general knowledge. Since search engines began answering in the results page and chat assistants
    began answering directly, many publishers have reported clear falls in referred visits, and the share of searches that
    end without a click has kept rising. The partial offsets are licensing deals and direct subscriptions, which replace
    some income but do not bring the visits back.
  rests_on: []
