app = "ai-tracker-query"
primary_region = "sjc"

[build]

[env]
  PORT = "8080"
  QUERY_DAILY_USD_CAP = "5"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
